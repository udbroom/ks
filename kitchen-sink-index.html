s a translucent \"glass\" frame/border around the media instead of plain rounded corners.</td>\n<td>Only some deployments</td>\n</tr>\n<tr>\n<td><code>merch-moment</code><sup class=\"fn-ref\" data-fn=\"merch-moment\" title=\"Click for details\">15</sup></td>\n<td>A commerce/merchandising layout: the section becomes a two-row grid (content row + inline, non-cover background-image row) at a fixed aspect ratio, with any price text (<code>inline-price</code>) bolded. Typically paired with a scroll-reveal <a href=\"./section-metadata.md\">Section Metadata</a> style.</td>\n<td>Only some deployments</td>\n</tr>\n<tr>\n<td>Per-viewport variant</td>\n<td>Swaps a class in/out only while a given viewport's content is active (see Notes).</td>\n<td>All deployments</td>\n</tr>\n</tbody>\n</table>\n<h2>Example</h2>\n<p>Standard hero:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Rich Content (hero, center)</th></tr>\n<tr><td><h2>Design without limits</h2>\n<p>Create stunning content faster with AI-powered tools built for every skill level.</p>\n<p><strong>Start for free</strong> <em>See plans</em></p></td></tr>\n</table>\n\n<p>Jump-link hero:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Rich Content (hero, jump-link)</th></tr>\n<tr><td><p><img alt=\"icon\" src=\"https://main--milo--adobecom.aem.live/libs/mep/ace1205/rich-content/assets/arrow.svg\" /> Product update</p>\n<h1>What's new in Creative Cloud</h1>\n<p><a href=\"#overview\">Overview</a> | <a href=\"#apps\">Apps</a> | <a href=\"#pricing\">Pricing</a></p></td></tr>\n</table>\n\n<p>Media variant:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Rich Content (media, glass-border)</th></tr>\n<tr><td><strong>Watch the film</strong></td><td><a href=\"https://example.com/video.mp4\">video.mp4</a></td></tr>\n</table>\n\n<p>Per-viewport example (breakpoint is width, not device):</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Rich Content (center)</th></tr>\n<tr class=\"ex-viewport-row\"><td colspan=\"1\">&#9656; mobile-viewport</td></tr>\n<tr><td><h2>Shop on the go</h2></td></tr>\n<tr class=\"ex-viewport-row\"><td colspan=\"1\">&#9656; desktop-viewport (dark)</td></tr>\n<tr><td><h2>Shop the full collection</h2>\n<p>Browse our entire lineup on the big screen.</p></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>To give mobile/tablet/desktop different text, insert single-cell delimiter rows containing <code>mobile-viewport</code>, <code>tablet-viewport</code>, or <code>desktop-viewport</code> before each viewport's content row(s) (bare <code>mobile</code>/<code>tablet</code>/<code>desktop</code> still works but is a legacy fallback being phased out \u2014 use the <code>-viewport</code> form in new authoring). Rows group between delimiters; using only <code>mobile-viewport</code> + <code>desktop-viewport</code> gives a simple two-way split at the <strong>1280px</strong> breakpoint (mobile = below 1280px, desktop = 1280px and up); adding <code>tablet-viewport</code> gives a three-way split at <strong>768px</strong> and <strong>1280px</strong> (mobile = below 768px, tablet = 768\u20131279px, desktop = 1280px and up). Any cell left empty in a higher viewport's row inherits content from the nearest lower viewport that has content \u2014 you only need to re-author what actually changes. A variant can be added per viewport in parentheses after the delimiter keyword, e.g. <code>desktop-viewport (dark)</code>.</li>\n<li>The whole block only has one authored \"row\" of real content per viewport (plus the optional hero-overlay second cell where supported) \u2014 don't spread content across multiple top-level rows outside the viewport-delimiter pattern; extra rows there are simply not read.</li>\n<li>The jump-link arrow icon is a static asset baked into the CSS via <code>mask-image</code>; authors cannot swap it per instance.</li>\n<li><code>hero</code> height is CSS-driven and shared with the parent <code>.section</code> \u2014 combine with a section background image/video (via <a href=\"./section-metadata.md\">Section Metadata</a>'s <code>background</code> key) for the typical full-bleed hero look.</li>\n<li><strong><a href=\"./section-metadata.md\">Section Metadata</a> interaction:</strong> pairing the <code>media</code> variant with a scroll-driven \"garage door\" reveal style on the containing section's Section Metadata <code>layout</code>/<code>style</code> row (only available in some deployments) animates the section open as the visitor scrolls, with extra spacing tuned for this block's media layout \u2014 has no effect without the <code>media</code> variant also present. See <a href=\"./section-metadata.md\">section-metadata.md</a>.</li>\n<li>If you don't add a real heading tag, the first paragraph is only visually promoted to heading size \u2014 check the visual result if you intended plain body copy only, since it will look like a headline even though it stays a <code>&lt;p&gt;</code> for accessibility/SEO.</li>\n<li>Video gotcha (<code>media</code> variant): pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the video to autoplay only while scrolled into view (instead of finishing during page load), the video link's hash needs both <code>autoplay</code> and <code>viewportplay</code>, e.g. <code>#autoplay|viewportplay</code>. <span class=\"autoplay-warn\">Using <code>#autoplay</code> alone plays the video immediately on page load \u2014 by the time it's visible it has already finished, so visitors just see its frozen last frame.</span></li>\n</ul>", "footnotes": {"hero": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/pull/6266\">#6266</a> \u2014 Du\u0161an Kosanovi\u0107, 2026-07-15"}, "center": {"num": 2, "html": "<a href=\"https://github.com/adobecom/milo/commit/e6f7950\"><code>e6f7950</code></a> \u2014 Dusan Kosanovic, 2026-07-17"}, "dark": {"num": 3, "html": "<a href=\"https://github.com/adobecom/milo/commit/e6f7950\"><code>e6f7950</code></a> \u2014 Dusan Kosanovic, 2026-07-17"}, "max-width-8": {"num": 4, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "max-width-10": {"num": 5, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "left-split": {"num": 6, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "jump-link": {"num": 7, "html": "<a href=\"https://github.com/adobecom/milo/pull/6266\">#6266</a> \u2014 Du\u0161an Kosanovi\u0107, 2026-07-15"}, "narrow": {"num": 8, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "narrow-xs": {"num": 9, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "grid-full-width": {"num": 10, "html": "<a href=\"https://github.com/adobecom/milo/commit/418ad2f\"><code>418ad2f</code></a> \u2014 Ryan Clayton, 2026-07-09"}, "media": {"num": 11, "html": "<a href=\"https://github.com/adobecom/milo/commit/29632b7\"><code>29632b7</code></a> \u2014 Dusan Kosanovic, 2026-07-20"}, "no-overlay": {"num": 12, "html": "<a href=\"https://github.com/adobecom/milo/commit/29632b7\"><code>29632b7</code></a> \u2014 Dusan Kosanovic, 2026-07-20"}, "indent": {"num": 13, "html": "<a href=\"https://github.com/adobecom/milo/commit/418ad2f\"><code>418ad2f</code></a> \u2014 Ryan Clayton, 2026-07-09"}, "glass-border": {"num": 14, "html": "<a href=\"https://github.com/adobecom/milo/commit/a0ce466\"><code>a0ce466</code></a> \u2014 Dusan Kosanovic, 2026-07-20"}, "merch-moment": {"num": 15, "html": "<a href=\"https://github.com/adobecom/milo/commit/e6f7950\"><code>e6f7950</code></a> \u2014 Dusan Kosanovic, 2026-07-17"}}, "raw": "# Rich Content\n\n> **Quick summary:** A flexible text-and-media block for heroes and general content sections \u2014 heading, body, and CTA buttons, optionally with a section background, a jump-link nav strip, or paired media \u2014 use it whenever you need a headline + supporting copy + CTA(s) without a fixed two-column layout. Authored as one row/cell of free-form rich text (heading, body, bold/italic button links), with viewport-delimiter rows (`mobile-viewport`/`tablet-viewport`/`desktop-viewport`) for per-viewport content. Key variations: `hero`, `center`, `dark`, `max-width-8`/`max-width-10`, `left-split`, `jump-link`, `narrow`/`narrow-xs`, `grid-full-width`, `media`, `no-overlay`, `indent`, `glass-border`, `merch-moment` \u2014 not all are available in every deployment (see the Availability column). Note the Section Metadata interaction: pairing `media` with a scroll-driven \"garage door\" reveal style on the section has no effect without `media` also present.\n\n## Authoring instructions\n\nThe block is authored as **one row with one cell** (the \"foreground\" content) in the simple case. Everything inside that cell is free-form rich text, decorated automatically:\n\n| Row | Content |\n| --- | --- |\n| Row 1 (required) | A single cell containing, in order: an optional heading (any level `H1`\u2013`H6`) \u2014 if you omit a heading, the first paragraph is auto-promoted to *look* like a Heading 2 (visually only \u2014 screen readers and SEO still see a plain paragraph, so use a real heading whenever the text is structurally a heading). If the text starts with a typographic opening quote (curly quote, e.g. `\"`), the mark is pulled into its own styled span for a \"hanging quote\" effect \u2014 no special authoring needed. If the paragraph immediately before the heading is a small image (icon) followed by short text, it becomes an \"eyebrow\" line with an inline icon. Below the heading, add body paragraphs. Add one or more buttons/links using standard Milo button syntax: bold text (`**text**`) = filled/primary button, italic text (`*text*`) = outline/secondary button, a plain link on its own line = link-styled (no button chrome). Bold and italic links are often paired together in one emphasized line, e.g. `_**[Get started](#)** [Learn more](#)_`. |\n| Row 2, second cell (optional, only with `hero`, and only in some deployments) | A second cell in the same row. If present and text-only, its content is treated as a CSS gradient/color value and applied as a custom hero-overlay override on the surrounding section, letting you replace the default dark hero gradient for that instance. Not every deployment of this block reads this cell \u2014 if you add it and see no effect, this deployment doesn't support the override and the default hero overlay is used instead. |\n\n**Jump-link contract (most deployments, not all):** if the block name includes `jump-link` (see Variations), add one additional paragraph anywhere in the cell containing only links separated by the pipe character `|`, e.g. `[Overview](#overview) | [Pricing](#pricing) | [FAQ](#faq)` \u2014 the code detects this row by looking for a `|` character among the links. That paragraph becomes a horizontal (or vertical, on mobile) jump-link nav with numbered/arrow badges that smooth-scroll to the matching `id` on the page. The simplest deployments of this block don't support `jump-link` at all.\n\n**Media contract (most deployments, not all):** if the block name includes `media` (see Variations), the table structure changes to hold both a CTA cell and a media cell (a picture, video, or a link to an `.mp4` file) \u2014 both optional, but at least one is expected for the variant to render meaningfully. How strictly cell order matters, and the resulting media's aspect ratio/shape, both vary by deployment \u2014 some require a fixed \"CTA cell first, media cell second\" order and render a narrow portrait clip; others scan every cell to find whichever one looks like media regardless of order, and render a wider, closer-to-square shape. When in doubt, author CTA first and media second \u2014 that order works everywhere media is supported. The simplest deployments of this block don't support `media` at all.\n\n## Variations\n\nAdd these as modifier text in the block name cell, comma-separated, e.g. `Rich Content (hero, center)`:\n\n| Variation | Effect | Availability |\n| --- | --- | --- |\n| `hero`[^hero] | Fixes the block/section to a tall hero height (640px mobile/tablet, 1040px desktop). | All deployments |\n| `center`[^center] | Center-aligns the heading/body/buttons instead of left-aligned. | All deployments |\n| `dark`[^dark] | Removes the block's own background color (used when content sits over a section background image/video). | All deployments |\n| `max-width-8`[^max-width-8] / `max-width-10`[^max-width-10] | With `hero` on desktop, constrains the content column to an 8- or 10-column grid width. | All deployments |\n| `left-split`[^left-split] | On desktop, lays content out with buttons pinned to the right side of the text instead of stacked below it. | Most deployments |\n| `jump-link`[^jump-link] | Enables the jump-link paragraph described above; implies knockout/white text. Commonly combined with `hero`. | Most deployments |\n| `narrow`[^narrow] / `narrow-xs`[^narrow-xs] | Caps the max-width of the heading/body text for a tighter reading column, tablet+ only (`narrow-xs` is tighter). | Most deployments |\n| `grid-full-width`[^grid-full-width] | Used inside a `bento` Section (see [Section Metadata](./section-metadata.md)) so the block spans the full masonry grid width with adjusted spacing. | Most deployments |\n| `media`[^media] | Switches to the CTA + media layout described above; renders on a dark background. (Older authoring/docs may reference this as `video` \u2014 that name has been retired everywhere this block is used; use `media`.) | Most deployments |\n| `no-overlay`[^no-overlay] | Used with `media`: skips the blurred/darkened section background treatment behind the media. | Most deployments |\n| `indent`[^indent] | Used inside a `bento` Section: indents the block with adjusted spacing (an alternative to `grid-full-width`). | Only some deployments |\n| `glass-border`[^glass-border] | Used with `media`: adds a translucent \"glass\" frame/border around the media instead of plain rounded corners. | Only some deployments |\n| `merch-moment`[^merch-moment] | A commerce/merchandising layout: the section becomes a two-row grid (content row + inline, non-cover background-image row) at a fixed aspect ratio, with any price text (`inline-price`) bolded. Typically paired with a scroll-reveal [Section Metadata](./section-metadata.md) style. | Only some deployments |\n| Per-viewport variant | Swaps a class in/out only while a given viewport's content is active (see Notes). | All deployments |\n\n[^hero]: [#6266](https://github.com/adobecom/milo/pull/6266) \u2014 Du\u0161an Kosanovi\u0107, 2026-07-15\n[^center]: [`e6f7950`](https://github.com/adobecom/milo/commit/e6f7950) \u2014 Dusan Kosanovic, 2026-07-17\n[^dark]: [`e6f7950`](https://github.com/adobecom/milo/commit/e6f7950) \u2014 Dusan Kosanovic, 2026-07-17\n[^max-width-8]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^max-width-10]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^left-split]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^jump-link]: [#6266](https://github.com/adobecom/milo/pull/6266) \u2014 Du\u0161an Kosanovi\u0107, 2026-07-15\n[^narrow]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^narrow-xs]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^grid-full-width]: [`418ad2f`](https://github.com/adobecom/milo/commit/418ad2f) \u2014 Ryan Clayton, 2026-07-09\n[^media]: [`29632b7`](https://github.com/adobecom/milo/commit/29632b7) \u2014 Dusan Kosanovic, 2026-07-20\n[^no-overlay]: [`29632b7`](https://github.com/adobecom/milo/commit/29632b7) \u2014 Dusan Kosanovic, 2026-07-20\n[^indent]: [`418ad2f`](https://github.com/adobecom/milo/commit/418ad2f) \u2014 Ryan Clayton, 2026-07-09\n[^glass-border]: [`a0ce466`](https://github.com/adobecom/milo/commit/a0ce466) \u2014 Dusan Kosanovic, 2026-07-20\n[^merch-moment]: [`e6f7950`](https://github.com/adobecom/milo/commit/e6f7950) \u2014 Dusan Kosanovic, 2026-07-17\n\n## Example\n\nStandard hero:\n\n```\n| Rich Content (hero, center) |\n| --- |\n| ## Design without limits<br>Create stunning content faster with AI-powered tools built for every skill level.<br><br>**Start for free**{: .con-button} *See plans*{: .con-button} |\n```\n\nJump-link hero:\n\n```\n| Rich Content (hero, jump-link) |\n| --- |\n| ![icon](https://main--milo--adobecom.aem.live/libs/mep/ace1205/rich-content/assets/arrow.svg) Product update<br># What's new in Creative Cloud<br>[Overview](#overview) \\| [Apps](#apps) \\| [Pricing](#pricing) |\n```\n\nMedia variant:\n\n```\n| Rich Content (media, glass-border) |\n| --- |\n| **Watch the film** | [video.mp4](https://example.com/video.mp4) |\n```\n\nPer-viewport example (breakpoint is width, not device):\n\n```\n| Rich Content (center) |\n| --- |\n| mobile-viewport |\n| ## Shop on the go |\n| desktop-viewport (dark) |\n| ## Shop the full collection <br> Browse our entire lineup on the big screen. |\n```\n\n## Notes\n\n- To give mobile/tablet/desktop different text, insert single-cell delimiter rows containing `mobile-viewport`, `tablet-viewport`, or `desktop-viewport` before each viewport's content row(s) (bare `mobile`/`tablet`/`desktop` still works but is a legacy fallback being phased out \u2014 use the `-viewport` form in new authoring). Rows group between delimiters; using only `mobile-viewport` + `desktop-viewport` gives a simple two-way split at the **1280px** breakpoint (mobile = below 1280px, desktop = 1280px and up); adding `tablet-viewport` gives a three-way split at **768px** and **1280px** (mobile = below 768px, tablet = 768\u20131279px, desktop = 1280px and up). Any cell left empty in a higher viewport's row inherits content from the nearest lower viewport that has content \u2014 you only need to re-author what actually changes. A variant can be added per viewport in parentheses after the delimiter keyword, e.g. `desktop-viewport (dark)`.\n- The whole block only has one authored \"row\" of real content per viewport (plus the optional hero-overlay second cell where supported) \u2014 don't spread content across multiple top-level rows outside the viewport-delimiter pattern; extra rows there are simply not read.\n- The jump-link arrow icon is a static asset baked into the CSS via `mask-image`; authors cannot swap it per instance.\n- `hero` height is CSS-driven and shared with the parent `.section` \u2014 combine with a section background image/video (via [Section Metadata](./section-metadata.md)'s `background` key) for the typical full-bleed hero look.\n- **[Section Metadata](./section-metadata.md) interaction:** pairing the `media` variant with a scroll-driven \"garage door\" reveal style on the containing section's Section Metadata `layout`/`style` row (only available in some deployments) animates the section open as the visitor scrolls, with extra spacing tuned for this block's media layout \u2014 has no effect without the `media` variant also present. See [section-metadata.md](./section-metadata.md).\n- If you don't add a real heading tag, the first paragraph is only visually promoted to heading size \u2014 check the visual result if you intended plain body copy only, since it will look like a headline even though it stays a `<p>` for accessibility/SEO.\n- Video gotcha (`media` variant): pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the video to autoplay only while scrolled into view (instead of finishing during page load), the video link's hash needs both `autoplay` and `viewportplay`, e.g. `#autoplay|viewportplay`. Using `#autoplay` alone plays the video immediately on page load \u2014 by the time it's visible it has already finished, so visitors just see its frozen last frame.\n"}, {"slug": "roller-carousel", "title": "Roller Carousel", "summary": "A full-viewport, scroll-driven showcase \u2014 a sticky panel with a blurred, crossfading background, a vertically scrolling list of item names grouped under category labels, and a media panel that crossfades in sync with whichever item is currently centered. Built for showcasing a lineup of items (e.g. \"every app in Creative Cloud\") where page scroll drives which item is highlighted. Authored as one header row followed by any number of single-cell category-label rows and multi-cell item rows. No author-facing modifier classes; it automatically falls back to a static list for `prefers-reduced-motion`, and automatically repositions its header when the viewport is too short for the roller to fit.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 672, "lastUpdated": "Aug 13, 2026", "lastUpdatedTs": 1786666262.9840717, "techSpecUrl": null, "html": "<h1>Roller Carousel</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A full-viewport, scroll-driven showcase \u2014 a sticky panel with a blurred, crossfading background, a vertically scrolling list of item names grouped under category labels, and a media panel that crossfades in sync with whichever item is currently centered. Built for showcasing a lineup of items (e.g. \"every app in Creative Cloud\") where page scroll drives which item is highlighted. Authored as one header row followed by any number of single-cell category-label rows and multi-cell item rows. No author-facing modifier classes; it automatically falls back to a static list for <code>prefers-reduced-motion</code>, and automatically repositions its header when the viewport is too short for the roller to fit.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Row 1 \u2014 header (1 cell)</td>\n<td>An optional short paragraph (eyebrow, e.g. \"All the apps you need\") followed by a heading (<code>H1</code>\u2013<code>H6</code>) \u2014 becomes the panel's title.</td>\n</tr>\n<tr>\n<td>Category row (1 cell)</td>\n<td>Plain text naming a group, e.g. \"Photography.\" Sets the category label shown above the list for every item row that follows it, until the next category row. Add one before your first item row \u2014 if you don't, the first group's category label renders blank.</td>\n</tr>\n<tr>\n<td>Item row (2 or 3 cells)</td>\n<td><strong>Cell 1:</strong> the item's name (plain text) \u2014 this is what scrolls through the list. <strong>Remaining cells:</strong> one or two images. With one image, it's used as the item's main media (shown in the media panel); with two, the first image becomes a small icon badge overlaid on the media and the second is the main media. A row whose name cell is empty is skipped entirely \u2014 it won't appear in the list.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<p>This block has no author-facing modifier classes \u2014 there's nothing to add to the block name. Two behaviors are automatic, not authored:</p>\n<ul>\n<li><strong>Reduced motion:</strong> if the visitor's OS has <code>prefers-reduced-motion: reduce</code> set, the block renders as a static, non-scrolling list (grouped under its category headings, with one fixed blurred background from the first item's image) instead of the scroll-driven roller.</li>\n<li><strong>Reflow:</strong> if the viewport is too short for the header, list, and media panel to fit together, the header automatically moves above the sticky panel to free up vertical room. This responds to available space at render/resize time \u2014 it isn't something you author.</li>\n</ul>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"3\">Roller Carousel</th></tr>\n<tr><td><p>All the apps you need</p>\n<h2>One place for every Creative Cloud app</h2></td><td></td><td></td></tr>\n<tr><td>Photography</td><td></td><td></td></tr>\n<tr><td>Lightroom</td><td><img alt=\"lr-icon.svg\" src=\"lr-icon.svg\" /></td><td><img alt=\"lightroom.jpg\" src=\"lightroom.jpg\" /></td></tr>\n<tr><td>Photoshop</td><td><img alt=\"ps-icon.svg\" src=\"ps-icon.svg\" /></td><td><img alt=\"photoshop.jpg\" src=\"photoshop.jpg\" /></td></tr>\n<tr><td>Video</td><td></td><td></td></tr>\n<tr><td>Premiere Pro</td><td><img alt=\"pr-icon.svg\" src=\"pr-icon.svg\" /></td><td><img alt=\"premiere.jpg\" src=\"premiere.jpg\" /></td></tr>\n<tr><td>After Effects</td><td><img alt=\"ae-icon.svg\" src=\"ae-icon.svg\" /></td><td><img alt=\"aftereffects.jpg\" src=\"aftereffects.jpg\" /></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>The total scroll distance scales with how many items you author (roughly one viewport height plus ~200px per item) \u2014 more items means more scrolling before the panel releases, and there's no per-instance way to shorten it.</li>\n<li>Category and item rows can be freely interleaved in any order or count \u2014 the code just walks rows top to bottom, treating any 1-cell row as a new category label and any 2+-cell row with a non-empty name as an item filed under whichever category label came most recently before it.</li>\n<li>Only one image is required per item; add a second only when you want the small icon badge over the main image. The icon is always whichever image appears first in the row, so order icon before main media if you use both.</li>\n<li>Media cells only read <code>&lt;picture&gt;</code> elements \u2014 video links are not supported here and won't display.</li>\n<li>Backgrounds are always heavily blurred and cropped to cover automatically; there's no authoring control over that treatment.</li>\n<li>Supports Milo's mobile/tablet/desktop content-override rows (see <a href=\"./rich-content.md\">rich-content.md</a>'s Notes for how that pattern works) \u2014 a viewport-delimiter row can give a different header, category set, or item lineup per breakpoint while inheriting anything left unchanged from the previous viewport.</li>\n</ul>", "footnotes": {}, "raw": "# Roller Carousel\n\n> **Quick summary:** A full-viewport, scroll-driven showcase \u2014 a sticky panel with a blurred, crossfading background, a vertically scrolling list of item names grouped under category labels, and a media panel that crossfades in sync with whichever item is currently centered. Built for showcasing a lineup of items (e.g. \"every app in Creative Cloud\") where page scroll drives which item is highlighted. Authored as one header row followed by any number of single-cell category-label rows and multi-cell item rows. No author-facing modifier classes; it automatically falls back to a static list for `prefers-reduced-motion`, and automatically repositions its header when the viewport is too short for the roller to fit.\n\n## Authoring instructions\n\n| Row | Content |\n| --- | --- |\n| Row 1 \u2014 header (1 cell) | An optional short paragraph (eyebrow, e.g. \"All the apps you need\") followed by a heading (`H1`\u2013`H6`) \u2014 becomes the panel's title. |\n| Category row (1 cell) | Plain text naming a group, e.g. \"Photography.\" Sets the category label shown above the list for every item row that follows it, until the next category row. Add one before your first item row \u2014 if you don't, the first group's category label renders blank. |\n| Item row (2 or 3 cells) | **Cell 1:** the item's name (plain text) \u2014 this is what scrolls through the list. **Remaining cells:** one or two images. With one image, it's used as the item's main media (shown in the media panel); with two, the first image becomes a small icon badge overlaid on the media and the second is the main media. A row whose name cell is empty is skipped entirely \u2014 it won't appear in the list. |\n\n## Variations\n\nThis block has no author-facing modifier classes \u2014 there's nothing to add to the block name. Two behaviors are automatic, not authored:\n\n- **Reduced motion:** if the visitor's OS has `prefers-reduced-motion: reduce` set, the block renders as a static, non-scrolling list (grouped under its category headings, with one fixed blurred background from the first item's image) instead of the scroll-driven roller.\n- **Reflow:** if the viewport is too short for the header, list, and media panel to fit together, the header automatically moves above the sticky panel to free up vertical room. This responds to available space at render/resize time \u2014 it isn't something you author.\n\n## Example\n\n```\n| Roller Carousel |\n| --- |\n| All the apps you need <br> ## One place for every Creative Cloud app |\n| Photography |\n| Lightroom | ![lr-icon.svg](lr-icon.svg) | ![lightroom.jpg](lightroom.jpg) |\n| Photoshop | ![ps-icon.svg](ps-icon.svg) | ![photoshop.jpg](photoshop.jpg) |\n| Video |\n| Premiere Pro | ![pr-icon.svg](pr-icon.svg) | ![premiere.jpg](premiere.jpg) |\n| After Effects | ![ae-icon.svg](ae-icon.svg) | ![aftereffects.jpg](aftereffects.jpg) |\n```\n\n## Notes\n\n- The total scroll distance scales with how many items you author (roughly one viewport height plus ~200px per item) \u2014 more items means more scrolling before the panel releases, and there's no per-instance way to shorten it.\n- Category and item rows can be freely interleaved in any order or count \u2014 the code just walks rows top to bottom, treating any 1-cell row as a new category label and any 2+-cell row with a non-empty name as an item filed under whichever category label came most recently before it.\n- Only one image is required per item; add a second only when you want the small icon badge over the main image. The icon is always whichever image appears first in the row, so order icon before main media if you use both.\n- Media cells only read `<picture>` elements \u2014 video links are not supported here and won't display.\n- Backgrounds are always heavily blurred and cropped to cover automatically; there's no authoring control over that treatment.\n- Supports Milo's mobile/tablet/desktop content-override rows (see [rich-content.md](./rich-content.md)'s Notes for how that pattern works) \u2014 a viewport-delimiter row can give a different header, category set, or item lineup per breakpoint while inheriting anything left unchanged from the previous viewport.\n"}, {"slug": "router-marquee", "title": "Router Marquee", "summary": "A full-viewport-height, auto-advancing hero carousel with a bottom tab-nav strip (icon + label per slide), used as a page's top hero for several rotating full-bleed slides a visitor can also jump between manually \u2014 e.g. a product-line router (\"Photography\", \"Video\", \"Design\", ...). Authored as a flat sequence of viewport-delimiter rows (`mobile-viewport` required, `tablet-viewport`/`desktop-viewport` optional) followed by one 2-cell slide row per slide (text cell: eyebrow, heading, tab icon+label, body, CTA; media cell: image or video). There are no author-facing modifier classes \u2014 content varies only by viewport delimiters. Note: adding a Section Metadata `starting-marquee` key reorders which slide plays first, and a `parallax move up fast` class on the *next* section makes this block reposition its nav controls automatically.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 1082, "lastUpdated": "Aug 6, 2026", "lastUpdatedTs": 1786042904.6349595, "techSpecUrl": null, "html": "<h1>Router Marquee</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A full-viewport-height, auto-advancing hero carousel with a bottom tab-nav strip (icon + label per slide), used as a page's top hero for several rotating full-bleed slides a visitor can also jump between manually \u2014 e.g. a product-line router (\"Photography\", \"Video\", \"Design\", ...). Authored as a flat sequence of viewport-delimiter rows (<code>mobile-viewport</code> required, <code>tablet-viewport</code>/<code>desktop-viewport</code> optional) followed by one 2-cell slide row per slide (text cell: eyebrow, heading, tab icon+label, body, CTA; media cell: image or video). There are no author-facing modifier classes \u2014 content varies only by viewport delimiters. Note: adding a Section Metadata <code>starting-marquee</code> key reorders which slide plays first, and a <code>parallax move up fast</code> class on the <em>next</em> section makes this block reposition its nav controls automatically.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as a flat sequence of rows: a single-cell <strong>viewport delimiter row</strong>, followed by one <strong>slide row per slide</strong> for that viewport. At minimum you need a <code>mobile-viewport</code> delimiter and its slides \u2014 <code>tablet-viewport</code> and <code>desktop-viewport</code> delimiters are optional. Breakpoint is screen width: mobile = below 768px, tablet = 768\u20131279px, desktop = 1280px and up.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Viewport delimiter</td>\n<td>A row with a single cell containing <code>mobile-viewport</code>, <code>tablet-viewport</code>, or <code>desktop-viewport</code>. Marks the start of that viewport's set of slides. Bare <code>mobile</code>/<code>tablet</code>/<code>desktop</code> still works but is a legacy fallback being phased out \u2014 use the <code>-viewport</code> form in new authoring. Only <code>mobile-viewport</code> is strictly required.</td>\n</tr>\n<tr>\n<td>Slide row (2 cells)</td>\n<td><strong>Cell 1 (text):</strong> an optional eyebrow paragraph, then a heading (H1 or H2 \u2014 becomes the slide title), then a small tab-icon paragraph (a link/image pointing to an <code>.svg</code> file), then immediately after it a label paragraph containing the link+text that becomes that slide's nav card (label text + destination URL), then any remaining body paragraph(s), then an optional CTA paragraph. <strong>Cell 2 (media):</strong> a background image, or an embedded video (it is automatically muted, looped, and lazy-loaded as the slide's animated background).</td>\n</tr>\n</tbody>\n</table>\n<p>Within cell 1, order matters because the script identifies pieces structurally, not by label:\n- <strong>Eyebrow</strong> = the paragraph immediately before the heading (any short line of text works, no special markup).\n- <strong>Title</strong> = the first <code>&lt;h1&gt;</code> or <code>&lt;h2&gt;</code> found.\n- <strong>Tab icon + label</strong> = a paragraph linking to an <code>.svg</code> asset (the nav card's icon), immediately followed by a paragraph containing a link (its text becomes the card's visible label, its href becomes the card's destination). Both paragraphs are removed from the slide body \u2014 they only render as the bottom nav card.\n- <strong>CTA</strong> = a paragraph containing italicized (<code>_..._</code>) links: a bold link (<code>**[text](url)**</code>) becomes the primary filled button, a plain link becomes the secondary outline button, e.g. <code>_**[Learn more](#)** [See plans](#)_</code>.\n- <strong>Body</strong> = any other paragraphs left in the cell.</p>\n<h2>Variations</h2>\n<p>This block has no author-facing modifier classes (nothing added in parentheses after the block name). Content variation is controlled entirely by the viewport delimiter rows described above:</p>\n<table>\n<thead>\n<tr>\n<th>Behavior</th>\n<th>Effect</th>\n<th>How to author it</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Only <code>mobile-viewport</code> defined</td>\n<td>Same slides shown at every screen size.</td>\n<td>Omit <code>tablet-viewport</code>/<code>desktop-viewport</code> delimiter rows entirely.</td>\n</tr>\n<tr>\n<td><code>tablet-viewport</code>/<code>desktop-viewport</code> defined with fewer slides than <code>mobile-viewport</code></td>\n<td>That viewport only shows the slides you explicitly listed (slide <em>count</em> is not inherited, only cell content is).</td>\n<td>Add the delimiter row and only as many slide rows as you want for that viewport.</td>\n</tr>\n<tr>\n<td>A slide's text or media cell left blank in <code>tablet-viewport</code>/<code>desktop-viewport</code></td>\n<td>That specific cell inherits content from the same-position slide in the next-lower defined viewport.</td>\n<td>Leave the cell empty in the table for that slide.</td>\n</tr>\n<tr>\n<td>Reorder which slide plays first</td>\n<td>Moves a given slide to the front of the rotation, across all viewports.</td>\n<td>Add a <strong><a href=\"./section-metadata.md\">Section Metadata</a></strong> block in the same section with key <code>starting-marquee</code> and the 1-based slide number as the value.</td>\n</tr>\n</tbody>\n</table>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Router Marquee</th></tr>\n<tr class=\"ex-viewport-row\"><td colspan=\"2\">&#9656; mobile-viewport</td></tr>\n<tr><td><h2>Photography</h2>\n<p><a href=\"icons/photography.svg\"></a></p>\n<p><a href=\"/photography/\">Photography</a></p>\n<p>Edit and organize every shot.</p>\n<p><em><strong><a href=\"#\">Explore</a></strong> <a href=\"#\">Learn more</a></em></p></td><td><img alt=\"\" src=\"/media/photo-bg-mobile.jpg\" /></td></tr>\n<tr><td><h2>Video</h2>\n<p><a href=\"icons/video.svg\"></a></p>\n<p><a href=\"/video/\">Video</a></p>\n<p>Cut, color, and publish faster.</p>\n<p><em><strong><a href=\"#\">Explore</a></strong> <a href=\"#\">Learn more</a></em></p></td><td><img alt=\"\" src=\"/media/video-bg-mobile.jpg\" /></td></tr>\n<tr class=\"ex-viewport-row\"><td colspan=\"2\">&#9656; desktop-viewport</td></tr>\n<tr><td><h2>Photography</h2>\n<p><a href=\"icons/photography.svg\"></a></p>\n<p><a href=\"/photography/\">Photography</a></p>\n<p>Edit and organize every shot.</p>\n<p><em><strong><a href=\"#\">Explore</a></strong> <a href=\"#\">Learn more</a></em></p></td><td><img alt=\"\" src=\"/media/photo-bg-desktop.jpg\" /></td></tr>\n<tr><td><h2>Video</h2>\n<p><a href=\"icons/video.svg\"></a></p>\n<p><a href=\"/video/\">Video</a></p>\n<p>Cut, color, and publish faster.</p>\n<p><em><strong><a href=\"#\">Explore</a></strong> <a href=\"#\">Learn more</a></em></p></td><td><img alt=\"\" src=\"/media/video-bg-desktop.jpg\" /></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>Slides auto-advance every 5 seconds, are swipeable on touch, and pause automatically whenever a visitor interacts with a link/button in the slide or scrolls to the next section; there's a visible pause/play control and a screen-reader hint announcing that autoplay is on. None of this is author-configurable.</li>\n<li>If <code>prefers-reduced-motion</code> is set, autoplay starts paused and slide transitions/staggered text animation are skipped \u2014 no authoring needed, this is automatic.</li>\n<li>Because slide count can legitimately differ between mobile and desktop (see Variations table), double-check each viewport's nav-card strip after publishing \u2014 a mismatched count is easy to introduce by accident when only editing one viewport's rows.</li>\n<li>The icon paragraph must link directly to an <code>.svg</code> file path; other image formats won't be picked up as the tab icon.</li>\n<li>Video gotcha (media cell): pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the video to autoplay only while scrolled into view (instead of finishing during page load), the video link's hash needs both <code>autoplay</code> and <code>viewportplay</code>, e.g. <code>#autoplay|viewportplay</code>. <span class=\"autoplay-warn\">Using <code>#autoplay</code> alone plays the video immediately on page load \u2014 by the time it's visible it has already finished, so visitors just see its frozen last frame.</span></li>\n<li><strong><a href=\"./section-metadata.md\">Section Metadata</a> <code>layout</code>/<code>style</code> interaction:</strong> if you add <code>parallax move up fast</code> (\u2192 class <code>parallax-move-up-fast</code>) to the Section Metadata <code>layout</code>/<code>style</code> row of the <em>section immediately after</em> this Router Marquee (e.g. so that next section animates up and covers the marquee as the visitor scrolls), Router Marquee's own CSS detects that adjacent class and repositions its bottom nav-card controls to make room. You only need to add the class to the following section \u2014 Router Marquee reacts to it automatically. This is part of Milo's shared scroll-animation system (see <a href=\"./section-metadata.md\">section-metadata.md</a>), not a Router Marquee variant of its own.</li>\n</ul>", "footnotes": {}, "raw": "# Router Marquee\n\n> **Quick summary:** A full-viewport-height, auto-advancing hero carousel with a bottom tab-nav strip (icon + label per slide), used as a page's top hero for several rotating full-bleed slides a visitor can also jump between manually \u2014 e.g. a product-line router (\"Photography\", \"Video\", \"Design\", ...). Authored as a flat sequence of viewport-delimiter rows (`mobile-viewport` required, `tablet-viewport`/`desktop-viewport` optional) followed by one 2-cell slide row per slide (text cell: eyebrow, heading, tab icon+label, body, CTA; media cell: image or video). There are no author-facing modifier classes \u2014 content varies only by viewport delimiters. Note: adding a Section Metadata `starting-marquee` key reorders which slide plays first, and a `parallax move up fast` class on the *next* section makes this block reposition its nav controls automatically.\n\n## Authoring instructions\n\nThe block is authored as a flat sequence of rows: a single-cell **viewport delimiter row**, followed by one **slide row per slide** for that viewport. At minimum you need a `mobile-viewport` delimiter and its slides \u2014 `tablet-viewport` and `desktop-viewport` delimiters are optional. Breakpoint is screen width: mobile = below 768px, tablet = 768\u20131279px, desktop = 1280px and up.\n\n| Row | Content |\n| --- | --- |\n| Viewport delimiter | A row with a single cell containing `mobile-viewport`, `tablet-viewport`, or `desktop-viewport`. Marks the start of that viewport's set of slides. Bare `mobile`/`tablet`/`desktop` still works but is a legacy fallback being phased out \u2014 use the `-viewport` form in new authoring. Only `mobile-viewport` is strictly required. |\n| Slide row (2 cells) | **Cell 1 (text):** an optional eyebrow paragraph, then a heading (H1 or H2 \u2014 becomes the slide title), then a small tab-icon paragraph (a link/image pointing to an `.svg` file), then immediately after it a label paragraph containing the link+text that becomes that slide's nav card (label text + destination URL), then any remaining body paragraph(s), then an optional CTA paragraph. **Cell 2 (media):** a background image, or an embedded video (it is automatically muted, looped, and lazy-loaded as the slide's animated background). |\n\nWithin cell 1, order matters because the script identifies pieces structurally, not by label:\n- **Eyebrow** = the paragraph immediately before the heading (any short line of text works, no special markup).\n- **Title** = the first `<h1>` or `<h2>` found.\n- **Tab icon + label** = a paragraph linking to an `.svg` asset (the nav card's icon), immediately followed by a paragraph containing a link (its text becomes the card's visible label, its href becomes the card's destination). Both paragraphs are removed from the slide body \u2014 they only render as the bottom nav card.\n- **CTA** = a paragraph containing italicized (`_..._`) links: a bold link (`**[text](url)**`) becomes the primary filled button, a plain link becomes the secondary outline button, e.g. `_**[Learn more](#)** [See plans](#)_`.\n- **Body** = any other paragraphs left in the cell.\n\n## Variations\n\nThis block has no author-facing modifier classes (nothing added in parentheses after the block name). Content variation is controlled entirely by the viewport delimiter rows described above:\n\n| Behavior | Effect | How to author it |\n| --- | --- | --- |\n| Only `mobile-viewport` defined | Same slides shown at every screen size. | Omit `tablet-viewport`/`desktop-viewport` delimiter rows entirely. |\n| `tablet-viewport`/`desktop-viewport` defined with fewer slides than `mobile-viewport` | That viewport only shows the slides you explicitly listed (slide *count* is not inherited, only cell content is). | Add the delimiter row and only as many slide rows as you want for that viewport. |\n| A slide's text or media cell left blank in `tablet-viewport`/`desktop-viewport` | That specific cell inherits content from the same-position slide in the next-lower defined viewport. | Leave the cell empty in the table for that slide. |\n| Reorder which slide plays first | Moves a given slide to the front of the rotation, across all viewports. | Add a **[Section Metadata](./section-metadata.md)** block in the same section with key `starting-marquee` and the 1-based slide number as the value. |\n\n## Example\n\n```\n| Router Marquee |\n| --- | --- |\n| mobile-viewport |\n| ## Photography <br> [](icons/photography.svg) <br> [Photography](/photography/) <br> Edit and organize every shot. <br> _**[Explore](#)** [Learn more](#)_ | ![](/media/photo-bg-mobile.jpg) |\n| ## Video <br> [](icons/video.svg) <br> [Video](/video/) <br> Cut, color, and publish faster. <br> _**[Explore](#)** [Learn more](#)_ | ![](/media/video-bg-mobile.jpg) |\n| desktop-viewport |\n| ## Photography <br> [](icons/photography.svg) <br> [Photography](/photography/) <br> Edit and organize every shot. <br> _**[Explore](#)** [Learn more](#)_ | ![](/media/photo-bg-desktop.jpg) |\n| ## Video <br> [](icons/video.svg) <br> [Video](/video/) <br> Cut, color, and publish faster. <br> _**[Explore](#)** [Learn more](#)_ | ![](/media/video-bg-desktop.jpg) |\n```\n\n## Notes\n\n- Slides auto-advance every 5 seconds, are swipeable on touch, and pause automatically whenever a visitor interacts with a link/button in the slide or scrolls to the next section; there's a visible pause/play control and a screen-reader hint announcing that autoplay is on. None of this is author-configurable.\n- If `prefers-reduced-motion` is set, autoplay starts paused and slide transitions/staggered text animation are skipped \u2014 no authoring needed, this is automatic.\n- Because slide count can legitimately differ between mobile and desktop (see Variations table), double-check each viewport's nav-card strip after publishing \u2014 a mismatched count is easy to introduce by accident when only editing one viewport's rows.\n- The icon paragraph must link directly to an `.svg` file path; other image formats won't be picked up as the tab icon.\n- Video gotcha (media cell): pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the video to autoplay only while scrolled into view (instead of finishing during page load), the video link's hash needs both `autoplay` and `viewportplay`, e.g. `#autoplay|viewportplay`. Using `#autoplay` alone plays the video immediately on page load \u2014 by the time it's visible it has already finished, so visitors just see its frozen last frame.\n- **[Section Metadata](./section-metadata.md) `layout`/`style` interaction:** if you add `parallax move up fast` (\u2192 class `parallax-move-up-fast`) to the Section Metadata `layout`/`style` row of the *section immediately after* this Router Marquee (e.g. so that next section animates up and covers the marquee as the visitor scrolls), Router Marquee's own CSS detects that adjacent class and repositions its bottom nav-card controls to make room. You only need to add the class to the following section \u2014 Router Marquee reacts to it automatically. This is part of Milo's shared scroll-animation system (see [section-metadata.md](./section-metadata.md)), not a Router Marquee variant of its own.\n"}, {"slug": "section-metadata", "title": "Section Metadata", "summary": "> - A hidden key/value configuration table (never rendered visibly), placed at the bottom of a Section to control section-level behavior \u2014 not a visual block. Each row is a `key | value` pair, or `key | value1 | value2 | value3` for per-viewport values. - Six recognized keys: `style`, `layout`, `background`, `masonry`, `anchor`, `images`. - `style`/`layout` class values are organized further down into grouped tables by purpose (visual/structural, multi-block grid, bento, scroll-animation, single-block-only). Not every key/class is available in every deployment \u2014 see the Availability notes. - A dedicated \"Cross-block interactions\" section covers how other blocks react to specific classes \u2014 worth checking before you add a class expecting an effect elsewhere.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 2685, "lastUpdated": "Aug 6, 2026", "lastUpdatedTs": 1786042904.6481502, "techSpecUrl": null, "html": "<h1>Section Metadata</h1>\n<blockquote>\n<p><strong>Quick summary:</strong>\n- A hidden key/value configuration table (never rendered visibly), placed at the bottom of a Section to control section-level behavior \u2014 not a visual block. Each row is a <code>key | value</code> pair, or <code>key | value1 | value2 | value3</code> for per-viewport values.\n- Six recognized keys: <code>style</code>, <code>layout</code>, <code>background</code>, <code>masonry</code>, <code>anchor</code>, <code>images</code>.\n- <code>style</code>/<code>layout</code> class values are organized further down into grouped tables by purpose (visual/structural, multi-block grid, bento, scroll-animation, single-block-only). Not every key/class is available in every deployment \u2014 see the Availability notes.\n- A dedicated \"Cross-block interactions\" section covers how other blocks react to specific classes \u2014 worth checking before you add a class expecting an effect elsewhere.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>Section Metadata is a table where <strong>the first cell of each row is a key name</strong> and the remaining cell(s) in that row are its value(s). The block itself is hidden (<code>display: none</code>), so none of this renders visibly.</p>\n<table>\n<thead>\n<tr>\n<th>Row (key)</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>style</code></td>\n<td>One or more CSS class names, comma-separated (e.g. <code>divider, rounded-corners</code>), applied directly to the containing section. Put 1 cell to apply the same classes at all breakpoints, or 2 cells (mobile | tablet+desktop) or 3 cells (mobile | tablet | desktop) to swap which classes are active per breakpoint (classes are added/removed live as the viewport changes). See \"Which values go under which key\" and \"Multi-block grids\" below.</td>\n</tr>\n<tr>\n<td><code>layout</code></td>\n<td>Same mechanism and cell structure as <code>style</code> (also class names, same 1/2/3-cell viewport logic) \u2014 functionally identical, just a separate key so authors can organize layout-only classes separately from cosmetic ones if they want. Using either accomplishes the same thing; don't use both on the same section.</td>\n</tr>\n<tr>\n<td><code>background</code></td>\n<td>One cell per background layer. Each cell holds either an image, a video link, or plain color text (e.g. <code>#1E1E1E</code>). 1 cell = same background at all sizes. 2 cells = mobile | tablet+desktop. 3 cells = mobile | tablet | desktop. Adds a background-present flag to the section and inserts an absolutely-positioned background layer behind the content. For an image cell, a second line of text under the image (e.g. <code>left, top</code>) sets its focal point/object-position.</td>\n</tr>\n<tr>\n<td><code>masonry</code></td>\n<td>Defines the grid span of each direct child block in the section, for use with <code>bento</code> or masonry grids. Value is written as one line per child block, <code>span N</code> (or comma-separated spans per row for multi-column masonry rows), e.g.: line 1 <code>span 8</code>, line 2 <code>span 4, span 4</code> \u2014 also accepts <code>full width</code>/<code>half width</code>. Use 1 cell for a fixed layout, or 2\u20133 cells for mobile/tablet/desktop variants (same viewport rules as <code>style</code>). Adds a masonry-layout class to the section. Like <code>product-grid</code>, this works with <em>any</em> block placed in the section \u2014 it's not tied to a specific one. It's most commonly used to arrange a mix of differently-sized promo/card blocks (<a href=\"./base-card.md\">Base Card</a>, <a href=\"./explore-card.md\">Explore Card</a>, <a href=\"./product-marquee-grid.md\">Product Marquee Grid</a>, and similar) into an uneven bento-style layout rather than a strict even grid.</td>\n</tr>\n<tr>\n<td><code>anchor</code></td>\n<td>A single word/phrase used as the section's jump-to <code>id</code> (lowercased, spaces converted to hyphens) \u2014 pair with <a href=\"./rich-content.md\">Rich Content</a>'s <code>jump-link</code> variant or any in-page anchor link.</td>\n</tr>\n<tr>\n<td><code>images</code></td>\n<td>A comma-separated list of picture-optimization hints applied to every <code>&lt;picture&gt;</code> in the section: a resolution multiplier (<code>1x</code>, <code>2x</code>, <code>3x</code>) and/or an encoding hint (<code>photography</code> \u2192 AVIF, <code>product</code> \u2192 WebP). Use <code>off</code> to explicitly skip this optimization.</td>\n</tr>\n</tbody>\n</table>\n<p>These six keys (<code>style</code>, <code>layout</code>, <code>background</code>, <code>masonry</code>, <code>anchor</code>, <code>images</code>) are recognized everywhere this block is used. Any other key/value row is silently ignored by this block's own code \u2014 though other blocks may read their own keys directly out of the same table (see \"Custom keys read by other blocks\" below).</p>\n<h2>Variations</h2>\n<p>Section Metadata has no author-facing modifier classes on the block itself \u2014 it is always just <code>Section Metadata</code>, and all behavior comes from which key rows you include.</p>\n<h3>Which values go under which key</h3>\n<p>Only <strong><code>style</code>/<code>layout</code></strong> accept freeform CSS class names \u2014 that's what the rest of this section documents. The other four keys each have their own fixed value type instead of a class list:</p>\n<table>\n<thead>\n<tr>\n<th>Key</th>\n<th>Value type</th>\n<th>Where documented</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>style</code> / <code>layout</code></td>\n<td>CSS class names, grouped below by what they do</td>\n<td>This section</td>\n</tr>\n<tr>\n<td><code>background</code></td>\n<td>Image, video, or color</td>\n<td>Authoring instructions table above</td>\n</tr>\n<tr>\n<td><code>masonry</code></td>\n<td>Grid-span sizes (<code>span N</code>, <code>full width</code>, <code>half width</code>)</td>\n<td>Authoring instructions table above</td>\n</tr>\n<tr>\n<td><code>images</code></td>\n<td>Optimization-hint keywords (<code>1x</code>/<code>2x</code>/<code>3x</code>, <code>photography</code>/<code>product</code>, <code>off</code>)</td>\n<td>Authoring instructions table above</td>\n</tr>\n<tr>\n<td><code>anchor</code></td>\n<td>Plain text (becomes the jump-link id)</td>\n<td>Authoring instructions table above</td>\n</tr>\n</tbody>\n</table>\n<h3><code>style</code> / <code>layout</code> classes, grouped by purpose</h3>\n<p>Any class name is technically accepted (it's just added to the section), but only these have matching CSS. A typo (e.g. <code>countainer</code>) is silently accepted and does nothing \u2014 spelling isn't validated. All of the classes below go under <strong>either</strong> <code>style</code> or <code>layout</code> \u2014 the two keys are interchangeable (see Notes), so which one you pick doesn't change anything.</p>\n<p><strong>Visual &amp; structural</strong> \u2014 standalone, no pairing required:</p>\n<table>\n<thead>\n<tr>\n<th>Class</th>\n<th>Effect</th>\n<th>Availability</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>divider</code></td>\n<td>Bottom border line under the section.</td>\n<td>All deployments</td>\n</tr>\n<tr>\n<td><code>vertical center</code></td>\n<td>Centers content vertically within the section.</td>\n<td>All deployments</td>\n</tr>\n<tr>\n<td><code>rounded corners</code> / <code>rounded corners top</code> / <code>rounded corners bottom</code></td>\n<td>Rounds all 4 corners / only top / only bottom.</td>\n<td>All deployments</td>\n</tr>\n<tr>\n<td><code>container</code></td>\n<td>Makes the section a grid container; pair with a <code>grid width 6</code>/<code>8</code>/<code>10</code> class to constrain its content width.</td>\n<td>All deployments</td>\n</tr>\n<tr>\n<td><code>grid width 6</code> / <code>8</code> / <code>10</code></td>\n<td>Constrains grid content width to 6/8/10 of 12 columns (desktop only). Pairs with <code>container</code>.</td>\n<td>All deployments</td>\n</tr>\n<tr>\n<td><code>scrim</code></td>\n<td>Adds a dark gradient overlay over the section's background image/video (gradient direction/stops are cosmetic details that vary slightly).</td>\n<td>All deployments</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Multi-block grid</strong> \u2014 must be combined together (full detail in \"Multi-block grids\" below):</p>\n<table>\n<thead>\n<tr>\n<th>Class</th>\n<th>Effect</th>\n<th>Availability</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>product grid</code> + a <code>-up</code> class</td>\n<td>Turns the section into a multi-block grid.</td>\n<td>All deployments</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Bento layout:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Class</th>\n<th>Effect</th>\n<th>Availability</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>bento</code></td>\n<td>Enables a bento-style grid layout; several other blocks (e.g. <a href=\"./explore-card.md\">Explore Card</a>, <a href=\"./rich-content.md\">Rich Content</a>'s <code>grid-full-width</code>) have extra CSS for sections carrying this class.</td>\n<td>Most deployments</td>\n</tr>\n<tr>\n<td><code>bento</code> + <code>stack-mobile</code> (together)</td>\n<td>Loads a sticky, depth-scaled mobile card-stack scroll animation for a bento section's child cards (e.g. <a href=\"./explore-card.md\">Explore Card</a>) with a <a href=\"./rich-content.md\">Rich Content</a> title pinned above it. Only active below the 768px breakpoint; respects reduced-motion.</td>\n<td>Only some deployments</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Scroll-animation family</strong> \u2014 part of Milo's shared scroll-driven section-transition system; this block mostly just passes these through rather than implementing the animation itself (see \"Cross-block interactions\" below for what actually reacts to them):</p>\n<table>\n<thead>\n<tr>\n<th>Class</th>\n<th>Effect</th>\n<th>Availability</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>parallax move up fast</code></td>\n<td>Triggers a scroll-linked \"move up\" transition on the section; see Cross-block interactions for the one block that also reacts to it directly.</td>\n<td>All deployments</td>\n</tr>\n<tr>\n<td><code>parallax garage door reveal</code> / <code>parallax double garage door</code></td>\n<td>Scroll-driven \"garage door\" reveal transitions between sections.</td>\n<td>All deployments</td>\n</tr>\n<tr>\n<td><code>parallax video garage door</code></td>\n<td>A variant of the above, paired with <a href=\"./rich-content.md\">Rich Content</a>'s <code>media</code> variant on the same section \u2014 no effect without that variant also present.</td>\n<td>Only where Rich Content's <code>media</code> variant is available (see <a href=\"./rich-content.md\">rich-content.md</a>)</td>\n</tr>\n<tr>\n<td><code>parallax stagger ltr</code> / <code>parallax stagger rtl</code></td>\n<td>Staggers the scroll-in of a section's child items left-to-right or right-to-left; pairs with the multi-block grid classes above (see \"Multi-block grids\").</td>\n<td>All deployments</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Narrow, single-block-only values</strong> \u2014 not general-purpose, only meaningful with one specific block:</p>\n<table>\n<thead>\n<tr>\n<th>Class</th>\n<th>Effect</th>\n<th>Availability</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>base card section</code></td>\n<td>Forces a single-column mobile layout with extra gap for a section holding multiple <a href=\"./base-card.md\">Base Card</a> blocks.</td>\n<td>Wherever Base Card is used</td>\n</tr>\n<tr>\n<td><code>region selector text</code></td>\n<td>Used only inside the region/locale-selector <a href=\"./modal.md\">Modal</a> fragment to tighten its intro-copy padding/typography. Don't reuse it elsewhere.</td>\n<td>Wherever that Modal fragment is used</td>\n</tr>\n</tbody>\n</table>\n<h3>Multi-block grids: <code>product-grid</code> + <code>two-up</code> / <code>three-up</code> / <code>four-up</code> / <code>six-up</code></h3>\n<p>To arrange <strong>more than one block side-by-side in the same section</strong> as an even-column grid instead of the default stacked layout, add both a grid-mode class and a column-count class to the same <code>style</code>/<code>layout</code> row:</p>\n<table>\n<thead>\n<tr>\n<th>Class</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>product-grid</code></td>\n<td>Turns the section into a CSS grid with stretched, equal-height rows. Does nothing on its own \u2014 must be paired with one of the column-count classes below.</td>\n</tr>\n<tr>\n<td><code>two-up</code></td>\n<td>2 columns (tablet width and up; collapses to 1 column on mobile).</td>\n</tr>\n<tr>\n<td><code>three-up</code></td>\n<td>3 columns.</td>\n</tr>\n<tr>\n<td><code>four-up</code></td>\n<td>4 columns.</td>\n</tr>\n<tr>\n<td><code>six-up</code></td>\n<td>6 columns.</td>\n</tr>\n<tr>\n<td><code>fill-last-row</code></td>\n<td>Pairs only with <code>two-up</code>: a leftover single block in the last row spans the full row width instead of sitting alone in one column.</td>\n</tr>\n</tbody>\n</table>\n<p>There's no <code>five-up</code> \u2014 only two/three/four/six column counts are defined, and this behaves identically everywhere the block is used.</p>\n<p>Optionally add <code>parallax-stagger-ltr</code>/<code>parallax-stagger-rtl</code> to the same row for a staggered scroll-in animation whose per-column timing automatically matches the <code>-up</code> count you picked. In most deployments, this block's own code also computes the per-item stagger index locally to drive that timing; in the simplest deployment there's no such code \u2014 stagger there relies entirely on the shared animation system reading DOM position, with nothing computed here.</p>\n<p><strong>Which blocks this is commonly used with:</strong> <code>product-grid</code> + a <code>-up</code> class works with <em>any</em> block \u2014 it's positional, not tied to a specific block. In practice it's most often used to arrange several small, self-contained promo/card-style blocks side by side (e.g. <a href=\"./base-card.md\">Base Card</a>, <a href=\"./explore-card.md\">Explore Card</a>, <a href=\"./product-marquee-grid.md\">Product Marquee Grid</a>), since those are sized to sit comfortably in an even column.</p>\n<p><strong>Gotcha \u2014 two blocks reuse these exact class names internally, unrelated to this system:</strong> <a href=\"./news.md\">News</a> and <a href=\"./quick-actions.md\">Quick Actions</a> both apply <code>two-up</code>/<code>three-up</code>/<code>four-up</code>/<code>six-up</code> (or a subset) to their <em>own internal</em> item/tile grid automatically, based on item count or viewport width \u2014 this has nothing to do with Section Metadata's <code>product-grid</code> system and isn't affected by adding these classes here. If you're troubleshooting a News or Quick Actions layout and see these class names, check that block's own doc (<a href=\"./news.md\">news.md</a> / <a href=\"./quick-actions.md\">quick-actions.md</a>) rather than this one.</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"3\">Section Metadata</th></tr>\n<tr><td>style</td><td>rounded corners</td><td>container</td></tr>\n<tr><td>background</td><td><span class=\"color-swatch\" style=\"background:#000000\"></span><code>#000000</code></td><td><img alt=\"Desktop background\" src=\"/media/hero-bg.jpg\" /></td></tr>\n<tr><td>anchor</td><td>Featured products</td><td></td></tr>\n</table>\n\n<p>Masonry example, with different spans per breakpoint:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"3\">Section Metadata</th></tr>\n<tr><td>masonry</td><td>full width, half width, half width</td><td>span 4, span 4, span 4</td></tr>\n</table>\n\n<p>Multi-block grid example \u2014 3 blocks arranged as an even 3-column grid, with scroll-in stagger:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Section Metadata</th></tr>\n<tr><td>style</td><td>product grid, three up, parallax stagger ltr</td></tr>\n</table>\n\n<p>(Place this Section Metadata at the bottom of a section that also contains three visual blocks \u2014 they'll tile into 3 equal columns instead of stacking.)</p>\n<h2>Notes</h2>\n<ul>\n<li>The <code>style</code>/<code>layout</code> classes only take effect together with matching CSS \u2014 a typo silently does nothing.</li>\n<li>For <code>background</code>, plain text with no image/video in that cell is treated as a CSS color value \u2014 an empty cell is simply skipped, it does not clear a previously inherited background.</li>\n<li><code>masonry</code>'s span list is matched to the section's other blocks <strong>in DOM order</strong>, excluding this Section Metadata block and any auto-generated background container \u2014 miscounting blocks (e.g. forgetting a hidden metadata block further up) will misalign spans to the wrong block.</li>\n<li>Multi-column <code>style</code>/<code>background</code>/<code>masonry</code> rows switch live as the browser is resized (wired to media-query listeners), so you can preview the breakpoint switch by resizing the window rather than needing separate device tests.</li>\n<li><code>product-grid</code> by itself does nothing \u2014 it must be combined with a <code>two-up</code>/<code>three-up</code>/<code>four-up</code>/<code>six-up</code> class in the same row, or the section falls back to its default stacked layout.</li>\n<li>The column count on mobile is always effectively 1 (the grid collapses to a single column below the tablet breakpoint) regardless of which <code>-up</code> class you chose \u2014 the <code>-up</code> class only controls tablet/desktop column count. This is identical everywhere the block is used.</li>\n<li>Key matching is case-insensitive and whitespace-trimmed (e.g. <code>Background</code> and <code>background</code> both work), but must otherwise match exactly \u2014 <code>back ground</code> will not.</li>\n<li><code>style</code> and <code>layout</code> are functionally identical (both call the same class-toggling code); they exist as two keys purely so authors can separate concerns.</li>\n<li>Video gotcha (<code>background</code> key): pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the background video to autoplay only while scrolled into view (instead of finishing during page load), the video link's hash needs both <code>autoplay</code> and <code>viewportplay</code>, e.g. <code>#autoplay|viewportplay</code>. <span class=\"autoplay-warn\">Using <code>#autoplay</code> alone plays the video immediately on page load \u2014 by the time the section is visible it has already finished, so visitors just see its frozen last frame.</span></li>\n</ul>\n<h3>Cross-block interactions</h3>\n<p>Some other blocks have their own CSS/JS tied to a specific <code>style</code>/<code>layout</code> class on the section:</p>\n<table>\n<thead>\n<tr>\n<th>Class</th>\n<th>Block</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>parallax move up fast</code></td>\n<td><a href=\"./router-marquee.md\">Router Marquee</a></td>\n<td>If the section <em>immediately after</em> a Router Marquee carries this class, the marquee repositions its bottom nav-card controls to make room as that section animates up over it.</td>\n</tr>\n<tr>\n<td><code>parallax move up fast</code>, <code>parallax garage door reveal</code></td>\n<td><a href=\"./offer-hero.md\">Offer Hero</a></td>\n<td>Suppresses Offer Hero's own <code>rounded-corners-bottom</code> treatment when either is also present, to avoid clipping during the scroll transition.</td>\n</tr>\n<tr>\n<td><code>parallax video garage door</code></td>\n<td><a href=\"./rich-content.md\">Rich Content</a></td>\n<td>Enables a scroll-driven \"garage door\" reveal of the media, only when combined with Rich Content's own <code>media</code> variant.</td>\n</tr>\n<tr>\n<td><code>bento</code></td>\n<td><a href=\"./explore-card.md\">Explore Card</a>, <a href=\"./rich-content.md\">Rich Content</a> (via <code>grid-full-width</code>)</td>\n<td>Extra spacing/sizing rules specific to those blocks when placed in a bento-style section.</td>\n</tr>\n<tr>\n<td><code>bento</code> + <code>stack-mobile</code></td>\n<td>Section Metadata itself (this doc)</td>\n<td>Loads the mobile card-stack scroll animation described above.</td>\n</tr>\n<tr>\n<td><code>base card section</code></td>\n<td><a href=\"./base-card.md\">Base Card</a></td>\n<td>Forces single-column mobile layout for a multi-card grid.</td>\n</tr>\n<tr>\n<td><code>region selector text</code></td>\n<td><a href=\"./modal.md\">Modal</a></td>\n<td>Tightens padding/typography for the region-selector modal fragment's intro copy.</td>\n</tr>\n</tbody>\n</table>\n<p><code>parallax move up fast</code>, <code>parallax garage door reveal</code>, <code>parallax double garage door</code>, and <code>parallax stagger ltr</code>/<code>rtl</code> are otherwise part of Milo's shared scroll-driven section-transition system \u2014 this block mostly just passes the class name through to the section rather than implementing the animation itself. Treat that system as the source of truth for exact scroll-animation behavior beyond what's listed above.</p>\n<h3>Custom keys read by other blocks</h3>\n<p>These rows aren't processed by Section Metadata's own code \u2014 the other block reads its own key(s) directly out of the same table.</p>\n<table>\n<thead>\n<tr>\n<th>Key</th>\n<th>Read by</th>\n<th>Format</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>carousel</code></td>\n<td><a href=\"./carousel-c2.md\">Carousel C2</a></td>\n<td>Value must match the parent Carousel C2 block's name exactly \u2014 tags that section as one of its slides.</td>\n</tr>\n<tr>\n<td><code>starting-marquee</code></td>\n<td><a href=\"./router-marquee.md\">Router Marquee</a></td>\n<td>1-based slide number \u2014 reorders which slide plays first.</td>\n</tr>\n<tr>\n<td><code>tab</code>, <code>tab-background</code>, <code>link</code>, <code>deeplink</code></td>\n<td><a href=\"./tabs.md\">Tabs</a></td>\n<td>Attaches the whole section as a tab panel; see <a href=\"./tabs.md\">tabs.md</a>.</td>\n</tr>\n<tr>\n<td><code>custom-hide</code></td>\n<td><a href=\"./floating-cta.md\">Floating CTA</a></td>\n<td>A CSS selector \u2014 hides the floating CTA while the matching element is in view.</td>\n</tr>\n<tr>\n<td><code>expand</code></td>\n<td><a href=\"./comparison-table-c2.md\">Comparison Table C2</a></td>\n<td><code>all</code>, or a comma-separated list of 1-based sub-table numbers \u2014 controls which <code>+++</code>-separated sub-tables render expanded by default.</td>\n</tr>\n</tbody>\n</table>", "footnotes": {}, "raw": "# Section Metadata\n\n> **Quick summary:**\n> - A hidden key/value configuration table (never rendered visibly), placed at the bottom of a Section to control section-level behavior \u2014 not a visual block. Each row is a `key | value` pair, or `key | value1 | value2 | value3` for per-viewport values.\n> - Six recognized keys: `style`, `layout`, `background`, `masonry`, `anchor`, `images`.\n> - `style`/`layout` class values are organized further down into grouped tables by purpose (visual/structural, multi-block grid, bento, scroll-animation, single-block-only). Not every key/class is available in every deployment \u2014 see the Availability notes.\n> - A dedicated \"Cross-block interactions\" section covers how other blocks react to specific classes \u2014 worth checking before you add a class expecting an effect elsewhere.\n\n## Authoring instructions\n\nSection Metadata is a table where **the first cell of each row is a key name** and the remaining cell(s) in that row are its value(s). The block itself is hidden (`display: none`), so none of this renders visibly.\n\n| Row (key) | Content |\n| --- | --- |\n| `style` | One or more CSS class names, comma-separated (e.g. `divider, rounded-corners`), applied directly to the containing section. Put 1 cell to apply the same classes at all breakpoints, or 2 cells (mobile \\| tablet+desktop) or 3 cells (mobile \\| tablet \\| desktop) to swap which classes are active per breakpoint (classes are added/removed live as the viewport changes). See \"Which values go under which key\" and \"Multi-block grids\" below. |\n| `layout` | Same mechanism and cell structure as `style` (also class names, same 1/2/3-cell viewport logic) \u2014 functionally identical, just a separate key so authors can organize layout-only classes separately from cosmetic ones if they want. Using either accomplishes the same thing; don't use both on the same section. |\n| `background` | One cell per background layer. Each cell holds either an image, a video link, or plain color text (e.g. `#1E1E1E`). 1 cell = same background at all sizes. 2 cells = mobile \\| tablet+desktop. 3 cells = mobile \\| tablet \\| desktop. Adds a background-present flag to the section and inserts an absolutely-positioned background layer behind the content. For an image cell, a second line of text under the image (e.g. `left, top`) sets its focal point/object-position. |\n| `masonry` | Defines the grid span of each direct child block in the section, for use with `bento` or masonry grids. Value is written as one line per child block, `span N` (or comma-separated spans per row for multi-column masonry rows), e.g.: line 1 `span 8`, line 2 `span 4, span 4` \u2014 also accepts `full width`/`half width`. Use 1 cell for a fixed layout, or 2\u20133 cells for mobile/tablet/desktop variants (same viewport rules as `style`). Adds a masonry-layout class to the section. Like `product-grid`, this works with *any* block placed in the section \u2014 it's not tied to a specific one. It's most commonly used to arrange a mix of differently-sized promo/card blocks ([Base Card](./base-card.md), [Explore Card](./explore-card.md), [Product Marquee Grid](./product-marquee-grid.md), and similar) into an uneven bento-style layout rather than a strict even grid. |\n| `anchor` | A single word/phrase used as the section's jump-to `id` (lowercased, spaces converted to hyphens) \u2014 pair with [Rich Content](./rich-content.md)'s `jump-link` variant or any in-page anchor link. |\n| `images` | A comma-separated list of picture-optimization hints applied to every `<picture>` in the section: a resolution multiplier (`1x`, `2x`, `3x`) and/or an encoding hint (`photography` \u2192 AVIF, `product` \u2192 WebP). Use `off` to explicitly skip this optimization. |\n\nThese six keys (`style`, `layout`, `background`, `masonry`, `anchor`, `images`) are recognized everywhere this block is used. Any other key/value row is silently ignored by this block's own code \u2014 though other blocks may read their own keys directly out of the same table (see \"Custom keys read by other blocks\" below).\n\n## Variations\n\nSection Metadata has no author-facing modifier classes on the block itself \u2014 it is always just `Section Metadata`, and all behavior comes from which key rows you include.\n\n### Which values go under which key\n\nOnly **`style`/`layout`** accept freeform CSS class names \u2014 that's what the rest of this section documents. The other four keys each have their own fixed value type instead of a class list:\n\n| Key | Value type | Where documented |\n| --- | --- | --- |\n| `style` / `layout` | CSS class names, grouped below by what they do | This section |\n| `background` | Image, video, or color | Authoring instructions table above |\n| `masonry` | Grid-span sizes (`span N`, `full width`, `half width`) | Authoring instructions table above |\n| `images` | Optimization-hint keywords (`1x`/`2x`/`3x`, `photography`/`product`, `off`) | Authoring instructions table above |\n| `anchor` | Plain text (becomes the jump-link id) | Authoring instructions table above |\n\n### `style` / `layout` classes, grouped by purpose\n\nAny class name is technically accepted (it's just added to the section), but only these have matching CSS. A typo (e.g. `countainer`) is silently accepted and does nothing \u2014 spelling isn't validated. All of the classes below go under **either** `style` or `layout` \u2014 the two keys are interchangeable (see Notes), so which one you pick doesn't change anything.\n\n**Visual & structural** \u2014 standalone, no pairing required:\n\n| Class | Effect | Availability |\n| --- | --- | --- |\n| `divider` | Bottom border line under the section. | All deployments |\n| `vertical center` | Centers content vertically within the section. | All deployments |\n| `rounded corners` / `rounded corners top` / `rounded corners bottom` | Rounds all 4 corners / only top / only bottom. | All deployments |\n| `container` | Makes the section a grid container; pair with a `grid width 6`/`8`/`10` class to constrain its content width. | All deployments |\n| `grid width 6` / `8` / `10` | Constrains grid content width to 6/8/10 of 12 columns (desktop only). Pairs with `container`. | All deployments |\n| `scrim` | Adds a dark gradient overlay over the section's background image/video (gradient direction/stops are cosmetic details that vary slightly). | All deployments |\n\n**Multi-block grid** \u2014 must be combined together (full detail in \"Multi-block grids\" below):\n\n| Class | Effect | Availability |\n| --- | --- | --- |\n| `product grid` + a `-up` class | Turns the section into a multi-block grid. | All deployments |\n\n**Bento layout:**\n\n| Class | Effect | Availability |\n| --- | --- | --- |\n| `bento` | Enables a bento-style grid layout; several other blocks (e.g. [Explore Card](./explore-card.md), [Rich Content](./rich-content.md)'s `grid-full-width`) have extra CSS for sections carrying this class. | Most deployments |\n| `bento` + `stack-mobile` (together) | Loads a sticky, depth-scaled mobile card-stack scroll animation for a bento section's child cards (e.g. [Explore Card](./explore-card.md)) with a [Rich Content](./rich-content.md) title pinned above it. Only active below the 768px breakpoint; respects reduced-motion. | Only some deployments |\n\n**Scroll-animation family** \u2014 part of Milo's shared scroll-driven section-transition system; this block mostly just passes these through rather than implementing the animation itself (see \"Cross-block interactions\" below for what actually reacts to them):\n\n| Class | Effect | Availability
