                            |\n| See how Generative Fill extends and edits images in seconds. [Watch the demo](https://www.adobe.com/videos/gen-fill-demo.mp4) | ![Generative Fill demo preview](/gen-fill-poster.jpg) |\n| ------------------------------------------------------------------------------------------------------------ |\n| ![icon](https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg)                                                                                      |\n| ## Firefly for video                                                                                          |\n| Learn more                                                                                                    |\n| Bring AI-generated effects into your video timeline. [Explore Firefly video](https://www.adobe.com/firefly-video.html) | ![Firefly video effects preview](/firefly-video-thumb.jpg) |\n```\n\n## Notes\n\n- The left column's first four items are read **positionally** \u2014 you cannot omit the icon or reorder heading/link-name/description; if a slide is missing one of them, later items will shift into the wrong role (e.g. the description's link will be searched for in whatever content actually lands in that fourth slot).\n- Because the entire card is a single link, don't add a second link elsewhere in the card \u2014 only the link found inside the fourth (description) item is used, but any other links will be visually inert or confusing since clicks anywhere on the card navigate via the card's own link.\n- Five cards is the assumed/default layout width (the sizing math is tuned around five); adding more or fewer will still work, but the elastic hover-grow width and gaps are tuned around five cards.\n- On the first slide, the accessible label read to screen readers includes the carousel's name, derived from the link's text split on a pipe character (`Label | Carousel Name`) \u2014 if you don't include a pipe in the first slide's link text, the whole link text is used and \"Adobe slides\" is used as a fallback name.\n- Row order in the doc table is the slide order shown left-to-right (or right-to-left, reversed automatically, on RTL pages).\n- The label paragraph's text is also reused for analytics tracking and for building the carousel's accessible name, which the code expects in a `Category|Label` pipe-delimited format (e.g. `Adobe Express|Learn more`) \u2014 if you omit the pipe, the carousel's accessible label falls back to the generic string \"Adobe slides\".\n- SVG images (icon or media) are automatically rewritten to Milo's federated (shared, cross-site) asset URL; no special authoring is needed beyond using a normal image.\n- Video slides only get their real playback, autoplay/rewind-on-hover, and mobile auto-play-in-view behavior if the media cell resolves to an actual video element via Milo's standard video-link authoring \u2014 a plain video *file link* pasted the normal Milo way is what triggers this; a video embedded via an unsupported method will just render as a static link/image.\n- Video gotcha: the poster image (shown in the example above) must sit immediately next to the video link \u2014 Milo grabs the poster from whichever image is adjacent to the link, and won't show one otherwise. For the mobile auto-play-in-view behavior above to actually kick in, the video link's hash needs both `autoplay` and `viewportplay`, e.g. `#autoplay|viewportplay`. Using `#autoplay` alone plays the video immediately on page load \u2014 by the time it scrolls into view it has already finished, so visitors just see its frozen last frame.\n"}, {"slug": "explore-card", "title": "Explore Card", "summary": "A full-bleed image/video card where the entire tile is one clickable link, with icon/title/description over a gradient scrim that fades in on hover/focus \u2014 used for \"explore\" grids where each card links out to a bigger story or product page. Authored as a table: row 1 (required) holds content plus background; row 2 (optional) adds extra layered foreground content. Variations: `dark`, plus deployment-only extras like `center`, `show-link`, and per-breakpoint background stacking. Gotcha: when the section's Section Metadata `layout`/`style` includes `bento`, spacing/sizing (and in some deployments a mobile card-stack scroll animation) applies automatically.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 1020, "lastUpdated": "Aug 6, 2026", "lastUpdatedTs": 1786042904.6380394, "techSpecUrl": "https://www.figma.com/design/SWqiVw6xQIib4xi2p9ZKPK/C2---Bento?node-id=1-2212&t=WBsVQLP8rBXEJRE1-1", "html": "<h1>Explore Card</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A full-bleed image/video card where the entire tile is one clickable link, with icon/title/description over a gradient scrim that fades in on hover/focus \u2014 used for \"explore\" grids where each card links out to a bigger story or product page. Authored as a table: row 1 (required) holds content plus background; row 2 (optional) adds extra layered foreground content. Variations: <code>dark</code>, plus deployment-only extras like <code>center</code>, <code>show-link</code>, and per-breakpoint background stacking. Gotcha: when the section's Section Metadata <code>layout</code>/<code>style</code> includes <code>bento</code>, spacing/sizing (and in some deployments a mobile card-stack scroll animation) applies automatically.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as a table. <strong>Row 1 is required</strong> and has two cells: content, then background. <strong>Row 2 is optional</strong> and adds extra layered content on top of the background.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Row 1, Cell 1 \u2014 Content</td>\n<td>One or more optional icon images, then a heading (any level, visually sized as \"heading-5\"), then body/description text, then a link. The link's destination is used to make the <strong>entire card</strong> clickable; by default the link's own visible text is removed since the whole card is already clickable (see <code>show-link</code> below to keep it visible). If the cell also happens to contain a video file link, that link is ignored when picking the card's destination \u2014 so you can safely include a video asset and a separate destination link in the same cell.</td>\n</tr>\n<tr>\n<td>Row 1, Cell 2 \u2014 Background</td>\n<td>An image or video that fills the card edge-to-edge.</td>\n</tr>\n<tr>\n<td>Row 2 \u2014 Foreground (optional)</td>\n<td>Extra content layered above the background but behind the text (e.g. a secondary line, badge, logo, or image/video). Only used if this row actually has content \u2014 an empty row is dropped automatically. Leave the row out entirely if you don't need it.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<p>Variations are authored as modifier classes appended to the block name, e.g. <code>Explore Card (dark)</code>.</p>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author it</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>dark</code><sup class=\"fn-ref\" data-fn=\"dark\" title=\"Click for details\">1</sup></td>\n<td>Switches the text color and background scrim tint for use on dark-themed pages/sections.</td>\n<td>\"Explore Card (dark)\"</td>\n</tr>\n</tbody>\n</table>\n<p>Some deployments of this block also support:</p>\n<ul>\n<li><code>center</code> \u2014 centers the card's text content (icon/heading/body) both horizontally and as centered text, instead of the default left-aligned layout.</li>\n<li><code>show-link</code> \u2014 keeps the authored link text visible as a small standalone label, instead of hiding it, for when you want an explicit \"Learn more\" caption in addition to the whole card being clickable.</li>\n<li>A more advanced background pattern: stacking 1, 2, or 3 images/videos in the background cell (each as its own paragraph) to show different media at mobile / tablet / desktop widths, optionally with a second line of text giving a focal point (e.g. <code>left, top</code>) to control image cropping. If the background cell has no image/video at all, its plain text is used as a solid background color instead. Where this pattern isn't available, use a single image/video for all breakpoints.</li>\n<li>Authoring <strong>multiple icon images</strong> in the content cell \u2014 they're automatically consolidated into one icon row shown side by side. In a simpler deployment of this block, only the first icon image is recognized and any additional ones are not consolidated, so stick to one icon there.</li>\n<li>An advanced pattern (shared across several blocks) where inserting a row containing just <code>mobile-viewport</code>, <code>tablet-viewport</code>, or <code>desktop-viewport</code> (bare <code>mobile</code>/<code>tablet</code>/<code>desktop</code> still works but is a legacy fallback being phased out) lets you author entirely different content/background/foreground row sets per breakpoint, with later breakpoints inheriting anything left empty from the previous one. Breakpoint is screen width: with all three defined, mobile = below 768px, tablet = 768\u20131279px, desktop = 1280px and up; with only mobile-viewport + desktop-viewport, the split is at 1280px. Most authors won't need this.</li>\n</ul>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Explore Card</th></tr>\n<tr><td><img alt=\"icon\" src=\"https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg\" />## Behind the shot <a href=\"https://www.adobe.com/stories/behind-the-shot.html\">Read the story</a> A photographer's guide to low-light portraits.</td><td><img alt=\"Photographer adjusting a camera at night\" src=\"/night-shoot.jpg\" /></td></tr>\n</table>\n\n<p>Dark variation:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Explore Card (dark)</th></tr>\n<tr><td><h2>Firefly in the field <a href=\"https://www.adobe.com/firefly.html\">See how</a> Generative AI, used on set.</h2></td><td><img alt=\"Video still of a film set\" src=\"/set-still.mp4\" /></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>If the content cell contains no link at all, the card renders as static (non-clickable) content.</li>\n<li>The icon image is optional and purely decorative \u2014 if you skip it, the heading simply becomes the first item and picks up extra top spacing automatically.</li>\n<li>The whole card is keyboard-focusable and shows a visible focus ring; don't nest another interactive element (e.g. a second button) inside the content cell, since only one link/destination is supported per card.</li>\n<li>Minimum card height grows at larger screen widths purely via styling \u2014 no extra authoring is needed to accommodate this.</li>\n<li>Video gotcha: pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the video to autoplay only while scrolled into view (rather than finishing during page load), the video link's hash needs both <code>autoplay</code> and <code>viewportplay</code>, e.g. <code>#autoplay|viewportplay</code>. <span class=\"autoplay-warn\">Using <code>#autoplay</code> alone plays the video immediately on page load \u2014 by the time it's visible it has already finished, so visitors just see its frozen last frame.</span></li>\n<li>Dark-mode text/background contrast is standard Milo section-level theming (separate from the <code>dark</code> variation above) \u2014 it applies automatically when the enclosing section/page is set to dark, without any class on this block.</li>\n<li><strong><a href=\"./section-metadata.md\">Section Metadata</a> <code>layout</code>/<code>style</code> interaction:</strong> when this block sits in a section whose Section Metadata <code>layout</code>/<code>style</code> row includes <code>bento</code>, extra spacing/sizing rules kick in automatically (padding, heading margins, and content-aspect-ratio adjustments tuned for a bento grid) \u2014 nothing extra to author on the card itself. In some deployments, adding <code>bento, stack-mobile</code> together on that Section Metadata row also turns a bento section's Explore Cards into a sticky, depth-scaled mobile card-stack scroll animation (with a <a href=\"./rich-content.md\">Rich Content</a> title pinned above it) below the 768px breakpoint \u2014 see <a href=\"./section-metadata.md\">section-metadata.md</a>.</li>\n</ul>", "footnotes": {"dark": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}}, "raw": "# Explore Card\n\n> **Quick summary:** A full-bleed image/video card where the entire tile is one clickable link, with icon/title/description over a gradient scrim that fades in on hover/focus \u2014 used for \"explore\" grids where each card links out to a bigger story or product page. Authored as a table: row 1 (required) holds content plus background; row 2 (optional) adds extra layered foreground content. Variations: `dark`, plus deployment-only extras like `center`, `show-link`, and per-breakpoint background stacking. Gotcha: when the section's Section Metadata `layout`/`style` includes `bento`, spacing/sizing (and in some deployments a mobile card-stack scroll animation) applies automatically.\n\n## Authoring instructions\n\nThe block is authored as a table. **Row 1 is required** and has two cells: content, then background. **Row 2 is optional** and adds extra layered content on top of the background.\n\n| Row | Content |\n|---|---|\n| Row 1, Cell 1 \u2014 Content | One or more optional icon images, then a heading (any level, visually sized as \"heading-5\"), then body/description text, then a link. The link's destination is used to make the **entire card** clickable; by default the link's own visible text is removed since the whole card is already clickable (see `show-link` below to keep it visible). If the cell also happens to contain a video file link, that link is ignored when picking the card's destination \u2014 so you can safely include a video asset and a separate destination link in the same cell. |\n| Row 1, Cell 2 \u2014 Background | An image or video that fills the card edge-to-edge. |\n| Row 2 \u2014 Foreground (optional) | Extra content layered above the background but behind the text (e.g. a secondary line, badge, logo, or image/video). Only used if this row actually has content \u2014 an empty row is dropped automatically. Leave the row out entirely if you don't need it. |\n\n## Variations\n\nVariations are authored as modifier classes appended to the block name, e.g. `Explore Card (dark)`.\n\n| Variation | Effect | How to author it |\n|---|---|---|\n| `dark`[^dark] | Switches the text color and background scrim tint for use on dark-themed pages/sections. | \"Explore Card (dark)\" |\n\n[^dark]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n\nSome deployments of this block also support:\n\n- `center` \u2014 centers the card's text content (icon/heading/body) both horizontally and as centered text, instead of the default left-aligned layout.\n- `show-link` \u2014 keeps the authored link text visible as a small standalone label, instead of hiding it, for when you want an explicit \"Learn more\" caption in addition to the whole card being clickable.\n- A more advanced background pattern: stacking 1, 2, or 3 images/videos in the background cell (each as its own paragraph) to show different media at mobile / tablet / desktop widths, optionally with a second line of text giving a focal point (e.g. `left, top`) to control image cropping. If the background cell has no image/video at all, its plain text is used as a solid background color instead. Where this pattern isn't available, use a single image/video for all breakpoints.\n- Authoring **multiple icon images** in the content cell \u2014 they're automatically consolidated into one icon row shown side by side. In a simpler deployment of this block, only the first icon image is recognized and any additional ones are not consolidated, so stick to one icon there.\n- An advanced pattern (shared across several blocks) where inserting a row containing just `mobile-viewport`, `tablet-viewport`, or `desktop-viewport` (bare `mobile`/`tablet`/`desktop` still works but is a legacy fallback being phased out) lets you author entirely different content/background/foreground row sets per breakpoint, with later breakpoints inheriting anything left empty from the previous one. Breakpoint is screen width: with all three defined, mobile = below 768px, tablet = 768\u20131279px, desktop = 1280px and up; with only mobile-viewport + desktop-viewport, the split is at 1280px. Most authors won't need this.\n\n## Example\n\n```\n| Explore Card                                                        |\n| ---------------------------------------------------------------------------------- |\n| ![icon](https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg)## Behind the shot [Read the story](https://www.adobe.com/stories/behind-the-shot.html) A photographer's guide to low-light portraits. | ![Photographer adjusting a camera at night](/night-shoot.jpg) |\n```\n\nDark variation:\n\n```\n| Explore Card (dark)                                                  |\n| ---------------------------------------------------------------------------------- |\n| ## Firefly in the field [See how](https://www.adobe.com/firefly.html) Generative AI, used on set. | ![Video still of a film set](/set-still.mp4) |\n```\n\n## Notes\n\n- If the content cell contains no link at all, the card renders as static (non-clickable) content.\n- The icon image is optional and purely decorative \u2014 if you skip it, the heading simply becomes the first item and picks up extra top spacing automatically.\n- The whole card is keyboard-focusable and shows a visible focus ring; don't nest another interactive element (e.g. a second button) inside the content cell, since only one link/destination is supported per card.\n- Minimum card height grows at larger screen widths purely via styling \u2014 no extra authoring is needed to accommodate this.\n- Video gotcha: pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the video to autoplay only while scrolled into view (rather than finishing during page load), the video link's hash needs both `autoplay` and `viewportplay`, e.g. `#autoplay|viewportplay`. Using `#autoplay` alone plays the video immediately on page load \u2014 by the time it's visible it has already finished, so visitors just see its frozen last frame.\n- Dark-mode text/background contrast is standard Milo section-level theming (separate from the `dark` variation above) \u2014 it applies automatically when the enclosing section/page is set to dark, without any class on this block.\n- **[Section Metadata](./section-metadata.md) `layout`/`style` interaction:** when this block sits in a section whose Section Metadata `layout`/`style` row includes `bento`, extra spacing/sizing rules kick in automatically (padding, heading margins, and content-aspect-ratio adjustments tuned for a bento grid) \u2014 nothing extra to author on the card itself. In some deployments, adding `bento, stack-mobile` together on that Section Metadata row also turns a bento section's Explore Cards into a sticky, depth-scaled mobile card-stack scroll animation (with a [Rich Content](./rich-content.md) title pinned above it) below the 768px breakpoint \u2014 see [section-metadata.md](./section-metadata.md).\n"}, {"slug": "faq", "title": "FAQ", "summary": "An accordion of frequently-asked questions, each expanding/collapsing independently via native `<details>`/`<summary>`, with the first item open by default. Authored as one table row per FAQ item \u2014 only the row's first cell is used, with a heading as the question and everything after it as the answer. Variations: `seo` (adds FAQPage JSON-LD schema), `heading-<size>`, `body-<size>`. Gotcha: a row without a heading in its first cell is silently skipped, not rendered.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 481, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868215.1076648, "techSpecUrl": null, "html": "<h1>FAQ</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> An accordion of frequently-asked questions, each expanding/collapsing independently via native <code>&lt;details&gt;</code>/<code>&lt;summary&gt;</code>, with the first item open by default. Authored as one table row per FAQ item \u2014 only the row's first cell is used, with a heading as the question and everything after it as the answer. Variations: <code>seo</code> (adds FAQPage JSON-LD schema), <code>heading-&lt;size&gt;</code>, <code>body-&lt;size&gt;</code>. Gotcha: a row without a heading in its first cell is silently skipped, not rendered.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as a table where <strong>each row is one FAQ item</strong>, and <strong>only the row's first cell is used</strong> \u2014 everything else in that row (additional cells) is ignored.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Any row = one FAQ item</td>\n<td>In the row's first cell: a heading (<code>h1</code>\u2013<code>h6</code>) whose text becomes the question, followed by one or more paragraphs/lists that become the answer (everything in that cell after the heading). <strong>A row with no heading is silently skipped</strong> and won't render as an item at all \u2014 always start each item's cell with a heading.</td>\n</tr>\n</tbody>\n</table>\n<p>The first FAQ item in the table is expanded (open) by default; all others start collapsed.</p>\n<h2>Variations</h2>\n<p>Variations are authored as modifier classes appended to the block name in parentheses, e.g. <code>FAQ (seo)</code>.</p>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>seo</code><sup class=\"fn-ref\" data-fn=\"seo\" title=\"Click for details\">1</sup></td>\n<td>Injects a <code>FAQPage</code> JSON-LD schema (<code>&lt;script type=\"application/ld+json\"&gt;</code>) into the page <code>&lt;head&gt;</code>, built from the authored questions and answers, for search-engine rich-result eligibility.</td>\n<td><code>FAQ (seo)</code></td>\n</tr>\n<tr>\n<td><code>heading-&lt;size&gt;</code></td>\n<td>Overrides the question text size (default is Milo's <code>heading-5</code> scale) with any other heading scale keyword, e.g. <code>heading-xl</code>. This uses Milo's generic text-override convention (<code>decorateTextOverrides</code>), not something specific to this block.</td>\n<td><code>FAQ (heading-xl)</code></td>\n</tr>\n<tr>\n<td><code>body-&lt;size&gt;</code></td>\n<td>Overrides the answer text size scale the same way.</td>\n<td><code>FAQ (body-lg)</code></td>\n</tr>\n</tbody>\n</table>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">FAQ (seo)</th></tr>\n<tr><td><h2>What is Adobe Creative Cloud?</h2>\n<p>Creative Cloud is a suite of apps for photography, design, video, and web.</p></td></tr>\n<tr><td><h2>Can I cancel anytime?</h2>\n<p>Yes, you can cancel your subscription at any time from your account page.</p></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>Only the first cell of each row is read; if you accidentally split the question and answer across two cells in the same row (e.g. question in cell 1, answer in cell 2), the answer content will be dropped \u2014 keep the heading and all its answer content together in a single cell.</li>\n<li>A row without any heading element is treated as not-an-item and is filtered out entirely before rendering \u2014 blank spacer rows are effectively invisible, but a row with only a paragraph and no heading is also silently dropped, which can be a surprising authoring trap.</li>\n<li>No block-specific <code>dark</code> handling exists in either the JS or CSS for this block.</li>\n</ul>", "footnotes": {"seo": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}}, "raw": "# FAQ\n\n> **Quick summary:** An accordion of frequently-asked questions, each expanding/collapsing independently via native `<details>`/`<summary>`, with the first item open by default. Authored as one table row per FAQ item \u2014 only the row's first cell is used, with a heading as the question and everything after it as the answer. Variations: `seo` (adds FAQPage JSON-LD schema), `heading-<size>`, `body-<size>`. Gotcha: a row without a heading in its first cell is silently skipped, not rendered.\n\n## Authoring instructions\n\nThe block is authored as a table where **each row is one FAQ item**, and **only the row's first cell is used** \u2014 everything else in that row (additional cells) is ignored.\n\n| Row | Content |\n|---|---|\n| Any row = one FAQ item | In the row's first cell: a heading (`h1`\u2013`h6`) whose text becomes the question, followed by one or more paragraphs/lists that become the answer (everything in that cell after the heading). **A row with no heading is silently skipped** and won't render as an item at all \u2014 always start each item's cell with a heading. |\n\nThe first FAQ item in the table is expanded (open) by default; all others start collapsed.\n\n## Variations\n\nVariations are authored as modifier classes appended to the block name in parentheses, e.g. `FAQ (seo)`.\n\n| Variation | Effect | How to author |\n|---|---|---|\n| `seo`[^seo] | Injects a `FAQPage` JSON-LD schema (`<script type=\"application/ld+json\">`) into the page `<head>`, built from the authored questions and answers, for search-engine rich-result eligibility. | `FAQ (seo)` |\n| `heading-<size>` | Overrides the question text size (default is Milo's `heading-5` scale) with any other heading scale keyword, e.g. `heading-xl`. This uses Milo's generic text-override convention (`decorateTextOverrides`), not something specific to this block. | `FAQ (heading-xl)` |\n| `body-<size>` | Overrides the answer text size scale the same way. | `FAQ (body-lg)` |\n\n[^seo]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n\n## Example\n\n```\n| FAQ (seo) |\n| ## What is Adobe Creative Cloud? \\n Creative Cloud is a suite of apps for photography, design, video, and web. |\n| ## Can I cancel anytime? \\n Yes, you can cancel your subscription at any time from your account page. |\n```\n\n## Notes\n\n- Only the first cell of each row is read; if you accidentally split the question and answer across two cells in the same row (e.g. question in cell 1, answer in cell 2), the answer content will be dropped \u2014 keep the heading and all its answer content together in a single cell.\n- A row without any heading element is treated as not-an-item and is filtered out entirely before rendering \u2014 blank spacer rows are effectively invisible, but a row with only a paragraph and no heading is also silently dropped, which can be a surprising authoring trap.\n- No block-specific `dark` handling exists in either the JS or CSS for this block.\n"}, {"slug": "floating-cta", "title": "Floating CTA", "summary": "A sticky, single-button CTA (e.g. \"Buy now\" / \"Get started\") that slides/fades into view as the reader scrolls, instead of scrolling away with the content. Authored as 1 row, 1 cell containing exactly two paragraphs (an icon image, then a link/text for the button). No named variations, but the link type (plain vs. a commerce/checkout link) changes runtime behavior. Important: the CTA is invisible by default and only appears via a required companion Section Metadata `custom-hide` row \u2014 without it, the block never shows up.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 622, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868234.255979, "techSpecUrl": null, "html": "<h1>Floating CTA</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A sticky, single-button CTA (e.g. \"Buy now\" / \"Get started\") that slides/fades into view as the reader scrolls, instead of scrolling away with the content. Authored as 1 row, 1 cell containing exactly two paragraphs (an icon image, then a link/text for the button). No named variations, but the link type (plain vs. a commerce/checkout link) changes runtime behavior. Important: the CTA is invisible by default and only appears via a required companion Section Metadata <code>custom-hide</code> row \u2014 without it, the block never shows up.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block only reads its <strong>first row, first cell</strong>, and that cell must contain exactly two paragraphs, in order:</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 (only row), paragraph 1</td>\n<td>An image (the icon shown to the left of the button text, e.g. a small product/app icon).</td>\n</tr>\n<tr>\n<td>1 (only row), paragraph 2</td>\n<td>The button text, as a link. Format: <code>[Get Adobe Photoshop](https://...)</code>. To set a different accessible name (the text read aloud by screen readers) than the visible text, add <code>\\| aria label text</code> after the visible text, e.g. <code>Get Photoshop \\| Get Adobe Photoshop, starting at $9.99/month</code> \u2014 the part before <code>\\|</code> is shown, the part after becomes the accessible name. If there is no link (plain text only), the plain text is used as both the button label and a placeholder destination.</td>\n</tr>\n</tbody>\n</table>\n<p>Both paragraphs are required \u2014 if the block only has one paragraph, or the first paragraph has no image, nothing renders.</p>\n<p>The block automatically:\n- Appends a right-pointing arrow icon after the button text (not authored).\n- Converts any relative (root-relative, starting with <code>/</code>) image path to a federated/absolute URL.</p>\n<h3>Optional: auto-hide based on another section</h3>\n<p>Floating CTA can hide itself while a specific section is in view and reappear once the reader scrolls past it. To enable this, add a <strong><a href=\"./section-metadata.md\">Section Metadata</a></strong> block to the <em>same section</em> as the Floating CTA with a row:</p>\n<table>\n<thead>\n<tr>\n<th>Key</th>\n<th>Value</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>custom-hide</td>\n<td>A CSS selector for the section to watch, e.g. <code>.hero</code> or <code>#pricing</code></td>\n</tr>\n</tbody>\n</table>\n<p>When the referenced section is in view, the CTA is hidden (not visible, not keyboard-focusable); once it scrolls out of view, the CTA becomes active/visible again.</p>\n<p><strong>This <a href=\"./section-metadata.md\">Section Metadata</a> row is effectively required, not optional.</strong> The CTA is authored invisible and non-interactive by default, and the <code>custom-hide</code> behavior above is the only thing that ever makes it appear. If you skip the Section Metadata block, the Floating CTA will render in the page but stay permanently invisible \u2014 nothing else makes it show up.</p>\n<h2>Variations</h2>\n<p>This block has no modifier classes added to the block name (no \"Floating CTA (dark)\" style variants). However, the <strong>kind of link</strong> you author changes runtime behavior:</p>\n<table>\n<thead>\n<tr>\n<th>Authoring choice</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Plain/standard link</td>\n<td>Renders a normal floating anchor button with icon + text + arrow, linking to the given URL.</td>\n</tr>\n<tr>\n<td>Merch/commerce (checkout) link \u2014 a link that Milo's commerce tooling upgrades into a live checkout link</td>\n<td>The block waits for that link to finish its commerce upgrade, then reuses the live checkout link itself so \"Add to cart\"/checkout behavior keeps working. If the upgrade times out (10 seconds) or errors, the whole block removes itself from the page.</td>\n</tr>\n</tbody>\n</table>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Floating CTA</th></tr>\n<tr><td><img alt=\"icon\" src=\"https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg\" /></td></tr>\n<tr><td><a href=\"https://www.adobe.com/products/photoshop.html\">Get Photoshop | Get Adobe Photoshop, starting at $9.99/month</a></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>Respects reduced-motion accessibility settings: the slide/fade transition is removed for visitors who have requested reduced motion in their system settings.</li>\n<li>Image paths are only rewritten to an absolute URL if they start with <code>/</code> (root-relative); already-absolute URLs are left as-is.</li>\n</ul>", "footnotes": {}, "raw": "# Floating CTA\n\n> **Quick summary:** A sticky, single-button CTA (e.g. \"Buy now\" / \"Get started\") that slides/fades into view as the reader scrolls, instead of scrolling away with the content. Authored as 1 row, 1 cell containing exactly two paragraphs (an icon image, then a link/text for the button). No named variations, but the link type (plain vs. a commerce/checkout link) changes runtime behavior. Important: the CTA is invisible by default and only appears via a required companion Section Metadata `custom-hide` row \u2014 without it, the block never shows up.\n\n## Authoring instructions\n\nThe block only reads its **first row, first cell**, and that cell must contain exactly two paragraphs, in order:\n\n| Row | Content |\n|---|---|\n| 1 (only row), paragraph 1 | An image (the icon shown to the left of the button text, e.g. a small product/app icon). |\n| 1 (only row), paragraph 2 | The button text, as a link. Format: `[Get Adobe Photoshop](https://...)`. To set a different accessible name (the text read aloud by screen readers) than the visible text, add `\\| aria label text` after the visible text, e.g. `Get Photoshop \\| Get Adobe Photoshop, starting at $9.99/month` \u2014 the part before `\\|` is shown, the part after becomes the accessible name. If there is no link (plain text only), the plain text is used as both the button label and a placeholder destination. |\n\nBoth paragraphs are required \u2014 if the block only has one paragraph, or the first paragraph has no image, nothing renders.\n\nThe block automatically:\n- Appends a right-pointing arrow icon after the button text (not authored).\n- Converts any relative (root-relative, starting with `/`) image path to a federated/absolute URL.\n\n### Optional: auto-hide based on another section\n\nFloating CTA can hide itself while a specific section is in view and reappear once the reader scrolls past it. To enable this, add a **[Section Metadata](./section-metadata.md)** block to the *same section* as the Floating CTA with a row:\n\n| Key | Value |\n|---|---|\n| custom-hide | A CSS selector for the section to watch, e.g. `.hero` or `#pricing` |\n\nWhen the referenced section is in view, the CTA is hidden (not visible, not keyboard-focusable); once it scrolls out of view, the CTA becomes active/visible again.\n\n**This [Section Metadata](./section-metadata.md) row is effectively required, not optional.** The CTA is authored invisible and non-interactive by default, and the `custom-hide` behavior above is the only thing that ever makes it appear. If you skip the Section Metadata block, the Floating CTA will render in the page but stay permanently invisible \u2014 nothing else makes it show up.\n\n## Variations\n\nThis block has no modifier classes added to the block name (no \"Floating CTA (dark)\" style variants). However, the **kind of link** you author changes runtime behavior:\n\n| Authoring choice | Effect |\n|---|---|\n| Plain/standard link | Renders a normal floating anchor button with icon + text + arrow, linking to the given URL. |\n| Merch/commerce (checkout) link \u2014 a link that Milo's commerce tooling upgrades into a live checkout link | The block waits for that link to finish its commerce upgrade, then reuses the live checkout link itself so \"Add to cart\"/checkout behavior keeps working. If the upgrade times out (10 seconds) or errors, the whole block removes itself from the page. |\n\n## Example\n\n```\n| Floating CTA           |\n|-------------------------|\n| ![icon](https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg) |\n| [Get Photoshop \\| Get Adobe Photoshop, starting at $9.99/month](https://www.adobe.com/products/photoshop.html) |\n```\n\n## Notes\n\n- Respects reduced-motion accessibility settings: the slide/fade transition is removed for visitors who have requested reduced motion in their system settings.\n- Image paths are only rewritten to an absolute URL if they start with `/` (root-relative); already-absolute URLs are left as-is.\n"}, {"slug": "global-footer", "title": "Global Footer", "summary": "The shared site-wide footer (menu columns, featured products, region picker, legal links, social icons, and the Adobe logo) that appears automatically across Milo pages. The block instance on a page is normally empty \u2014 real content is authored in a separate shared footer document (default `/footer`, overridable per-page via a `footer-source` metadata key), not in the block's own rows. Only variation: `responsive-container`. Key gotcha: editing the block directly on a page does nothing \u2014 all content changes must go in the footer document.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 792, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868234.220174, "techSpecUrl": "https://www.figma.com/design/uKIL5YfYG18WQyGpsGhkTn/C2---GNav---Footer?node-id=1-2212&t=kfIFMJBdvv96UzoM-1", "html": "<h1>Global Footer</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> The shared site-wide footer (menu columns, featured products, region picker, legal links, social icons, and the Adobe logo) that appears automatically across Milo pages. The block instance on a page is normally empty \u2014 real content is authored in a separate shared footer document (default <code>/footer</code>, overridable per-page via a <code>footer-source</code> metadata key), not in the block's own rows. Only variation: <code>responsive-container</code>. Key gotcha: editing the block directly on a page does nothing \u2014 all content changes must go in the footer document.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The <code>global-footer</code> block itself, as placed on a page, is normally just an empty block with no authored rows \u2014 it doesn't read any content you put inside it. Instead, it fetches a separate plain-HTML document (by default <code>&lt;locale&gt;/footer</code>, e.g. <code>/footer</code>) and builds the footer from that document's contents. This lets one footer document power every page in a locale.</p>\n<p>If you need a page (or a set of pages) to use a <em>different</em> footer document, set the page-level metadata key <code>footer-source</code> to the path of that document.</p>\n<p>The real authoring happens <strong>in the footer document</strong>, which follows this structure:</p>\n<table>\n<thead>\n<tr>\n<th>Row / Section in the footer document</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Menu columns</td>\n<td>Any number of <code>##</code> (H2) headings, each followed by a list of links (plain links become nav links; a link inside <strong>bold</strong> or <em>italic</em> becomes a highlighted CTA button). Each H2 starts a new column/section \u2014 put a new H2 wherever you want a new labeled group of links.</td>\n</tr>\n<tr>\n<td>Featured products</td>\n<td>A block of links where each link (and optionally a small icon image + one description line under it) is wrapped as its own \"link-group\" \u2014 author this as its own distinctly-styled group of items (image, link title, optional description) rather than plain bullet links; it renders as a separate row of icon+label tiles above the legal/region area.</td>\n</tr>\n<tr>\n<td>Region selector</td>\n<td>One link, authored with the \"region-selector\" styling, pointing either to a page fragment (renders as an expandable in-page region list) or to a URL with a <code>#</code> hash (renders as a button that opens the region-picker in a modal).</td>\n</tr>\n<tr>\n<td>Social links</td>\n<td>A set of links to known social platforms (Facebook, Instagram, X/Twitter, LinkedIn, Pinterest, Discord, Behance, YouTube, Weibo) authored with the \"social\" styling \u2014 each recognized platform link is swapped for its icon automatically.</td>\n</tr>\n<tr>\n<td>Legal / copyright</td>\n<td>A paragraph whose copyright sentence is wrapped in <em>italics</em> (em) \u2014 this text is stripped out and replaced with \"\u00a9 <code>&lt;current year&gt;</code> Adobe Inc. <code>&lt;rest of your italic text&gt;</code>\" automatically. Any additional privacy links (e.g. \"Do not sell my info\", \"Cookie preferences\", \"Ad choices\") go in the same block, after the copyright paragraph.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author it</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>responsive-container</code><sup class=\"fn-ref\" data-fn=\"responsive-container\" title=\"Click for details\">1</sup></td>\n<td>Switches the footer's mobile/desktop layout decision from \"viewport width\" to \"the footer's own container width\" (via a resize observer), so it lays out correctly when embedded in a narrower container (e.g. a side panel) rather than the full page.</td>\n<td>Add \"responsive-container\" to the <code>global-footer</code> block's name cell on the page where the block is placed, e.g. \"Global Footer (responsive-container)\".</td>\n</tr>\n</tbody>\n</table>\n<h2>Example</h2>\n<p>On the page (block instance \u2014 typically no rows needed):</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Global Footer</th></tr>\n</table>\n\n<p>In the shared footer document (<code>/footer</code>), a minimal example:</p>\n<pre><code>## Products\n\n[Photoshop](https://www.adobe.com/photoshop.html)\n[Lightroom](https://www.adobe.com/lightroom.html)\n\n## Support\n\n[Help Center](https://helpx.adobe.com/)\n**[Contact us](https://www.adobe.com/contact.html)**\n\n*Choose your region*\n[Change region](https://www.adobe.com/#_regionmodal)\n\n[Facebook](https://www.facebook.com/adobe)\n[Instagram](https://www.instagram.com/adobe)\n\n*Copyright \u00a9 2026 Adobe. All rights reserved.*\n[Privacy](https://www.adobe.com/privacy.html) [Terms](https://www.adobe.com/terms.html) [Ad choices](https://www.adobe.com/privacy.html#interest-based-ads)\n</code></pre>\n<h2>Notes</h2>\n<ul>\n<li>Do not put footer content directly on ordinary pages expecting it to show up \u2014 content only comes from the footer document at the resolved path (<code>/footer</code> by default, or your <code>footer-source</code> override). Editing the block instance on a normal page has no effect on the footer's content.</li>\n<li>The footer only decorates once it scrolls near the viewport (or after a 3-second fallback) \u2014 during local preview it can take a moment to populate.</li>\n<li>If the footer document can't be fetched, the footer silently fails to render (logged as an error) rather than showing a broken block \u2014 always verify the footer document path exists and is published.</li>\n<li>Menu columns automatically collapse into a \"stacked\" 3-per-row grid on desktop if there are more than 3 columns and they don't all fit on one line \u2014 no manual layout authoring is needed for that.</li>\n<li>Region-selector links that include a <code>#</code> hash open in a modal (loading the region-nav block); links without a hash instead load as an inline expanding fragment. Pick the destination link type based on which behavior you want.</li>\n</ul>", "footnotes": {"responsive-container": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/pull/5692\">#5692</a> \u2014 Rares Munteanu, 2026-03-30"}}, "raw": "# Global Footer\n\n> **Quick summary:** The shared site-wide footer (menu columns, featured products, region picker, legal links, social icons, and the Adobe logo) that appears automatically across Milo pages. The block instance on a page is normally empty \u2014 real content is authored in a separate shared footer document (default `/footer`, overridable per-page via a `footer-source` metadata key), not in the block's own rows. Only variation: `responsive-container`. Key gotcha: editing the block directly on a page does nothing \u2014 all content changes must go in the footer document.\n\n## Authoring instructions\n\nThe `global-footer` block itself, as placed on a page, is normally just an empty block with no authored rows \u2014 it doesn't read any content you put inside it. Instead, it fetches a separate plain-HTML document (by default `<locale>/footer`, e.g. `/footer`) and builds the footer from that document's contents. This lets one footer document power every page in a locale.\n\nIf you need a page (or a set of pages) to use a *different* footer document, set the page-level metadata key `footer-source` to the path of that document.\n\nThe real authoring happens **in the footer document**, which follows this structure:\n\n| Row / Section in the footer document | Content |\n|---|---|\n| Menu columns | Any number of `##` (H2) headings, each followed by a list of links (plain links become nav links; a link inside **bold** or *italic* becomes a highlighted CTA button). Each H2 starts a new column/section \u2014 put a new H2 wherever you want a new labeled group of links. |\n| Featured products | A block of links where each link (and optionally a small icon image + one description line under it) is wrapped as its own \"link-group\" \u2014 author this as its own distinctly-styled group of items (image, link title, optional description) rather than plain bullet links; it renders as a separate row of icon+label tiles above the legal/region area. |\n| Region selector | One link, authored with the \"region-selector\" styling, pointing either to a page fragment (renders as an expandable in-page region list) or to a URL with a `#` hash (renders as a button that opens the region-picker in a modal). |\n| Social links | A set of links to known social platforms (Facebook, Instagram, X/Twitter, LinkedIn, Pinterest, Discord, Behance, YouTube, Weibo) authored with the \"social\" styling \u2014 each recognized platform link is swapped for its icon automatically. |\n| Legal / copyright | A paragraph whose copyright sentence is wrapped in *italics* (em) \u2014 this text is stripped out and replaced with \"\u00a9 `<current year>` Adobe Inc. `<rest of your italic text>`\" automatically. Any additional privacy links (e.g. \"Do not sell my info\", \"Cookie preferences\", \"Ad choices\") go in the same block, after the copyright paragraph. |\n\n## Variations\n\n| Variation | Effect | How to author it |\n|---|---|---|\n| `responsive-container`[^responsive-container] | Switches the footer's mobile/desktop layout decision from \"viewport width\" to \"the footer's own container width\" (via a resize observer), so it lays out correctly when embedded in a narrower container (e.g. a side panel) rather than the full page. | Add \"responsive-container\" to the `global-footer` block's name cell on the page where the block is placed, e.g. \"Global Footer (responsive-container)\". |\n\n[^responsive-container]: [#5692](https://github.com/adobecom/milo/pull/5692) \u2014 Rares Munteanu, 2026-03-30\n\n## Example\n\nOn the page (block instance \u2014 typically no rows needed):\n\n```\n| Global Footer |\n| -------------- |\n```\n\nIn the shared footer document (`/footer`), a minimal example:\n\n```\n## Products\n\n[Photoshop](https://www.adobe.com/photoshop.html)\n[Lightroom](https://www.adobe.com/lightroom.html)\n\n## Support\n\n[Help Center](https://helpx.adobe.com/)\n**[Contact us](https://www.adobe.com/contact.html)**\n\n*Choose your region*\n[Change region](https://www.adobe.com/#_regionmodal)\n\n[Facebook](https://www.facebook.com/adobe)\n[Instagram](https://www.instagram.com/adobe)\n\n*Copyright \u00a9 2026 Adobe. All rights reserved.*\n[Privacy](https://www.adobe.com/privacy.html) [Terms](https://www.adobe.com/terms.html) [Ad choices](https://www.adobe.com/privacy.html#interest-based-ads)\n```\n\n## Notes\n\n- Do not put footer content directly on ordinary pages expecting it to show up \u2014 content only comes from the footer document at the resolved path (`/footer` by default, or your `footer-source` override). Editing the block instance on a normal page has no effect on the footer's content.\n- The footer only decorates once it scrolls near the viewport (or after a 3-second fallback) \u2014 during local preview it can take a moment to populate.\n- If the footer document can't be fetched, the footer silently fails to render (logged as an error) rather than showing a broken block \u2014 always verify the footer document path exists and is published.\n- Menu columns automatically collapse into a \"stacked\" 3-per-row grid on desktop if there are more than 3 columns and they don't all fit on one line \u2014 no manual layout authoring is needed for that.\n- Region-selector links that include a `#` hash open in a modal (loading the region-nav block); links without a hash instead load as an inline expanding fragment. Pick the destination link type based on which behavior you want.\n"}, {"slug": "global-navigation", "title": "Global Navigation", "summary": "The shared Adobe header bar (logo, primary nav, search, sign-in) that appears at the top of every Milo page. The block's own table content is never read \u2014 it just mounts the shared federal nav app, which pulls real content from a separate nav document (default `/gnav`, overridable via a `gnav-source` metadata key). This block has no author-facing variations at all \u2014 its CSS is empty and it checks no modifier classes.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 417, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868219.3161297, "techSpecUrl": "https://www.figma.com/design/uKIL5YfYG18WQyGpsGhkTn/C2---GNav---Footer?node-id=1-2211&t=kfIFMJBdvv96UzoM-1", "html": "<h1>Global Navigation</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> The shared Adobe header bar (logo, primary nav, search, sign-in) that appears at the top of every Milo page. The block's own table content is never read \u2014 it just mounts the shared federal nav app, which pulls real content from a separate nav document (default <code>/gnav</code>, overridable via a <code>gnav-source</code> metadata key). This block has no author-facing variations at all \u2014 its CSS is empty and it checks no modifier classes.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>Add a block named \"Global Navigation\" to the page (typically the first block in the first section). This block never reads anything typed inside its own table \u2014 it ignores it completely. Instead, it loads the shared \"federal\" navigation app and mounts it into the block, pulling the actual nav content (logo, links, search, profile) from a separate navigation document.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Global Navigation</td>\n<td>Leave the cell empty (or put a placeholder note like \"Global nav\"). Nothing typed here is read or rendered.</td>\n</tr>\n</tbody>\n</table>\n<p>The nav's real content lives in a separate document, resolved as follows:\n- By default, Milo fetches <code>/gnav</code> at the site's content root.\n- If the page has a <strong>Metadata</strong> block with key <code>gnav-source</code>, its value (a path) is used instead, e.g. <code>gnav-source: /fr/gnav</code>.\n- A Metadata key <code>unav</code> with value <code>on</code> enables Universal Nav (the cross-Adobe app switcher/profile menu) alongside the standard nav.</p>\n<p>Editing the logo, nav items, search behavior, or sign-in flow is done in that separate gnav document/federal nav system, not in this block's table.</p>\n<h2>Variations</h2>\n<p>This block has no author-facing variations. It doesn't check for any modifier classes, and its CSS file is empty \u2014 all visual styling comes from the shared federal navigation stylesheet loaded at runtime.</p>\n<h2>Example</h2>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Global Navigation</td>\n<td><em>(empty)</em></td>\n</tr>\n</tbody>\n</table>\n<p>Paired page Metadata (optional):</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>gnav-source</td>\n<td>/gnav</td>\n</tr>\n<tr>\n<td>unav</td>\n<td>on</td>\n</tr>\n</tbody>\n</table>\n<h2>Notes</h2>\n<ul>\n<li>Because the block ignores its own table content, authors cannot preview nav changes by editing this block directly \u2014 changes must be made in the gnav source document referenced above.</li>\n<li>If <code>gnav-source</code> metadata is missing and no <code>/gnav</code> document exists at the content root, the block logs an error (<code>window.lana</code>) and silently renders nothing.</li>\n<li>The nav's federal domain is auto-detected from the current hostname (<code>.aem.page</code>/<code>.aem.live</code>/<code>.aem.reviews</code> vs. stage/prod), and can be overridden for testing with a <code>?fedsbranch=&lt;branch&gt;</code> query parameter (or <code>local</code> to point at <code>http://localhost:3000/federal</code>).</li>\n</ul>", "footnotes": {}, "raw": "# Global Navigation\n\n> **Quick summary:** The shared Adobe header bar (logo, primary nav, search, sign-in) that appears at the top of every Milo page. The block's own table content is never read \u2014 it just mounts the shared federal nav app, which pulls real content from a separate nav document (default `/gnav`, overridable via a `gnav-source` metadata key). This block has no author-facing variations at all \u2014 its CSS is empty and it checks no modifier classes.\n\n## Authoring instructions\n\nAdd a block named \"Global Navigation\" to the page (typically the first block in the first section). This block never reads anything typed inside its own table \u2014 it ignores it completely. Instead, it loads the shared \"federal\" navigation app and mounts it into the block, pulling the actual nav content (logo, links, search, profile) from a separate navigation document.\n\n| Row | Content |\n|---|---|\n| Global Navigation | Leave the cell empty (or put a placeholder note like \"Global nav\"). Nothing typed here is read or rendered. |\n\nThe nav's real content lives in a separate document, resolved as follows:\n- By default, Milo fetches `/gnav` at the site's content root.\n- If the page has a **Metadata** block with key `gnav-source`, its value (a path) is used instead, e.g. `gnav-source: /fr/gnav`.\n- A Metadata key `unav` with value `on` enables Universal Nav (the cross-Adobe app switcher/profile menu) alongside the standard nav.\n\nEditing the logo, nav items, search behavior, or sign-in flow is done in that separate gnav document/federal nav system, not in this block's table.\n\n## Variations\n\nThis block has no author-facing variations. It doesn't check for any modifier classes, and its CSS file is empty \u2014 all visual styling comes from the shared federal navigation stylesheet loaded at runtime.\n\n## Example\n\n| Row | Content |\n|---|---|\n| Global Navigation | *(empty)* |\n\nPaired page Metadata (optional):\n\n| Row | Content |\n|---|---|\n| gnav-source | /gnav |\n| unav | on |\n\n## Notes\n\n- Because the block ignores its own table content, authors cannot preview nav changes by editing this block directly \u2014 changes must be made in the gnav source document referenced above.\n- If `gnav-source` metadata is missing and no `/gnav` document exists at the content root, the block logs an error (`window.lana`) and silently renders nothing.\n- The nav's federal domain is auto-detected from the current hostname (`.aem.page`/`.aem.live`/`.aem.reviews` vs. stage/prod), and can be overridden for testing with a `?fedsbranch=<branch>` query parameter (or `local` to point at `http://localhost:3000/federal`).\n"}, {"slug": "globe-gallery", "title": "Globe Gallery", "summary": "A large, scroll-driven WebGL globe of photo cards \u2014 cards fan across the screen, peel into a grid, then fold onto a sphere (a scrollable barrel wall on phones and other touch devices) that visitors can drag to spin and tap into a full detail view. Built for an immersive \"browse everyone/everything\" hero \u2014 a directory of people, apps, or products \u2014 rather than a standard content section. Authored as up to four fixed rows: intro copy, a link to a fragment that supplies the actual cards, optional hint/instruction/label copy, and an optional closing pull-quote. No modifier classes \u2014 reduced motion, a missing/broken fragment, WebGL failure, and device/card-count handling are all automatic.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 1188, "lastUpdated": "Aug 13, 2026", "lastUpdatedTs": 1786666366.036528, "techSpecUrl": null, "html": "<h1>Globe Gallery</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A large, scroll-driven WebGL globe of photo cards \u2014 cards fan across the screen, peel into a grid, then fold onto a sphere (a scrollable barrel wall on phones and other touch devices) that visitors can drag to spin and tap into a full detail view. Built for an immersive \"browse everyone/everything\" hero \u2014 a directory of people, apps, or products \u2014 rather than a standard content section. Authored as up to four fixed rows: intro copy, a link to a fragment that supplies the actual cards, optional hint/instruction/label copy, and an optional closing pull-quote. No modifier classes \u2014 reduced motion, a missing/broken fragment, WebGL failure, and device/card-count handling are all automatic.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored with up to 4 rows, always in this order. Only the fragment-link row is required \u2014 you can leave the others out.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Purpose</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 \u2014 Intro copy (optional)</td>\n<td>The fixed caption shown while cards fan across the screen at the start of the scroll.</td>\n<td>A heading (any level) for the title, followed by a paragraph for the body copy. If you skip the heading, the first paragraph becomes the title instead and there's no separate body.</td>\n</tr>\n<tr>\n<td>2 \u2014 Cards (required)</td>\n<td>Points the block at the fragment that supplies every card.</td>\n<td>One link to a Milo fragment, with <code>#_dnb</code> appended to the URL (e.g. <code>.../fragments/team-cards#_dnb</code>). The <code>#_dnb</code> suffix is required so Milo doesn't resolve the fragment before the block reads it itself. If this link is missing or wrong, or the fragment fetch fails, the block collapses to an empty section instead of showing a broken globe.</td>\n</tr>\n<tr>\n<td>3 \u2014 Hint, instructions, and labels (optional)</td>\n<td>Small pieces of localizable UI copy.</td>\n<td>Up to 3 paragraphs: <strong>1st</strong> \u2014 the \"Click &amp; Drag\" hint shown over the globe (falls back to \"Click &amp; Drag\" if omitted). <strong>2nd</strong> \u2014 the instructions read to screen reader/keyboard users for entering the gallery (falls back to an English default). <strong>3rd</strong> \u2014 the four modal/gallery labels on one line, <code>\\|\\|</code>-separated, in this order: previous-arrow label, card-position template, next-arrow label, close-button label \u2014 e.g. <code>Previous \\|\\| {index} of {count} \\|\\| Next \\|\\| Close</code>. The position template must literally contain both <code>{index}</code> and <code>{count}</code> (substituted at runtime) or it falls back to English; any of the other three parts left blank between the <code>\\|\\|</code>s falls back to its own English default individually.</td>\n</tr>\n<tr>\n<td>4 \u2014 Pull-quote (optional)</td>\n<td>A quote shown as the scroll winds down after the globe.</td>\n<td>A heading or blockquote for the quote text, then a paragraph for the person's name and another for their role/title.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>The cards themselves come only from the fragment linked in row 2, not from the block's own table.</strong> In that fragment document, author one section per card (sections split the normal way, with <code>---</code>; a single section can also hold multiple cards separated by a horizontal rule). Each card section is flat paragraphs plus one list:</p>\n<table>\n<thead>\n<tr>\n<th>Content</th>\n<th>Becomes</th>\n<th>Notes</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>A paragraph containing only an image</td>\n<td>the card's photo</td>\n<td><strong>Required</strong> \u2014 a card section with no image is skipped entirely, with no warning.</td>\n</tr>\n<tr>\n<td>A paragraph in <em>italics</em></td>\n<td>role</td>\n<td>Optional.</td>\n</tr>\n<tr>\n<td>A paragraph in <strong>bold</strong></td>\n<td>name</td>\n<td>Optional.</td>\n</tr>\n<tr>\n<td>A plain paragraph</td>\n<td>description</td>\n<td>Shown in the detail view when the card is opened.</td>\n</tr>\n<tr>\n<td>A bulleted list, one top-level item per badge</td>\n<td>badges</td>\n<td>Each badge item can hold a product name/link, and, nested one level under it, a second bullet with that badge's role text \u2014 e.g. <code>- [Photoshop](url)</code> with a nested <code>- Compositing</code>. A badge item may also carry a small <code>.svg</code> logo link alongside the product link. The older single-line <code>Name \\| Role</code> format inside one bullet still works too.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<p>This block has no author-facing modifier classes. Everything else is automatic, not authored:</p>\n<ul>\n<li><strong>No cards, a broken fragment link, or no WebGL support:</strong> the block collapses to an empty section instead of showing a broken or blank globe.</li>\n<li><strong>Reduced motion:</strong> if the visitor's OS has <code>prefers-reduced-motion</code> set, the globe renders already formed and static in normal page flow (no scroll choreography) \u2014 still draggable/spinnable, with the same pull-quote underneath.</li>\n<li><strong>Small screens and touch devices</strong> automatically render a scrollable barrel/wall layout instead of a full sphere, showing only the first 24 authored cards on that barrel \u2014 but tapping into the detail view still lets visitors page through every card in the fragment. This is device-driven; there's nothing to author differently for it.</li>\n</ul>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Globe Gallery</th></tr>\n<tr><td><h2>Meet the whole team</h2>\n<p>Every person behind the product, in one place.</p></td></tr>\n<tr><td><a href=\"https://main--milo--adobecom.aem.page/fragments/team-cards#_dnb\">Team cards</a></td></tr>\n<tr><td><p>Click &amp; Drag</p>\n<p>Press Enter to enter the gallery, then Tab through the photos.</p>\n<p>Previous ||  of  || Next || Close</p></td></tr>\n<tr><td><h3>\"The best part of this job is the people.\"</h3>\n<p>Jordan Lee</p>\n<p>VP, Product Design</p></td></tr>\n</table>\n\n<p>Fragment (<code>team-cards</code>), one section per card:</p>\n<p><img alt=\"headshot.jpg\" src=\"headshot.jpg\" />\n<em>Product Design</em>\n<strong>Jordan Lee</strong>\nLeads the design systems team and has shipped three major redesigns.\n- <a href=\"https://figma.com\">Figma</a>\n  - Design tooling</p>\n\n<h2>Notes</h2>\n<ul>\n<li>Rows are read by <strong>position</strong>, not by markers \u2014 row 1 is always treated as intro copy, row 2 as the fragment link, row 3 as hint/instruction/label copy, row 4 as the pull-quote. Omitting a row is fine (later rows just shift up), but reordering them will misassign content.</li>\n<li>Row 2 only reads the link inside it \u2014 any other content authored in that row's cell is ignored.</li>\n<li>All visible chrome strings are authored, not hardcoded: to fully customize the hint/instructions/labels, author all three paragraphs in row 3. Leaving any one of them out falls back to its own English default individually, not the whole row.</li>\n<li>The card-position label (row 3's 3rd paragraph) is a template, not plain text \u2014 it must contain the literal tokens <code>{index}</code> and <code>{count}</code> for the \"N of M\" counter to localize correctly. A string missing either token is discarded in favor of the English default.</li>\n<li>On phones and other touch devices, only the first 24 authored cards appear on the sphere/barrel itself \u2014 this is a rendering limit, not a content limit. The detail view (opened by tapping any card, or via the keyboard/screen-reader gallery) can still page through every card in the fragment, so nothing is actually hidden from those visitors.</li>\n<li>A card section with no image is silently skipped \u2014 it never reaches the globe and nothing flags the omission, so a missing photo in the fragment is easy to miss during a content review.</li>\n<li>This is a large, purely visual/interactive hero experience \u2014 pair it with the intro copy (row 1) and pull-quote (row 4) it's designed around rather than expecting other page content to sit inside its scroll run.</li>\n</ul>", "footnotes": {}, "raw": "# Globe Gallery\n\n> **Quick summary:** A large, scroll-driven WebGL globe of photo cards \u2014 cards fan across the screen, peel into a grid, then fold onto a sphere (a scrollable barrel wall on phones and other touch devices) that visitors can drag to spin and tap into a full detail view. Built for an immersive \"browse everyone/everything\" hero \u2014 a directory of people, apps, or products \u2014 rather than a standard content section. Authored as up to four fixed rows: intro copy, a link to a fragment that supplies the actual cards, optional hint/instruction/label copy, and an optional closing pull-quote. No modifier classes \u2014 reduced motion, a missing/broken fragment, WebGL failure, and device/card-count handling are all automatic.\n\n## Authoring instructions\n\nThe block is authored with up to 4 rows, always in this order. Only the fragment-link row is required \u2014 you can leave the others out.\n\n| Row | Purpose | Content |\n| --- | --- | --- |\n| 1 \u2014 Intro copy (optional) | The fixed caption shown while cards fan across the screen at the start of the scroll. | A heading (any level) for the title, followed by a paragraph for the body copy. If you skip the heading, the first paragraph becomes the title instead and there's no separate body. |\n| 2 \u2014 Cards (required) | Points the block at the fragment that supplies every card. | One link to a Milo fragment, with `#_dnb` appended to the URL (e.g. `.../fragments/team-cards#_dnb`). The `#_dnb` suffix is required so Milo doesn't resolve the fragment before the block reads it itself. If this link is missing or wrong, or the fragment fetch fails, the block collapses to an empty section instead of showing a broken globe. |\n| 3 \u2014 Hint, instructions, and labels (optional) | Small pieces of localizable UI copy. | Up to 3 paragraphs: **1st** \u2014 the \"Click & Drag\" hint shown over the globe (falls back to \"Click & Drag\" if omitted). **2nd** \u2014 the instructions read to screen reader/keyboard users for entering the gallery (falls back to an English default). **3rd** \u2014 the four modal/gallery labels on one line, `\\|\\|`-separated, in this order: previous-arrow label, card-position template, next-arrow label, close-button label \u2014 e.g. `Previous \\|\\| {index} of {count} \\|\\| Next \\|\\| Close`. The position template must literally contain both `{index}` and `{count}` (substituted at runtime) or it falls back to English; any of the other three parts left blank between the `\\|\\|`s falls back to its own English default individually. |\n| 4 \u2014 Pull-quote (optional) | A quote shown as the scroll winds down after the globe. | A heading or blockquote for the quote text, then a paragraph for the person's name and another for their role/title. |\n\n**The cards themselves come only from the fragment linked in row 2, not from the block's own table.** In that fragment document, author one section per card (sections split the normal way, with `---`; a single section can also hold multiple cards separated by a horizontal rule). Each card section is flat paragraphs plus one list:\n\n| Content | Becomes | Notes |\n| --- | --- | --- |\n| A paragraph containing only an image | the card's photo | **Required** \u2014 a card section with no image is skipped entirely, with no warning. |\n| A paragraph in *italics* | role | Optional. |\n| A paragraph in **bold** | name | Optional. |\n| A plain paragraph | description | Shown in the detail view when the card is opened. |\n| A bulleted list, one top-level item per badge | badges | Each badge item can hold a product name/link, and, nested one level under it, a second bullet with that badge's role text \u2014 e.g. `- [Photoshop](url)` with a nested `- Compositing`. A badge item may also carry a small `.svg` logo link alongside the product link. The older single-line `Name \\| Role` format inside one bullet still works too. |\n\n## Variations\n\nThis block has no author-facing modifier classes. Everything else is automatic, not authored:\n\n- **No cards, a broken fragment link, or no WebGL support:** the block collapses to an empty section instead of showing a broken or blank globe.\n- **Reduced motion:** if the visitor's OS has `prefers-reduced-motion` set, the globe renders already formed and static in normal page flow (no scroll choreography) \u2014 still draggable/spinnable, with the same pull-quote underneath.\n- **Small screens and touch devices** automatically render a scrollable barrel/wall layout instead of a full sphere, showing only the first 24 authored cards on that barrel \u2014 but tapping into the detail view still lets visitors page through every card in the fragment. This is device-driven; there's nothing to author differently for it.\n\n## Example\n\n```\n| Globe Gallery |\n| --- |\n| ## Meet the whole team <br> Every person behind the product, in one place. |\n| [Team cards](https://main--milo--adobecom.aem.page/fragments/team-cards#_dnb) |\n| Click & Drag <br> Press Enter to enter the gallery, then Tab through the photos. <br> Previous \\|\\| {index} of {count} \\|\\| Next \\|\\| Close |\n| ### \"The best part of this job is the people.\" <br> Jordan Lee <br> VP, Product Design |\n```\n\nFragment (`team-cards`), one section per card:\n\n```\n![headshot.jpg](headshot.jpg)\n*Product Design*\n**Jordan Lee**\nLeads the design systems team and has shipped three major redesigns.\n- [Figma](https://figma.com)\n  - Design tooling\n```\n\n## Notes\n\n- Rows are read by **position**, not by markers \u2014 row 1 is always treated as intro copy, row 2 as the fragment link, row 3 as hint/instruction/label copy, row 4 as the pull-quote. Omitting a row is fine (later rows just shift up), but reordering them will misassign content.\n- Row 2 only reads the link inside it \u2014 any other content authored in that row's cell is ignored.\n- All visible chrome strings are authored, not hardcoded: to fully customize the hint/instructions/labels, author all three paragraphs in row 3. Leaving any one of them out falls back to its own English default individually, not the whole row.\n- The card-position label (row 3's 3rd paragraph) is a template, not plain text \u2014 it must contain the literal tokens `{index}` and `{count}` for the \"N of M\" counter to localize correctly. A string missing either token is discarded in favor of the English default.\n- On phones and other touch devices, only the first 24 authored cards appear on the sphere/barrel itself \u2014 this is a rendering limit, not a content limit. The detail view (opened by tapping any card, or via the keyboard/screen-reader gallery) can still page through every card in the fragment, so nothing is actually hidden from those visitors.\n- A card section with no image is silently skipped \u2014 it never reaches the globe and nothing flags the omission, so a missing photo in the fragment is easy to miss during a content review.\n- This is a large, purely visual/interactive hero experience \u2014 pair it with the intro copy (row 1) and pull-quote (row 4) it's designed around rather than expecting other page content to sit inside its scroll run.\n"}, {"slug": "hover-list", "title": "Hover List", "summary": "A numbered list \u2014 e.g. feature/benefit lists like \"01 Fast performance\", \"02 Built-in AI\" \u2014 where hovering (or the active item on touch) reveals a stacked, parallax-following image pile. Authored as a heading row followed by one row per item (label cell + one-or-more-images media cell). Key feature: optional per-breakpoint content overrides via `mobile-viewport`/`tablet-viewport`/`desktop-viewport` divider rows, which can also carry per-breakpoint modifier classes.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 705, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868237.5635822, "techSpecUrl": "https://www.figma.com/design/8J4Zfwzago7gNtxv3pgI0K/C2---Hover-List?node-id=1-2211&t=bSRcib1cA2slh1vk-1", "html": "<h1>Hover List</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A numbered list \u2014 e.g. feature/benefit lists like \"01 Fast performance\", \"02 Built-in AI\" \u2014 where hovering (or the active item on touch) reveals a stacked, parallax-following image pile. Authored as a heading row followed by one row per item (label cell + one-or-more-images media cell). Key feature: optional per-breakpoint content overrides via <code>mobile-viewport</code>/<code>tablet-viewport</code>/<code>desktop-viewport</code> divider rows, which can also carry per-breakpoint modifier classes.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block reads rows top to bottom. <strong>Row 1</strong> is the heading row, <strong>every row after that</strong> is a list item.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1, cell 1</td>\n<td>The block headline. Put a heading (e.g. <code>## My Headline</code>) here \u2014 it's auto-styled as <code>heading-2</code>. Any other cells in row 1 are ignored.</td>\n</tr>\n<tr>\n<td>2+, cell 1 (text)</td>\n<td>The item's text/label, e.g. <code>### Real-time collaboration</code>. Rendered as <code>heading-5</code>.</td>\n</tr>\n<tr>\n<td>2+, cell 2 (media)</td>\n<td>One or more images. Add multiple images to the same cell to get a stacked, layered \"photo pile\" that follows the cursor for that item (each extra image is progressively offset/rotated). If a row has no images in cell 2, that item just has no hover media.</td>\n</tr>\n</tbody>\n</table>\n<p>Item numbers (\"1.\", \"2.\", \"3.\", ...) are generated automatically \u2014 do not type them into the text cell.</p>\n<h2>Variations</h2>\n<p>This block has no modifier classes on the block name. It does have one structural authoring feature: <strong>per-viewport content overrides</strong>, via <code>decorateViewportContent</code>.</p>\n<table>\n<thead>\n<tr>\n<th>Feature</th>\n<th>Effect</th>\n<th>How to author it</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Per-breakpoint content</td>\n<td>Lets you author completely different rows for mobile / tablet / desktop instead of one shared set of rows.</td>\n<td>Insert a row whose <strong>only cell</strong> contains just <code>mobile-viewport</code>, <code>tablet-viewport</code>, or <code>desktop-viewport</code> (case-insensitive; bare <code>mobile</code>/<code>tablet</code>/<code>desktop</code> still works but is a legacy fallback being phased out) as a divider. Every row after that divider (until the next divider or the end of the table) becomes that breakpoint's content. Breakpoints you don't define inherit content from the next-smaller breakpoint you did define (e.g. define <code>mobile-viewport</code> and <code>desktop-viewport</code> only \u2014 tablet reuses <code>mobile-viewport</code>'s content, or <code>desktop-viewport</code>'s if a row/cell is empty in the smaller viewport section but filled in a larger one already processed). Breakpoint is measured by screen <strong>width</strong>: with all three defined, mobile = below 768px, tablet = 768\u20131279px, desktop = 1280px and up; with only <code>mobile-viewport</code> + <code>desktop-viewport</code>, the split moves to 1280px (mobile = below 1280px).</td>\n</tr>\n<tr>\n<td>Per-breakpoint modifier classes</td>\n<td>Add extra CSS classes to the block only for a given breakpoint.</td>\n<td>On the same divider row, add classes in parentheses after the keyword, e.g. <code>desktop-viewport (compact)</code> \u2014 <code>compact</code> is added to the block's class list only while that breakpoint is active.</td>\n</tr>\n</tbody>\n</table>\n<p>If you never add <code>mobile-viewport</code>/<code>tablet-viewport</code>/<code>desktop-viewport</code> divider rows, the same rows/content are used at every breakpoint (the default, and the common case).</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Hover List</th></tr>\n<tr><td><h2>Why creators choose Adobe</h2></td><td></td></tr>\n<tr><td><h3>Real-time collaboration</h3></td><td><img alt=\"preview\" src=\"/media_1.png\" /></td></tr>\n<tr><td><h3>Built-in generative AI</h3></td><td><img alt=\"preview\" src=\"/media_2.png\" /> <img alt=\"preview 2\" src=\"/media_3.png\" /></td></tr>\n<tr><td><h3>One subscription, every app</h3></td><td><img alt=\"preview\" src=\"/media_4.png\" /></td></tr>\n</table>\n\n<p>With a per-viewport override (mobile shows fewer items than desktop; breakpoint is 1280px since only two viewports are defined):</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Hover List</th></tr>\n<tr><td><h2>Why creators choose Adobe</h2></td><td></td></tr>\n<tr class=\"ex-viewport-row\"><td colspan=\"2\">&#9656; desktop-viewport</td></tr>\n<tr><td><h3>Real-time collaboration</h3></td><td><img alt=\"preview\" src=\"/media_1.png\" /></td></tr>\n<tr><td><h3>Built-in generative AI</h3></td><td><img alt=\"preview\" src=\"/media_2.png\" /></td></tr>\n<tr><td><h3>One subscription, every app</h3></td><td><img alt=\"preview\" src=\"/media_4.png\" /></td></tr>\n<tr class=\"ex-viewport-row\"><td colspan=\"2\">&#9656; mobile-viewport</td></tr>\n<tr><td><h3>Real-time collaboration</h3></td><td><img alt=\"preview\" src=\"/media_1.png\" /></td></tr>\n<tr><td><h3>Built-in generative AI</h3></td><td><img alt=\"preview\" src=\"/media_2.png\" /></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>The hover/parallax image-follow effect is desktop-only (<code>width &gt;= 1280px</code>); below that, images are simply shown inline/statically per item (no follower JS runs) per the responsive CSS.</li>\n<li>Respects <code>prefers-reduced-motion</code>: images snap directly into place under the cursor instead of animating in with spring physics.</li>\n<li>Keyboard/touch users don't get a cursor to \"hover\" with
