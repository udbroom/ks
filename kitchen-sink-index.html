y utility block, not a content block \u2014 it doesn't process anything you author, so there's no real authoring contract or row/cell shape to follow. Use it to add text assistive technology should announce (extra context, a label, an instruction) without displaying it on screen: whatever content you put in the table (typically one row, one cell of plain text) is clipped to a 1px box and hidden visually while staying readable by screen readers. No variations exist. Avoid putting interactive content (links, buttons) inside it, since it will be functionally present but invisible and effectively untappable.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 368, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868244.7510355, "techSpecUrl": null, "html": "<h1>Visually Hidden</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A CSS-only utility block, not a content block \u2014 it doesn't process anything you author, so there's no real authoring contract or row/cell shape to follow. Use it to add text assistive technology should announce (extra context, a label, an instruction) without displaying it on screen: whatever content you put in the table (typically one row, one cell of plain text) is clipped to a 1px box and hidden visually while staying readable by screen readers. No variations exist. Avoid putting interactive content (links, buttons) inside it, since it will be functionally present but invisible and effectively untappable.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>Because there's no decoration logic, there's no special row/column contract \u2014 the block simply wraps whatever content you author inside its table and hides it visually. Typically this is a single row with a single cell of plain text.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Any text you want announced to screen readers but not shown visually \u2014 e.g. supplemental context for an icon-only control elsewhere on the page, or a short instruction. Plain text is typical; there is no author-facing formatting convention since the JS does not process the content at all.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<p>This block has no author-facing variations \u2014 there are no modifier classes checked anywhere in its JS or CSS, and no decoration logic to vary.</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Visually Hidden</th></tr>\n<tr><td>Opens in a new tab</td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>The block does nothing to the content you author \u2014 all behavior comes purely from CSS that clips the content offscreen while keeping it in the page's structure. Nothing about the authored content is transformed, validated, or reformatted.</li>\n<li>Because the content isn't visually rendered, always preview with a screen reader (or check the accessibility tree in devtools) rather than relying on the live preview to confirm the text is present and reads correctly.</li>\n<li>Don't put interactive content (links, buttons) inside this block expecting normal visual behavior \u2014 it will be functionally present but invisible and effectively untappable/unclickable for sighted mouse/touch users, which is usually not what's intended for interactive elements.</li>\n</ul>", "footnotes": {}, "raw": "# Visually Hidden\n\n> **Quick summary:** A CSS-only utility block, not a content block \u2014 it doesn't process anything you author, so there's no real authoring contract or row/cell shape to follow. Use it to add text assistive technology should announce (extra context, a label, an instruction) without displaying it on screen: whatever content you put in the table (typically one row, one cell of plain text) is clipped to a 1px box and hidden visually while staying readable by screen readers. No variations exist. Avoid putting interactive content (links, buttons) inside it, since it will be functionally present but invisible and effectively untappable.\n\n## Authoring instructions\n\nBecause there's no decoration logic, there's no special row/column contract \u2014 the block simply wraps whatever content you author inside its table and hides it visually. Typically this is a single row with a single cell of plain text.\n\n| Row | Content |\n| --- | --- |\n| 1 | Any text you want announced to screen readers but not shown visually \u2014 e.g. supplemental context for an icon-only control elsewhere on the page, or a short instruction. Plain text is typical; there is no author-facing formatting convention since the JS does not process the content at all. |\n\n## Variations\n\nThis block has no author-facing variations \u2014 there are no modifier classes checked anywhere in its JS or CSS, and no decoration logic to vary.\n\n## Example\n\n```\n| Visually Hidden |\n| --- |\n| Opens in a new tab |\n```\n\n## Notes\n\n- The block does nothing to the content you author \u2014 all behavior comes purely from CSS that clips the content offscreen while keeping it in the page's structure. Nothing about the authored content is transformed, validated, or reformatted.\n- Because the content isn't visually rendered, always preview with a screen reader (or check the accessibility tree in devtools) rather than relying on the live preview to confirm the text is present and reads correctly.\n- Don't put interactive content (links, buttons) inside this block expecting normal visual behavior \u2014 it will be functionally present but invisible and effectively untappable/unclickable for sighted mouse/touch users, which is usually not what's intended for interactive elements.\n"}];

const listEl = document.getElementById('block-list');
const mainEl = document.getElementById('main-inner');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('block-count');

let activeSlug = null;
let historyStack = []; // stack of slugs, last = current

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
// Escape then highlight a plain-text string against the search query.
function highlightPlain(text, q) {
  const escaped = escapeHtml(text || '');
  if (!q) return escaped;
  const re = new RegExp('(' + escapeRegExp(q) + ')', 'ig');
  return escaped.replace(re, '<mark class="search-hit">$1</mark>');
}
// Pull a short snippet of raw content around the first match, so a hit that
// only occurs in the body (not the title) still shows where it landed.
function getSnippet(raw, q, radius) {
  if (!raw || !q) return '';
  const idx = raw.toLowerCase().indexOf(q);
  if (idx === -1) return '';
  const start = Math.max(0, idx - radius);
  const end = Math.min(raw.length, idx + q.length + radius);
  let snippet = raw.slice(start, end).replace(/\s+/g, ' ').trim();
  if (start > 0) snippet = '…' + snippet;
  if (end < raw.length) snippet = snippet + '…';
  return snippet;
}

function renderList(filter) {
  const q = (filter || '').toLowerCase().trim();
  const filtered = BLOCKS.filter(b =>
    !q ||
    b.title.toLowerCase().includes(q) ||
    b.summary.toLowerCase().includes(q) ||
    b.slug.includes(q) ||
    (b.raw && b.raw.toLowerCase().includes(q))
  );
  countEl.textContent = filtered.length + ' of ' + BLOCKS.length + ' blocks';
  listEl.innerHTML = filtered.map(b => {
    const titleHtml = highlightPlain(b.title, q);
    const titleMatches = q && b.title.toLowerCase().includes(q);
    let snippetHtml = '';
    if (q && !titleMatches) {
      const snippet = getSnippet(b.raw, q, 40);
      if (snippet) snippetHtml = `<div class="block-snippet">${highlightPlain(snippet, q)}</div>`;
    }
    return `
      <div class="block-item${b.slug === activeSlug ? ' active' : ''}" data-slug="${b.slug}">
        <div class="block-title">${titleHtml}</div>
        ${snippetHtml}
      </div>
    `;
  }).join('');
  listEl.querySelectorAll('.block-item').forEach(el => {
    el.addEventListener('click', () => selectBlock(el.dataset.slug));
  });
}

function selectBlock(slug, opts) {
  opts = opts || {};
  const b = BLOCKS.find(x => x.slug === slug);
  if (!b) return;
  activeSlug = slug;

  if (opts.push !== false) {
    // Normal forward navigation (sidebar click or cross-ref link): push,
    // but don't create a duplicate entry if we're already on this block.
    if (historyStack[historyStack.length - 1] !== slug) {
      historyStack.push(slug);
    }
  }

  const sectionNames = { authoring: 'Authoring instructions', variations: 'Variations', example: 'Example', notes: 'Notes' };
  const badges = Object.entries(b.sections).map(([k, present]) =>
    `<span class="badge${present ? '' : ' missing'}">${present ? '✓' : '✕'} ${sectionNames[k]}</span>`
  ).join('');

  mainEl.innerHTML = `
    <div class="nav-bar">
      <button id="back-btn" title="Go back">&larr; Back</button>
      <div id="breadcrumb"></div>
    </div>
    <div class="doc-summary">
      <div><strong>Quick summary:</strong> ${b.summary || '<em>No summary found.</em>'}</div>
      <div class="doc-summary-footer">
        <span class="updated-date">Updated ${b.lastUpdated}</span>
        <span class="footer-sep">&middot;</span>
        ${b.techSpecUrl
          ? `<a class="tech-spec-link" href="${b.techSpecUrl}" target="_blank" rel="noopener">Tech spec &#8599;</a>`
          : `<span class="tech-spec-link tbd">Tech spec: TBD</span>`}
      </div>
    </div>
    <div class="badges">${badges}</div>
    <div class="doc-content">${b.html}</div>
  `;
  mainEl.scrollTop = 0;
  document.getElementById('main').scrollTop = 0;
  renderList(searchEl.value);
  wireCrossRefLinks();
  wireFootnotes(b);
  renderNavBar();
  wrapMatches(mainEl.querySelector('.doc-content'), searchEl.value);
}

// Wrap every occurrence of the search query in <mark> within a text-node
// walk, so table cells, headings, links, etc. keep their structure intact.
function wrapMatches(root, q) {
  if (!root) return;
  const query = (q || '').toLowerCase().trim();
  if (!query) return;
  const re = new RegExp('(' + escapeRegExp(query) + ')', 'ig');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) {
    if (re.test(n.nodeValue)) nodes.push(n);
    re.lastIndex = 0;
  }
  nodes.forEach(node => {
    const frag = document.createElement('span');
    frag.innerHTML = node.nodeValue.replace(re, '<mark class="search-hit">$1</mark>');
    const parent = node.parentNode;
    while (frag.firstChild) parent.insertBefore(frag.firstChild, node);
    parent.removeChild(node);
  });
}

// Re-render the open block's content from its clean source and re-apply
// highlighting — keeps live typing from stacking marks on top of marks.
function refreshContentHighlight() {
  const contentEl = mainEl.querySelector('.doc-content');
  if (!contentEl || !activeSlug) return;
  const b = BLOCKS.find(x => x.slug === activeSlug);
  if (!b) return;
  contentEl.innerHTML = b.html;
  wireCrossRefLinks();
  wireFootnotes(b);
  wrapMatches(contentEl, searchEl.value);
}

// Footnote-style refs, e.g. `dark`[^dark], are a repo convention noting the
// PR/commit that added a variation. Rather than dumping them at the bottom
// of the page, convert.py already turned each [^id] into a small clickable
// <sup class="fn-ref" data-fn="id"> marker. Here we wire clicks to a popup
// anchored to that marker, flipping above/below depending on available space.
function wireFootnotes(b) {
  mainEl.querySelectorAll('.fn-ref').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const fn = b.footnotes && b.footnotes[el.dataset.fn];
      if (!fn) return;
      if (el.classList.contains('open')) {
        closeFootnotePopup();
        return;
      }
      showFootnotePopup(el, fn.html);
    });
  });
}

function closeFootnotePopup() {
  const existing = document.getElementById('fn-popup');
  if (existing) existing.remove();
  document.querySelectorAll('.fn-ref.open').forEach(el => el.classList.remove('open'));
}

function showFootnotePopup(anchorEl, html) {
  closeFootnotePopup();
  anchorEl.classList.add('open');

  const popup = document.createElement('div');
  popup.id = 'fn-popup';
  popup.innerHTML = html;
  document.body.appendChild(popup);

  const rect = anchorEl.getBoundingClientRect();
  const popupRect = popup.getBoundingClientRect();
  const gap = 10;
  const spaceBelow = window.innerHeight - rect.bottom;
  const spaceAbove = rect.top;
  const showAbove = spaceBelow < popupRect.height + gap && spaceAbove > spaceBelow;

  const top = showAbove ? rect.top - popupRect.height - gap : rect.bottom + gap;
  let left = rect.left - 10;
  const maxLeft = window.innerWidth - popupRect.width - 12;
  left = Math.max(12, Math.min(left, maxLeft));

  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
  popup.classList.add(showAbove ? 'fn-above' : 'fn-below');
  // Point the little arrow at the marker regardless of popup horizontal shift.
  const arrowOffset = Math.max(10, Math.min(rect.left + rect.width / 2 - left - 4, popupRect.width - 18));
  popup.style.setProperty('--arrow-left', arrowOffset + 'px');

  setTimeout(() => {
    document.addEventListener('click', function closeOnce(e) {
      if (!popup.contains(e.target)) {
        closeFootnotePopup();
        document.removeEventListener('click', closeOnce);
      }
    });
  }, 0);
}

function renderNavBar() {
  const backBtn = document.getElementById('back-btn');
  const crumbEl = document.getElementById('breadcrumb');
  if (!backBtn || !crumbEl) return;

  backBtn.disabled = historyStack.length <= 1;
  backBtn.onclick = goBack;

  const hasHistory = historyStack.length > 1;
  const currentSlug = historyStack[historyStack.length - 1];
  const currentBlock = BLOCKS.find(x => x.slug === currentSlug);
  const currentTitle = currentBlock ? currentBlock.title : currentSlug;

  // One visible level (the current block); everything earlier collapses
  // into a "History" dropdown, most recent first.
  crumbEl.innerHTML = `
    ${hasHistory ? `
      <button id="history-toggle">History (${historyStack.length - 1}) &#9662;</button>
      <span class="crumb-sep">/</span>
    ` : ''}
    <span class="crumb-current">${currentTitle}</span>
  `;

  if (hasHistory) {
    const toggle = document.getElementById('history-toggle');
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleHistoryDropdown(crumbEl);
    });
  }
}

function toggleHistoryDropdown(crumbEl) {
  const existing = document.getElementById('history-dropdown');
  if (existing) {
    existing.remove();
    return;
  }

  const dropdown = document.createElement('div');
  dropdown.id = 'history-dropdown';

  // Most recent first, excluding the current (already shown) entry.
  const past = historyStack.slice(0, -1).slice().reverse();
  dropdown.innerHTML = past.map((slug) => {
    const b = BLOCKS.find(x => x.slug === slug);
    const title = b ? b.title : slug;
    const idx = historyStack.lastIndexOf(slug);
    return `<div class="crumb-item" data-index="${idx}">${title}</div>`;
  }).join('');

  dropdown.querySelectorAll('.crumb-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.index, 10);
      const targetSlug = historyStack[idx];
      historyStack = historyStack.slice(0, idx + 1);
      selectBlock(targetSlug, { push: false });
    });
  });

  crumbEl.appendChild(dropdown);

  // Close on outside click.
  setTimeout(() => {
    document.addEventListener('click', function closeOnce(e) {
      if (!dropdown.contains(e.target)) {
        dropdown.remove();
        document.removeEventListener('click', closeOnce);
      }
    });
  }, 0);
}

function goBack() {
  if (historyStack.length <= 1) return;
  historyStack.pop(); // drop current
  const prev = historyStack[historyStack.length - 1];
  selectBlock(prev, { push: false });
}

// Markdown cross-reference links like [Section Metadata](./section-metadata.md)
// or (section-metadata.md) point to other blocks' .md files. There's no real
// file at that path inside the artifact, so intercept them and route to the
// matching block in the sidebar instead of letting the <a> navigate nowhere.
function wireCrossRefLinks() {
  mainEl.querySelectorAll('.doc-content a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (/^https?:\/\//i.test(href)) {
      a.target = '_blank';
      a.rel = 'noopener';
      return;
    }
    const slug = href.replace(/^\.?\//, '').replace(/\.md$/i, '');
    const match = BLOCKS.find(b => b.slug === slug);
    if (match) {
      a.href = 'javascript:void(0)';
      a.title = 'Jump to ' + match.title;
      a.addEventListener('click', (e) => {
        e.preventDefault();
        selectBlock(match.slug);
      });
    }
  });
}

searchEl.addEventListener('input', () => {
  renderList(searchEl.value);
  refreshContentHighlight();
});

renderList('');
if (BLOCKS.length) selectBlock(BLOCKS[0].slug);
</script>

</body>
</html>
