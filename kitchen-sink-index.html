<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {

  }
  #search {

    flex: 1;
    overflow-y: auto;

  }

  }
  .block-item:hover { background: #eee; }
  .block-item.active { background: #FA0F00; }
  .block-item.active .block-title { color: #fff; }
  .block-item.active .block-meta { color: #ffd6d3; }
  .block-title {
    font-size: 13.5px;
    font-weight: 600;
    color: #1d1d1f;
  }
  .block-meta {
    font-size: 11px;
    color: #6e6e73;
    margin-top: 1px;
  }
  .block-snippet {
    font-size: 11.5px;
    color: #6e6e73;
    margin-top: 3px;

  }
  .block-item.active .block-snippet { color: #ffd6d3; }
  mark.search-hit {
    background: #ffe38a;

    padding: 0 1px;
  }
  .block-item.active mark.search-hit { background: #fff3c4; }
  #main {
    flex: 1;
    overflow-y: auto;

  }
  #main-inner { max-width: 780px; margin: 0 auto; }
  .doc-summary {
    background: #fff5f4;
    border: 1px solid #ffd6d3;
    border-radius: 10px;

    line-height: 1.55;
    margin: 12px 0 28px;
    color: #4a2a28;
  }
  .doc-summary strong { color: #d1150f; }
  .doc-summary-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #ffd6d3;
    font-size: 12px;
  }
  .doc-summary-footer .updated-date { color: #8a5f5c; }
  .doc-summary-footer .footer-sep { color: #e3a9a5; }
  .doc-summary-footer .tech-spec-link {
    color: #d1150f;
    font-weight: 600;
    text-decoration: none;
  }
  .doc-summary-footer .tech-spec-link:hover { text-decoration: underline; }
  .doc-summary-footer .tech-spec-link.tbd {
    color: #a3766f;
    font-weight: 500;
    cursor: default;
  }
  .doc-summary-footer .tech-spec-link.tbd:hover { text-decoration: none; }
  .doc-content h1 { font-size: 26px; margin-bottom: 4px; }
  .doc-content h2 {
    font-size: 17px;
    margin-top: 32px;
    padding-top: 12px;
    border-top: 1px solid #eee;
  }
  .doc-content h2:first-of-type { border-top: none; padding-top: 0; }
  .autoplay-warn {
    background: #fff4e5;
    color: #8a4b00;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 4px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .autoplay-warn code {
    background: rgba(138, 75, 0, 0.12);
    color: #8a4b00;
  }
  .doc-content p, .doc-content li { font-size: 14px; line-height: 1.65; color: #2c2c2e; }
  .doc-content table {
    border-collapse: collapse;
    width: 100%;
    margin: 14px 0;
    font-size: 13px;
  }
  .doc-content th, .doc-content td {
    border: 1px solid #e5e5e7;
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
  }
  .doc-content th { background: #f5f5f7; font-weight: 600; }
  .doc-content code {
    background: #f5f5f7;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .doc-content pre {
    background: #1d1d1f;
    color: #f5f5f7;
    padding: 14px 16px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 12.5px;
  }
  .doc-content pre code { background: none; padding: 0; color: inherit; }
  .authoring-example-table {
    border-collapse: collapse;
    width: 100%;
    margin: 14px 0;
    font-size: 13px;
    border: 1px solid #d2d2d7;

  .authoring-example-table th.ex-header-row {
    background: #464646;
    color: #fff;
    font-weight: 600;
    text-align: left;
    padding: 8px 12px;
    font-size: 13px;
  }
  .authoring-example-table td {
    border: 1px solid #d2d2d7;
    padding: 10px 12px;
    vertical-align: top;
    background: #fff;
  }
  .authoring-example-table td h1,
  .authoring-example-table td h2,
  .authoring-example-table td h3,
  .authoring-example-table td h4,
  .authoring-example-table td h5,
  .authoring-example-table td h6 {
    font-size: 15px;
    margin: 0 0 6px;
  }
  .authoring-example-table td p { margin: 0 0 6px; }
  .authoring-example-table td p:last-child { margin-bottom: 0; }
  .authoring-example-table td img {
    max-width: 140px;
    max-height: 90px;
    display: block;
    margin-bottom: 6px;
    border-radius: 4px;
    object-fit: cover;
  }
  .authoring-example-table td img[alt="icon"] {
    width: 40px;
    height: 40px;
    max-width: 40px;
    max-height: 40px;
    border-radius: 6px;
    object-fit: contain;

  .authoring-example-table tr.ex-viewport-row td {
    background: #eef3fc;
    color: #0265DC;
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    padding: 5px 12px;
  }
  .authoring-example-table .color-swatch {
    display: inline-block;
    width: 13px;
    height: 13px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.15);
    vertical-align: -2px;
    margin-right: 6px;
  }
  .authoring-example-table tr.ex-group-start td {
    border-top: 2px dashed #c7c7cc;
  }
  .authoring-example-table .empty-dash {
    color: #b6b6ba;
    font-weight: 600;
  }
  .authoring-example-table .tooltip-label {
    text-decoration: underline dotted;
    text-underline-offset: 2px;
    cursor: help;
  }
  .authoring-example-table .badge-primary {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    background: #FA0F00;
    color: #fff;
    padding: 1px 7px;
    border-radius: 100px;
    margin-left: 6px;
    vertical-align: 1px;
  }
  .authoring-example-table hr.cell-group-divider {

  }

  }
  .ex-image-preview img {
    max-width: 220px;
    max-height: 120px;
    border-radius: 6px;

    object-fit: cover;
  }

  }
  .ex-section-divider {
    font-size: 11.5px;

    background: #f5f5f7;
    border-radius: 6px;

  .ex-section-body {

    margin-bottom: 10px;
  }
  .doc-content blockquote {
    display: none; /* the quick-summary blockquote is rendered separately above */
  }
  .doc-content a { color: #0265DC; }
  .fn-ref {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 15px;
    height: 15px;
    padding: 0 3px;
    margin-left: 2px;
    border-radius: 100px;
    background: #eef3fc;
    color: #0265DC;

    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    vertical-align: super;
    user-select: none;
  }
  .fn-ref:hover { background: #d9e6fb; }
  .fn-ref.open { background: #0265DC; color: #fff; }
  #fn-popup {
    position: fixed;
    background: #1d1d1f;
    color: #f5f5f7;
    font-size: 12px;
    line-height: 1.5;
    padding: 9px 12px;
    border-radius: 8px;
    max-width: 280px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    z-index: 50;
  }
  #fn-popup a { color: #8ec1ff; }
  #fn-popup::after {
    content: '';
    position: absolute;
    width: 9px;
    height: 9px;
    background: #1d1d1f;
    transform: rotate(45deg);
    left: var(--arrow-left, 14px);
  }
  #fn-popup.fn-below::after { top: -4px; }
  #fn-popup.fn-above::after { bottom: -4px; }
  .nav-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  #back-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 600;

    background: #f0f0f2;
    border: 1px solid #e0e0e3;

  }

  #breadcrumb {

    display: flex;
    align-items: center;
    gap: 2px;
    font-size: 12.5px;

  #history-dropdown {
    position: absolute;

    background: #fff;
    border: 1px solid #e5e5e7;
    border-radius: 9px;

  }
  #history-dropdown .crumb-item {
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
    color: #1d1d1f;

    text-overflow: ellipsis;
  }
  #history-dropdown .crumb-item:hover { background: #f5f5f7; }
  .badges { display: flex; gap: 6px; margin: 10px 0 0; flex-wrap: wrap; }
  .badge {
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 100px;
    background: #eef6ec;
    color: #2a6b1f;

  }
  .badge.missing { background: #fdecea; color: #b3261e; border-color: #f6cfcb; }
  #empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #86868b;
    font-size: 13px;
  }
</style>

<script>
const BLOCKS = [{"slug": "base-card", "title": "Base Card", "summary": "A single promotional card pairing an image (optionally icon-badged) with a heading/body/link \u2014 for simple tiles in a grid, e.g. product callouts, feature highlights, or \"learn more\" teasers. Authored as one table row with two cells \u2014 text (foreground) and image (media). Only variation: `featured`, which enlarges the card and adds a parallax reveal. Worth knowing: a Section Metadata `layout`/`style` value (`base card section`) can fix mobile stacking when several of these sit in a grid.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 783, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868222.879531, "techSpecUrl": "https://www.figma.com/design/hVUf8gwf7USwNGpYKPqKgo/C2---Cards?node-id=1-2212&t=ewIKpNUXNPD7oLDX-1", "html": "<h1>Base Card</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A single promotional card pairing an image (optionally icon-badged) with a heading/body/link \u2014 for simple tiles in a grid, e.g. product callouts, feature highlights, or \"learn more\" teasers. Authored as one table row with two cells \u2014 text (foreground) and image (media). Only variation: <code>featured</code>, which enlarges the card and adds a parallax reveal. Worth knowing: a Section Metadata <code>layout</code>/<code>style</code> value (<code>base card section</code>) can fix mobile stacking when several of these sit in a grid.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as <strong>one table row with two columns</strong> (cells). Column 1 is the text (\"foreground\"); column 2 is the image (\"media\").</p>\n<p>This block only picks up the first row you add \u2014 if you include more than one, the extras are ignored unless you use the mobile-viewport/tablet-viewport/desktop-viewport syntax (see Notes).</p>\n<table>\n<thead>\n<tr>\n<th>Row / Column</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Column 1 \u2014 Foreground (text)</td>\n<td>Optional: an image on its own line at the very top of the cell (nothing else in that line) \u2014 this is treated as a small <strong>icon</strong> and is automatically moved onto the media image as a 24\u00d724 badge in the top corner. Then: a heading (any level, h1\u2013h6 \u2014 it's visually sized as \"heading-5\" regardless of the level you pick), then body paragraph(s). Optionally end with a link on its own line (not bold/italic) \u2014 a \"standalone\" text link that becomes the whole card's click target. A link wrapped in <strong>bold</strong> or <em>italic</em> instead becomes a normal button.</td>\n</tr>\n<tr>\n<td>Column 2 \u2014 Media (image)</td>\n<td>Required if you want a card image. A single image, authored normally (with alt text describing the image for screen readers). Milo requires <code>width</code>/<code>height</code> attributes on the image, which are set automatically when you paste/insert the image \u2014 do not strip them.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author it</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Featured</td>\n<td>Enlarges the card: the media gets an animated rounded-corner reveal (parallax), and on desktop the heading and CTA link sit side-by-side above the image in a two-column layout instead of stacking.</td>\n<td>Add \"featured\" to the block name cell, e.g. \"Base Card (featured)\".</td>\n</tr>\n</tbody>\n</table>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Base Card</th></tr>\n<tr><td><p><img alt=\"icon\" src=\"https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg\" /></p>\n<h2>Creative Cloud</h2>\n<p>Get every Adobe app, plus AI tools and 100GB of storage.</p>\n<p><a href=\"https://www.adobe.com/creativecloud.html\">Learn more</a></p></td><td><img alt=\"Person editing photos on a laptop\" src=\"https://www.adobe.com/cc-shared/fragments/cco/q1-2026/media_1a42db9c41aec37e5576b44dceb116b48e2963303.jpg?width=750&amp;format=jpg&amp;optimize=medium\" /></td></tr>\n</table>\n\n<p>Featured variation:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Base Card (featured)</th></tr>\n<tr><td><h2>Photoshop</h2>\n<p>Now with Generative Fill.</p>\n<p><a href=\"https://www.adobe.com/photoshop.html\">Try it free</a></p></td><td><img alt=\"Collage created in Photoshop\" src=\"/media_banner.jpg\" /></td></tr>\n</table>\n\n<p>(In an actual authoring table each <code>|</code> group above column 1 and column 2 is a separate table cell \u2014 the pipe mockup just shows cell boundaries; refer to your doc/table tool's normal 2-column row.)</p>\n<h2>Notes</h2>\n<ul>\n<li>Only the <strong>first row</strong> of the table is read. If you add a second row without using the <code>mobile-viewport</code>/<code>tablet-viewport</code>/<code>desktop-viewport</code> delimiter keywords, it will be silently ignored.</li>\n<li>This block supports Milo's per-viewport authoring shortcut: adding a row whose single cell reads exactly <code>mobile-viewport</code>, <code>tablet-viewport</code>, or <code>desktop-viewport</code> (bare <code>mobile</code>/<code>tablet</code>/<code>desktop</code> still works but is a legacy fallback being phased out; optionally add variant classes in parentheses, e.g. <code>desktop-viewport (featured)</code>) lets you author different content per breakpoint. Breakpoint is screen width: with all three defined, mobile = below 768px, tablet = 768\u20131279px, desktop = 1280px and up; with only mobile-viewport + desktop-viewport, the split is at 1280px. If you don't need that, ignore it and just use one row.</li>\n<li>The \"icon\" detection is strict: it only triggers if the first thing in the foreground cell is a paragraph/line containing <strong>only</strong> an image and nothing else. If any text shares that first line, the icon behavior won't trigger and the image will render as ordinary body content instead.</li>\n<li>The standalone link's clickable area is expanded (via an invisible overlay) to cover the entire foreground text area \u2014 so avoid putting two links directly in the foreground cell, or the overlay from the first will intercept clicks meant for the second.</li>\n<li>Always provide meaningful alt text on the media image; it is not decorative in most uses of this card.</li>\n<li><strong><a href=\"./section-metadata.md\">Section Metadata</a> <code>layout</code>/<code>style</code> interaction:</strong> if a section holds several Base Card blocks side-by-side as a grid, you can add <code>base card section</code> (\u2192 class <code>base-card-section</code>) to that section's Section Metadata <code>layout</code>/<code>style</code> row (see <a href=\"./section-metadata.md\">section-metadata.md</a>). On mobile, this forces the grid to a single column with extra vertical spacing, overriding whatever column count the page's default grid CSS would otherwise apply. This isn't required \u2014 only add it if the default mobile stacking looks wrong for your specific grid.</li>\n</ul>", "footnotes": {}, "raw": "# Base Card\n\n> **Quick summary:** A single promotional card pairing an image (optionally icon-badged) with a heading/body/link \u2014 for simple tiles in a grid, e.g. product callouts, feature highlights, or \"learn more\" teasers. Authored as one table row with two cells \u2014 text (foreground) and image (media). Only variation: `featured`, which enlarges the card and adds a parallax reveal. Worth knowing: a Section Metadata `layout`/`style` value (`base card section`) can fix mobile stacking when several of these sit in a grid.\n\n## Authoring instructions\n\nThe block is authored as **one table row with two columns** (cells). Column 1 is the text (\"foreground\"); column 2 is the image (\"media\").\n\nThis block only picks up the first row you add \u2014 if you include more than one, the extras are ignored unless you use the mobile-viewport/tablet-viewport/desktop-viewport syntax (see Notes).\n\n| Row / Column | Content |\n|---|---|\n| Column 1 \u2014 Foreground (text) | Optional: an image on its own line at the very top of the cell (nothing else in that line) \u2014 this is treated as a small **icon** and is automatically moved onto the media image as a 24\u00d724 badge in the top corner. Then: a heading (any level, h1\u2013h6 \u2014 it's visually sized as \"heading-5\" regardless of the level you pick), then body paragraph(s). Optionally end with a link on its own line (not bold/italic) \u2014 a \"standalone\" text link that becomes the whole card's click target. A link wrapped in **bold** or *italic* instead becomes a normal button. |\n| Column 2 \u2014 Media (image) | Required if you want a card image. A single image, authored normally (with alt text describing the image for screen readers). Milo requires `width`/`height` attributes on the image, which are set automatically when you paste/insert the image \u2014 do not strip them. |\n\n## Variations\n\n| Variation | Effect | How to author it |\n|---|---|---|\n| Featured | Enlarges the card: the media gets an animated rounded-corner reveal (parallax), and on desktop the heading and CTA link sit side-by-side above the image in a two-column layout instead of stacking. | Add \"featured\" to the block name cell, e.g. \"Base Card (featured)\". |\n\n## Example\n\n```\n| Base Card                                                          |\n| ------------------------------------------------------------------ |\n| ![icon](https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg)                                           |\n| ## Creative Cloud                                                  |\n| Get every Adobe app, plus AI tools and 100GB of storage.            |\n| [Learn more](https://www.adobe.com/creativecloud.html)              || ![Person editing photos on a laptop](https://www.adobe.com/cc-shared/fragments/cco/q1-2026/media_1a42db9c41aec37e5576b44dceb116b48e2963303.jpg?width=750&format=jpg&optimize=medium) |\n```\n\nFeatured variation:\n\n```\n| Base Card (featured)                                                |\n| ------------------------------------------------------------------ |\n| ## Photoshop                                                        |\n| Now with Generative Fill.                                           |\n| [Try it free](https://www.adobe.com/photoshop.html)                  || ![Collage created in Photoshop](/media_banner.jpg) |\n```\n\n(In an actual authoring table each `|` group above column 1 and column 2 is a separate table cell \u2014 the pipe mockup just shows cell boundaries; refer to your doc/table tool's normal 2-column row.)\n\n## Notes\n\n- Only the **first row** of the table is read. If you add a second row without using the `mobile-viewport`/`tablet-viewport`/`desktop-viewport` delimiter keywords, it will be silently ignored.\n- This block supports Milo's per-viewport authoring shortcut: adding a row whose single cell reads exactly `mobile-viewport`, `tablet-viewport`, or `desktop-viewport` (bare `mobile`/`tablet`/`desktop` still works but is a legacy fallback being phased out; optionally add variant classes in parentheses, e.g. `desktop-viewport (featured)`) lets you author different content per breakpoint. Breakpoint is screen width: with all three defined, mobile = below 768px, tablet = 768\u20131279px, desktop = 1280px and up; with only mobile-viewport + desktop-viewport, the split is at 1280px. If you don't need that, ignore it and just use one row.\n- The \"icon\" detection is strict: it only triggers if the first thing in the foreground cell is a paragraph/line containing **only** an image and nothing else. If any text shares that first line, the icon behavior won't trigger and the image will render as ordinary body content instead.\n- The standalone link's clickable area is expanded (via an invisible overlay) to cover the entire foreground text area \u2014 so avoid putting two links directly in the foreground cell, or the overlay from the first will intercept clicks meant for the second.\n- Always provide meaningful alt text on the media image; it is not decorative in most uses of this card.\n- **[Section Metadata](./section-metadata.md) `layout`/`style` interaction:** if a section holds several Base Card blocks side-by-side as a grid, you can add `base card section` (\u2192 class `base-card-section`) to that section's Section Metadata `layout`/`style` row (see [section-metadata.md](./section-metadata.md)). On mobile, this forces the grid to a single column with extra vertical spacing, overriding whatever column count the page's default grid CSS would otherwise apply. This isn't required \u2014 only add it if the default mobile stacking looks wrong for your specific grid.\n"}, {"slug": "brand-concierge", "title": "Brand Concierge", "summary": "An AI chat entry point (\"Ask\") that lets visitors type a question or tap a suggested prompt to open a full-screen chat modal, from a hero, inline section, or scroll-following floating element \u2014 for pages that want to offer AI-assisted product guidance alongside standard marketing content. Authored as a fixed, positional stack of 5 rows \u2014 Background, Header, Cards, Input, Legal \u2014 always in that order, even for floating-only variants. Key variations: `hero`, `input-first`, `floating-button`, `floating-button-only`, `floating-anchor-hide`, `floating-delay-<ms>`, `floating-anchor-delay-<ms>`, `c2-dark`, `pill-cards` (some deployments also add `dark` and `floating-input`/`floating-input-only`/`floating-input-dark`). Gotcha: rows are read positionally, so never skip or delete a row \u2014 leave it empty instead.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 1100, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868239.3416836, "techSpecUrl": "https://www.figma.com/design/yhYGJpQ3vOMcPsc4zxs0Nf/C2---Brand-Concierge?node-id=1-1178&t=3gAN1Tq7QxQ3YF16-1", "html": "<h1>Brand Concierge</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> An AI chat entry point (\"Ask\") that lets visitors type a question or tap a suggested prompt to open a full-screen chat modal, from a hero, inline section, or scroll-following floating element \u2014 for pages that want to offer AI-assisted product guidance alongside standard marketing content. Authored as a fixed, positional stack of 5 rows \u2014 Background, Header, Cards, Input, Legal \u2014 always in that order, even for floating-only variants. Key variations: <code>hero</code>, <code>input-first</code>, <code>floating-button</code>, <code>floating-button-only</code>, <code>floating-anchor-hide</code>, <code>floating-delay-&lt;ms&gt;</code>, <code>floating-anchor-delay-&lt;ms&gt;</code>, <code>c2-dark</code>, <code>pill-cards</code> (some deployments also add <code>dark</code> and <code>floating-input</code>/<code>floating-input-only</code>/<code>floating-input-dark</code>). Gotcha: rows are read positionally, so never skip or delete a row \u2014 leave it empty instead.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as a stack of rows. Which rows are required depends on the variation (see below), but the row <strong>order is always the same</strong>: Background, Header, Cards, Input, Legal. The rows are read positionally by the code, so you cannot skip a row in the middle \u2014 leave it empty instead of deleting it if you don't need it (this still applies even for the \"floating-only\" variants, where the whole row set is discarded after being read).</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1. Background</td>\n<td>Either a solid/gradient color value as plain text (e.g. <code>#F5F5F5</code>), or an image. Leave empty for no background.</td>\n</tr>\n<tr>\n<td>2. Header</td>\n<td>A heading (any level) for the title, and optionally one paragraph directly after it for the subtitle. If you provide plain text with no heading/paragraph markup, it's used as the subtitle.</td>\n</tr>\n<tr>\n<td>3. Cards</td>\n<td>One or more suggested-prompt cards. Author each card as its own line/paragraph: optionally an image first (used as the card's icon/photo depending on variation), then the prompt text. Each card becomes a clickable pill/tile that pre-fills the chat input with that text and opens the chat.</td>\n</tr>\n<tr>\n<td>4. Input</td>\n<td>Plain text used as the input field's placeholder (e.g. \"Ask Adobe AI a question\u2026\").</td>\n</tr>\n<tr>\n<td>5. Legal</td>\n<td>Legal/disclaimer text (supports links).</td>\n</tr>\n</tbody>\n</table>\n<p>Clicking a card or submitting text in the input opens a modal containing Adobe's hosted Brand Concierge chat experience; the heading, subtitle, cards, and input placeholder you authored are passed into that chat as overrides. If a visitor isn't already signed in and takes an action that requires it, a sign-in modal opens automatically as part of the chat flow \u2014 this isn't something you author, it's built into the block.</p>\n<h2>Variations</h2>\n<p>Add these as modifier classes on the block name cell, e.g. \"Brand Concierge (hero)\". Some combine.</p>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author it</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>(default \u2014 no class)</td>\n<td>Standard inline block: background, header, cards, input, legal, in that order top to bottom.</td>\n<td>Leave the block name plain: \"Brand Concierge\".</td>\n</tr>\n<tr>\n<td><code>hero</code><sup class=\"fn-ref\" data-fn=\"hero\" title=\"Click for details\">1</sup></td>\n<td>Same row order as default, but sized/spaced as a page hero (bigger heading, wider input).</td>\n<td>\"Brand Concierge (hero)\"</td>\n</tr>\n<tr>\n<td><code>input-first</code><sup class=\"fn-ref\" data-fn=\"input-first\" title=\"Click for details\">2</sup></td>\n<td>Swaps the visual order of Cards and Input (input field renders above the suggested-prompt cards) in the default layout.</td>\n<td>\"Brand Concierge (input-first)\"</td>\n</tr>\n<tr>\n<td><code>floating-button</code><sup class=\"fn-ref\" data-fn=\"floating-button\" title=\"Click for details\">3</sup></td>\n<td>Adds a floating pill button (in addition to the normal rows) that stays pinned to the bottom of the viewport as the visitor scrolls, opening the chat on click.</td>\n<td>\"Brand Concierge (floating-button)\"</td>\n</tr>\n<tr>\n<td><code>floating-button-only</code><sup class=\"fn-ref\" data-fn=\"floating-button-only\" title=\"Click for details\">4</sup></td>\n<td>Renders <strong>only</strong> the floating button \u2014 background/header/cards/input/legal rows are removed from the page entirely.</td>\n<td>\"Brand Concierge (floating-button-only)\"</td>\n</tr>\n<tr>\n<td><code>floating-anchor-hide</code><sup class=\"fn-ref\" data-fn=\"floating-anchor-hide\" title=\"Click for details\">5</sup></td>\n<td>Hides the floating button once the visitor scrolls past the bottom of the page's main content (instead of staying pinned).</td>\n<td>Combine with <code>floating-button</code> or <code>floating-button-only</code>.</td>\n</tr>\n<tr>\n<td><code>floating-delay-&lt;ms&gt;</code></td>\n<td>Delays showing the floating button until the visitor has scrolled past <code>&lt;ms&gt;</code> pixels.</td>\n<td>e.g. \"Brand Concierge (floating-button, floating-delay-400)\"</td>\n</tr>\n<tr>\n<td><code>floating-anchor-delay-&lt;ms&gt;</code></td>\n<td>Delays hiding the floating element near the bottom of the page by <code>&lt;ms&gt;</code> pixels.</td>\n<td>e.g. \"floating-anchor-delay-200\"</td>\n</tr>\n<tr>\n<td><code>c2-dark</code><sup class=\"fn-ref\" data-fn=\"c2-dark\" title=\"Click for details\">6</sup></td>\n<td>Switches header/input/card text and chrome to a dark-mode color scheme, with larger heading sizes at wider screen widths.</td>\n<td>\"Brand Concierge (hero, c2-dark)\"</td>\n</tr>\n<tr>\n<td><code>pill-cards</code><sup class=\"fn-ref\" data-fn=\"pill-cards\" title=\"Click for details\">7</sup></td>\n<td>Renders the suggested-prompt cards as compact horizontal pills instead of full tiles (tablet screens and larger).</td>\n<td>\"Brand Concierge (pill-cards)\"</td>\n</tr>\n</tbody>\n</table>\n<p>Some deployments of this block also support:</p>\n<ul>\n<li>A plain <code>dark</code> variant \u2014 a simpler dark-mode color scheme, distinct from and less elaborate than <code>c2-dark</code> (smaller heading sizes, plainer card borders). Where both are available, treat <code>c2-dark</code> as the richer/preferred dark option and <code>dark</code> as a lighter-touch alternative.</li>\n<li>A <code>floating-input</code> variant, which adds a floating input bar (with the suggested-prompt cards shown as pills) that follows scroll, alongside the normal content \u2014 and a <code>floating-input-only</code> variant that renders just that floating bar, discarding the other rows the same way <code>floating-button-only</code> does. <code>floating-input-only</code> combined with <code>floating-anchor-hide</code> hides the bar once the visitor scrolls past the page's main content. A <code>floating-input-dark</code> modifier applies dark styling specifically to this floating input bar. Where this variant isn't available, use <code>floating-button</code> for a persistent scroll-following entry point instead.</li>\n</ul>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Brand Concierge (hero)</th></tr>\n<tr><td><span class=\"color-swatch\" style=\"background:#F5F5F5\"></span><code>#F5F5F5</code></td></tr>\n<tr><td><h2>Ask Adobe AI anything</h2></td></tr>\n<tr><td>Get instant answers about our products.</td></tr>\n<tr><td><img alt=\"icon\" src=\"https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg\" /> What's the difference between Photoshop and Lightroom?</td></tr>\n<tr><td><img alt=\"icon\" src=\"https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg\" /> Recommend a plan for a small business</td></tr>\n<tr><td>Ask a question\u2026</td></tr>\n<tr><td>By using this feature you agree to the <a href=\"https://www.adobe.com/legal/terms.html\">AI Terms</a>.</td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>This block only initializes its chat experience after the visitor has scrolled it near the viewport (or after a 3-second fallback) \u2014 the underlying chat widget is a separately-hosted script, not part of the block markup, so previewing may show a brief loading state.</li>\n<li>The block auto-hides itself if the visitor hasn't consented to the relevant cookie group; this is expected privacy behavior, not a bug.</li>\n<li>For any \"-only\" floating variant, you still must author all 5 rows in order (even if some are left blank) \u2014 the rows are read positionally before being discarded.</li>\n<li>Card icons in the default/hero card row are decorative and are hidden entirely in dark-themed variants, which rely on text alone.</li>\n<li>Row positions are hard-coded \u2014 do not add extra rows or leave the table short; if a row is entirely missing, later rows shift up and get misinterpreted as the wrong content type.</li>\n</ul>", "footnotes": {"hero": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "input-first": {"num": 2, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "floating-button": {"num": 3, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "floating-button-only": {"num": 4, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "floating-anchor-hide": {"num": 5, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "c2-dark": {"num": 6, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "pill-cards": {"num": 7, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}}, "raw": "# Brand Concierge\n\n> **Quick summary:** An AI chat entry point (\"Ask\") that lets visitors type a question or tap a suggested prompt to open a full-screen chat modal, from a hero, inline section, or scroll-following floating element \u2014 for pages that want to offer AI-assisted product guidance alongside standard marketing content. Authored as a fixed, positional stack of 5 rows \u2014 Background, Header, Cards, Input, Legal \u2014 always in that order, even for floating-only variants. Key variations: `hero`, `input-first`, `floating-button`, `floating-button-only`, `floating-anchor-hide`, `floating-delay-<ms>`, `floating-anchor-delay-<ms>`, `c2-dark`, `pill-cards` (some deployments also add `dark` and `floating-input`/`floating-input-only`/`floating-input-dark`). Gotcha: rows are read positionally, so never skip or delete a row \u2014 leave it empty instead.\n\n## Authoring instructions\n\nThe block is authored as a stack of rows. Which rows are required depends on the variation (see below), but the row **order is always the same**: Background, Header, Cards, Input, Legal. The rows are read positionally by the code, so you cannot skip a row in the middle \u2014 leave it empty instead of deleting it if you don't need it (this still applies even for the \"floating-only\" variants, where the whole row set is discarded after being read).\n\n| Row | Content |\n|---|---|\n| 1. Background | Either a solid/gradient color value as plain text (e.g. `#F5F5F5`), or an image. Leave empty for no background. |\n| 2. Header | A heading (any level) for the title, and optionally one paragraph directly after it for the subtitle. If you provide plain text with no heading/paragraph markup, it's used as the subtitle. |\n| 3. Cards | One or more suggested-prompt cards. Author each card as its own line/paragraph: optionally an image first (used as the card's icon/photo depending on variation), then the prompt text. Each card becomes a clickable pill/tile that pre-fills the chat input with that text and opens the chat. |\n| 4. Input | Plain text used as the input field's placeholder (e.g. \"Ask Adobe AI a question\u2026\"). |\n| 5. Legal | Legal/disclaimer text (supports links). |\n\nClicking a card or submitting text in the input opens a modal containing Adobe's hosted Brand Concierge chat experience; the heading, subtitle, cards, and input placeholder you authored are passed into that chat as overrides. If a visitor isn't already signed in and takes an action that requires it, a sign-in modal opens automatically as part of the chat flow \u2014 this isn't something you author, it's built into the block.\n\n## Variations\n\nAdd these as modifier classes on the block name cell, e.g. \"Brand Concierge (hero)\". Some combine.\n\n| Variation | Effect | How to author it |\n|---|---|---|\n| (default \u2014 no class) | Standard inline block: background, header, cards, input, legal, in that order top to bottom. | Leave the block name plain: \"Brand Concierge\". |\n| `hero`[^hero] | Same row order as default, but sized/spaced as a page hero (bigger heading, wider input). | \"Brand Concierge (hero)\" |\n| `input-first`[^input-first] | Swaps the visual order of Cards and Input (input field renders above the suggested-prompt cards) in the default layout. | \"Brand Concierge (input-first)\" |\n| `floating-button`[^floating-button] | Adds a floating pill button (in addition to the normal rows) that stays pinned to the bottom of the viewport as the visitor scrolls, opening the chat on click. | \"Brand Concierge (floating-button)\" |\n| `floating-button-only`[^floating-button-only] | Renders **only** the floating button \u2014 background/header/cards/input/legal rows are removed from the page entirely. | \"Brand Concierge (floating-button-only)\" |\n| `floating-anchor-hide`[^floating-anchor-hide] | Hides the floating button once the visitor scrolls past the bottom of the page's main content (instead of staying pinned). | Combine with `floating-button` or `floating-button-only`. |\n| `floating-delay-<ms>` | Delays showing the floating button until the visitor has scrolled past `<ms>` pixels. | e.g. \"Brand Concierge (floating-button, floating-delay-400)\" |\n| `floating-anchor-delay-<ms>` | Delays hiding the floating element near the bottom of the page by `<ms>` pixels. | e.g. \"floating-anchor-delay-200\" |\n| `c2-dark`[^c2-dark] | Switches header/input/card text and chrome to a dark-mode color scheme, with larger heading sizes at wider screen widths. | \"Brand Concierge (hero, c2-dark)\" |\n| `pill-cards`[^pill-cards] | Renders the suggested-prompt cards as compact horizontal pills instead of full tiles (tablet screens and larger). | \"Brand Concierge (pill-cards)\" |\n\n[^hero]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^input-first]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^floating-button]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^floating-button-only]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^floating-anchor-hide]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^c2-dark]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^pill-cards]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n\nSome deployments of this block also support:\n\n- A plain `dark` variant \u2014 a simpler dark-mode color scheme, distinct from and less elaborate than `c2-dark` (smaller heading sizes, plainer card borders). Where both are available, treat `c2-dark` as the richer/preferred dark option and `dark` as a lighter-touch alternative.\n- A `floating-input` variant, which adds a floating input bar (with the suggested-prompt cards shown as pills) that follows scroll, alongside the normal content \u2014 and a `floating-input-only` variant that renders just that floating bar, discarding the other rows the same way `floating-button-only` does. `floating-input-only` combined with `floating-anchor-hide` hides the bar once the visitor scrolls past the page's main content. A `floating-input-dark` modifier applies dark styling specifically to this floating input bar. Where this variant isn't available, use `floating-button` for a persistent scroll-following entry point instead.\n\n## Example\n\n```\n| Brand Concierge (hero)                                    |\n| ---------------------------------------------------------- |\n| #F5F5F5                                                    |\n| ## Ask Adobe AI anything                                    |\n| Get instant answers about our products.                    |\n| ![icon](https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg) What's the difference between Photoshop and Lightroom? |\n| ![icon](https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg) Recommend a plan for a small business  |\n| Ask a question\u2026                                             |\n| By using this feature you agree to the [AI Terms](https://www.adobe.com/legal/terms.html). |\n```\n\n## Notes\n\n- This block only initializes its chat experience after the visitor has scrolled it near the viewport (or after a 3-second fallback) \u2014 the underlying chat widget is a separately-hosted script, not part of the block markup, so previewing may show a brief loading state.\n- The block auto-hides itself if the visitor hasn't consented to the relevant cookie group; this is expected privacy behavior, not a bug.\n- For any \"-only\" floating variant, you still must author all 5 rows in order (even if some are left blank) \u2014 the rows are read positionally before being discarded.\n- Card icons in the default/hero card row are decorative and are hidden entirely in dark-themed variants, which rely on text alone.\n- Row positions are hard-coded \u2014 do not add extra rows or leave the table short; if a row is entirely missing, later rows shift up and get misinterpreted as the wrong content type.\n"}, {"slug": "carousel-c2", "title": "Carousel C2", "summary": "A full-width, swipeable (drag, arrow keys, or Previous/Next buttons) hero-style slide carousel with a parallax \"spread\" effect between slides \u2014 use it for a rotating showcase rather than a simple content-grid carousel. Unusually, slide content isn't authored inside the block \u2014 the block itself is just one row/two cells (carousel name, aria-label), and each slide is its own page section tagged with a Section Metadata `carousel` row matching that name. No author-facing variations. Gotcha: matching is by exact text, so a typo in the carousel name silently drops that slide instead of erroring \u2014 see [section-metadata.md](./section-metadata.md).", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 609, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868230.933078, "techSpecUrl": "https://www.figma.com/design/1MdZ0LMObUwlvuJ4H5Kb15/C2---Carousels?node-id=1-2211&t=qTRdtk16fnjC05NG-1", "html": "<h1>Carousel C2</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A full-width, swipeable (drag, arrow keys, or Previous/Next buttons) hero-style slide carousel with a parallax \"spread\" effect between slides \u2014 use it for a rotating showcase rather than a simple content-grid carousel. Unusually, slide content isn't authored inside the block \u2014 the block itself is just one row/two cells (carousel name, aria-label), and each slide is its own page section tagged with a Section Metadata <code>carousel</code> row matching that name. No author-facing variations. Gotcha: matching is by exact text, so a typo in the carousel name silently drops that slide instead of erroring \u2014 see <a href=\"./section-metadata.md\">section-metadata.md</a>.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p><strong>Step 1 \u2014 the block:</strong> Author a \"Carousel C2\" block with <strong>exactly one row, two columns</strong>. This row is never displayed; it only names the carousel and supplies its accessible label. The block only reads this first row \u2014 the first cell becomes the carousel's internal name, the second becomes its accessible label.</p>\n<table>\n<thead>\n<tr>\n<th>Row / Column (in the Carousel C2 block)</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Column 1 \u2014 Carousel name</td>\n<td>A short identifier, e.g. <code>product-launch</code>. Not shown to visitors \u2014 it's only used to match slides to this carousel (see Step 2). Must be unique per page/fragment if you have more than one carousel.</td>\n</tr>\n<tr>\n<td>Column 2 \u2014 Accessible label</td>\n<td>The text screen readers announce for the whole carousel, e.g. \"Product launch highlights, carousel.\"</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Step 2 \u2014 the slides:</strong> Create a new page <strong>section</strong> for each slide (use your authoring tool's section break). In each slide section, add a <strong><a href=\"./section-metadata.md\">Section Metadata</a></strong> block with a row <code>carousel</code> \u2192 <code>&lt;carousel name&gt;</code>, matching Column 1 above exactly. The rest of that section's content (image/background, and optionally a <a href=\"./rich-content.md\">Rich Content</a> block for text overlay) becomes the slide.</p>\n<table>\n<thead>\n<tr>\n<th>Section Metadata row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>carousel</code></td>\n<td>The same carousel name you used in Step 1, e.g. <code>product-launch</code>.</td>\n</tr>\n</tbody>\n</table>\n<p>Slides are collected in the order their sections appear on the page/fragment \u2014 there is no separate ordering field.</p>\n<h2>Variations</h2>\n<p>This block has no author-facing modifier classes. All visual behavior (RTL mirroring, reduced-motion, animation) is automatic based on page language and OS settings.</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Carousel C2</th></tr>\n<tr><td>product-launch</td><td>Product launch highlights, carousel.</td></tr>\n</table>\n\n<p>Then, elsewhere on the same page, as separate sections:</p>\n<div class=\"ex-section-divider\">&#9656; New page section</div>\n<div class=\"ex-section-body\"><div class=\"ex-image-preview\"><img src=\"/slide-1.jpg\" alt=\"New laptop on a desk\"><span class=\"ex-image-caption\">New laptop on a desk</span></div>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Section Metadata</th></tr>\n<tr><td>carousel</td><td>product-launch</td></tr>\n</table></div>\n<div class=\"ex-section-divider\">&#9656; New page section</div>\n<div class=\"ex-section-body\"><table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Rich Content</th></tr>\n<tr><td><h2>Meet the new lineup</h2></td></tr>\n<tr><td>Faster, lighter, and built for creators. <a href=\"https://www.adobe.com/new-lineup.html\">Learn more</a></td></tr>\n</table>\n<div class=\"ex-image-preview\"><img src=\"/slide-2.jpg\" alt=\"Designer working outdoors with the new laptop\"><span class=\"ex-image-caption\">Designer working outdoors with the new laptop</span></div>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Section Metadata</th></tr>\n<tr><td>carousel</td><td>product-launch</td></tr>\n</table></div>\n\n<h2>Notes</h2>\n<ul>\n<li>The <strong>first slide you author becomes the initially active/visible slide</strong>. Behind the scenes the carousel repositions slides for the infinite-loop peek effect (so the last slide appears to sit just before the first), but whichever slide you authored first is always what visitors see active on load.</li>\n<li>Every section you want in the carousel needs its own Section Metadata <code>carousel</code> row with the matching name \u2014 a slide's section without this row will just render as a normal standalone page section and won't join the carousel.</li>\n<li>Because matching happens by exact text match on the carousel name, typos (extra spaces, different casing) will silently drop a slide from the carousel instead of erroring.</li>\n<li>Buttons, indicators, and the live-region announcement (\"Slide 2 of 5, \u2026\") are all generated automatically \u2014 do not author them.</li>\n<li>RTL languages automatically reverse slide order and mirror the arrows; no extra authoring needed.</li>\n</ul>", "footnotes": {}, "raw": "# Carousel C2\n\n> **Quick summary:** A full-width, swipeable (drag, arrow keys, or Previous/Next buttons) hero-style slide carousel with a parallax \"spread\" effect between slides \u2014 use it for a rotating showcase rather than a simple content-grid carousel. Unusually, slide content isn't authored inside the block \u2014 the block itself is just one row/two cells (carousel name, aria-label), and each slide is its own page section tagged with a Section Metadata `carousel` row matching that name. No author-facing variations. Gotcha: matching is by exact text, so a typo in the carousel name silently drops that slide instead of erroring \u2014 see [section-metadata.md](./section-metadata.md).\n\n## Authoring instructions\n\n**Step 1 \u2014 the block:** Author a \"Carousel C2\" block with **exactly one row, two columns**. This row is never displayed; it only names the carousel and supplies its accessible label. The block only reads this first row \u2014 the first cell becomes the carousel's internal name, the second becomes its accessible label.\n\n| Row / Column (in the Carousel C2 block) | Content |\n|---|---|\n| Column 1 \u2014 Carousel name | A short identifier, e.g. `product-launch`. Not shown to visitors \u2014 it's only used to match slides to this carousel (see Step 2). Must be unique per page/fragment if you have more than one carousel. |\n| Column 2 \u2014 Accessible label | The text screen readers announce for the whole carousel, e.g. \"Product launch highlights, carousel.\" |\n\n**Step 2 \u2014 the slides:** Create a new page **section** for each slide (use your authoring tool's section break). In each slide section, add a **[Section Metadata](./section-metadata.md)** block with a row `carousel` \u2192 `<carousel name>`, matching Column 1 above exactly. The rest of that section's content (image/background, and optionally a [Rich Content](./rich-content.md) block for text overlay) becomes the slide.\n\n| Section Metadata row | Content |\n|---|---|\n| `carousel` | The same carousel name you used in Step 1, e.g. `product-launch`. |\n\nSlides are collected in the order their sections appear on the page/fragment \u2014 there is no separate ordering field.\n\n## Variations\n\nThis block has no author-facing modifier classes. All visual behavior (RTL mirroring, reduced-motion, animation) is automatic based on page language and OS settings.\n\n## Example\n\n```\n| Carousel C2                    |\n| ------------------------------ |\n| product-launch | Product launch highlights, carousel. |\n```\n\nThen, elsewhere on the same page, as separate sections:\n\n```\n[Section break]\n![New laptop on a desk](/slide-1.jpg)\n\n| Section Metadata |\n| ----------------- |\n| carousel | product-launch |\n\n[Section break]\n| Rich Content |\n| ------------- |\n| ## Meet the new lineup                              |\n| Faster, lighter, and built for creators. [Learn more](https://www.adobe.com/new-lineup.html) |\n\n![Designer working outdoors with the new laptop](/slide-2.jpg)\n\n| Section Metadata |\n| ----------------- |\n| carousel | product-launch |\n```\n\n## Notes\n\n- The **first slide you author becomes the initially active/visible slide**. Behind the scenes the carousel repositions slides for the infinite-loop peek effect (so the last slide appears to sit just before the first), but whichever slide you authored first is always what visitors see active on load.\n- Every section you want in the carousel needs its own Section Metadata `carousel` row with the matching name \u2014 a slide's section without this row will just render as a normal standalone page section and won't join the carousel.\n- Because matching happens by exact text match on the carousel name, typos (extra spaces, different casing) will silently drop a slide from the carousel instead of erroring.\n- Buttons, indicators, and the live-region announcement (\"Slide 2 of 5, \u2026\") are all generated automatically \u2014 do not author them.\n- RTL languages automatically reverse slide order and mirror the arrows; no extra authoring needed.\n"}, {"slug": "comparison-table-c2", "title": "Comparison Table (C2)", "summary": "A responsive pricing/plan comparison table: a sticky row of plan cards (title, price, feature blurb, CTA button) above collapsible feature-comparison rows, with mobile column-switching, tooltips, and built-in accessibility labeling. Authored as one table \u2014 row 1 is the mandatory header (corner cell + plan cells split by `-` dividers into label/collapsible/CTA groups), every row after is a feature row, and a `+++` row splits the table into multiple independently-collapsible sub-tables. Variations: `static-header`, and a Section Metadata `expand` key controlling which sub-tables open by default. Gotcha: column alignment across rows is purely positional, so adding/removing a plan column means updating every row.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 1003, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868204.3590102, "techSpecUrl": "https://www.figma.com/design/RexHLUgaqscFZIbOr7hBzt/C2---Tables?node-id=1-2209&t=EGkel8gQmaIdYDlm-1", "html": "<h1>Comparison Table (C2)</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A responsive pricing/plan comparison table: a sticky row of plan cards (title, price, feature blurb, CTA button) above collapsible feature-comparison rows, with mobile column-switching, tooltips, and built-in accessibility labeling. Authored as one table \u2014 row 1 is the mandatory header (corner cell + plan cells split by <code>-</code> dividers into label/collapsible/CTA groups), every row after is a feature row, and a <code>+++</code> row splits the table into multiple independently-collapsible sub-tables. Variations: <code>static-header</code>, and a Section Metadata <code>expand</code> key controlling which sub-tables open by default. Gotcha: column alignment across rows is purely positional, so adding/removing a plan column means updating every row.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as one table. The <strong>first row</strong> is always treated as the header (the plan cards), and <strong>every row after it</strong> is feature-row content \u2014 so row order matters, and the header row is mandatory.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Row 1 \u2014 Header</td>\n<td>One cell per column. <strong>Cell 1</strong> is the \"corner\" cell \u2014 its content (e.g. a heading) becomes the label above the feature-name column and is not treated as a plan. <strong>Cells 2+</strong> are the plan/column cards: each cell's paragraphs are split into up to 3 stacked groups by inserting a paragraph containing only a hyphen (<code>-</code>) as a divider \u2014 Group 1 = eyebrow/label + heading (plan name) + price + short description; Group 2 (optional, appears between two <code>-</code> dividers) = extra bullet copy shown in a collapsible area; Group 3 (after the last <code>-</code>) = the CTA button(s) and/or fine-print description. Leave a plan cell completely empty to have that whole column removed.</td>\n</tr>\n<tr>\n<td>Row 2+ \u2014 Feature rows</td>\n<td><strong>Cell 1</strong> = the feature/row label (supports the tooltip syntax below). <strong>Cells 2+</strong> = one cell per plan column (must line up positionally with the header's plan cells), each cell's value for that feature \u2014 plain text, an icon, or a dash (<code>-</code>) alone to mark \"not included\" (renders as a muted em-dash placeholder and is hidden from sighted users but announced to screen readers).</td>\n</tr>\n<tr>\n<td>A row whose single cell contains exactly <code>+++</code></td>\n<td>Not a data row \u2014 a <strong>divider</strong> that splits the block into multiple independent, separately-collapsible comparison tables (e.g. \"Individual plans\" then \"Teams plans\"). The <code>+++</code> row itself is removed. The row immediately after each divider (or the very first row after the header) is that table's own toggle/heading row: cell 1 is the clickable heading that expands/collapses the section, and typing the word <code>primary</code> (case-sensitive, lowercase) in one of that row's other cells flags that column as the \"primary/recommended\" plan for that sub-table (the <code>primary</code> marker cell itself is removed).</td>\n</tr>\n</tbody>\n</table>\n<p>Row-label tooltip syntax: apply underline formatting to text in a feature-row's first cell and separate with pipes: <code>Label|position|Tooltip text</code>, e.g. <code>Storage|top|Includes 100GB of cloud storage</code>. <code>position</code> is one of <code>top</code>, <code>bottom</code>, <code>left</code>, <code>right</code> (optional \u2014 defaults to <code>right</code> on desktop / <code>bottom</code> on mobile). Underlined text with no pipes, or only a label and no tooltip text, just renders as a dotted-underline hint with no popup.</p>\n<p>Buttons in the CTA group follow standard Milo convention: wrap link text in <code>**bold**</code> for a filled/primary button, or <code>_italic_</code> for an outline button.</p>\n<h2>Variations</h2>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>static-header</code><sup class=\"fn-ref\" data-fn=\"static-header\" title=\"Click for details\">1</sup></td>\n<td>Disables the sticky/collapsing behavior of the plan-card header on scroll \u2014 the header stays in its normal position instead of shrinking and sticking as the user scrolls down.</td>\n<td><code>Comparison Table C2 (static-header)</code></td>\n</tr>\n<tr>\n<td><a href=\"./section-metadata.md\">Section Metadata</a> <code>expand</code><sup class=\"fn-ref\" data-fn=\"expand\" title=\"Click for details\">2</sup> key</td>\n<td>Controls which of the <code>+++</code>-separated sub-tables render expanded by default. Value <code>all</code> expands every sub-table; a comma-separated list of 1-based numbers (e.g. <code>1, 3</code>) expands only those sub-tables (in document order); if omitted, only the first sub-table is expanded.</td>\n<td>Add a <strong><a href=\"./section-metadata.md\">Section Metadata</a></strong> block in the same page section with a row: <code>expand</code> | <code>1, 3</code></td>\n</tr>\n</tbody>\n</table>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"3\">Comparison Table C2</th></tr>\n<tr><td>Compare plans</td><td><h2>Standard</h2>\n<p>Good for individuals</p>\n<p>$9.99/mo</p><hr class=\"cell-group-divider\">Cloud storage</td><td><h2>Pro</h2>\n<p>Best for teams</p>\n<p>$19.99/mo</p><hr class=\"cell-group-divider\">Cloud storage, Priority support</td></tr>\n<tr><td><span class=\"tooltip-label\" title=\"Includes automatic backups\">Cloud storage</span></td><td>100GB</td><td>1TB</td></tr>\n<tr><td>Priority support</td><td><span class=\"empty-dash\" title=\"Not included\">\u2014</span></td><td>Yes</td></tr>\n<tr><td><em>Sign up</em></td><td><span class=\"empty-dash\" title=\"Not included\">\u2014</span></td><td><span class=\"empty-dash\" title=\"Not included\">\u2014</span></td></tr>\n</table>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"3\">Individual plans <span class=\"badge-primary\">Primary</span></th></tr>\n<tr><td><span class=\"tooltip-label\" title=\"Includes automatic backups\">Cloud storage</span></td><td>100GB</td><td>1TB</td></tr>\n</table>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Section Metadata</th></tr>\n<tr><td>expand</td><td>all</td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>The number of <code>-</code> dividers you type inside a header plan cell determines how the content is grouped: exactly 2 dividers give you all 3 groups (label/price block, collapsible middle, CTA); with 0 or 1 dividers the collapsible/CTA styling (button decoration, description wrapping) may not apply correctly \u2014 always use 2 dividers per plan cell for the documented layout.</li>\n<li>The mobile column-switcher (a dropdown letting visitors swap which plan column is visible) only appears automatically when there are more than 2 plan columns (i.e. more than 3 total header cells including the corner cell); with 2 or fewer plan columns all columns just show on mobile.</li>\n<li>Column alignment between the header row and every feature row is purely positional \u2014 cell 2 of every row must always refer to the same plan, cell 3 to the next, etc. Adding/removing a plan column requires updating every single row in the table.</li>\n<li>A cell containing only <code>-</code> (or only dashes) is treated as \"empty/not included\" and is visually hidden with only a short line drawn \u2014 do not use <code>-</code> for an actual hyphenated value.</li>\n<li>No block-specific <code>dark</code> class check exists in this block's JS; the <code>.dark</code> CSS rules present are the standard Milo section-level dark theme and apply automatically when the enclosing section is set to dark, not something toggled via the block name.</li>\n</ul>", "footnotes": {"static-header": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/pull/6086\">#6086</a> \u2014 Rares Munteanu, 2026-06-15"}, "expand": {"num": 2, "html": "<a href=\"https://github.com/adobecom/milo/pull/6086\">#6086</a> \u2014 Rares Munteanu, 2026-06-15"}}, "raw": "# Comparison Table (C2)\n\n> **Quick summary:** A responsive pricing/plan comparison table: a sticky row of plan cards (title, price, feature blurb, CTA button) above collapsible feature-comparison rows, with mobile column-switching, tooltips, and built-in accessibility labeling. Authored as one table \u2014 row 1 is the mandatory header (corner cell + plan cells split by `-` dividers into label/collapsible/CTA groups), every row after is a feature row, and a `+++` row splits the table into multiple independently-collapsible sub-tables. Variations: `static-header`, and a Section Metadata `expand` key controlling which sub-tables open by default. Gotcha: column alignment across rows is purely positional, so adding/removing a plan column means updating every row.\n\n## Authoring instructions\n\nThe block is authored as one table. The **first row** is always treated as the header (the plan cards), and **every row after it** is feature-row content \u2014 so row order matters, and the header row is mandatory.\n\n| Row | Content |\n|---|---|\n| Row 1 \u2014 Header | One cell per column. **Cell 1** is the \"corner\" cell \u2014 its content (e.g. a heading) becomes the label above the feature-name column and is not treated as a plan. **Cells 2+** are the plan/column cards: each cell's paragraphs are split into up to 3 stacked groups by inserting a paragraph containing only a hyphen (`-`) as a divider \u2014 Group 1 = eyebrow/label + heading (plan name) + price + short description; Group 2 (optional, appears between two `-` dividers) = extra bullet copy shown in a collapsible area; Group 3 (after the last `-`) = the CTA button(s) and/or fine-print description. Leave a plan cell completely empty to have that whole column removed. |\n| Row 2+ \u2014 Feature rows | **Cell 1** = the feature/row label (supports the tooltip syntax below). **Cells 2+** = one cell per plan column (must line up positionally with the header's plan cells), each cell's value for that feature \u2014 plain text, an icon, or a dash (`-`) alone to mark \"not included\" (renders as a muted em-dash placeholder and is hidden from sighted users but announced to screen readers). |\n| A row whose single cell contains exactly `+++` | Not a data row \u2014 a **divider** that splits the block into multiple independent, separately-collapsible comparison tables (e.g. \"Individual plans\" then \"Teams plans\"). The `+++` row itself is removed. The row immediately after each divider (or the very first row after the header) is that table's own toggle/heading row: cell 1 is the clickable heading that expands/collapses the section, and typing the word `primary` (case-sensitive, lowercase) in one of that row's other cells flags that column as the \"primary/recommended\" plan for that sub-table (the `primary` marker cell itself is removed). |\n\nRow-label tooltip syntax: apply underline formatting to text in a feature-row's first cell and separate with pipes: `Label|position|Tooltip text`, e.g. `Storage|top|Includes 100GB of cloud storage`. `position` is one of `top`, `bottom`, `left`, `right` (optional \u2014 defaults to `right` on desktop / `bottom` on mobile). Underlined text with no pipes, or only a label and no tooltip text, just renders as a dotted-underline hint with no popup.\n\nButtons in the CTA group follow standard Milo convention: wrap link text in `**bold**` for a filled/primary button, or `_italic_` for an outline button.\n\n## Variations\n\n| Variation | Effect | How to author |\n|---|---|---|\n| `static-header`[^static-header] | Disables the sticky/collapsing behavior of the plan-card header on scroll \u2014 the header stays in its normal position instead of shrinking and sticking as the user scrolls down. | `Comparison Table C2 (static-header)` |\n| [Section Metadata](./section-metadata.md) `expand`[^expand] key | Controls which of the `+++`-separated sub-tables render expanded by default. Value `all` expands every sub-table; a comma-separated list of 1-based numbers (e.g. `1, 3`) expands only those sub-tables (in document order); if omitted, only the first sub-table is expanded. | Add a **[Section Metadata](./section-metadata.md)** block in the same page section with a row: `expand` \\| `1, 3` |\n\n[^static-header]: [#6086](https://github.com/adobecom/milo/pull/6086) \u2014 Rares Munteanu, 2026-06-15\n[^expand]: [#6086](https://github.com/adobecom/milo/pull/6086) \u2014 Rares Munteanu, 2026-06-15\n\n## Example\n\n```\n| Comparison Table C2 |\n| Compare plans | ## Standard \\n Good for individuals \\n $9.99/mo \\n --- \\n Cloud storage \\n --- | ## Pro \\n Best for teams \\n $19.99/mo \\n --- \\n Cloud storage, Priority support \\n --- |\n| **Cloud storage|top|Includes automatic backups** | 100GB | 1TB |\n| Priority support | - | Yes |\n| _Sign up_ | - | - |\n\n| Comparison Table C2 |\n| +++ |\n| Individual plans | | primary |\n| **Cloud storage|top|Includes automatic backups** | 100GB | 1TB |\n\n| Section Metadata |\n| expand | all |\n```\n\n## Notes\n\n- The number of `-` dividers you type inside a header plan cell determines how the content is grouped: exactly 2 dividers give you all 3 groups (label/price block, collapsible middle, CTA); with 0 or 1 dividers the collapsible/CTA styling (button decoration, description wrapping) may not apply correctly \u2014 always use 2 dividers per plan cell for the documented layout.\n- The mobile column-switcher (a dropdown letting visitors swap which plan column is visible) only appears automatically when there are more than 2 plan columns (i.e. more than 3 total header cells including the corner cell); with 2 or fewer plan columns all columns just show on mobile.\n- Column alignment between the header row and every feature row is purely positional \u2014 cell 2 of every row must always refer to the same plan, cell 3 to the next, etc. Adding/removing a plan column requires updating every single row in the table.\n- A cell containing only `-` (or only dashes) is treated as \"empty/not included\" and is visually hidden with only a short line drawn \u2014 do not use `-` for an actual hyphenated value.\n- No block-specific `dark` class check exists in this block's JS; the `.dark` CSS rules present are the standard Milo section-level dark theme and apply automatically when the enclosing section is set to dark, not something toggled via the block name.\n"}, {"slug": "elastic-carousel", "title": "Elastic Carousel", "summary": "A row of compact cards (typically around 5) that elastically expand on hover/focus to reveal more of a video or image, then settle back down, with scroll-driven stacking on mobile \u2014 used for a horizontal showcase of linked items like feature highlights or tutorial teasers. Authored as one row per card, each with two columns: a text column read positionally as icon, heading, link name, then description (which must contain the link), and a media column (image or `.mp4` link). No author-facing variations \u2014 behavior only changes automatically for RTL pages. Gotcha: the whole card is one big link, so avoid adding a second link elsewhere in the card.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 955, "lastUpdated": "Aug 6, 2026", "lastUpdatedTs": 1786042904.631341, "techSpecUrl": "https://www.figma.com/design/1MdZ0LMObUwlvuJ4H5Kb15/C2---Carousels?node-id=1-2212&t=qTRdtk16fnjC05NG-1", "html": "<h1>Elastic Carousel</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A row of compact cards (typically around 5) that elastically expand on hover/focus to reveal more of a video or image, then settle back down, with scroll-driven stacking on mobile \u2014 used for a horizontal showcase of linked items like feature highlights or tutorial teasers. Authored as one row per card, each with two columns: a text column read positionally as icon, heading, link name, then description (which must contain the link), and a media column (image or <code>.mp4</code> link). No author-facing variations \u2014 behavior only changes automatically for RTL pages. Gotcha: the whole card is one big link, so avoid adding a second link elsewhere in the card.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as <strong>one row per card (slide)</strong>, each row having exactly <strong>two columns</strong>: a text column (left) and a media column (right).</p>\n<p>Each row is treated as one slide. Within the left column, the code reads the <strong>first four child elements in order</strong> \u2014 icon, heading, link name, description \u2014 and looks for the link <em>inside the last of those four (the description)</em>.</p>\n<table>\n<thead>\n<tr>\n<th>Row (= one card) / Column</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Left column, item 1 \u2014 Icon</td>\n<td>A small icon image (rendered at 24\u00d724). Required as the first item.</td>\n</tr>\n<tr>\n<td>Left column, item 2 \u2014 Heading</td>\n<td>A heading (any level) shown at the top of the card, above the media.</td>\n</tr>\n<tr>\n<td>Left column, item 3 \u2014 Link name</td>\n<td>Short label text shown in the card's footer, above the description (e.g. \"Watch now\").</td>\n</tr>\n<tr>\n<td>Left column, item 4 \u2014 Description</td>\n<td>Descriptive text shown in the footer under the link name. <strong>This paragraph must contain the link</strong> \u2014 that link's <code>href</code> becomes the destination for the entire card (the whole card is one big clickable link).</td>\n</tr>\n<tr>\n<td>Right column \u2014 Media</td>\n<td>A single image, or a link to an <code>.mp4</code> video (Milo's standard video-link authoring \u2014 Milo converts a plain link to a video file into an inline video automatically). On mobile, videos autoplay/rewind as they scroll into and out of view; on desktop, they play on hover/focus.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<p>This block has no author-facing modifier classes \u2014 there are no variant checks in the code, and the only classes it manages are internal state (added/removed automatically as the visitor hovers, scrolls, etc.), not something you author.</p>\n<p>The only behavioral change driven by authoring context is document direction: on right-to-left (RTL) pages, slide order is reversed and hover-arrow/underline decorations flip automatically \u2014 this is inherited from the page's text direction setting, not something added to the block name.</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Elastic Carousel</th></tr>\n<tr><td><p><img alt=\"icon\" src=\"https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg\" /></p>\n<h2>Generative Fill</h2>\n<p>Watch now</p>\n<p>See how Generative Fill extends and edits images in seconds. <a href=\"https://www.adobe.com/videos/gen-fill-demo.mp4\">Watch the demo</a></p></td><td><img alt=\"Generative Fill demo preview\" src=\"/gen-fill-poster.jpg\" /></td></tr>\n<tr class=\"ex-group-start\"><td><p><img alt=\"icon\" src=\"https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg\" /></p>\n<h2>Firefly for video</h2>\n<p>Learn more</p>\n<p>Bring AI-generated effects into your video timeline. <a href=\"https://www.adobe.com/firefly-video.html\">Explore Firefly video</a></p></td><td><img alt=\"Firefly video effects preview\" src=\"/firefly-video-thumb.jpg\" /></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>The left column's first four items are read <strong>positionally</strong> \u2014 you cannot omit the icon or reorder heading/link-name/description; if a slide is missing one of them, later items will shift into the wrong role (e.g. the description's link will be searched for in whatever content actually lands in that fourth slot).</li>\n<li>Because the entire card is a single link, don't add a second link elsewhere in the card \u2014 only the link found inside the fourth (description) item is used, but any other links will be visually inert or confusing since clicks anywhere on the card navigate via the card's own link.</li>\n<li>Five cards is the assumed/default layout width (the sizing math is tuned around five); adding more or fewer will still work, but the elastic hover-grow width and gaps are tuned around five cards.</li>\n<li>On the first slide, the accessible label read to screen readers includes the carousel's name, derived from the link's text split on a pipe character (<code>Label | Carousel Name</code>) \u2014 if you don't include a pipe in the first slide's link text, the whole link text is used and \"Adobe slides\" is used as a fallback name.</li>\n<li>Row order in the doc table is the slide order shown left-to-right (or right-to-left, reversed automatically, on RTL pages).</li>\n<li>The label paragraph's text is also reused for analytics tracking and for building the carousel's accessible name, which the code expects in a <code>Category|Label</code> pipe-delimited format (e.g. <code>Adobe Express|Learn more</code>) \u2014 if you omit the pipe, the carousel's accessible label falls back to the generic string \"Adobe slides\".</li>\n<li>SVG images (icon or media) are automatically rewritten to Milo's federated (shared, cross-site) asset URL; no special authoring is needed beyond using a normal image.</li>\n<li>Video slides only get their real playback, autoplay/rewind-on-hover, and mobile auto-play-in-view behavior if the media cell resolves to an actual video element via Milo's standard video-link authoring \u2014 a plain video <em>file link</em> pasted the normal Milo way is what triggers this; a video embedded via an unsupported method will just render as a static link/image.</li>\n<li>Video gotcha: the poster image (shown in the example above) must sit immediately next to the video link \u2014 Milo grabs the poster from whichever image is adjacent to the link, and won't show one otherwise. For the mobile auto-play-in-view behavior above to actually kick in, the video link's hash needs both <code>autoplay</code> and <code>viewportplay</code>, e.g. <code>#autoplay|viewportplay</code>. <span class=\"autoplay-warn\">Using <code>#autoplay</code> alone plays the video immediately on page load \u2014 by the time it scrolls into view it has already finished, so visitors just see its frozen last frame.</span></li>\n</ul>", "footnotes": {}, "raw": "# Elastic Carousel\n\n> **Quick summary:** A row of compact cards (typically around 5) that elastically expand on hover/focus to reveal more of a video or image, then settle back down, with scroll-driven stacking on mobile \u2014 used for a horizontal showcase of linked items like feature highlights or tutorial teasers. Authored as one row per card, each with two columns: a text column read positionally as icon, heading, link name, then description (which must contain the link), and a media column (image or `.mp4` link). No author-facing variations \u2014 behavior only changes automatically for RTL pages. Gotcha: the whole card is one big link, so avoid adding a second link elsewhere in the card.\n\n## Authoring instructions\n\nThe block is authored as **one row per card (slide)**, each row having exactly **two columns**: a text column (left) and a media column (right).\n\nEach row is treated as one slide. Within the left column, the code reads the **first four child elements in order** \u2014 icon, heading, link name, description \u2014 and looks for the link *inside the last of those four (the description)*.\n\n| Row (= one card) / Column | Content |\n|---|---|\n| Left column, item 1 \u2014 Icon | A small icon image (rendered at 24\u00d724). Required as the first item. |\n| Left column, item 2 \u2014 Heading | A heading (any level) shown at the top of the card, above the media. |\n| Left column, item 3 \u2014 Link name | Short label text shown in the card's footer, above the description (e.g. \"Watch now\"). |\n| Left column, item 4 \u2014 Description | Descriptive text shown in the footer under the link name. **This paragraph must contain the link** \u2014 that link's `href` becomes the destination for the entire card (the whole card is one big clickable link). |\n| Right column \u2014 Media | A single image, or a link to an `.mp4` video (Milo's standard video-link authoring \u2014 Milo converts a plain link to a video file into an inline video automatically). On mobile, videos autoplay/rewind as they scroll into and out of view; on desktop, they play on hover/focus. |\n\n## Variations\n\nThis block has no author-facing modifier classes \u2014 there are no variant checks in the code, and the only classes it manages are internal state (added/removed automatically as the visitor hovers, scrolls, etc.), not something you author.\n\nThe only behavioral change driven by authoring context is document direction: on right-to-left (RTL) pages, slide order is reversed and hover-arrow/underline decorations flip automatically \u2014 this is inherited from the page's text direction setting, not something added to the block name.\n\n## Example\n\n```\n| Elastic Carousel                                                                                          |\n| ---------------------------------------------------------------------------------------------------------- |\n| ![icon](https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg)                                                                                     |\n| ## Generative Fill                                                                                          |\n| Watch now
