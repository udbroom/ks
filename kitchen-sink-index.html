 |\n| --- | --- | --- |\n| `parallax move up fast` | Triggers a scroll-linked \"move up\" transition on the section; see Cross-block interactions for the one block that also reacts to it directly. | All deployments |\n| `parallax garage door reveal` / `parallax double garage door` | Scroll-driven \"garage door\" reveal transitions between sections. | All deployments |\n| `parallax video garage door` | A variant of the above, paired with [Rich Content](./rich-content.md)'s `media` variant on the same section \u2014 no effect without that variant also present. | Only where Rich Content's `media` variant is available (see [rich-content.md](./rich-content.md)) |\n| `parallax stagger ltr` / `parallax stagger rtl` | Staggers the scroll-in of a section's child items left-to-right or right-to-left; pairs with the multi-block grid classes above (see \"Multi-block grids\"). | All deployments |\n\n**Narrow, single-block-only values** \u2014 not general-purpose, only meaningful with one specific block:\n\n| Class | Effect | Availability |\n| --- | --- | --- |\n| `base card section` | Forces a single-column mobile layout with extra gap for a section holding multiple [Base Card](./base-card.md) blocks. | Wherever Base Card is used |\n| `region selector text` | Used only inside the region/locale-selector [Modal](./modal.md) fragment to tighten its intro-copy padding/typography. Don't reuse it elsewhere. | Wherever that Modal fragment is used |\n\n### Multi-block grids: `product-grid` + `two-up` / `three-up` / `four-up` / `six-up`\n\nTo arrange **more than one block side-by-side in the same section** as an even-column grid instead of the default stacked layout, add both a grid-mode class and a column-count class to the same `style`/`layout` row:\n\n| Class | Effect |\n| --- | --- |\n| `product-grid` | Turns the section into a CSS grid with stretched, equal-height rows. Does nothing on its own \u2014 must be paired with one of the column-count classes below. |\n| `two-up` | 2 columns (tablet width and up; collapses to 1 column on mobile). |\n| `three-up` | 3 columns. |\n| `four-up` | 4 columns. |\n| `six-up` | 6 columns. |\n| `fill-last-row` | Pairs only with `two-up`: a leftover single block in the last row spans the full row width instead of sitting alone in one column. |\n\nThere's no `five-up` \u2014 only two/three/four/six column counts are defined, and this behaves identically everywhere the block is used.\n\nOptionally add `parallax-stagger-ltr`/`parallax-stagger-rtl` to the same row for a staggered scroll-in animation whose per-column timing automatically matches the `-up` count you picked. In most deployments, this block's own code also computes the per-item stagger index locally to drive that timing; in the simplest deployment there's no such code \u2014 stagger there relies entirely on the shared animation system reading DOM position, with nothing computed here.\n\n**Which blocks this is commonly used with:** `product-grid` + a `-up` class works with *any* block \u2014 it's positional, not tied to a specific block. In practice it's most often used to arrange several small, self-contained promo/card-style blocks side by side (e.g. [Base Card](./base-card.md), [Explore Card](./explore-card.md), [Product Marquee Grid](./product-marquee-grid.md)), since those are sized to sit comfortably in an even column.\n\n**Gotcha \u2014 two blocks reuse these exact class names internally, unrelated to this system:** [News](./news.md) and [Quick Actions](./quick-actions.md) both apply `two-up`/`three-up`/`four-up`/`six-up` (or a subset) to their *own internal* item/tile grid automatically, based on item count or viewport width \u2014 this has nothing to do with Section Metadata's `product-grid` system and isn't affected by adding these classes here. If you're troubleshooting a News or Quick Actions layout and see these class names, check that block's own doc ([news.md](./news.md) / [quick-actions.md](./quick-actions.md)) rather than this one.\n\n## Example\n\n```\n| Section Metadata |\n| --- | --- | --- |\n| style | rounded corners | container |\n| background | #000000 | ![Desktop background](/media/hero-bg.jpg) |\n| anchor | Featured products |\n```\n\nMasonry example, with different spans per breakpoint:\n\n```\n| Section Metadata |\n| --- | --- |\n| masonry | full width, half width, half width | span 4, span 4, span 4 |\n```\n\nMulti-block grid example \u2014 3 blocks arranged as an even 3-column grid, with scroll-in stagger:\n\n```\n| Section Metadata |\n| --- |\n| style | product grid, three up, parallax stagger ltr |\n```\n\n(Place this Section Metadata at the bottom of a section that also contains three visual blocks \u2014 they'll tile into 3 equal columns instead of stacking.)\n\n## Notes\n\n- The `style`/`layout` classes only take effect together with matching CSS \u2014 a typo silently does nothing.\n- For `background`, plain text with no image/video in that cell is treated as a CSS color value \u2014 an empty cell is simply skipped, it does not clear a previously inherited background.\n- `masonry`'s span list is matched to the section's other blocks **in DOM order**, excluding this Section Metadata block and any auto-generated background container \u2014 miscounting blocks (e.g. forgetting a hidden metadata block further up) will misalign spans to the wrong block.\n- Multi-column `style`/`background`/`masonry` rows switch live as the browser is resized (wired to media-query listeners), so you can preview the breakpoint switch by resizing the window rather than needing separate device tests.\n- `product-grid` by itself does nothing \u2014 it must be combined with a `two-up`/`three-up`/`four-up`/`six-up` class in the same row, or the section falls back to its default stacked layout.\n- The column count on mobile is always effectively 1 (the grid collapses to a single column below the tablet breakpoint) regardless of which `-up` class you chose \u2014 the `-up` class only controls tablet/desktop column count. This is identical everywhere the block is used.\n- Key matching is case-insensitive and whitespace-trimmed (e.g. `Background` and `background` both work), but must otherwise match exactly \u2014 `back ground` will not.\n- `style` and `layout` are functionally identical (both call the same class-toggling code); they exist as two keys purely so authors can separate concerns.\n- Video gotcha (`background` key): pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the background video to autoplay only while scrolled into view (instead of finishing during page load), the video link's hash needs both `autoplay` and `viewportplay`, e.g. `#autoplay|viewportplay`. Using `#autoplay` alone plays the video immediately on page load \u2014 by the time the section is visible it has already finished, so visitors just see its frozen last frame.\n\n### Cross-block interactions\n\nSome other blocks have their own CSS/JS tied to a specific `style`/`layout` class on the section:\n\n| Class | Block | Effect |\n| --- | --- | --- |\n| `parallax move up fast` | [Router Marquee](./router-marquee.md) | If the section *immediately after* a Router Marquee carries this class, the marquee repositions its bottom nav-card controls to make room as that section animates up over it. |\n| `parallax move up fast`, `parallax garage door reveal` | [Offer Hero](./offer-hero.md) | Suppresses Offer Hero's own `rounded-corners-bottom` treatment when either is also present, to avoid clipping during the scroll transition. |\n| `parallax video garage door` | [Rich Content](./rich-content.md) | Enables a scroll-driven \"garage door\" reveal of the media, only when combined with Rich Content's own `media` variant. |\n| `bento` | [Explore Card](./explore-card.md), [Rich Content](./rich-content.md) (via `grid-full-width`) | Extra spacing/sizing rules specific to those blocks when placed in a bento-style section. |\n| `bento` + `stack-mobile` | Section Metadata itself (this doc) | Loads the mobile card-stack scroll animation described above. |\n| `base card section` | [Base Card](./base-card.md) | Forces single-column mobile layout for a multi-card grid. |\n| `region selector text` | [Modal](./modal.md) | Tightens padding/typography for the region-selector modal fragment's intro copy. |\n\n`parallax move up fast`, `parallax garage door reveal`, `parallax double garage door`, and `parallax stagger ltr`/`rtl` are otherwise part of Milo's shared scroll-driven section-transition system \u2014 this block mostly just passes the class name through to the section rather than implementing the animation itself. Treat that system as the source of truth for exact scroll-animation behavior beyond what's listed above.\n\n### Custom keys read by other blocks\n\nThese rows aren't processed by Section Metadata's own code \u2014 the other block reads its own key(s) directly out of the same table.\n\n| Key | Read by | Format |\n| --- | --- | --- |\n| `carousel` | [Carousel C2](./carousel-c2.md) | Value must match the parent Carousel C2 block's name exactly \u2014 tags that section as one of its slides. |\n| `starting-marquee` | [Router Marquee](./router-marquee.md) | 1-based slide number \u2014 reorders which slide plays first. |\n| `tab`, `tab-background`, `link`, `deeplink` | [Tabs](./tabs.md) | Attaches the whole section as a tab panel; see [tabs.md](./tabs.md). |\n| `custom-hide` | [Floating CTA](./floating-cta.md) | A CSS selector \u2014 hides the floating CTA while the matching element is in view. |\n| `expand` | [Comparison Table C2](./comparison-table-c2.md) | `all`, or a comma-separated list of 1-based sub-table numbers \u2014 controls which `+++`-separated sub-tables render expanded by default. |\n"}, {"slug": "side-by-side", "title": "Side by Side", "summary": "A two-card layout pairing a large overlay card (text on image) with a smaller stacked card (text below media), letting authors show two related pieces of content side by side on desktop, stacked on mobile. Authored as two rows \u2014 a media row and a text row \u2014 with one cell per card, cells lining up between rows. Variations: `dark`, `reverse`, `equal`, `featured`, `small-left`. Only `dark` is guaranteed everywhere; the other four variations depend on which deployment of the block you're using, and `featured` expects exactly one media/text cell pair, not two.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 1150, "lastUpdated": "Aug 13, 2026", "lastUpdatedTs": 1786664847.0311334, "techSpecUrl": null, "html": "<h1>Side by Side</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A two-card layout pairing a large overlay card (text on image) with a smaller stacked card (text below media), letting authors show two related pieces of content side by side on desktop, stacked on mobile. Authored as two rows \u2014 a media row and a text row \u2014 with one cell per card, cells lining up between rows. Variations: <code>dark</code>, <code>reverse</code>, <code>equal</code>, <code>featured</code>, <code>small-left</code>. Only <code>dark</code> is guaranteed everywhere; the other four variations depend on which deployment of the block you're using, and <code>featured</code> expects exactly one media/text cell pair, not two.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as <strong>two rows</strong>: a media row and a text row.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Row 1 (media)</td>\n<td>One cell per card, each containing one image or video for that card. In the default two-card layout, use exactly two cells: Cell 1 = media for Card 1 (the large \"overlay\" card), Cell 2 = media for Card 2 (the smaller \"stacked\" card). With the <code>featured</code> variant (where available \u2014 see Variations), use only <strong>one</strong> cell.</td>\n</tr>\n<tr>\n<td>Row 2 (text)</td>\n<td>One cell per card, matching the media row's cell count, each containing that card's text: a heading (any level) and/or a bold paragraph (bold text becomes a <code>title</code>-styled line rather than a button), plus body copy. Cell 1 pairs with Card 1's media, Cell 2 with Card 2's.</td>\n</tr>\n</tbody>\n</table>\n<p>If either row is missing, or the two rows don't line up, the block's decoration logic bails out silently and nothing renders \u2014 always author matching row/cell structure for whichever variant you're using.</p>\n<h2>Variations</h2>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>dark</code><sup class=\"fn-ref\" data-fn=\"dark\" title=\"Click for details\">1</sup></td>\n<td>Suppresses the automatic dark-overlay treatment normally added to the overlay card \u2014 use when the block already sits inside a section with a dark background, so the card doesn't get a redundant dark treatment.</td>\n<td>Add <code>dark</code> to the block name, e.g. <code>Side by Side (dark)</code>.</td>\n</tr>\n</tbody>\n</table>\n<p>In an expanded version of this block, four additional variations are available:</p>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>reverse</code><sup class=\"fn-ref\" data-fn=\"reverse\" title=\"Click for details\">2</sup></td>\n<td>Swaps which card gets the \"overlay\" treatment and which gets \"stacked\": Card 1 (left cell) becomes the small stacked card, Card 2 (right cell) becomes the large overlay card. The desktop column widths flip to match (small column first, wide column second).</td>\n<td>Add <code>reverse</code> to the block name.</td>\n</tr>\n<tr>\n<td><code>equal</code><sup class=\"fn-ref\" data-fn=\"equal\" title=\"Click for details\">3</sup></td>\n<td>Both cards render as \"stacked\" cards (no large overlay card) \u2014 useful for a matched pair of cards, commonly placed directly after a <code>featured</code> Side by Side block to build a mixed 1-large + 2-small layout. On desktop the grid reserves an extra empty leading column so the two cards line up under a preceding <code>featured</code> block.</td>\n<td>Add <code>equal</code> to the block name.</td>\n</tr>\n<tr>\n<td><code>featured</code><sup class=\"fn-ref\" data-fn=\"featured\" title=\"Click for details\">4</sup></td>\n<td>Renders as a <strong>single</strong> full-width overlay card instead of two cards. Author only <strong>one</strong> cell in the media row and <strong>one</strong> cell in the text row \u2014 do not add a second pair of cells, since the variant only expects one card.</td>\n<td>Add <code>featured</code> to the block name; author only one media cell + one text cell.</td>\n</tr>\n<tr>\n<td><code>small-left</code><sup class=\"fn-ref\" data-fn=\"small-left\" title=\"Click for details\">5</sup></td>\n<td>Cosmetic tweak for the stacked card's inner padding \u2014 moves its indent padding from the left side to the right (the default already pads on the left; <code>small-left</code> flips it). Used to mirror a stacked card's layout when paired with <code>reverse</code>/<code>equal</code> arrangements.</td>\n<td>Add <code>small-left</code> to the block name alongside another variant.</td>\n</tr>\n</tbody>\n</table>\n<p>In a simpler deployment of this block, only <code>dark</code> is available \u2014 there is no <code>reverse</code>, <code>equal</code>, <code>featured</code>, or <code>small-left</code> option, and the block always renders exactly two cards (one fixed overlay + one fixed stacked). Check which behavior your environment supports before authoring one of these four variants.</p>\n<h2>Example</h2>\n<p>Default two-card layout:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Side by Side</th></tr>\n<tr><td><img alt=\"overlay.jpg\" src=\"overlay.jpg\" /></td><td><img alt=\"stacked.jpg\" src=\"stacked.jpg\" /></td></tr>\n<tr><td><h2>Built for creators</h2>\n<p>Everything you need to bring your ideas to life.</p></td><td><p><strong>Community spotlight</strong></p>\n<p>See what others are making with Creative Cloud.</p></td></tr>\n</table>\n\n<p>With the dark variant:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Side by Side (dark)</th></tr>\n<tr><td><img alt=\"overlay.jpg\" src=\"overlay.jpg\" /></td><td><img alt=\"stacked.jpg\" src=\"stacked.jpg\" /></td></tr>\n<tr><td><h2>Built for creators</h2>\n<p>Everything you need to bring your ideas to life.</p></td><td><p><strong>Community spotlight</strong></p>\n<p>See what others are making with Creative Cloud.</p></td></tr>\n</table>\n\n<p>Featured + equal pair (hero card followed by a matched two-up row, where the expanded variant set is available):</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Side by Side (featured)</th></tr>\n<tr><td><img alt=\"hero.jpg\" src=\"hero.jpg\" /></td></tr>\n<tr><td><h2>Meet the new Creative Cloud</h2></td></tr>\n</table>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Side by Side (equal)</th></tr>\n<tr><td><img alt=\"story-a.jpg\" src=\"story-a.jpg\" /></td><td><img alt=\"story-b.jpg\" src=\"story-b.jpg\" /></td></tr>\n<tr><td><p><strong>Story A</strong></p>\n<p>Short supporting copy.</p></td><td><p><strong>Story B</strong></p>\n<p>Short supporting copy.</p></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>If either row is missing, or either row has fewer cells than expected for the variant, nothing renders \u2014 always author exactly matching row/cell structure.</li>\n<li>Videos in either card are managed automatically: an intersection observer pauses off-screen video and resumes on-screen video; authors do not need to configure autoplay behavior manually beyond adding the video.</li>\n<li>Video gotcha: pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. <span class=\"autoplay-warn\">Using <code>#autoplay</code> alone plays the video immediately on page load (before the intersection observer above ever gets a chance to manage it) \u2014 by the time the card scrolls into view it has already finished, so visitors just see its frozen last frame.</span> If you want it scroll-gated instead, its hash needs both <code>autoplay</code> and <code>viewportplay</code>, e.g. <code>#autoplay|viewportplay</code>.</li>\n<li>Supports Milo's mobile/tablet/desktop content-override rows (see <a href=\"./rich-content.md\">rich-content.md</a>'s Notes for how that pattern works) \u2014 a viewport-delimiter row can override just one card's media or text while leaving the other card's content inherited from the previous viewport.</li>\n<li>Where the <code>featured</code> variant is available, it only assigns a card type to the first media/text cell pair. If you accidentally author a second media/text cell pair alongside <code>featured</code>, that second card gets an invalid/blank card-type class and won't render its overlay/stacked styling correctly \u2014 keep <code>featured</code> blocks to exactly one media cell + one text cell.</li>\n<li><code>reverse</code>/<code>equal</code>/<code>featured</code> now work correctly together with mobile/tablet/desktop viewport-override rows<sup class=\"fn-ref\" data-fn=\"viewport-fix\" title=\"Click for details\">6</sup> \u2014 previously, combining a variation class with viewport overrides could silently fall back to the default card layout instead of applying the variant, since the code checked the wrong element's class list for viewport-override content. If you saw a variant \"not take\" on a viewport-override authored block before, it should now.</li>\n</ul>", "footnotes": {"dark": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/commit/43647d6\"><code>43647d6</code></a> \u2014 Ratko Zagorac, 2026-07-08"}, "reverse": {"num": 2, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "equal": {"num": 3, "html": "<a href=\"https://github.com/adobecom/milo/commit/4114fbe\"><code>4114fbe</code></a> \u2014 Ratko Zagorac, 2026-07-08"}, "featured": {"num": 4, "html": "<a href=\"https://github.com/adobecom/milo/commit/4114fbe\"><code>4114fbe</code></a> \u2014 Ratko Zagorac, 2026-07-08"}, "small-left": {"num": 5, "html": "<a href=\"https://github.com/adobecom/milo/commit/4114fbe\"><code>4114fbe</code></a> \u2014 Ratko Zagorac, 2026-07-08"}, "viewport-fix": {"num": 6, "html": "<a href=\"https://github.com/adobecom/milo/commit/c025f84\"><code>c025f84</code></a> \u2014 Ratko Zagorac, 2026-08-07"}}, "raw": "# Side by Side\n\n> **Quick summary:** A two-card layout pairing a large overlay card (text on image) with a smaller stacked card (text below media), letting authors show two related pieces of content side by side on desktop, stacked on mobile. Authored as two rows \u2014 a media row and a text row \u2014 with one cell per card, cells lining up between rows. Variations: `dark`, `reverse`, `equal`, `featured`, `small-left`. Only `dark` is guaranteed everywhere; the other four variations depend on which deployment of the block you're using, and `featured` expects exactly one media/text cell pair, not two.\n\n## Authoring instructions\n\nThe block is authored as **two rows**: a media row and a text row.\n\n| Row | Content |\n|---|---|\n| Row 1 (media) | One cell per card, each containing one image or video for that card. In the default two-card layout, use exactly two cells: Cell 1 = media for Card 1 (the large \"overlay\" card), Cell 2 = media for Card 2 (the smaller \"stacked\" card). With the `featured` variant (where available \u2014 see Variations), use only **one** cell. |\n| Row 2 (text) | One cell per card, matching the media row's cell count, each containing that card's text: a heading (any level) and/or a bold paragraph (bold text becomes a `title`-styled line rather than a button), plus body copy. Cell 1 pairs with Card 1's media, Cell 2 with Card 2's. |\n\nIf either row is missing, or the two rows don't line up, the block's decoration logic bails out silently and nothing renders \u2014 always author matching row/cell structure for whichever variant you're using.\n\n## Variations\n\n| Variation | Effect | How to author |\n|---|---|---|\n| `dark`[^dark] | Suppresses the automatic dark-overlay treatment normally added to the overlay card \u2014 use when the block already sits inside a section with a dark background, so the card doesn't get a redundant dark treatment. | Add `dark` to the block name, e.g. `Side by Side (dark)`. |\n\nIn an expanded version of this block, four additional variations are available:\n\n| Variation | Effect | How to author |\n|---|---|---|\n| `reverse`[^reverse] | Swaps which card gets the \"overlay\" treatment and which gets \"stacked\": Card 1 (left cell) becomes the small stacked card, Card 2 (right cell) becomes the large overlay card. The desktop column widths flip to match (small column first, wide column second). | Add `reverse` to the block name. |\n| `equal`[^equal] | Both cards render as \"stacked\" cards (no large overlay card) \u2014 useful for a matched pair of cards, commonly placed directly after a `featured` Side by Side block to build a mixed 1-large + 2-small layout. On desktop the grid reserves an extra empty leading column so the two cards line up under a preceding `featured` block. | Add `equal` to the block name. |\n| `featured`[^featured] | Renders as a **single** full-width overlay card instead of two cards. Author only **one** cell in the media row and **one** cell in the text row \u2014 do not add a second pair of cells, since the variant only expects one card. | Add `featured` to the block name; author only one media cell + one text cell. |\n| `small-left`[^small-left] | Cosmetic tweak for the stacked card's inner padding \u2014 moves its indent padding from the left side to the right (the default already pads on the left; `small-left` flips it). Used to mirror a stacked card's layout when paired with `reverse`/`equal` arrangements. | Add `small-left` to the block name alongside another variant. |\n\n[^dark]: [`43647d6`](https://github.com/adobecom/milo/commit/43647d6) \u2014 Ratko Zagorac, 2026-07-08\n[^reverse]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^equal]: [`4114fbe`](https://github.com/adobecom/milo/commit/4114fbe) \u2014 Ratko Zagorac, 2026-07-08\n[^featured]: [`4114fbe`](https://github.com/adobecom/milo/commit/4114fbe) \u2014 Ratko Zagorac, 2026-07-08\n[^small-left]: [`4114fbe`](https://github.com/adobecom/milo/commit/4114fbe) \u2014 Ratko Zagorac, 2026-07-08\n\nIn a simpler deployment of this block, only `dark` is available \u2014 there is no `reverse`, `equal`, `featured`, or `small-left` option, and the block always renders exactly two cards (one fixed overlay + one fixed stacked). Check which behavior your environment supports before authoring one of these four variants.\n\n## Example\n\nDefault two-card layout:\n\n```\n| Side by Side |     |\n| --- | --- |\n| ![overlay.jpg](overlay.jpg) | ![stacked.jpg](stacked.jpg) |\n| ## Built for creators<br>Everything you need to bring your ideas to life. | **Community spotlight**<br>See what others are making with Creative Cloud. |\n```\n\nWith the dark variant:\n\n```\n| Side by Side (dark) |     |\n| --- | --- |\n| ![overlay.jpg](overlay.jpg) | ![stacked.jpg](stacked.jpg) |\n| ## Built for creators<br>Everything you need to bring your ideas to life. | **Community spotlight**<br>See what others are making with Creative Cloud. |\n```\n\nFeatured + equal pair (hero card followed by a matched two-up row, where the expanded variant set is available):\n\n```\n| Side by Side (featured) |\n| --- |\n| ![hero.jpg](hero.jpg) |\n| ## Meet the new Creative Cloud |\n\n| Side by Side (equal) |     |\n| --- | --- |\n| ![story-a.jpg](story-a.jpg) | ![story-b.jpg](story-b.jpg) |\n| **Story A**<br>Short supporting copy. | **Story B**<br>Short supporting copy. |\n```\n\n## Notes\n\n- If either row is missing, or either row has fewer cells than expected for the variant, nothing renders \u2014 always author exactly matching row/cell structure.\n- Videos in either card are managed automatically: an intersection observer pauses off-screen video and resumes on-screen video; authors do not need to configure autoplay behavior manually beyond adding the video.\n- Video gotcha: pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. Using `#autoplay` alone plays the video immediately on page load (before the intersection observer above ever gets a chance to manage it) \u2014 by the time the card scrolls into view it has already finished, so visitors just see its frozen last frame. If you want it scroll-gated instead, its hash needs both `autoplay` and `viewportplay`, e.g. `#autoplay|viewportplay`.\n- Supports Milo's mobile/tablet/desktop content-override rows (see [rich-content.md](./rich-content.md)'s Notes for how that pattern works) \u2014 a viewport-delimiter row can override just one card's media or text while leaving the other card's content inherited from the previous viewport.\n- Where the `featured` variant is available, it only assigns a card type to the first media/text cell pair. If you accidentally author a second media/text cell pair alongside `featured`, that second card gets an invalid/blank card-type class and won't render its overlay/stacked styling correctly \u2014 keep `featured` blocks to exactly one media cell + one text cell.\n- `reverse`/`equal`/`featured` now work correctly together with mobile/tablet/desktop viewport-override rows[^viewport-fix] \u2014 previously, combining a variation class with viewport overrides could silently fall back to the default card layout instead of applying the variant, since the code checked the wrong element's class list for viewport-override content. If you saw a variant \"not take\" on a viewport-override authored block before, it should now.\n\n[^viewport-fix]: [`c025f84`](https://github.com/adobecom/milo/commit/c025f84) \u2014 Ratko Zagorac, 2026-08-07\n"}, {"slug": "social-proof", "title": "Social Proof", "summary": "A single testimonial/highlight card combining an image with either a heading-and-body text block or a pull-quote, plus a subtle scroll-driven zoom animation \u2014 used to spotlight a customer story, quote, or key stat alongside supporting imagery. Authored as two rows: Row 1 holds the text (and an optional background-color cell), Row 2 holds the media. No author-facing variation classes \u2014 the pull-quote layout is triggered simply by formatting Cell 1's text as a blockquote. Row 2's media cell is read without a null-check, so a missing media item will throw at author-time rather than fail silently.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 608, "lastUpdated": "Aug 6, 2026", "lastUpdatedTs": 1786042904.6447847, "techSpecUrl": null, "html": "<h1>Social Proof</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A single testimonial/highlight card combining an image with either a heading-and-body text block or a pull-quote, plus a subtle scroll-driven zoom animation \u2014 used to spotlight a customer story, quote, or key stat alongside supporting imagery. Authored as two rows: Row 1 holds the text (and an optional background-color cell), Row 2 holds the media. No author-facing variation classes \u2014 the pull-quote layout is triggered simply by formatting Cell 1's text as a blockquote. Row 2's media cell is read without a null-check, so a missing media item will throw at author-time rather than fail silently.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as <strong>two rows</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Row 1 (text + optional background color)</td>\n<td><strong>Cell 1</strong>: the text content \u2014 either (a) a heading (any level) followed by body paragraph(s) and optional buttons, or (b) a blockquote (author applies \"Quote\"/blockquote formatting to a paragraph in your doc tool) \u2014 see Variations below for how the blockquote changes the layout. <strong>Cell 2 (optional)</strong>: plain text naming a background color (e.g. <code>#1E1E1E</code> or a CSS color keyword) applied to the whole card. Leave empty for no custom background.</td>\n</tr>\n<tr>\n<td>Row 2 (media)</td>\n<td>One cell containing a single image or video \u2014 this becomes the card's photo/video panel.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<p>This block has no author-facing modifier classes. The only structural choice authors make is content-driven, not a class:</p>\n<table>\n<thead>\n<tr>\n<th>Choice</th>\n<th>Effect</th>\n<th>How to author</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Blockquote content</td>\n<td>Instead of a heading + body layout, the text renders as a pull-quote: the quote text is styled as a large heading (with any leading curly opening-quote character hung outside the text block), and any additional lines in the blockquote become a caption (e.g. attribution name, title) below it.</td>\n<td>Format the text in Cell 1 as a blockquote in your authoring tool; put the quote as the first line and attribution details as additional lines within the same blockquote.</td>\n</tr>\n</tbody>\n</table>\n<h2>Example</h2>\n<p>Headline + body:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Social Proof</th></tr>\n<tr><td><h2>40% faster turnaround</h2>\n<p>Since switching to Creative Cloud, our team ships campaigns in half the time.</p></td><td></td></tr>\n<tr><td><img alt=\"customer-photo.jpg\" src=\"customer-photo.jpg\" /></td><td></td></tr>\n</table>\n\n<p>Pull-quote variant with background color:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Social Proof</th></tr>\n<tr><td><blockquote>\n<p>\"This is the first tool that actually keeps up with our creative team.\"</p>\n</blockquote>\n<p>Jamie Lee</p>\n<p>Creative Director, Acme Co.</p></td><td><span class=\"color-swatch\" style=\"background:#1E1E1E\"></span><code>#1E1E1E</code></td></tr>\n<tr><td><img alt=\"customer-photo.jpg\" src=\"customer-photo.jpg\" /></td><td></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>If Row 1 is missing entirely, the block renders nothing \u2014 Row 1 is required.</li>\n<li>Row 2's media cell isn't checked for emptiness before the block tries to style it, so an empty or missing Row 2 will cause an error when the page loads \u2014 always include a media item in Row 2.</li>\n<li>Supports Milo's mobile/tablet/desktop content-override rows (same viewport-delimiter pattern described in <a href=\"./rich-content.md\">rich-content.md</a>'s Notes).</li>\n<li>The card has a scroll-linked \"stretch\" and content-enter animation built into the CSS; this is automatic and not configurable per instance, and is disabled under <code>prefers-reduced-motion: reduce</code>.</li>\n<li>Video gotcha (Row 2 media): pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the video to autoplay only while scrolled into view (instead of finishing during page load), the video link's hash needs both <code>autoplay</code> and <code>viewportplay</code>, e.g. <code>#autoplay|viewportplay</code>. <span class=\"autoplay-warn\">Using <code>#autoplay</code> alone plays the video immediately on page load \u2014 by the time it's visible it has already finished, so visitors just see its frozen last frame.</span></li>\n</ul>", "footnotes": {}, "raw": "# Social Proof\n\n> **Quick summary:** A single testimonial/highlight card combining an image with either a heading-and-body text block or a pull-quote, plus a subtle scroll-driven zoom animation \u2014 used to spotlight a customer story, quote, or key stat alongside supporting imagery. Authored as two rows: Row 1 holds the text (and an optional background-color cell), Row 2 holds the media. No author-facing variation classes \u2014 the pull-quote layout is triggered simply by formatting Cell 1's text as a blockquote. Row 2's media cell is read without a null-check, so a missing media item will throw at author-time rather than fail silently.\n\n## Authoring instructions\n\nThe block is authored as **two rows**.\n\n| Row | Content |\n|---|---|\n| Row 1 (text + optional background color) | **Cell 1**: the text content \u2014 either (a) a heading (any level) followed by body paragraph(s) and optional buttons, or (b) a blockquote (author applies \"Quote\"/blockquote formatting to a paragraph in your doc tool) \u2014 see Variations below for how the blockquote changes the layout. **Cell 2 (optional)**: plain text naming a background color (e.g. `#1E1E1E` or a CSS color keyword) applied to the whole card. Leave empty for no custom background. |\n| Row 2 (media) | One cell containing a single image or video \u2014 this becomes the card's photo/video panel. |\n\n## Variations\n\nThis block has no author-facing modifier classes. The only structural choice authors make is content-driven, not a class:\n\n| Choice | Effect | How to author |\n|---|---|---|\n| Blockquote content | Instead of a heading + body layout, the text renders as a pull-quote: the quote text is styled as a large heading (with any leading curly opening-quote character hung outside the text block), and any additional lines in the blockquote become a caption (e.g. attribution name, title) below it. | Format the text in Cell 1 as a blockquote in your authoring tool; put the quote as the first line and attribution details as additional lines within the same blockquote. |\n\n## Example\n\nHeadline + body:\n\n```\n| Social Proof |     |\n| --- | --- |\n| ## 40% faster turnaround<br>Since switching to Creative Cloud, our team ships campaigns in half the time. |     |\n| ![customer-photo.jpg](customer-photo.jpg) |\n```\n\nPull-quote variant with background color:\n\n```\n| Social Proof |     |\n| --- | --- |\n| > \"This is the first tool that actually keeps up with our creative team.\"<br>Jamie Lee<br>Creative Director, Acme Co. | #1E1E1E |\n| ![customer-photo.jpg](customer-photo.jpg) |\n```\n\n## Notes\n\n- If Row 1 is missing entirely, the block renders nothing \u2014 Row 1 is required.\n- Row 2's media cell isn't checked for emptiness before the block tries to style it, so an empty or missing Row 2 will cause an error when the page loads \u2014 always include a media item in Row 2.\n- Supports Milo's mobile/tablet/desktop content-override rows (same viewport-delimiter pattern described in [rich-content.md](./rich-content.md)'s Notes).\n- The card has a scroll-linked \"stretch\" and content-enter animation built into the CSS; this is automatic and not configurable per instance, and is disabled under `prefers-reduced-motion: reduce`.\n- Video gotcha (Row 2 media): pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the video to autoplay only while scrolled into view (instead of finishing during page load), the video link's hash needs both `autoplay` and `viewportplay`, e.g. `#autoplay|viewportplay`. Using `#autoplay` alone plays the video immediately on page load \u2014 by the time it's visible it has already finished, so visitors just see its frozen last frame.\n"}, {"slug": "split-aside-grid", "title": "Split Aside Grid", "summary": "A feature-list-plus-media block \u2014 a clickable vertical list of features paired with a stacked deck of matching images/videos, expanding the description and swapping the front card on click (desktop) or swipe (mobile) \u2014 letting authors walk visitors through several related features, each with its own illustration. Authored as one row per feature/slide, each with two cells: content (heading, body, optional link) and media. Variations: `dark`, `mobile-carousel` (an alternate mobile swipe interaction). `mobile-carousel` is only available in the expanded deployment of this block; a simpler deployment only supports `dark`.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 791, "lastUpdated": "Aug 6, 2026", "lastUpdatedTs": 1786042904.659366, "techSpecUrl": null, "html": "<h1>Split Aside Grid</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A feature-list-plus-media block \u2014 a clickable vertical list of features paired with a stacked deck of matching images/videos, expanding the description and swapping the front card on click (desktop) or swipe (mobile) \u2014 letting authors walk visitors through several related features, each with its own illustration. Authored as one row per feature/slide, each with two cells: content (heading, body, optional link) and media. Variations: <code>dark</code>, <code>mobile-carousel</code> (an alternate mobile swipe interaction). <code>mobile-carousel</code> is only available in the expanded deployment of this block; a simpler deployment only supports <code>dark</code>.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as <strong>one row per feature/slide</strong>, each row with exactly two cells.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Each row = one slide</td>\n<td><strong>Cell 1 (content)</strong>: a heading (any level \u2014 on desktop this heading is hidden by CSS regardless of expanded/collapsed state, with the toggle text as the only visible label there, while on mobile the heading is the slide's visible caption), body paragraph(s) for the expanded description, and optionally one paragraph containing only a link (the link text must equal the whole paragraph's text) to render a standalone \"learn more\" arrow-link instead of a button. Wrapping the link in bold/italic instead produces a normal button. <strong>Cell 2 (media)</strong>: one image or video for that slide's card.</td>\n</tr>\n</tbody>\n</table>\n<p>Author as many rows as you have features; each becomes one card in the stack and one row in the list, in document order (first row = first/front slide).</p>\n<h2>Variations</h2>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>dark</code><sup class=\"fn-ref\" data-fn=\"dark\" title=\"Click for details\">1</sup></td>\n<td>Removes the block's own background color (use when the block already sits on a dark-background section).</td>\n<td>Add <code>dark</code> to the block name, e.g. <code>Split Aside Grid (dark)</code>.</td>\n</tr>\n</tbody>\n</table>\n<p>In an expanded version of this block, a second variation is available:</p>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>mobile-carousel</code><sup class=\"fn-ref\" data-fn=\"mobile-carousel\" title=\"Click for details\">2</sup></td>\n<td>Changes the mobile (below-tablet) interaction from a swipe-off/fly-away card stack to a horizontal sliding carousel track \u2014 slides sit side-by-side at a 16:9 aspect ratio and translate into view (with cloned first/last slides for a seamless loop), instead of the default card literally flying off-screen and rotating. Desktop behavior (click-to-expand list) is unaffected.</td>\n<td>Add <code>mobile-carousel</code> to the block name, e.g. <code>Split Aside Grid (mobile-carousel)</code>.</td>\n</tr>\n</tbody>\n</table>\n<p>In a simpler deployment of this block, <code>mobile-carousel</code> is not available \u2014 mobile interaction is always the fly-off card-swipe stack, and <code>dark</code> is the only author-facing variation.</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Split Aside Grid</th></tr>\n<tr><td><h3>Real-time co-editing</h3>\n<p>Work on the same file with your team, live, with no version conflicts.</p></td><td><img alt=\"coedit.jpg\" src=\"coedit.jpg\" /></td></tr>\n<tr><td><h3>Cloud-native assets</h3>\n<p>Every asset syncs automatically across your devices.</p>\n<p><a href=\"https://example.com/formats\">See supported formats</a></p></td><td><img alt=\"assets.jpg\" src=\"assets.jpg\" /></td></tr>\n<tr><td><h3>One-click sharing</h3>\n<p>Send a link, not a file \u2014 reviewers see your latest version instantly.</p></td><td><img alt=\"share.mp4\" src=\"https://example.com/share.mp4\" /></td></tr>\n</table>\n\n<p>Where available, with the mobile carousel variant:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Split Aside Grid (mobile-carousel)</th></tr>\n<tr><td><h3>Real-time co-editing</h3>\n<p>Work on the same file with your team, live, with no version conflicts.</p></td><td><img alt=\"coedit.jpg\" src=\"coedit.jpg\" /></td></tr>\n<tr><td><h3>Cloud-native assets</h3>\n<p>Every asset syncs automatically across your devices.</p></td><td><img alt=\"assets.jpg\" src=\"assets.jpg\" /></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>The first row's slide is active by default (front of the stack, expanded on desktop).</li>\n<li>If a row has no media cell, that slide is filtered out of the interactive stack; if <strong>no</strong> rows have media, the whole block silently does nothing \u2014 always include a media item in every row.</li>\n<li>The mobile interaction is swipe-driven (pointer drag) with an aria-live region announcing \"Slide X of Y\" for screen-reader users; desktop is a plain click-to-expand accordion-style list \u2014 no author configuration changes this beyond the <code>mobile-carousel</code> variant where available, it's otherwise purely responsive.</li>\n<li>Supports Milo's <code>mobile-viewport</code>/<code>tablet-viewport</code>/<code>desktop-viewport</code> content-override rows (same viewport-delimiter pattern as <a href=\"./rich-content.md\">Rich Content</a>, including the 768px/1280px breakpoint split) if you need to vary slide content per breakpoint.</li>\n<li>Where <code>mobile-carousel</code> is available, the code clones the first and last slide to create a seamless-loop illusion when swiping past the ends \u2014 this is automatic and requires no extra authoring.</li>\n<li>Video gotcha: pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the video to autoplay only while scrolled into view (instead of finishing during page load), the video link's hash needs both <code>autoplay</code> and <code>viewportplay</code>, e.g. <code>#autoplay|viewportplay</code>. <span class=\"autoplay-warn\">Using <code>#autoplay</code> alone plays the video immediately on page load \u2014 by the time it's visible it has already finished, so visitors just see its frozen last frame.</span></li>\n</ul>", "footnotes": {"dark": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "mobile-carousel": {"num": 2, "html": "<a href=\"https://github.com/adobecom/milo/commit/60dcb44\"><code>60dcb44</code></a> \u2014 Ratko Zagorac, 2026-07-16"}}, "raw": "# Split Aside Grid\n\n> **Quick summary:** A feature-list-plus-media block \u2014 a clickable vertical list of features paired with a stacked deck of matching images/videos, expanding the description and swapping the front card on click (desktop) or swipe (mobile) \u2014 letting authors walk visitors through several related features, each with its own illustration. Authored as one row per feature/slide, each with two cells: content (heading, body, optional link) and media. Variations: `dark`, `mobile-carousel` (an alternate mobile swipe interaction). `mobile-carousel` is only available in the expanded deployment of this block; a simpler deployment only supports `dark`.\n\n## Authoring instructions\n\nThe block is authored as **one row per feature/slide**, each row with exactly two cells.\n\n| Row | Content |\n|---|---|\n| Each row = one slide | **Cell 1 (content)**: a heading (any level \u2014 on desktop this heading is hidden by CSS regardless of expanded/collapsed state, with the toggle text as the only visible label there, while on mobile the heading is the slide's visible caption), body paragraph(s) for the expanded description, and optionally one paragraph containing only a link (the link text must equal the whole paragraph's text) to render a standalone \"learn more\" arrow-link instead of a button. Wrapping the link in bold/italic instead produces a normal button. **Cell 2 (media)**: one image or video for that slide's card. |\n\nAuthor as many rows as you have features; each becomes one card in the stack and one row in the list, in document order (first row = first/front slide).\n\n## Variations\n\n| Variation | Effect | How to author |\n|---|---|---|\n| `dark`[^dark] | Removes the block's own background color (use when the block already sits on a dark-background section). | Add `dark` to the block name, e.g. `Split Aside Grid (dark)`. |\n\nIn an expanded version of this block, a second variation is available:\n\n| Variation | Effect | How to author |\n|---|---|---|\n| `mobile-carousel`[^mobile-carousel] | Changes the mobile (below-tablet) interaction from a swipe-off/fly-away card stack to a horizontal sliding carousel track \u2014 slides sit side-by-side at a 16:9 aspect ratio and translate into view (with cloned first/last slides for a seamless loop), instead of the default card literally flying off-screen and rotating. Desktop behavior (click-to-expand list) is unaffected. | Add `mobile-carousel` to the block name, e.g. `Split Aside Grid (mobile-carousel)`. |\n\n[^dark]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^mobile-carousel]: [`60dcb44`](https://github.com/adobecom/milo/commit/60dcb44) \u2014 Ratko Zagorac, 2026-07-16\n\nIn a simpler deployment of this block, `mobile-carousel` is not available \u2014 mobile interaction is always the fly-off card-swipe stack, and `dark` is the only author-facing variation.\n\n## Example\n\n```\n| Split Aside Grid |     |\n| --- | --- |\n| ### Real-time co-editing<br>Work on the same file with your team, live, with no version conflicts. | ![coedit.jpg](coedit.jpg) |\n| ### Cloud-native assets<br>Every asset syncs automatically across your devices.<br>[See supported formats](https://example.com/formats) | ![assets.jpg](assets.jpg) |\n| ### One-click sharing<br>Send a link, not a file \u2014 reviewers see your latest version instantly. | ![share.mp4](https://example.com/share.mp4) |\n```\n\nWhere available, with the mobile carousel variant:\n\n```\n| Split Aside Grid (mobile-carousel) |     |\n| --- | --- |\n| ### Real-time co-editing<br>Work on the same file with your team, live, with no version conflicts. | ![coedit.jpg](coedit.jpg) |\n| ### Cloud-native assets<br>Every asset syncs automatically across your devices. | ![assets.jpg](assets.jpg) |\n```\n\n## Notes\n\n- The first row's slide is active by default (front of the stack, expanded on desktop).\n- If a row has no media cell, that slide is filtered out of the interactive stack; if **no** rows have media, the whole block silently does nothing \u2014 always include a media item in every row.\n- The mobile interaction is swipe-driven (pointer drag) with an aria-live region announcing \"Slide X of Y\" for screen-reader users; desktop is a plain click-to-expand accordion-style list \u2014 no author configuration changes this beyond the `mobile-carousel` variant where available, it's otherwise purely responsive.\n- Supports Milo's `mobile-viewport`/`tablet-viewport`/`desktop-viewport` content-override rows (same viewport-delimiter pattern as [Rich Content](./rich-content.md), including the 768px/1280px breakpoint split) if you need to vary slide content per breakpoint.\n- Where `mobile-carousel` is available, the code clones the first and last slide to create a seamless-loop illusion when swiping past the ends \u2014 this is automatic and requires no extra authoring.\n- Video gotcha: pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the video to autoplay only while scrolled into view (instead of finishing during page load), the video link's hash needs both `autoplay` and `viewportplay`, e.g. `#autoplay|viewportplay`. Using `#autoplay` alone plays the video immediately on page load \u2014 by the time it's visible it has already finished, so visitors just see its frozen last frame.\n"}, {"slug": "tabs", "title": "Tabs", "summary": "An accessible tab-switcher that shows/hides whole page Sections as tab panels, letting authors offer alternate views (plan tiers, product categories) without leaving the page. Styled by default as a pill bar; also supports `radio`, `quiet`, and `dark` treatments. Variations: `center`, `right`, `background-transparent`, `staggered-intro-merch-cards`, `radio`, `quiet`, `dark`. Gotcha: a Section only becomes a tab panel if its Section Metadata `tab` value matches a tab label exactly \u2014 a mismatch silently drops it.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 982, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868251.0152342, "techSpecUrl": null, "html": "<h1>Tabs</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> An accessible tab-switcher that shows/hides whole page Sections as tab panels, letting authors offer alternate views (plan tiers, product categories) without leaving the page. Styled by default as a pill bar; also supports <code>radio</code>, <code>quiet</code>, and <code>dark</code> treatments. Variations: <code>center</code>, <code>right</code>, <code>background-transparent</code>, <code>staggered-intro-merch-cards</code>, <code>radio</code>, <code>quiet</code>, <code>dark</code>. Gotcha: a Section only becomes a tab panel if its Section Metadata <code>tab</code> value matches a tab label exactly \u2014 a mismatch silently drops it.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p><strong>Part 1 \u2014 the Tabs block (the tab list + settings):</strong></p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Row 1 (tab list)</td>\n<td>A single cell containing a bulleted list. Each list item's text becomes one tab's label (e.g. <code>Overview</code>, <code>Plans &amp; Pricing</code>). Optionally, add a paragraph <em>before</em> the list: with the <code>radio</code> variation this becomes a visible label next to the tab group; with any other variation it's dropped \u2014 use the <code>pretext</code> config row below instead for an invisible screen-reader label in that case.</td>\n</tr>\n<tr>\n<td>Any additional rows</td>\n<td>Each is a <code>key | value</code> config pair (removed from the DOM at build time, never visible). Recognized keys: <code>id</code> \u2014 a custom string ID for this tab set (needed only if the page has more than one Tabs block, or you want a query-string deep link, e.g. <code>?plans=business</code>); <code>remember</code> \u2014 set to <code>on</code> to remember the visitor's last-selected tab (via session storage) and restore it on return; <code>active-tab</code> \u2014 the label text of the tab that should be selected by default instead of the first one; <code>pretext</code> \u2014 an accessible label (<code>aria-label</code>) read by screen readers for the tab list, e.g. <code>Choose a plan</code>.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Part 2 \u2014 each tab's content (a separate Section, placed anywhere after the Tabs block):</strong></p>\n<p>Add a <strong><a href=\"./section-metadata.md\">Section Metadata</a></strong> block at the top of the Section you want to appear inside a tab, with these rows:</p>\n<table>\n<thead>\n<tr>\n<th>Section Metadata row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>tab</code></td>\n<td>The tab's label (lowercased, spaces\u2192hyphens automatically), e.g. <code>plans-pricing</code> for a tab labeled \"Plans &amp; Pricing\". If the Tabs block has a custom <code>id</code> config row, write this as <code>id,tab-label</code> instead (comma-separated), e.g. <code>plans,business</code>.</td>\n</tr>\n<tr>\n<td><code>tab-background</code> (optional)</td>\n<td>A color value applied to that tab button's background only while it is selected.</td>\n</tr>\n<tr>\n<td><code>link</code> (optional)</td>\n<td>A URL \u2014 if set, clicking this tab navigates to that URL instead of switching panels in place (used to make one \"tab\" of a shared tab bar actually live on a different page).</td>\n</tr>\n<tr>\n<td><code>deeplink</code> (optional)</td>\n<td>A custom query-string value (e.g. <code>edu</code>) \u2014 visiting the page with <code>?&lt;id&gt;=&lt;deeplink-value&gt;</code> auto-selects this tab on load.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<p>Add these as modifier text on the Tabs block name, e.g. <code>Tabs (center, background-transparent)</code>:</p>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>center</code><sup class=\"fn-ref\" data-fn=\"center\" title=\"Click for details\">1</sup></td>\n<td>Centers the tab pill list instead of left-aligning it (desktop only).</td>\n<td>Add <code>center</code>.</td>\n</tr>\n<tr>\n<td><code>right</code><sup class=\"fn-ref\" data-fn=\"right\" title=\"Click for details\">2</sup></td>\n<td>Right-aligns the tab pill list (desktop only).</td>\n<td>Add <code>right</code>.</td>\n</tr>\n<tr>\n<td><code>background-transparent</code><sup class=\"fn-ref\" data-fn=\"background-transparent\" title=\"Click for details\">3</sup></td>\n<td>Removes the tab bar's pill background so it sits directly on the section background.</td>\n<td>Add <code>background-transparent</code>.</td>\n</tr>\n<tr>\n<td><code>staggered-intro-merch-cards</code><sup class=\"fn-ref\" data-fn=\"staggered-intro-merch-cards\" title=\"Click for details\">4</sup></td>\n<td>When the active tab panel contains merch cards, animates them in with a staggered fade/slide as the tab becomes active.</td>\n<td>Add <code>staggered-intro-merch-cards</code>.</td>\n</tr>\n<tr>\n<td><code>radio</code><sup class=\"fn-ref\" data-fn=\"radio\" title=\"Click for details\">5</sup></td>\n<td>Restyles the tab list as a row of radio buttons instead of a pill bar (announced to screen readers as a radio group, not a set of tabs). Pair with the optional leading paragraph above for a visible label next to the group.</td>\n<td>Add <code>radio</code>.</td>\n</tr>\n<tr>\n<td><code>quiet</code><sup class=\"fn-ref\" data-fn=\"quiet\" title=\"Click for details\">6</sup></td>\n<td>Restyles the tab list as plain text labels with an underline on the active tab, removing the pill background entirely.</td>\n<td>Add <code>quiet</code>.</td>\n</tr>\n<tr>\n<td><code>dark</code><sup class=\"fn-ref\" data-fn=\"dark\" title=\"Click for details\">7</sup></td>\n<td>Switches the tab bar's color treatment for a dark background. Combines with either the default pill style or <code>radio</code>.</td>\n<td>Add <code>dark</code> (e.g. <code>Tabs (radio, dark)</code>).</td>\n</tr>\n</tbody>\n</table>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Tabs</th></tr>\n<tr><td><p>\u2022 Overview</p>\n<p>\u2022 Plans &amp; Pricing</p>\n<p>\u2022 FAQ</p></td><td></td></tr>\n<tr><td>pretext</td><td>Choose a section</td></tr>\n<tr><td>remember</td><td>on</td></tr>\n</table>\n\n<p>Then, further down the page, the \"Plans &amp; Pricing\" tab's content section starts with:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Section Metadata</th></tr>\n<tr><td>tab</td><td>plans-pricing</td></tr>\n<tr><td>tab-background</td><td><span class=\"color-swatch\" style=\"background:#FA0F00\"></span><code>#FA0F00</code></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>If you don't set a custom <code>id</code> on the Tabs block, it's auto-numbered by its position among all Tabs blocks in the document (1st Tabs block on the page, 2nd, etc.). With only one Tabs block this is fine; with multiple Tabs blocks on the same page, give each an explicit <code>id</code> and use the <code>id,tab-label</code> format in every associated Section Metadata <code>tab</code> row \u2014 otherwise sections can attach to the wrong tab set.</li>\n<li>A Section only becomes a tab panel if its <code>tab</code> value successfully matches a tab button generated from the Tabs list \u2014 a typo in either the list item text or the <code>tab</code> value (after lowercasing/hyphenating) means that section is silently left out of any tab and stays in normal page flow.</li>\n<li>Keyboard users can move between tabs with Left/Right arrow keys once a tab is focused; this is automatic, no authoring needed.</li>\n<li>This block is unrelated to the <a href=\"./section-metadata.md\">Section Metadata</a> block's own key handling \u2014 the <code>tab</code>, <code>tab-background</code>, <code>link</code>, and <code>deeplink</code> keys are read directly by Tabs' own code, not by Section Metadata's decorate logic.</li>\n<li><code>radio</code> and <code>quiet</code> are visual restyles only \u2014 the same authoring table (bulleted list + config rows) and the same Section Metadata <code>tab</code> linking work identically regardless of which style variation you choose.</li>\n</ul>", "footnotes": {"center": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "right": {"num": 2, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "background-transparent": {"num": 3, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "staggered-intro-merch-cards": {"num": 4, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "radio": {"num": 5, "html": "<a href=\"https://github.com/adobecom/milo/pull/6340\">#6340</a> \u2014 Rares Munteanu, 2026-08-03"}, "quiet": {"num": 6, "html": "<a href=\"https://github.com/adobecom/milo/pull/6340\">#6340</a> \u2014 Rares Munteanu, 2026-08-03"}, "dark": {"num": 7, "html": "<a href=\"https://github.com/adobecom/milo/pull/6340\">#6340</a> \u2014 Rares Munteanu, 2026-08-03"}}, "raw": "# Tabs\n\n> **Quick summary:** An accessible tab-switcher that shows/hides whole page Sections as tab panels, letting authors offer alternate views (plan tiers, product categories) without leaving the page. Styled by default as a pill bar; also supports `radio`, `quiet`, and `dark` treatments. Variations: `center`, `right`, `background-transparent`, `staggered-intro-merch-cards`, `radio`, `quiet`, `dark`. Gotcha: a Section only becomes a tab panel if its Section Metadata `tab` value matches a tab label exactly \u2014 a mismatch silently drops it.\n\n## Authoring instructions\n\n**Part 1 \u2014 the Tabs block (the tab list + settings):**\n\n| Row | Content |\n|---|---|\n| Row 1 (tab list) | A single cell containing a bulleted list. Each list item's text becomes one tab's label (e.g. `Overview`, `Plans & Pricing`). Optionally, add a paragraph *before* the list: with the `radio` variation this becomes a visible label next to the tab group; with any other variation it's dropped \u2014 use the `pretext` config row below instead for an invisible screen-reader label in that case. |\n| Any additional rows | Each is a `key | value` config pair (removed from the DOM at build time, never visible). Recognized keys: `id` \u2014 a custom string ID for this tab set (needed only if the page has more than one Tabs block, or you want a query-string deep link, e.g. `?plans=business`); `remember` \u2014 set to `on` to remember the visitor's last-selected tab (via session storage) and restore it on return; `active-tab` \u2014 the label text of the tab that should be selected by default instead of the first one; `pretext` \u2014 an accessible label (`aria-label`) read by screen readers for the tab list, e.g. `Choose a plan`. |\n\n**Part 2 \u2014 each tab's content (a separate Section, placed anywhere after the Tabs block):**\n\nAdd a **[Section Metadata](./section-metadata.md)** block at the top of the Section you want to appear inside a tab, with these rows:\n\n| Section Metadata row | Content |\n|---|---|\n| `tab` | The tab's label (lowercased, spaces\u2192hyphens automatically), e.g. `plans-pricing` for a tab labeled \"Plans & Pricing\". If the Tabs block has a custom `id` config row, write this as `id,tab-label` instead (comma-separated), e.g. `plans,business`. |\n| `tab-background` (optional) | A color value applied to that tab button's background only while it is selected. |\n| `link` (optional) | A URL \u2014 if set, clicking this tab navigates to that URL instead of switching panels in place (used to make one \"tab\" of a shared tab bar actually live on a different page). |\n| `deeplink` (optional) | A custom query-string value (e.g. `edu`) \u2014 visiting the page with `?<id>=<deeplink-value>` auto-selects this tab on load. |\n\n## Variations\n\nAdd these as modifier text on the Tabs block name, e.g. `Tabs (center, background-transparent)`:\n\n| Variation | Effect | How to author |\n|---|---|---|\n| `center`[^center] | Centers the tab pill list instead of left-aligning it (desktop only). | Add `center`. |\n| `right`[^right] | Right-aligns the tab pill list (desktop only). | Add `right`. |\n| `background-transparent`[^background-transparent] | Removes the tab bar's pill background so it sits directly on the section background. | Add `background-transparent`. |\n| `staggered-intro-merch-cards`[^staggered-intro-merch-cards] | When the active tab panel contains merch cards, animates them in with a staggered fade/slide as the tab becomes active. | Add `staggered-intro-merch-cards`. |\n| `radio`[^radio] | Restyles the tab list as a row of radio buttons instead of a pill bar (announced to screen readers as a radio group, not a set of tabs). Pair with the optional leading paragraph above for a visible label next to the group. | Add `radio`. |\n| `quiet`[^quiet] | Restyles the tab list as plain text labels with an underline on the active tab, removing the pill background entirely. | Add `quiet`. |\n| `dark`[^dark] | Switches the tab bar's color treatment for a dark background. Combines with either the default pill style or `radio`. | Add `dark` (e.g. `Tabs (radio, dark)`). |\n\n[^center]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^right]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^background-transparent]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^staggered-intro-merch-cards]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^radio]: [#6340](https://github.com/adobecom/milo/pull/6340) \u2014 Rares Munteanu, 2026-08-03\n[^quiet]: [#6340](https://github.com/adobecom/milo/pull/6340) \u2014 Rares Munteanu, 2026-08-03\n[^dark]: [#6340](https://github.com/adobecom/milo/pull/6340) \u2014 Rares Munteanu, 2026-08-03\n\n## Example\n\n```\n| Tabs |     |\n| --- | --- |\n| \u2022 Overview<br>\u2022 Plans & Pricing<br>\u2022 FAQ |\n| pretext | Choose a section |\n| remember | on |\n```\n\nThen, further down the page, the \"Plans & Pricing\" tab's content section starts with:\n\n```\n| Section Metadata |     |\n| --- | --- |\n| tab | plans-pricing |\n| tab-background | #FA0F00 |\n```\n\n## Notes\n\n- If you don't set a custom `id` on the Tabs block, it's auto-numbered by its position among all Tabs blocks in the document (1st Tabs block on the page, 2nd, etc.). With only one Tabs block this is fine; with multiple Tabs blocks on the same page, give each an explicit `id` and use the `id,tab-label` format in every associated Section Metadata `tab` row \u2014 otherwise sections can attach to the wrong tab set.\n- A Section only becomes a tab panel if its `tab` value successfully matches a tab button generated from the Tabs list \u2014 a typo in either the list item text or the `tab` value (after lowercasing/hyphenating) means that section is silently left out of any tab and stays in normal page flow.\n- Keyboard users can move between tabs with Left/Right arrow keys once a tab is focused; this is automatic, no authoring needed.\n- This block is unrelated to the [Section Metadata](./section-metadata.md) block's own key handling \u2014 the `tab`, `tab-background`, `link`, and `deeplink` keys are read directly by Tabs' own code, not by Section Metadata's decorate logic.\n- `radio` and `quiet` are visual restyles only \u2014 the same authoring table (bulleted list + config rows) and the same Section Metadata `tab` linking work identically regardless of which style variation you choose.\n"}, {"slug": "tour", "title": "Tour", "summary": "A scrollable, numbered product-tour layout meant to run inside a modal dialog \u2014 a header (eyebrow + title), 2-3 image-plus-description steps, and a sticky footer promo/CTA, with a drag-to-dismiss handle on touch devices. Used for \"what's new\" or guided-feature walkthroughs launched from a modal link. Authored with exactly two single-column rows (header and footer) plus one two-column row per step; rows are classified purely by cell count, not by position, so an extra/missing cell can misclassify a header or footer row as a step. Only variation: `dark` (not available in every deployment). Gotcha: this block is designed to live inside a modal link's content, not as a standalone in-page block.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 789, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868254.8950133, "techSpecUrl": null, "html": "<h1>Tour</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A scrollable, numbered product-tour layout meant to run inside a modal dialog \u2014 a header (eyebrow + title), 2-3 image-plus-description steps, and a sticky footer promo/CTA, with a drag-to-dismiss handle on touch devices. Used for \"what's new\" or guided-feature walkthroughs launched from a modal link. Authored with exactly two single-column rows (header and footer) plus one two-column row per step; rows are classified purely by cell count, not by position, so an extra/missing cell can misclassify a header or footer row as a step. Only variation: <code>dark</code> (not available in every deployment). Gotcha: this block is designed to live inside a modal link's content, not as a standalone in-page block.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored with <strong>exactly two single-column rows</strong> (a header and a footer) plus <strong>one two-column row per tour step</strong>, in any order \u2014 the code sorts them by column count, then assigns the first single-column row it finds as the header and the second as the footer:</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>First single-cell row (header)</td>\n<td>One cell containing an optional short paragraph (becomes the eyebrow line, e.g. <code>New in Creative Cloud</code>) followed by a Heading 3 (becomes the tour's title, e.g. <code>### See what's new</code>).</td>\n</tr>\n<tr>\n<td>Two-cell rows (tour steps \u2014 author 1 to 3 of these)</td>\n<td><strong>Cell 1</strong>: body paragraph(s) describing the step. <strong>Cell 2</strong>: one image (or more than one \u2014 extra images after the first are placed in a centered secondary row below the main image). Steps are ordered automatically by their position in the document; as of 2026-07-28<sup class=\"fn-ref\" data-fn=\"no-count\" title=\"Click for details\">2</sup> a visible step counter (e.g. <code>( 1/3 )</code>) is no longer shown to visitors.</td>\n</tr>\n<tr>\n<td>Second single-cell row (footer)</td>\n<td>One cell containing exactly two paragraphs: <strong>first paragraph</strong> = a small promo image/icon, <strong>second paragraph</strong> = the call-to-action link. The link text supports the pipe syntax <code>Button text\\|Accessible label</code> to set a different <code>aria-label</code> than the visible text; if you don't include a link and just type text, that text becomes the CTA label with a non-functional <code>#</code> href.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>dark</code><sup class=\"fn-ref\" data-fn=\"dark\" title=\"Click for details\">1</sup></td>\n<td>Switches the sticky footer's fade gradient (and the touch-device grab handle's color scheme) from a light/white fade to a dark/knockout fade \u2014 use when the tour's modal content sits on a dark background.</td>\n<td>Add <code>dark</code> to the block name, e.g. <code>Tour (dark)</code>.</td>\n</tr>\n</tbody>\n</table>\n<p>Some deployments of this block do not include the <code>dark</code> variant \u2014 check whether it's supported in your environment before relying on it.</p>\n<p>The only other structural choice is how many two-column step rows you include (the CSS has specific spacing tuned for 3 steps via <code>.row-1</code>/<code>.row-2</code>/<code>.row-3</code>, so more than 3 steps will still render but may not be visually tuned).</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Tour (dark)</th></tr>\n<tr><td><p>New in Creative Cloud</p>\n<h3>Discover the Creative Cloud desktop app</h3></td><td></td></tr>\n<tr><td>Manage every app from one place \u2014 install, update, and launch without leaving your desktop.</td><td><img alt=\"step1.jpg\" src=\"step1.jpg\" /></td></tr>\n<tr><td>Sync your files everywhere they're on every device the moment you save.</td><td><img alt=\"step2.jpg\" src=\"step2.jpg\" /></td></tr>\n<tr><td>Real-time collaboration lets your whole team co-edit the same file, live.</td><td><img alt=\"step3.jpg\" src=\"step3.jpg\" /></td></tr>\n<tr><td><p><img alt=\"cc-icon.png\" src=\"cc-icon.png\" /></p>\n<p><a href=\"https://example.com/start\">Get started|Get started with Creative Cloud</a></p></td><td></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>The block is designed to render inside a Milo modal dialog (its CSS specifically targets <code>.dialog-modal:has(.tour)</code> for sizing, slide-in animation, and a swipe-down-to-dismiss handle on touch devices) \u2014 author it as the content of a modal link elsewhere on the page, not as a standalone in-page block.</li>\n<li>Rows are classified purely by cell count: if you accidentally create a two-cell header or footer row (e.g. an extra empty second cell), it will be misclassified as a tour step instead \u2014 keep header and footer rows to exactly one cell.</li>\n<li>If a document has more or fewer than two single-column rows, the \"footer\" (or even the \"header\") may end up undefined and simply not render \u2014 always include exactly one header row and one footer row.</li>\n<li>Swipe-to-dismiss and the slide-in/out animation are automatically skipped for users with <code>prefers-reduced-motion: reduce</code>.</li>\n<li>In some deployments, the modal also closes when a visitor clicks outside the tour content, and the modal's close (\u00d7) button stays visually pinned in place (adjusting its position in sync with scroll) as the tour content scrolls; initial focus moves to the header eyebrow when the tour opens. None of this changes what authors put in the table, but it does affect screen-reader/focus behavior \u2014 worth knowing when testing a tour block if this UX isn't what you observe.</li>\n</ul>", "footnotes": {"dark": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/commit/26685af\"><code>26685af</code></a> \u2014 Dev Ashish Sardana, 2026-07-15"}, "no-count": {"num": 2, "html": "<a href=\"https://github.com/adobecom/milo/pull/6356\">#6356</a> \u2014 Dev Ashish Saradhana, 2026-07-28"}}, "raw": "# Tour\n\n> **Quick summary:** A scrollable, numbered product-tour layout meant to run inside a modal dialog \u2014 a header (eyebrow + title), 2-3 image-plus-description steps, and a sticky footer promo/CTA, with a drag-to-dismiss handle on touch devices. Used for \"what's new\" or guided-feature walkthroughs launched from a modal link. Authored with exactly two single-column rows (header and footer) plus one two-column row per step; rows are classified purely by cell count, not by position, so an extra/missing cell can misclassify a header or footer row as a step. Only variation: `dark` (not available in every deployment). Gotcha: this block is designed to live inside a modal link's content, not as a standalone in-page block.\n\n## Authoring instructions\n\nThe block is authored with **exactly two single-column rows** (a header and a footer) plus **one two-column row per tour step**, in any order \u2014 the code sorts them by column count, then assigns the first single-column row it finds as the header and the second as the footer:\n\n| Row | Content |\n|---|---|\n| First single-cell row (header) | One cell containing an optional short paragraph (becomes the eyebrow line, e.g. `New in Creative Cloud`) followed by a Heading 3 (becomes the tour's title, e.g. `### See what's new`). |\n| Two-cell rows (tour steps \u2014 author 1 to 3 of these) | **Cell 1**: body paragraph(s) describing the step. **Cell 2**: one image (or more than one \u2014 extra images after the first are placed in a centered secondary row below the main image). Steps are ordered automatically by their position in the document; as of 2026-07-28[^no-count] a visible step counter (e.g. `( 1/3 )`) is no longer shown to visitors. |\n| Second single-cell row (footer) | One cell containing exactly two paragraphs: **first paragraph** = a small promo image/icon, **second paragraph** = the call-to-action link. The link text supports the pipe syntax `Button text\\|Accessible label` to set a different `aria-label` than the visible text; if you don't include a link and just type text, that text becomes the CTA label with a non-functional `#` href. |\n\n## Variations\n\n| Variation | Effect | How to author |\n|---|---|---|\n| `dark`[^dark] | Switches the sticky footer's fade gradient (and the touch-device grab handle's color scheme) from a light/white fade to a dark/knockout fade \u2014 use when the tour's modal content sits on a dark background. | Add `dark` to the block name, e.g. `Tour (dark)`. |\n\n[^dark]: [`26685af`](https://github.com/adobecom/milo/commit/26685af) \u2014 Dev Ashish Sardana, 2026-07-15\n[^no-count]: [#6356](https://github.com/adobecom/milo/pull/6356) \u2014 Dev Ashish Saradhana, 2026-07-28\n\nSome deployments of this block do not include the `dark` variant \u2014 check whether it's supported in your environment before relying on it.\n\nThe only other structural choice is how many two-column step rows you include (the CSS has specific spacing tuned for 3 steps via `.row-1`/`.row-2`/`.row-3`, so more than 3 steps will still render but may not be visually tuned).\n\n## Example\n\n```\n| Tour (dark) |\n| --- |\n| New in Creative Cloud<br>### Discover the Creative Cloud desktop app |\n| Manage every app from one place \u2014 install, update, and launch without leaving your desktop. | ![step1.jpg](step1.jpg) |\n| Sync your files everywhere they're on every device the moment you save. | ![step2.jpg](step2.jpg) |\n| Real-time collaboration lets your whole team co-edit the same file, live. | ![step3.jpg](step3.jpg) |\n| ![cc-icon.png](cc-icon.png)<br>[Get started\\|Get started with Creative Cloud](https://example.com/start) |\n```\n\n## Notes\n\n- The block is designed to render inside a Milo modal dialog (its CSS specifically targets `.dialog-modal:has(.tour)` for sizing, slide-in animation, and a swipe-down-to-dismiss handle on touch devices) \u2014 author it as the content of a modal link elsewhere on the page, not as a standalone in-page block.\n- Rows are classified purely by cell count: if you accidentally create a two-cell header or footer row (e.g. an extra empty second cell), it will be misclassified as a tour step instead \u2014 keep header and footer rows to exactly one cell.\n- If a document has more or fewer than two single-column rows, the \"footer\" (or even the \"header\") may end up undefined and simply not render \u2014 always include exactly one header row and one footer row.\n- Swipe-to-dismiss and the slide-in/out animation are automatically skipped for users with `prefers-reduced-motion: reduce`.\n- In some deployments, the modal also closes when a visitor clicks outside the tour content, and the modal's close (\u00d7) button stays visually pinned in place (adjusting its position in sync with scroll) as the tour content scrolls; initial focus moves to the header eyebrow when the tour opens. None of this changes what authors put in the table, but it does affect screen-reader/focus behavior \u2014 worth knowing when testing a tour block if this UX isn't what you observe.\n"}, {"slug": "visually-hidden", "title": "Visually Hidden", "summary": "A CSS-onl
