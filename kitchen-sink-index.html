ur-up`/`six-up` classes mentioned above are applied automatically by this block's own code to its own internal item grid \u2014 they're unrelated to [Section Metadata](./section-metadata.md)'s `product-grid` + `-up` multi-block layout system (which arranges separate blocks side by side in a section). Adding `product-grid, two-up` to this block's Section Metadata does not change how many items per row News shows; only the item count does.\n"}, {"slug": "offer-hero", "title": "Offer Hero", "summary": "A full-viewport scroll-driven hero \u2014 headline/CTA above four preview cards that pile up, fan out, and settle into a 2-up grid as the visitor scrolls. Use it to open a product/offer landing page for a cinematic reveal of feature highlights before the visitor reaches the rest of the page. Authored as a fixed row sequence: hero content (row 1), an optional pinned \"What's included\" label (row 2), then up to 4 feature cards (rows 3\u20136, text + media each). No author-facing variations; reduced-motion fallback and layout are automatic. Note: this block's own `-up` grid classes are unrelated to Section Metadata's `product-grid` layout system.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 986, "lastUpdated": "Aug 6, 2026", "lastUpdatedTs": 1786042904.6636038, "techSpecUrl": null, "html": "<h1>Offer Hero</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A full-viewport scroll-driven hero \u2014 headline/CTA above four preview cards that pile up, fan out, and settle into a 2-up grid as the visitor scrolls. Use it to open a product/offer landing page for a cinematic reveal of feature highlights before the visitor reaches the rest of the page. Authored as a fixed row sequence: hero content (row 1), an optional pinned \"What's included\" label (row 2), then up to 4 feature cards (rows 3\u20136, text + media each). No author-facing variations; reduced-motion fallback and layout are automatic. Note: this block's own <code>-up</code> grid classes are unrelated to Section Metadata's <code>product-grid</code> layout system.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as a sequence of table rows. Row 1 is required; row 2 is optional; the remaining rows are the feature cards (up to 4 for the full experience).</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 \u2014 Hero (1 cell)</td>\n<td>Optional small product icon (an SVG image, either on its own line or inline with the eyebrow text) \u2192 optional eyebrow line (short text directly above the heading, e.g. \"Acrobat Pro\") \u2192 a heading (any level <code>H1</code>\u2013<code>H6</code>; it is automatically promoted to a real <code>&lt;h1&gt;</code> for SEO) \u2192 one or more body paragraphs \u2192 one or more CTA buttons authored with Milo's standard <strong>bold link</strong> (filled button) or <em>italic link</em> (outline button) syntax.</td>\n</tr>\n<tr>\n<td>2 \u2014 \"What's included\" label (1 cell, optional)</td>\n<td>A single heading (e.g. \"What's included\"). This becomes a small label that stays pinned near the top of the viewport while the visitor scrolls through the cards. <strong>If you include this row it must contain exactly one cell</strong> \u2014 anything else is left orphaned in the page instead of being removed.</td>\n</tr>\n<tr>\n<td>3\u20136 \u2014 Feature cards (2 cells each)</td>\n<td><strong>Cell 1 (text):</strong> a heading (any level, rendered small) + one short body paragraph + a plain-text \"Learn more\" link (do <strong>not</strong> bold/italic it \u2014 it must be a plain link so it gets the arrow-chevron treatment instead of becoming a button). <strong>Cell 2 (media):</strong> an image, or a Milo-standard autoplaying video (link to an <code>.mp4</code> with the usual video hash options). The whole card becomes clickable, linking to the \"Learn more\" URL.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<p>This block has no author-facing variation classes. All visual states (piled cards, animation-complete grid, reduced-motion fallback) are computed automatically from scroll position and the visitor's OS motion preference \u2014 there is nothing to add to the block-name cell.</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Offer Hero</th></tr>\n<tr><td><p><img alt=\"\" src=\"/icons/acrobat.svg\" /></p>\n<p>Acrobat Pro</p>\n<h2>Turn any file into a polished PDF</h2>\n<p>Edit, sign, and share documents from anywhere.</p>\n<p><strong><a href=\"https://www.adobe.com/acrobat/free-trial.html\">Try for free</a></strong></p></td></tr>\n</table>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Offer Hero</th></tr>\n<tr><td><h6>What's included</h6></td></tr>\n</table>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Offer Hero</th></tr>\n<tr><td><h6>Edit text and images</h6>\n<p>Fix a typo or swap a photo without leaving your PDF.</p>\n<p><a href=\"https://www.adobe.com/acrobat/edit-pdf.html\">Learn more</a></p></td><td><img alt=\"\" src=\"/media/card-edit.png\" /></td></tr>\n<tr><td><h6>Sign in seconds</h6>\n<p>Collect legally binding e-signatures from any device.</p>\n<p><a href=\"https://www.adobe.com/acrobat/sign.html\">Learn more</a></p></td><td><img alt=\"\" src=\"/media/card-sign.png\" /></td></tr>\n<tr><td><h6>Compress large files</h6>\n<p>Shrink PDFs without losing quality.</p>\n<p><a href=\"https://www.adobe.com/acrobat/compress-pdf.html\">Learn more</a></p></td><td><img alt=\"\" src=\"/media/card-compress.png\" /></td></tr>\n<tr><td><h6>Convert to Word or Excel</h6>\n<p>Turn a PDF into an editable file in one click.</p>\n<p><a href=\"https://www.adobe.com/acrobat/pdf-to-word.html\">Learn more</a></p></td><td><img alt=\"\" src=\"/media/card-convert.png\" /></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>The scroll animation only runs with exactly 4 card rows; fewer cards still render (as a plain grid, no pile/fan animation) but the \"cards pile up\" effect is designed around 4.</li>\n<li>The \"Learn more\" link must be plain text, not wrapped in bold/italic \u2014 those get converted into filled/outline buttons elsewhere in Milo and would break the chevron-link styling this block expects.</li>\n<li>The optional row 2 (\"What's included\") only works with exactly one cell; if you add a second cell by mistake the row is left in the page unprocessed.</li>\n<li>Card media supports video: if reduced motion is on, or the browser lacks scroll-timeline support, any authored video is swapped for its poster image (or removed if no poster is set) \u2014 always give videos a poster image as a safety net.</li>\n<li>Video gotcha (the \"usual video hash options\" above): pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the video to autoplay only while scrolled into view (instead of finishing during page load), the video link's hash needs both <code>autoplay</code> and <code>viewportplay</code>, e.g. <code>#autoplay|viewportplay</code>. <span class=\"autoplay-warn\">Using <code>#autoplay</code> alone plays the video immediately on page load \u2014 by the time the card scrolls into view it has already finished, so visitors just see its frozen last frame.</span></li>\n<li>The animation and pinned-eyebrow behavior are automatically skipped for users with <code>prefers-reduced-motion</code> set, and inert for browsers without scroll-driven animation support (both are handled in code, no authoring needed).</li>\n<li><strong><a href=\"./section-metadata.md\">Section Metadata</a> <code>layout</code>/<code>style</code> interaction:</strong> adding <code>rounded corners bottom</code> (\u2192 class <code>rounded-corners-bottom</code>) to this section's Section Metadata <code>layout</code>/<code>style</code> row rounds the bottom corners of the hero's background. This block's own CSS deliberately suppresses that rounding if the section <em>also</em> carries <code>parallax move up fast</code> or <code>parallax garage door reveal</code> (both part of Milo's shared scroll-transition system) \u2014 combining them would clip the background during the scroll animation, so don't expect rounded corners if either of those is also present.</li>\n<li>In an expanded version of this block, once a card finishes settling into the final grid it's tagged with a class that gives it a visible border in dark-mode sections and makes its tile background transparent; this expanded version also uses a slightly taller card aspect ratio. In a simpler deployment, settled cards get no dark-mode border/transparency treatment and use a slightly shorter card aspect ratio. Either way this is purely visual \u2014 the authoring contract (rows/cells/content) is identical.</li>\n</ul>", "footnotes": {}, "raw": "# Offer Hero\n\n> **Quick summary:** A full-viewport scroll-driven hero \u2014 headline/CTA above four preview cards that pile up, fan out, and settle into a 2-up grid as the visitor scrolls. Use it to open a product/offer landing page for a cinematic reveal of feature highlights before the visitor reaches the rest of the page. Authored as a fixed row sequence: hero content (row 1), an optional pinned \"What's included\" label (row 2), then up to 4 feature cards (rows 3\u20136, text + media each). No author-facing variations; reduced-motion fallback and layout are automatic. Note: this block's own `-up` grid classes are unrelated to Section Metadata's `product-grid` layout system.\n\n## Authoring instructions\n\nThe block is authored as a sequence of table rows. Row 1 is required; row 2 is optional; the remaining rows are the feature cards (up to 4 for the full experience).\n\n| Row | Content |\n| --- | --- |\n| 1 \u2014 Hero (1 cell) | Optional small product icon (an SVG image, either on its own line or inline with the eyebrow text) \u2192 optional eyebrow line (short text directly above the heading, e.g. \"Acrobat Pro\") \u2192 a heading (any level `H1`\u2013`H6`; it is automatically promoted to a real `<h1>` for SEO) \u2192 one or more body paragraphs \u2192 one or more CTA buttons authored with Milo's standard **bold link** (filled button) or *italic link* (outline button) syntax. |\n| 2 \u2014 \"What's included\" label (1 cell, optional) | A single heading (e.g. \"What's included\"). This becomes a small label that stays pinned near the top of the viewport while the visitor scrolls through the cards. **If you include this row it must contain exactly one cell** \u2014 anything else is left orphaned in the page instead of being removed. |\n| 3\u20136 \u2014 Feature cards (2 cells each) | **Cell 1 (text):** a heading (any level, rendered small) + one short body paragraph + a plain-text \"Learn more\" link (do **not** bold/italic it \u2014 it must be a plain link so it gets the arrow-chevron treatment instead of becoming a button). **Cell 2 (media):** an image, or a Milo-standard autoplaying video (link to an `.mp4` with the usual video hash options). The whole card becomes clickable, linking to the \"Learn more\" URL. |\n\n## Variations\n\nThis block has no author-facing variation classes. All visual states (piled cards, animation-complete grid, reduced-motion fallback) are computed automatically from scroll position and the visitor's OS motion preference \u2014 there is nothing to add to the block-name cell.\n\n## Example\n\n```\n| Offer Hero |\n| --- |\n| ![](/icons/acrobat.svg) <br> Acrobat Pro <br> ## Turn any file into a polished PDF <br> Edit, sign, and share documents from anywhere. <br> **[Try for free](https://www.adobe.com/acrobat/free-trial.html)** |\n\n| Offer Hero |\n| --- |\n| ###### What's included |\n\n| Offer Hero |\n| --- |\n| ###### Edit text and images <br> Fix a typo or swap a photo without leaving your PDF. <br> [Learn more](https://www.adobe.com/acrobat/edit-pdf.html) | ![](/media/card-edit.png) |\n| ###### Sign in seconds <br> Collect legally binding e-signatures from any device. <br> [Learn more](https://www.adobe.com/acrobat/sign.html) | ![](/media/card-sign.png) |\n| ###### Compress large files <br> Shrink PDFs without losing quality. <br> [Learn more](https://www.adobe.com/acrobat/compress-pdf.html) | ![](/media/card-compress.png) |\n| ###### Convert to Word or Excel <br> Turn a PDF into an editable file in one click. <br> [Learn more](https://www.adobe.com/acrobat/pdf-to-word.html) | ![](/media/card-convert.png) |\n```\n\n## Notes\n\n- The scroll animation only runs with exactly 4 card rows; fewer cards still render (as a plain grid, no pile/fan animation) but the \"cards pile up\" effect is designed around 4.\n- The \"Learn more\" link must be plain text, not wrapped in bold/italic \u2014 those get converted into filled/outline buttons elsewhere in Milo and would break the chevron-link styling this block expects.\n- The optional row 2 (\"What's included\") only works with exactly one cell; if you add a second cell by mistake the row is left in the page unprocessed.\n- Card media supports video: if reduced motion is on, or the browser lacks scroll-timeline support, any authored video is swapped for its poster image (or removed if no poster is set) \u2014 always give videos a poster image as a safety net.\n- Video gotcha (the \"usual video hash options\" above): pair the video link with its poster image as two adjacent cells/lines \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the video to autoplay only while scrolled into view (instead of finishing during page load), the video link's hash needs both `autoplay` and `viewportplay`, e.g. `#autoplay|viewportplay`. Using `#autoplay` alone plays the video immediately on page load \u2014 by the time the card scrolls into view it has already finished, so visitors just see its frozen last frame.\n- The animation and pinned-eyebrow behavior are automatically skipped for users with `prefers-reduced-motion` set, and inert for browsers without scroll-driven animation support (both are handled in code, no authoring needed).\n- **[Section Metadata](./section-metadata.md) `layout`/`style` interaction:** adding `rounded corners bottom` (\u2192 class `rounded-corners-bottom`) to this section's Section Metadata `layout`/`style` row rounds the bottom corners of the hero's background. This block's own CSS deliberately suppresses that rounding if the section *also* carries `parallax move up fast` or `parallax garage door reveal` (both part of Milo's shared scroll-transition system) \u2014 combining them would clip the background during the scroll animation, so don't expect rounded corners if either of those is also present.\n- In an expanded version of this block, once a card finishes settling into the final grid it's tagged with a class that gives it a visible border in dark-mode sections and makes its tile background transparent; this expanded version also uses a slightly taller card aspect ratio. In a simpler deployment, settled cards get no dark-mode border/transparency treatment and use a slightly shorter card aspect ratio. Either way this is purely visual \u2014 the authoring contract (rows/cells/content) is identical.\n"}, {"slug": "pdf-space", "title": "PDF Space", "summary": "A large scroll-driven hero \u2014 eight preview cards fan out along an arc, peel onto a grid, then glide into an Acrobat app mockup while the headline/CTA slide in. Use it as a showcase hero for a PDF/Acrobat-style product page needing a long, cinematic scroll sequence rather than a static hero. Authored as exactly 6 fixed rows in strict order (two 4-cell card rows, marketing text, title, 3-cell mockup images, CTA); row order and column counts are rigid, and misauthoring silently misassigns content rather than erroring. No author-facing variations; falls back to a static layout automatically for reduced-motion visitors.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 745, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868200.1336408, "techSpecUrl": null, "html": "<h1>PDF Space</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A large scroll-driven hero \u2014 eight preview cards fan out along an arc, peel onto a grid, then glide into an Acrobat app mockup while the headline/CTA slide in. Use it as a showcase hero for a PDF/Acrobat-style product page needing a long, cinematic scroll sequence rather than a static hero. Authored as exactly 6 fixed rows in strict order (two 4-cell card rows, marketing text, title, 3-cell mockup images, CTA); row order and column counts are rigid, and misauthoring silently misassigns content rather than erroring. No author-facing variations; falls back to a static layout automatically for reduced-motion visitors.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block's parsing code (<code>parseAuthoredContent</code>) reads <strong>exactly 6 rows</strong>, in this fixed order. Row order matters \u2014 this is not a flexible layout.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Columns</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 \u2014 Card grid, row 0</td>\n<td>4 cells</td>\n<td>One cell per card (top row of the authored 2\u00d74 grid). Each cell: an image (<code>&lt;picture&gt;</code>/<code>&lt;img&gt;</code>) plus a short label/caption as text. <strong>Set the image's <code>width</code> and <code>height</code> attributes</strong> \u2014 the code reads them to compute each card's aspect ratio; if omitted it silently assumes 192\u00d7230.</td>\n</tr>\n<tr>\n<td>2 \u2014 Card grid, row 1</td>\n<td>4 cells</td>\n<td>Same format as row 1. These 4 cards are <strong>hidden on mobile</strong> (only the first row's 4 cards show, reflowed into a 2\u00d72 mobile grid).</td>\n</tr>\n<tr>\n<td>3 \u2014 Marketing text block</td>\n<td>1 cell</td>\n<td>A heading + supporting paragraph (and optionally a link) shown as the copy that pans in once the cards settle onto the grid.</td>\n</tr>\n<tr>\n<td>4 \u2014 Title</td>\n<td>1 cell</td>\n<td>The main headline (<code>&lt;h2&gt;</code>\u2013<code>&lt;h6&gt;</code>) with optional subcopy paragraph, shown near the Acrobat mockup at the end of the sequence.</td>\n</tr>\n<tr>\n<td>5 \u2014 Mockup images</td>\n<td>3 cells</td>\n<td>Cell 1: mobile mockup image. Cell 2: desktop mockup (app window) image. Cell 3: desktop side-panel image shown docked to the mockup. All as <code>&lt;picture&gt;</code>.</td>\n</tr>\n<tr>\n<td>6 \u2014 CTA</td>\n<td>1 cell</td>\n<td>A single call-to-action link, shown next to the mockup at the end of the sequence.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<p>This block has no author-facing variation classes to add to the block-name cell. The only alternate state \u2014 a static, non-scroll-animated layout showing the settled grid + slotted mockup end-state \u2014 is applied automatically for visitors with <code>prefers-reduced-motion</code> enabled; there is nothing an author authors to trigger it.</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"4\">PDF Space</th></tr>\n<tr><td><img alt=\"\" src=\"/media/card-edit.png\" /> Edit text</td><td><img alt=\"\" src=\"/media/card-sign.png\" /> Sign documents</td><td><img alt=\"\" src=\"/media/card-share.png\" /> Share securely</td><td><img alt=\"\" src=\"/media/card-export.png\" /> Export to Word</td></tr>\n</table>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"4\">PDF Space</th></tr>\n<tr><td><img alt=\"\" src=\"/media/card-scan.png\" /> Scan to PDF</td><td><img alt=\"\" src=\"/media/card-compress.png\" /> Compress files</td><td><img alt=\"\" src=\"/media/card-merge.png\" /> Merge files</td><td><img alt=\"\" src=\"/media/card-protect.png\" /> Protect with a password</td></tr>\n</table>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">PDF Space</th></tr>\n<tr><td><h2>Every tool you need for PDF</h2>\n<p>From editing to e-signatures, do it all in one app.</p></td></tr>\n</table>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">PDF Space</th></tr>\n<tr><td><h2>Meet Acrobat</h2>\n<p>The all-in-one PDF and e-sign solution.</p></td></tr>\n</table>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"3\">PDF Space</th></tr>\n<tr><td><img alt=\"\" src=\"/media/mockup-mobile.png\" /></td><td><img alt=\"\" src=\"/media/mockup-desktop.png\" /></td><td><img alt=\"\" src=\"/media/mockup-panel.png\" /></td></tr>\n</table>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">PDF Space</th></tr>\n<tr><td><a href=\"https://www.adobe.com/acrobat/free-trial.html\">Try Acrobat for free</a></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>Row order and column count are strict: the code destructures the 6 rows positionally (<code>[imageRow1, imageRow2, textRow, titleRow, mockupRow, ctaRow]</code>) with no validation, so an extra/missing row or a mockup row with fewer than 3 cells will silently misassign content rather than error.</li>\n<li>Always set <code>width</code> and <code>height</code> on the 8 card images \u2014 they're the only source of each card's aspect ratio; getting them wrong distorts the card during the animation.</li>\n<li>This block is very tall (650vh) and pins to the viewport while scrolling \u2014 it's meant to be used once per page as a hero, not repeated.</li>\n<li>All decorative animation elements (mockup chrome, dot-grid canvas, Adobe logo flourish, the animated card clones) are marked <code>aria-hidden</code> in the code, so screen reader/keyboard users only ever encounter the real authored content (cards' text, marketing copy, title, CTA) \u2014 authors don't need to do anything extra for this.</li>\n<li>The full engineering-level tuning reference (phase timings, arc geometry, z-index layering, etc.) lives in <code>libs/mep/ace1205/pdf-space/README.md</code> \u2014 that's for developers adjusting the animation feel, not for content authors.</li>\n</ul>", "footnotes": {}, "raw": "# PDF Space\n\n> **Quick summary:** A large scroll-driven hero \u2014 eight preview cards fan out along an arc, peel onto a grid, then glide into an Acrobat app mockup while the headline/CTA slide in. Use it as a showcase hero for a PDF/Acrobat-style product page needing a long, cinematic scroll sequence rather than a static hero. Authored as exactly 6 fixed rows in strict order (two 4-cell card rows, marketing text, title, 3-cell mockup images, CTA); row order and column counts are rigid, and misauthoring silently misassigns content rather than erroring. No author-facing variations; falls back to a static layout automatically for reduced-motion visitors.\n\n## Authoring instructions\n\nThe block's parsing code (`parseAuthoredContent`) reads **exactly 6 rows**, in this fixed order. Row order matters \u2014 this is not a flexible layout.\n\n| Row | Columns | Content |\n| --- | --- | --- |\n| 1 \u2014 Card grid, row 0 | 4 cells | One cell per card (top row of the authored 2\u00d74 grid). Each cell: an image (`<picture>`/`<img>`) plus a short label/caption as text. **Set the image's `width` and `height` attributes** \u2014 the code reads them to compute each card's aspect ratio; if omitted it silently assumes 192\u00d7230. |\n| 2 \u2014 Card grid, row 1 | 4 cells | Same format as row 1. These 4 cards are **hidden on mobile** (only the first row's 4 cards show, reflowed into a 2\u00d72 mobile grid). |\n| 3 \u2014 Marketing text block | 1 cell | A heading + supporting paragraph (and optionally a link) shown as the copy that pans in once the cards settle onto the grid. |\n| 4 \u2014 Title | 1 cell | The main headline (`<h2>`\u2013`<h6>`) with optional subcopy paragraph, shown near the Acrobat mockup at the end of the sequence. |\n| 5 \u2014 Mockup images | 3 cells | Cell 1: mobile mockup image. Cell 2: desktop mockup (app window) image. Cell 3: desktop side-panel image shown docked to the mockup. All as `<picture>`. |\n| 6 \u2014 CTA | 1 cell | A single call-to-action link, shown next to the mockup at the end of the sequence. |\n\n## Variations\n\nThis block has no author-facing variation classes to add to the block-name cell. The only alternate state \u2014 a static, non-scroll-animated layout showing the settled grid + slotted mockup end-state \u2014 is applied automatically for visitors with `prefers-reduced-motion` enabled; there is nothing an author authors to trigger it.\n\n## Example\n\n```\n| PDF Space |\n| --- | --- | --- | --- |\n| ![](/media/card-edit.png){width=\"192\" height=\"230\"} Edit text | ![](/media/card-sign.png){width=\"192\" height=\"230\"} Sign documents | ![](/media/card-share.png){width=\"192\" height=\"230\"} Share securely | ![](/media/card-export.png){width=\"192\" height=\"230\"} Export to Word |\n\n| PDF Space |\n| --- | --- | --- | --- |\n| ![](/media/card-scan.png){width=\"192\" height=\"230\"} Scan to PDF | ![](/media/card-compress.png){width=\"192\" height=\"230\"} Compress files | ![](/media/card-merge.png){width=\"192\" height=\"230\"} Merge files | ![](/media/card-protect.png){width=\"192\" height=\"230\"} Protect with a password |\n\n| PDF Space |\n| --- |\n| ## Every tool you need for PDF <br> From editing to e-signatures, do it all in one app. |\n\n| PDF Space |\n| --- |\n| ## Meet Acrobat <br> The all-in-one PDF and e-sign solution. |\n\n| PDF Space |\n| --- | --- | --- |\n| ![](/media/mockup-mobile.png) | ![](/media/mockup-desktop.png) | ![](/media/mockup-panel.png) |\n\n| PDF Space |\n| --- |\n| [Try Acrobat for free](https://www.adobe.com/acrobat/free-trial.html) |\n```\n\n## Notes\n\n- Row order and column count are strict: the code destructures the 6 rows positionally (`[imageRow1, imageRow2, textRow, titleRow, mockupRow, ctaRow]`) with no validation, so an extra/missing row or a mockup row with fewer than 3 cells will silently misassign content rather than error.\n- Always set `width` and `height` on the 8 card images \u2014 they're the only source of each card's aspect ratio; getting them wrong distorts the card during the animation.\n- This block is very tall (650vh) and pins to the viewport while scrolling \u2014 it's meant to be used once per page as a hero, not repeated.\n- All decorative animation elements (mockup chrome, dot-grid canvas, Adobe logo flourish, the animated card clones) are marked `aria-hidden` in the code, so screen reader/keyboard users only ever encounter the real authored content (cards' text, marketing copy, title, CTA) \u2014 authors don't need to do anything extra for this.\n- The full engineering-level tuning reference (phase timings, arc geometry, z-index layering, etc.) lives in `libs/mep/ace1205/pdf-space/README.md` \u2014 that's for developers adjusting the animation feel, not for content authors.\n"}, {"slug": "plans-hero", "title": "Plans Hero", "summary": "A simple full-width hero banner \u2014 background image with a scrim, plus an overlaid text block (eyebrow, heading, body, CTA) \u2014 authored as one row with 2 cells (text, media). Use it for a plans/pricing page header needing a media-backed hero without the scroll animation used by other hero blocks. No variations. Some deployments support an optional focal-point line (e.g. `left, top`) below the image to control crop position; others always crop from center.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 443, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868203.0219367, "techSpecUrl": null, "html": "<h1>Plans Hero</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A simple full-width hero banner \u2014 background image with a scrim, plus an overlaid text block (eyebrow, heading, body, CTA) \u2014 authored as one row with 2 cells (text, media). Use it for a plans/pricing page header needing a media-backed hero without the scroll animation used by other hero blocks. No variations. Some deployments support an optional focal-point line (e.g. <code>left, top</code>) below the image to control crop position; others always crop from center.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as a single row with 2 cells.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 (2 cells)</td>\n<td><strong>Cell 1 (text):</strong> an optional eyebrow line (short text directly above the heading), a heading (<code>H1</code>\u2013<code>H6</code>), one or more body paragraphs, and CTA button(s) authored with Milo's standard <strong>bold link</strong> (filled button) / <em>italic link</em> (outline button) syntax. <strong>Cell 2 (media):</strong> a background image, authored as a normal <code>&lt;picture&gt;</code>. In some deployments of this block you can optionally add a second line of plain text below the image giving a focal point, e.g. <code>left, top</code>, to control which part of the image stays visible when it's cropped (see Notes); in a simpler deployment this option isn't available and the image always crops from the center.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<p>This block has no author-facing variations. There are no modifier classes checked in the JS or CSS \u2014 the only visual changes come from the responsive breakpoints (image scrim gradient position and content max-width adjust automatically at 768px and 1440px).</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Plans Hero</th></tr>\n<tr><td><p>Creative Cloud plans</p>\n<h2>Find the plan that's right for you</h2>\n<p>Get one app or the whole collection, all backed by the latest features.</p>\n<p><strong><a href=\"https://www.adobe.com/creativecloud/plans.html\">See plans</a></strong></p></td><td><p><img alt=\"\" src=\"/media/plans-hero-bg.jpg\" /></p>\n<p>left, top</p></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>Where the focal-point option is available: adding a second paragraph (or trailing plain text line) in the media cell \u2014 e.g. <code>left, top</code> or <code>30%, 70%</code> \u2014 sets which part of the background image stays visible when it's cropped, and that text is then removed so it doesn't render as visible copy. If you don't need custom cropping, simply omit the second line and the image behaves the same as in a deployment without this option (default centered cropping).</li>\n<li>If the media cell has no <code>&lt;picture&gt;</code>, the hero still renders with just the text content and an empty media div \u2014 no image, no scrim visible.</li>\n<li>If the text cell is empty/missing, the block still creates an empty content container so the layout doesn't break, but there will be no visible text.</li>\n</ul>", "footnotes": {}, "raw": "# Plans Hero\n\n> **Quick summary:** A simple full-width hero banner \u2014 background image with a scrim, plus an overlaid text block (eyebrow, heading, body, CTA) \u2014 authored as one row with 2 cells (text, media). Use it for a plans/pricing page header needing a media-backed hero without the scroll animation used by other hero blocks. No variations. Some deployments support an optional focal-point line (e.g. `left, top`) below the image to control crop position; others always crop from center.\n\n## Authoring instructions\n\nThe block is authored as a single row with 2 cells.\n\n| Row | Content |\n| --- | --- |\n| 1 (2 cells) | **Cell 1 (text):** an optional eyebrow line (short text directly above the heading), a heading (`H1`\u2013`H6`), one or more body paragraphs, and CTA button(s) authored with Milo's standard **bold link** (filled button) / *italic link* (outline button) syntax. **Cell 2 (media):** a background image, authored as a normal `<picture>`. In some deployments of this block you can optionally add a second line of plain text below the image giving a focal point, e.g. `left, top`, to control which part of the image stays visible when it's cropped (see Notes); in a simpler deployment this option isn't available and the image always crops from the center. |\n\n## Variations\n\nThis block has no author-facing variations. There are no modifier classes checked in the JS or CSS \u2014 the only visual changes come from the responsive breakpoints (image scrim gradient position and content max-width adjust automatically at 768px and 1440px).\n\n## Example\n\n```\n| Plans Hero |\n| --- | --- |\n| Creative Cloud plans <br> ## Find the plan that's right for you <br> Get one app or the whole collection, all backed by the latest features. <br> **[See plans](https://www.adobe.com/creativecloud/plans.html)** | ![](/media/plans-hero-bg.jpg) <br> left, top |\n```\n\n## Notes\n\n- Where the focal-point option is available: adding a second paragraph (or trailing plain text line) in the media cell \u2014 e.g. `left, top` or `30%, 70%` \u2014 sets which part of the background image stays visible when it's cropped, and that text is then removed so it doesn't render as visible copy. If you don't need custom cropping, simply omit the second line and the image behaves the same as in a deployment without this option (default centered cropping).\n- If the media cell has no `<picture>`, the hero still renders with just the text content and an empty media div \u2014 no image, no scrim visible.\n- If the text cell is empty/missing, the block still creates an empty content container so the layout doesn't break, but there will be no visible text.\n"}, {"slug": "product-marquee-grid", "title": "Product Marquee Grid", "summary": "A small product-highlight tile \u2014 an icon/heading \"chiclet\" stacked above body copy and a CTA \u2014 meant to sit alongside other tiles in a grid of products or offers (e.g. a row of app tiles each linking to its own product page). Authored as 1 row, 1 cell (icon, heading, body, optional label paragraph, then a bold/italic CTA link). Two variations: the default \"soft offer\" (label-style CTA) and `featured-offer` (large filled chip button, pinned to 25% width on desktop). Only the first cell of the first row is read \u2014 extra rows/cells are ignored.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 585, "lastUpdated": "Aug 13, 2026", "lastUpdatedTs": 1786664854.9456282, "techSpecUrl": null, "html": "<h1>Product Marquee Grid</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A small product-highlight tile \u2014 an icon/heading \"chiclet\" stacked above body copy and a CTA \u2014 meant to sit alongside other tiles in a grid of products or offers (e.g. a row of app tiles each linking to its own product page). Authored as 1 row, 1 cell (icon, heading, body, optional label paragraph, then a bold/italic CTA link). Two variations: the default \"soft offer\" (label-style CTA) and <code>featured-offer</code> (large filled chip button, pinned to 25% width on desktop). Only the first cell of the first row is read \u2014 extra rows/cells are ignored.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block reads content from the <strong>first cell of the first row only</strong> \u2014 everything is authored in one column.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 (1 cell used)</td>\n<td>In order: an optional small SVG icon image \u2192 a heading (<code>H1</code>\u2013<code>H6</code>, rendered as a large \"super\" style) \u2192 one or more body paragraphs \u2192 optionally, one extra short paragraph directly before the CTA link (see \"Variations\" \u2014 this becomes a price/label line next to the button in the default variation) \u2192 a CTA link, either a plain link wrapped in <strong>bold</strong> or <em>italic</em> (Milo's standard button syntax: <code>**[Get it now](url)**</code> or <code>*[Get it now](url)*</code>), or a Merchandising-at-Scale (M@S) commerce link<sup class=\"fn-ref\" data-fn=\"mas-cta\" title=\"Click for details\">2</sup> \u2014 those are recognized as the CTA even unwrapped, since M@S applies its own <code>data-wcs-osi</code> attribute to the link before this block reads it.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author it</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Default (soft offer)</td>\n<td>The CTA renders as a light, label-style call-to-action: if you include an extra short paragraph right before the CTA link, it's pulled out and shown as a small label/price line next to the button (e.g. \"Starting at $9.99/mo\").</td>\n<td>Do nothing extra \u2014 this is the default when the block-name cell has no modifier.</td>\n</tr>\n<tr>\n<td><code>featured-offer</code><sup class=\"fn-ref\" data-fn=\"featured-offer\" title=\"Click for details\">1</sup></td>\n<td>The CTA renders instead as a large filled dark \"chip\" button with an arrow icon, and the promo area is pinned to take up 25% width on desktop. The extra paragraph described above is <strong>not</strong> treated as a label in this variation (it's simply included as body text if present).</td>\n<td>Add <code>featured-offer</code> to the block name, e.g. <code>Product Marquee Grid (featured-offer)</code>.</td>\n</tr>\n</tbody>\n</table>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Product Marquee Grid</th></tr>\n<tr><td><p><img alt=\"\" src=\"/icons/photoshop.svg\" /></p>\n<h2>Photoshop</h2>\n<p>Edit and composite images with the world's best imaging app.</p>\n<p>Starting at $22.99/mo</p>\n<p><strong><a href=\"https://www.adobe.com/products/photoshop.html\">Buy now</a></strong></p></td></tr>\n</table>\n\n<p>With the <code>featured-offer</code> variation:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Product Marquee Grid (featured-offer)</th></tr>\n<tr><td><p><img alt=\"\" src=\"/icons/creative-cloud.svg\" /></p>\n<h2>All Apps</h2>\n<p>Get Photoshop, Illustrator, Premiere Pro, and more \u2014 20+ apps in one plan.</p>\n<p><strong><a href=\"https://www.adobe.com/creativecloud/plans.html\">Explore All Apps</a></strong></p></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>Only the first cell of the first row is read; if you author extra rows or a second cell, they are ignored.</li>\n<li>The CTA link must be either bold/italic (button syntax) or a M@S commerce link carrying <code>data-wcs-osi</code><sup class=\"fn-ref\" data-fn=\"mas-cta\" title=\"Click for details\">2</sup> \u2014 any other plain link will not be picked up as the CTA and will simply render as leftover inline text.</li>\n<li>In the default (non-<code>featured-offer</code>) variation, the \"label\" paragraph is only extracted when there are <strong>two or more</strong> body paragraphs remaining after the CTA line is removed \u2014 with only one paragraph, everything is treated as body copy and no label line appears.</li>\n</ul>", "footnotes": {"featured-offer": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "mas-cta": {"num": 2, "html": "<a href=\"https://github.com/adobecom/milo/commit/72960f6\">MWPW-203872</a> \u2014 Narcis Radu, 2026-08-11"}}, "raw": "# Product Marquee Grid\n\n> **Quick summary:** A small product-highlight tile \u2014 an icon/heading \"chiclet\" stacked above body copy and a CTA \u2014 meant to sit alongside other tiles in a grid of products or offers (e.g. a row of app tiles each linking to its own product page). Authored as 1 row, 1 cell (icon, heading, body, optional label paragraph, then a bold/italic CTA link). Two variations: the default \"soft offer\" (label-style CTA) and `featured-offer` (large filled chip button, pinned to 25% width on desktop). Only the first cell of the first row is read \u2014 extra rows/cells are ignored.\n\n## Authoring instructions\n\nThe block reads content from the **first cell of the first row only** \u2014 everything is authored in one column.\n\n| Row | Content |\n| --- | --- |\n| 1 (1 cell used) | In order: an optional small SVG icon image \u2192 a heading (`H1`\u2013`H6`, rendered as a large \"super\" style) \u2192 one or more body paragraphs \u2192 optionally, one extra short paragraph directly before the CTA link (see \"Variations\" \u2014 this becomes a price/label line next to the button in the default variation) \u2192 a CTA link, either a plain link wrapped in **bold** or *italic* (Milo's standard button syntax: `**[Get it now](url)**` or `*[Get it now](url)*`), or a Merchandising-at-Scale (M@S) commerce link[^mas-cta] \u2014 those are recognized as the CTA even unwrapped, since M@S applies its own `data-wcs-osi` attribute to the link before this block reads it. |\n\n## Variations\n\n| Variation | Effect | How to author it |\n| --- | --- | --- |\n| Default (soft offer) | The CTA renders as a light, label-style call-to-action: if you include an extra short paragraph right before the CTA link, it's pulled out and shown as a small label/price line next to the button (e.g. \"Starting at $9.99/mo\"). | Do nothing extra \u2014 this is the default when the block-name cell has no modifier. |\n| `featured-offer`[^featured-offer] | The CTA renders instead as a large filled dark \"chip\" button with an arrow icon, and the promo area is pinned to take up 25% width on desktop. The extra paragraph described above is **not** treated as a label in this variation (it's simply included as body text if present). | Add `featured-offer` to the block name, e.g. `Product Marquee Grid (featured-offer)`. |\n\n[^featured-offer]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n\n## Example\n\n```\n| Product Marquee Grid |\n| --- |\n| ![](/icons/photoshop.svg) <br> ## Photoshop <br> Edit and composite images with the world's best imaging app. <br> Starting at $22.99/mo <br> **[Buy now](https://www.adobe.com/products/photoshop.html)** |\n```\n\nWith the `featured-offer` variation:\n\n```\n| Product Marquee Grid (featured-offer) |\n| --- |\n| ![](/icons/creative-cloud.svg) <br> ## All Apps <br> Get Photoshop, Illustrator, Premiere Pro, and more \u2014 20+ apps in one plan. <br> **[Explore All Apps](https://www.adobe.com/creativecloud/plans.html)** |\n```\n\n## Notes\n\n- Only the first cell of the first row is read; if you author extra rows or a second cell, they are ignored.\n- The CTA link must be either bold/italic (button syntax) or a M@S commerce link carrying `data-wcs-osi`[^mas-cta] \u2014 any other plain link will not be picked up as the CTA and will simply render as leftover inline text.\n- In the default (non-`featured-offer`) variation, the \"label\" paragraph is only extracted when there are **two or more** body paragraphs remaining after the CTA line is removed \u2014 with only one paragraph, everything is treated as body copy and no label line appears.\n\n[^mas-cta]: [MWPW-203872](https://github.com/adobecom/milo/commit/72960f6) \u2014 Narcis Radu, 2026-08-11\n"}, {"slug": "quick-actions", "title": "Quick Actions", "summary": "A section header (heading + optional CTA) followed by a responsive grid of image tiles that link out to tools or pages (e.g. a \"Quick actions\" panel of shortcuts like \"Compress a PDF,\" \"Convert to Word\"), showing 2 tiles per row on mobile, 3 on tablet, and 6 on desktop. Authored as an optional 1-cell header row, then one row per tile (link cell + image cell). There are no author-facing variation classes \u2014 the grid's column count is set automatically by JS. Note: the `two-up`/`three-up`/`six-up` classes this block applies internally are unrelated to Section Metadata's `product-grid` multi-block layout system.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 481, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868191.4227986, "techSpecUrl": null, "html": "<h1>Quick Actions</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A section header (heading + optional CTA) followed by a responsive grid of image tiles that link out to tools or pages (e.g. a \"Quick actions\" panel of shortcuts like \"Compress a PDF,\" \"Convert to Word\"), showing 2 tiles per row on mobile, 3 on tablet, and 6 on desktop. Authored as an optional 1-cell header row, then one row per tile (link cell + image cell). There are no author-facing variation classes \u2014 the grid's column count is set automatically by JS. Note: the <code>two-up</code>/<code>three-up</code>/<code>six-up</code> classes this block applies internally are unrelated to Section Metadata's <code>product-grid</code> multi-block layout system.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 \u2014 Section header (optional, 1 cell)</td>\n<td>A heading (<code>H1</code>\u2013<code>H6</code>) plus, optionally, a CTA button authored with Milo's bold/italic link syntax. <strong>Only included if this row's first cell contains a heading</strong> \u2014 otherwise the block assumes there is no header row and treats every row as a tile.</td>\n</tr>\n<tr>\n<td>2+ \u2014 Tiles (2 cells each)</td>\n<td><strong>Cell 1:</strong> a link \u2014 its text becomes the tile's visible label, and its URL becomes the tile's link target. <strong>Cell 2:</strong> an image (<code>&lt;picture&gt;</code>/<code>&lt;img&gt;</code>) used as the tile's background. Rows with fewer than 2 cells are skipped and not rendered as tiles.</td>\n</tr>\n</tbody>\n</table>\n<h2>Variations</h2>\n<p>This block has no author-facing variation classes. The grid's column count (<code>two-up</code> / <code>three-up</code> / <code>six-up</code>) is applied automatically by JS based on viewport width \u2014 it is not something an author sets.</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Quick Actions</th></tr>\n<tr><td><h2>Quick actions</h2>\n<p><strong><a href=\"https://www.adobe.com/acrobat/online/tools.html\">See all tools</a></strong></p></td></tr>\n</table>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Quick Actions</th></tr>\n<tr><td><a href=\"https://www.adobe.com/acrobat/online/compress-pdf.html\">Compress a PDF</a></td><td><img alt=\"\" src=\"/media/qa-compress.png\" /></td></tr>\n<tr><td><a href=\"https://www.adobe.com/acrobat/online/pdf-to-word.html\">Convert to Word</a></td><td><img alt=\"\" src=\"/media/qa-convert.png\" /></td></tr>\n<tr><td><a href=\"https://www.adobe.com/acrobat/online/sign-pdf.html\">Sign a document</a></td><td><img alt=\"\" src=\"/media/qa-sign.png\" /></td></tr>\n<tr><td><a href=\"https://www.adobe.com/acrobat/online/merge-pdf.html\">Merge files</a></td><td><img alt=\"\" src=\"/media/qa-merge.png\" /></td></tr>\n<tr><td><a href=\"https://www.adobe.com/acrobat/online/fill-sign-pdf-forms.html\">Fill and sign a form</a></td><td><img alt=\"\" src=\"/media/qa-fill.png\" /></td></tr>\n<tr><td><a href=\"https://www.adobe.com/acrobat/online/edit-pdf.html\">Edit a PDF</a></td><td><img alt=\"\" src=\"/media/qa-edit.png\" /></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>The header row's CTA link must use bold/italic button syntax to render as a button \u2014 this row is decorated with the same button styling as other blocks (<code>decorateBlockText</code>).</li>\n<li>Tile labels are clamped to 2 lines of text in the layout \u2014 keep tile link text short (a few words) so it doesn't get visually truncated.</li>\n<li>If you omit the header row entirely, just start the table directly with tile rows (link + image, 2 cells) \u2014 the block correctly detects there's no heading and skips building a header.</li>\n<li>The <code>two-up</code>/<code>three-up</code>/<code>six-up</code> classes mentioned in Variations are applied automatically by this block's own code to its own internal tile grid \u2014 they're unrelated to <a href=\"./section-metadata.md\">Section Metadata</a>'s <code>product-grid</code> + <code>-up</code> multi-block layout system (which arranges separate blocks side by side in a section). Adding <code>product-grid</code> classes to this block's Section Metadata has no effect on its tile grid.</li>\n</ul>", "footnotes": {}, "raw": "# Quick Actions\n\n> **Quick summary:** A section header (heading + optional CTA) followed by a responsive grid of image tiles that link out to tools or pages (e.g. a \"Quick actions\" panel of shortcuts like \"Compress a PDF,\" \"Convert to Word\"), showing 2 tiles per row on mobile, 3 on tablet, and 6 on desktop. Authored as an optional 1-cell header row, then one row per tile (link cell + image cell). There are no author-facing variation classes \u2014 the grid's column count is set automatically by JS. Note: the `two-up`/`three-up`/`six-up` classes this block applies internally are unrelated to Section Metadata's `product-grid` multi-block layout system.\n\n## Authoring instructions\n\n| Row | Content |\n| --- | --- |\n| 1 \u2014 Section header (optional, 1 cell) | A heading (`H1`\u2013`H6`) plus, optionally, a CTA button authored with Milo's bold/italic link syntax. **Only included if this row's first cell contains a heading** \u2014 otherwise the block assumes there is no header row and treats every row as a tile. |\n| 2+ \u2014 Tiles (2 cells each) | **Cell 1:** a link \u2014 its text becomes the tile's visible label, and its URL becomes the tile's link target. **Cell 2:** an image (`<picture>`/`<img>`) used as the tile's background. Rows with fewer than 2 cells are skipped and not rendered as tiles. |\n\n## Variations\n\nThis block has no author-facing variation classes. The grid's column count (`two-up` / `three-up` / `six-up`) is applied automatically by JS based on viewport width \u2014 it is not something an author sets.\n\n## Example\n\n```\n| Quick Actions |\n| --- |\n| ## Quick actions <br> **[See all tools](https://www.adobe.com/acrobat/online/tools.html)** |\n\n| Quick Actions |\n| --- | --- |\n| [Compress a PDF](https://www.adobe.com/acrobat/online/compress-pdf.html) | ![](/media/qa-compress.png) |\n| [Convert to Word](https://www.adobe.com/acrobat/online/pdf-to-word.html) | ![](/media/qa-convert.png) |\n| [Sign a document](https://www.adobe.com/acrobat/online/sign-pdf.html) | ![](/media/qa-sign.png) |\n| [Merge files](https://www.adobe.com/acrobat/online/merge-pdf.html) | ![](/media/qa-merge.png) |\n| [Fill and sign a form](https://www.adobe.com/acrobat/online/fill-sign-pdf-forms.html) | ![](/media/qa-fill.png) |\n| [Edit a PDF](https://www.adobe.com/acrobat/online/edit-pdf.html) | ![](/media/qa-edit.png) |\n```\n\n## Notes\n\n- The header row's CTA link must use bold/italic button syntax to render as a button \u2014 this row is decorated with the same button styling as other blocks (`decorateBlockText`).\n- Tile labels are clamped to 2 lines of text in the layout \u2014 keep tile link text short (a few words) so it doesn't get visually truncated.\n- If you omit the header row entirely, just start the table directly with tile rows (link + image, 2 cells) \u2014 the block correctly detects there's no heading and skips building a header.\n- The `two-up`/`three-up`/`six-up` classes mentioned in Variations are applied automatically by this block's own code to its own internal tile grid \u2014 they're unrelated to [Section Metadata](./section-metadata.md)'s `product-grid` + `-up` multi-block layout system (which arranges separate blocks side by side in a section). Adding `product-grid` classes to this block's Section Metadata has no effect on its tile grid.\n"}, {"slug": "quote", "title": "Quote", "summary": "A large, decoratively framed pull-quote (corner dots, center guide lines) with an optional name + role attribution below it, used to spotlight a customer testimonial or executive quote on its own. Authored as a single cell containing up to three top-level heading/paragraph elements, in order: quote (required), name (optional), role (optional, only used if a name is present). Variations control attribution alignment: default (left), `center-footer`, `right-footer`. Use a real typographic opening quote character (not a straight `\"`) if you want the automatic hanging-punctuation effect.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 555, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868243.1477349, "techSpecUrl": null, "html": "<h1>Quote</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A large, decoratively framed pull-quote (corner dots, center guide lines) with an optional name + role attribution below it, used to spotlight a customer testimonial or executive quote on its own. Authored as a single cell containing up to three top-level heading/paragraph elements, in order: quote (required), name (optional), role (optional, only used if a name is present). Variations control attribution alignment: default (left), <code>center-footer</code>, <code>right-footer</code>. Use a real typographic opening quote character (not a straight <code>\"</code>) if you want the automatic hanging-punctuation effect.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block reads a single cell \u2014 the first cell in the first row \u2014 and looks for up to three top-level heading/paragraph elements inside it, in order:</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1, Cell 1 \u2014 Quote (required)</td>\n<td>The <strong>first</strong> heading (<code>h1</code>\u2013<code>h6</code>) or paragraph found directly in the cell is treated as the quote text itself. It's wrapped in a <code>&lt;blockquote&gt;</code>. If the text starts with a real opening curly/typographic quotation mark (e.g. <code>\"</code> or <code>\u00ab</code>), that character is automatically pulled out into its own styled span for a \"hanging punctuation\" effect \u2014 you don't need to do anything special, just type the actual curly quote character (not a straight <code>\"</code>) at the start of your quote if you want this effect.</td>\n</tr>\n<tr>\n<td>1, Cell 1 \u2014 Name (optional)</td>\n<td>The <strong>second</strong> top-level heading/paragraph is treated as the attribution name (e.g. \"Jane Doe\"). If present, it's wrapped (together with the role, if any) in a <code>&lt;figcaption&gt;</code>.</td>\n</tr>\n<tr>\n<td>1, Cell 1 \u2014 Role (optional)</td>\n<td>The <strong>third</strong> top-level heading/paragraph is treated as the person's role/title (e.g. \"VP of Design, Acme Corp\"). Only used if a name is also present \u2014 a role with no name is ignored.</td>\n</tr>\n</tbody>\n</table>\n<p>If the cell doesn't contain any heading or paragraph at all, the block won't build its quote frame \u2014 it's left mostly unprocessed.</p>\n<h2>Variations</h2>\n<p>Variations are authored as modifier classes appended to the block name in parentheses, e.g. <code>Quote (center-footer)</code>.</p>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>center-footer</code><sup class=\"fn-ref\" data-fn=\"center-footer\" title=\"Click for details\">1</sup></td>\n<td>Centers the name/role attribution block (text-align + flex alignment) instead of the default left-aligned attribution.</td>\n<td><code>Quote (center-footer)</code></td>\n</tr>\n<tr>\n<td><code>right-footer</code><sup class=\"fn-ref\" data-fn=\"right-footer\" title=\"Click for details\">2</sup></td>\n<td>Right-aligns the name/role attribution block instead of the default left alignment.</td>\n<td><code>Quote (right-footer)</code></td>\n</tr>\n</tbody>\n</table>\n<p>If neither variation is added, the attribution is left-aligned by default.</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Quote (right-footer)</th></tr>\n<tr><td>\"Adobe's tools let our team ship campaigns twice as fast.</td></tr>\n<tr><td>Jane Doe</td></tr>\n<tr><td>VP of Marketing, Acme Corp</td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>Only the first three heading/paragraph elements directly in the cell are used (quote, name, role in that order); any additional headings/paragraphs beyond the third are discarded \u2014 the block replaces the entire cell's contents with just the built quote/attribution markup.</li>\n<li>The decorative frame (corner dots, horizontal/vertical guide lines, center dashed line) is entirely CSS-driven and marked <code>aria-hidden=\"true\"</code> \u2014 it's automatic, not something you author.</li>\n<li>Use a real typographic opening quote character (e.g. <code>\"</code>, <code>\u2018</code>, or <code>\u00ab</code>) if you want the hanging-punctuation treatment; a straight double-quote (<code>\"</code>) does not match the Unicode \"initial punctuation\" pattern the code checks for (<code>\\p{Pi}</code>), so it won't get the special hang-out styling.</li>\n</ul>", "footnotes": {"center-footer": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/pull/6219\">#6219</a> \u2014 Rares Munteanu, 2026-06-23"}, "right-footer": {"num": 2, "html": "<a href=\"https://github.com/adobecom/milo/commit/8206068\"><code>8206068</code></a> \u2014 Rares Munteanu, 2026-06-30"}}, "raw": "# Quote\n\n> **Quick summary:** A large, decoratively framed pull-quote (corner dots, center guide lines) with an optional name + role attribution below it, used to spotlight a customer testimonial or executive quote on its own. Authored as a single cell containing up to three top-level heading/paragraph elements, in order: quote (required), name (optional), role (optional, only used if a name is present). Variations control attribution alignment: default (left), `center-footer`, `right-footer`. Use a real typographic opening quote character (not a straight `\"`) if you want the automatic hanging-punctuation effect.\n\n## Authoring instructions\n\nThe block reads a single cell \u2014 the first cell in the first row \u2014 and looks for up to three top-level heading/paragraph elements inside it, in order:\n\n| Row | Content |\n|---|---|\n| 1, Cell 1 \u2014 Quote (required) | The **first** heading (`h1`\u2013`h6`) or paragraph found directly in the cell is treated as the quote text itself. It's wrapped in a `<blockquote>`. If the text starts with a real opening curly/typographic quotation mark (e.g. `\"` or `\u00ab`), that character is automatically pulled out into its own styled span for a \"hanging punctuation\" effect \u2014 you don't need to do anything special, just type the actual curly quote character (not a straight `\"`) at the start of your quote if you want this effect. |\n| 1, Cell 1 \u2014 Name (optional) | The **second** top-level heading/paragraph is treated as the attribution name (e.g. \"Jane Doe\"). If present, it's wrapped (together with the role, if any) in a `<figcaption>`. |\n| 1, Cell 1 \u2014 Role (optional) | The **third** top-level heading/paragraph is treated as the person's role/title (e.g. \"VP of Design, Acme Corp\"). Only used if a name is also present \u2014 a role with no name is ignored. |\n\nIf the cell doesn't contain any heading or paragraph at all, the block won't build its quote frame \u2014 it's left mostly unprocessed.\n\n## Variations\n\nVariations are authored as modifier classes appended to the block name in parentheses, e.g. `Quote (center-footer)`.\n\n| Variation | Effect | How to author |\n|---|---|---|\n| `center-footer`[^center-footer] | Centers the name/role attribution block (text-align + flex alignment) instead of the default left-aligned attribution. | `Quote (center-footer)` |\n| `right-footer`[^right-footer] | Right-aligns the name/role attribution block instead of the default left alignment. | `Quote (right-footer)` |\n\n[^center-footer]: [#6219](https://github.com/adobecom/milo/pull/6219) \u2014 Rares Munteanu, 2026-06-23\n[^right-footer]: [`8206068`](https://github.com/adobecom/milo/commit/8206068) \u2014 Rares Munteanu, 2026-06-30\n\nIf neither variation is added, the attribution is left-aligned by default.\n\n## Example\n\n```\n| Quote (right-footer) |\n| --- |\n| \"Adobe's tools let our team ship campaigns twice as fast. |\n| Jane Doe |\n| VP of Marketing, Acme Corp |\n```\n\n## Notes\n\n- Only the first three heading/paragraph elements directly in the cell are used (quote, name, role in that order); any additional headings/paragraphs beyond the third are discarded \u2014 the block replaces the entire cell's contents with just the built quote/attribution markup.\n- The decorative frame (corner dots, horizontal/vertical guide lines, center dashed line) is entirely CSS-driven and marked `aria-hidden=\"true\"` \u2014 it's automatic, not something you author.\n- Use a real typographic opening quote character (e.g. `\"`, `\u2018`, or `\u00ab`) if you want the hanging-punctuation treatment; a straight double-quote (`\"`) does not match the Unicode \"initial punctuation\" pattern the code checks for (`\\p{Pi}`), so it won't get the special hang-out styling.\n"}, {"slug": "region-nav", "title": "Region Nav", "summary": "The country/language picker shown inside the footer's \"change region\" modal (opened via the footer's language link, URL fragment `#langnav`), with an intro heading plus a scrollable, multi-column list of region/language links. Authored as exactly 2 rows: row 1 is intro heading + body copy, row 2 holds one cell per region group (bold label + bulleted links). There are no author-facing variations \u2014 every link's `href` in row 2 is automatically rewritten to the equivalent page in the target locale, preserving the visitor's current page. This block is meant to live inside a modal/dialog fragment, not as a normal in-page block.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 580, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868207.0470707, "techSpecUrl": null, "html": "<h1>Region Nav</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> The country/language picker shown inside the footer's \"change region\" modal (opened via the footer's language link, URL fragment <code>#langnav</code>), with an intro heading plus a scrollable, multi-column list of region/language links. Authored as exactly 2 rows: row 1 is intro heading + body copy, row 2 holds one cell per region group (bold label + bulleted links). There are no author-facing variations \u2014 every link's <code>href</code> in row 2 is automatically rewritten to the equivalent page in the target locale, preserving the visitor's current page. This block is meant to live inside a modal/dialog fragment, not as a normal in-page block.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as two rows. Row 1 is the modal's intro copy. Row 2 holds one or more \"region group\" columns, each with a group heading and a bulleted list of links \u2014 the JS reads every <code>&lt;a&gt;</code> inside row 2 and rewrites its <code>href</code>, so only the second row's links matter for the picker logic.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Intro copy for the modal: a heading (renders as the large title, e.g. Heading 5) followed by a paragraph of body text (e.g. \"Choose your region\"). Both are required for the modal to read correctly, though the JS itself does not enforce them \u2014 this row is skipped if the block has fewer than 2 rows total, which breaks the whole block.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>One cell per region/language group. Each cell should contain a short bold label (e.g. \"Americas\", \"Europe\") followed by a bulleted list (<code>&lt;ul&gt;&lt;li&gt;</code>) of links, one per country/language, e.g. <code>[United States (English)](/us/)</code>. Every <code>&lt;a&gt;</code> found anywhere in this row is picked up and its <code>href</code> is rewritten automatically \u2014 do not hand-author the domain/locale prefix beyond a normal relative link to that locale's homepage.</td>\n</tr>\n</tbody>\n</table>\n<p>Each <code>&lt;a&gt;</code> href is rewritten by the block's script to point at the equivalent of the <em>current page</em> in the target locale, falling back to that locale's homepage if the equivalent page returns a 404 (checked via a <code>HEAD</code> request on hover/click). Authors do not control this behavior \u2014 it is automatic for every link in row 2.</p>\n<h2>Variations</h2>\n<p>This block has no author-facing variations. (The <code>.hide</code> class referenced in the CSS is toggled by the loading code that inserts region-nav into the modal, not something an author adds in the table.)</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Region Nav</th></tr>\n<tr><td><p><strong>Change your region</strong></p>\n<p>Choose the region and language you'd like to see this site in.</p>\n<p><strong>Americas</strong></p>\n<ul>\n<li>\n<p><a href=\"/us/\">United States (English)</a></p>\n</li>\n<li>\n<p><a href=\"/ca/\">Canada (English)</a></p>\n</li>\n<li>\n<p><a href=\"/br/\">Brasil (Portugu\u00eas)</a></p>\n</li>\n</ul></td><td><p><strong>Europe</strong></p>\n<ul>\n<li>\n<p><a href=\"/fr/\">France (Fran\u00e7ais)</a></p>\n</li>\n<li>\n<p><a href=\"/de/\">Deutschland (Deutsch)</a></p>\n</li>\n</ul></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>Row 2's columns are not laid out 1:1 with the cells you author \u2014 the container applies a CSS multi-column layout (1 column on mobile, 3 columns at 600px+, 5 columns at 1200px+), so the browser reflows all the group headings/lists together into that many visual columns regardless of how many divs/cells you used.</li>\n<li>This block is meant to live inside a modal/dialog fragment (it's styled specifically for <code>.dialog-modal</code>); authoring it as a normal in-page block is not its intended use.</li>\n<li>Links are checked with a live <code>HEAD</code> request when a visitor hovers or clicks \u2014 broken destination pages silently fall back to the target locale's homepage rather than erroring, so there's no visual indicator in the doc if a link target doesn't exist for a given locale.</li>\n</ul>", "footnotes": {}, "raw": "# Region Nav\n\n> **Quick summary:** The country/language picker shown inside the footer's \"change region\" modal (opened via the footer's language link, URL fragment `#langnav`), with an intro heading plus a scrollable, multi-column list of region/language links. Authored as exactly 2 rows: row 1 is intro heading + body copy, row 2 holds one cell per region group (bold label + bulleted links). There are no author-facing variations \u2014 every link's `href` in row 2 is automatically rewritten to the equivalent page in the target locale, preserving the visitor's current page. This block is meant to live inside a modal/dialog fragment, not as a normal in-page block.\n\n## Authoring instructions\n\nThe block is authored as two rows. Row 1 is the modal's intro copy. Row 2 holds one or more \"region group\" columns, each with a group heading and a bulleted list of links \u2014 the JS reads every `<a>` inside row 2 and rewrites its `href`, so only the second row's links matter for the picker logic.\n\n| Row | Content |\n| --- | --- |\n| 1 | Intro copy for the modal: a heading (renders as the large title, e.g. Heading 5) followed by a paragraph of body text (e.g. \"Choose your region\"). Both are required for the modal to read correctly, though the JS itself does not enforce them \u2014 this row is skipped if the block has fewer than 2 rows total, which breaks the whole block. |\n| 2 | One cell per region/language group. Each cell should contain a short bold label (e.g. \"Americas\", \"Europe\") followed by a bulleted list (`<ul><li>`) of links, one per country/language, e.g. `[United States (English)](/us/)`. Every `<a>` found anywhere in this row is picked up and its `href` is rewritten automatically \u2014 do not hand-author the domain/locale prefix beyond a normal relative link to that locale's homepage. |\n\nEach `<a>` href is rewritten by the block's script to point at the equivalent of the *current page* in the target locale, falling back to that locale's homepage if the equivalent page returns a 404 (checked via a `HEAD` request on hover/click). Authors do not control this behavior \u2014 it is automatic for every link in row 2.\n\n## Variations\n\nThis block has no author-facing variations. (The `.hide` class referenced in the CSS is toggled by the loading code that inserts region-nav into the modal, not something an author adds in the table.)\n\n## Example\n\n```\n| Region Nav |\n| --- |\n| **Change your region**<br>Choose the region and language you'd like to see this site in. |\n| **Americas**<br>- [United States (English)](/us/)<br>- [Canada (English)](/ca/)<br>- [Brasil (Portugu\u00eas)](/br/) | **Europe**<br>- [France (Fran\u00e7ais)](/fr/)<br>- [Deutschland (Deutsch)](/de/) |\n```\n\n## Notes\n\n- Row 2's columns are not laid out 1:1 with the cells you author \u2014 the container applies a CSS multi-column layout (1 column on mobile, 3 columns at 600px+, 5 columns at 1200px+), so the browser reflows all the group headings/lists together into that many visual columns regardless of how many divs/cells you used.\n- This block is meant to live inside a modal/dialog fragment (it's styled specifically for `.dialog-modal`); authoring it as a normal in-page block is not its intended use.\n- Links are checked with a live `HEAD` request when a visitor hovers or clicks \u2014 broken destination pages silently fall back to the target locale's homepage rather than erroring, so there's no visual indicator in the doc if a link target doesn't exist for a given locale.\n"}, {"slug": "rich-content", "title": "Rich Content", "summary": "A flexible text-and-media block for heroes and general content sections \u2014 heading, body, and CTA buttons, optionally with a section background, a jump-link nav strip, or paired media \u2014 use it whenever you need a headline + supporting copy + CTA(s) without a fixed two-column layout. Authored as one row/cell of free-form rich text (heading, body, bold/italic button links), with viewport-delimiter rows (`mobile-viewport`/`tablet-viewport`/`desktop-viewport`) for per-viewport content. Key variations: `hero`, `center`, `dark`, `max-width-8`/`max-width-10`, `left-split`, `jump-link`, `narrow`/`narrow-xs`, `grid-full-width`, `media`, `no-overlay`, `indent`, `glass-border`, `merch-moment` \u2014 not all are available in every deployment (see the Availability column). Note the Section Metadata interaction: pairing `media` with a scroll-driven \"garage door\" reveal style on the section has no effect without `media` also present.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 1670, "lastUpdated": "Aug 6, 2026", "lastUpdatedTs": 1786042904.6516218, "techSpecUrl": "https://www.figma.com/design/kEJ8qfXSgEqInVtJL7P6Ld/C2---Rich-Content?node-id=1-2211&t=QhLCpJnsGgRKSdo9-1", "html": "<h1>Rich Content</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A flexible text-and-media block for heroes and general content sections \u2014 heading, body, and CTA buttons, optionally with a section background, a jump-link nav strip, or paired media \u2014 use it whenever you need a headline + supporting copy + CTA(s) without a fixed two-column layout. Authored as one row/cell of free-form rich text (heading, body, bold/italic button links), with viewport-delimiter rows (<code>mobile-viewport</code>/<code>tablet-viewport</code>/<code>desktop-viewport</code>) for per-viewport content. Key variations: <code>hero</code>, <code>center</code>, <code>dark</code>, <code>max-width-8</code>/<code>max-width-10</code>, <code>left-split</code>, <code>jump-link</code>, <code>narrow</code>/<code>narrow-xs</code>, <code>grid-full-width</code>, <code>media</code>, <code>no-overlay</code>, <code>indent</code>, <code>glass-border</code>, <code>merch-moment</code> \u2014 not all are available in every deployment (see the Availability column). Note the Section Metadata interaction: pairing <code>media</code> with a scroll-driven \"garage door\" reveal style on the section has no effect without <code>media</code> also present.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>The block is authored as <strong>one row with one cell</strong> (the \"foreground\" content) in the simple case. Everything inside that cell is free-form rich text, decorated automatically:</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Row 1 (required)</td>\n<td>A single cell containing, in order: an optional heading (any level <code>H1</code>\u2013<code>H6</code>) \u2014 if you omit a heading, the first paragraph is auto-promoted to <em>look</em> like a Heading 2 (visually only \u2014 screen readers and SEO still see a plain paragraph, so use a real heading whenever the text is structurally a heading). If the text starts with a typographic opening quote (curly quote, e.g. <code>\"</code>), the mark is pulled into its own styled span for a \"hanging quote\" effect \u2014 no special authoring needed. If the paragraph immediately before the heading is a small image (icon) followed by short text, it becomes an \"eyebrow\" line with an inline icon. Below the heading, add body paragraphs. Add one or more buttons/links using standard Milo button syntax: bold text (<code>**text**</code>) = filled/primary button, italic text (<code>*text*</code>) = outline/secondary button, a plain link on its own line = link-styled (no button chrome). Bold and italic links are often paired together in one emphasized line, e.g. <code>_**[Get started](#)** [Learn more](#)_</code>.</td>\n</tr>\n<tr>\n<td>Row 2, second cell (optional, only with <code>hero</code>, and only in some deployments)</td>\n<td>A second cell in the same row. If present and text-only, its content is treated as a CSS gradient/color value and applied as a custom hero-overlay override on the surrounding section, letting you replace the default dark hero gradient for that instance. Not every deployment of this block reads this cell \u2014 if you add it and see no effect, this deployment doesn't support the override and the default hero overlay is used instead.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Jump-link contract (most deployments, not all):</strong> if the block name includes <code>jump-link</code> (see Variations), add one additional paragraph anywhere in the cell containing only links separated by the pipe character <code>|</code>, e.g. <code>[Overview](#overview) | [Pricing](#pricing) | [FAQ](#faq)</code> \u2014 the code detects this row by looking for a <code>|</code> character among the links. That paragraph becomes a horizontal (or vertical, on mobile) jump-link nav with numbered/arrow badges that smooth-scroll to the matching <code>id</code> on the page. The simplest deployments of this block don't support <code>jump-link</code> at all.</p>\n<p><strong>Media contract (most deployments, not all):</strong> if the block name includes <code>media</code> (see Variations), the table structure changes to hold both a CTA cell and a media cell (a picture, video, or a link to an <code>.mp4</code> file) \u2014 both optional, but at least one is expected for the variant to render meaningfully. How strictly cell order matters, and the resulting media's aspect ratio/shape, both vary by deployment \u2014 some require a fixed \"CTA cell first, media cell second\" order and render a narrow portrait clip; others scan every cell to find whichever one looks like media regardless of order, and render a wider, closer-to-square shape. When in doubt, author CTA first and media second \u2014 that order works everywhere media is supported. The simplest deployments of this block don't support <code>media</code> at all.</p>\n<h2>Variations</h2>\n<p>Add these as modifier text in the block name cell, comma-separated, e.g. <code>Rich Content (hero, center)</code>:</p>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>Availability</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>hero</code><sup class=\"fn-ref\" data-fn=\"hero\" title=\"Click for details\">1</sup></td>\n<td>Fixes the block/section to a tall hero height (640px mobile/tablet, 1040px desktop).</td>\n<td>All deployments</td>\n</tr>\n<tr>\n<td><code>center</code><sup class=\"fn-ref\" data-fn=\"center\" title=\"Click for details\">2</sup></td>\n<td>Center-aligns the heading/body/buttons instead of left-aligned.</td>\n<td>All deployments</td>\n</tr>\n<tr>\n<td><code>dark</code><sup class=\"fn-ref\" data-fn=\"dark\" title=\"Click for details\">3</sup></td>\n<td>Removes the block's own background color (used when content sits over a section background image/video).</td>\n<td>All deployments</td>\n</tr>\n<tr>\n<td><code>max-width-8</code><sup class=\"fn-ref\" data-fn=\"max-width-8\" title=\"Click for details\">4</sup> / <code>max-width-10</code><sup class=\"fn-ref\" data-fn=\"max-width-10\" title=\"Click for details\">5</sup></td>\n<td>With <code>hero</code> on desktop, constrains the content column to an 8- or 10-column grid width.</td>\n<td>All deployments</td>\n</tr>\n<tr>\n<td><code>left-split</code><sup class=\"fn-ref\" data-fn=\"left-split\" title=\"Click for details\">6</sup></td>\n<td>On desktop, lays content out with buttons pinned to the right side of the text instead of stacked below it.</td>\n<td>Most deployments</td>\n</tr>\n<tr>\n<td><code>jump-link</code><sup class=\"fn-ref\" data-fn=\"jump-link\" title=\"Click for details\">7</sup></td>\n<td>Enables the jump-link paragraph described above; implies knockout/white text. Commonly combined with <code>hero</code>.</td>\n<td>Most deployments</td>\n</tr>\n<tr>\n<td><code>narrow</code><sup class=\"fn-ref\" data-fn=\"narrow\" title=\"Click for details\">8</sup> / <code>narrow-xs</code><sup class=\"fn-ref\" data-fn=\"narrow-xs\" title=\"Click for details\">9</sup></td>\n<td>Caps the max-width of the heading/body text for a tighter reading column, tablet+ only (<code>narrow-xs</code> is tighter).</td>\n<td>Most deployments</td>\n</tr>\n<tr>\n<td><code>grid-full-width</code><sup class=\"fn-ref\" data-fn=\"grid-full-width\" title=\"Click for details\">10</sup></td>\n<td>Used inside a <code>bento</code> Section (see <a href=\"./section-metadata.md\">Section Metadata</a>) so the block spans the full masonry grid width with adjusted spacing.</td>\n<td>Most deployments</td>\n</tr>\n<tr>\n<td><code>media</code><sup class=\"fn-ref\" data-fn=\"media\" title=\"Click for details\">11</sup></td>\n<td>Switches to the CTA + media layout described above; renders on a dark background. (Older authoring/docs may reference this as <code>video</code> \u2014 that name has been retired everywhere this block is used; use <code>media</code>.)</td>\n<td>Most deployments</td>\n</tr>\n<tr>\n<td><code>no-overlay</code><sup class=\"fn-ref\" data-fn=\"no-overlay\" title=\"Click for details\">12</sup></td>\n<td>Used with <code>media</code>: skips the blurred/darkened section background treatment behind the media.</td>\n<td>Most deployments</td>\n</tr>\n<tr>\n<td><code>indent</code><sup class=\"fn-ref\" data-fn=\"indent\" title=\"Click for details\">13</sup></td>\n<td>Used inside a <code>bento</code> Section: indents the block with adjusted spacing (an alternative to <code>grid-full-width</code>).</td>\n<td>Only some deployments</td>\n</tr>\n<tr>\n<td><code>glass-border</code><sup class=\"fn-ref\" data-fn=\"glass-border\" title=\"Click for details\">14</sup></td>\n<td>Used with <code>media</code>: add
