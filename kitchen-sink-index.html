 \u2014 on narrower viewports the media block for each item is shown inline instead of relying on mouse position, so content isn't lost, just presented differently.</li>\n<li>Because only the first cell of row 1 is used for the headline, don't rely on additional cells in the headline row \u2014 they're silently dropped.</li>\n</ul>", "footnotes": {}, "raw": "# Hover List\n\n> **Quick summary:** A numbered list \u2014 e.g. feature/benefit lists like \"01 Fast performance\", \"02 Built-in AI\" \u2014 where hovering (or the active item on touch) reveals a stacked, parallax-following image pile. Authored as a heading row followed by one row per item (label cell + one-or-more-images media cell). Key feature: optional per-breakpoint content overrides via `mobile-viewport`/`tablet-viewport`/`desktop-viewport` divider rows, which can also carry per-breakpoint modifier classes.\n\n## Authoring instructions\n\nThe block reads rows top to bottom. **Row 1** is the heading row, **every row after that** is a list item.\n\n| Row | Content |\n|---|---|\n| 1, cell 1 | The block headline. Put a heading (e.g. `## My Headline`) here \u2014 it's auto-styled as `heading-2`. Any other cells in row 1 are ignored. |\n| 2+, cell 1 (text) | The item's text/label, e.g. `### Real-time collaboration`. Rendered as `heading-5`. |\n| 2+, cell 2 (media) | One or more images. Add multiple images to the same cell to get a stacked, layered \"photo pile\" that follows the cursor for that item (each extra image is progressively offset/rotated). If a row has no images in cell 2, that item just has no hover media. |\n\nItem numbers (\"1.\", \"2.\", \"3.\", ...) are generated automatically \u2014 do not type them into the text cell.\n\n## Variations\n\nThis block has no modifier classes on the block name. It does have one structural authoring feature: **per-viewport content overrides**, via `decorateViewportContent`.\n\n| Feature | Effect | How to author it |\n|---|---|---|\n| Per-breakpoint content | Lets you author completely different rows for mobile / tablet / desktop instead of one shared set of rows. | Insert a row whose **only cell** contains just `mobile-viewport`, `tablet-viewport`, or `desktop-viewport` (case-insensitive; bare `mobile`/`tablet`/`desktop` still works but is a legacy fallback being phased out) as a divider. Every row after that divider (until the next divider or the end of the table) becomes that breakpoint's content. Breakpoints you don't define inherit content from the next-smaller breakpoint you did define (e.g. define `mobile-viewport` and `desktop-viewport` only \u2014 tablet reuses `mobile-viewport`'s content, or `desktop-viewport`'s if a row/cell is empty in the smaller viewport section but filled in a larger one already processed). Breakpoint is measured by screen **width**: with all three defined, mobile = below 768px, tablet = 768\u20131279px, desktop = 1280px and up; with only `mobile-viewport` + `desktop-viewport`, the split moves to 1280px (mobile = below 1280px). |\n| Per-breakpoint modifier classes | Add extra CSS classes to the block only for a given breakpoint. | On the same divider row, add classes in parentheses after the keyword, e.g. `desktop-viewport (compact)` \u2014 `compact` is added to the block's class list only while that breakpoint is active. |\n\nIf you never add `mobile-viewport`/`tablet-viewport`/`desktop-viewport` divider rows, the same rows/content are used at every breakpoint (the default, and the common case).\n\n## Example\n\n```\n| Hover List                              |\n|------------------------------------------|\n| ## Why creators choose Adobe             |\n| ### Real-time collaboration | ![preview](/media_1.png) |\n| ### Built-in generative AI  | ![preview](/media_2.png) ![preview 2](/media_3.png) |\n| ### One subscription, every app | ![preview](/media_4.png) |\n```\n\nWith a per-viewport override (mobile shows fewer items than desktop; breakpoint is 1280px since only two viewports are defined):\n\n```\n| Hover List                              |\n|------------------------------------------|\n| ## Why creators choose Adobe             |\n| desktop-viewport                         |\n| ### Real-time collaboration | ![preview](/media_1.png) |\n| ### Built-in generative AI  | ![preview](/media_2.png) |\n| ### One subscription, every app | ![preview](/media_4.png) |\n| mobile-viewport                          |\n| ### Real-time collaboration | ![preview](/media_1.png) |\n| ### Built-in generative AI  | ![preview](/media_2.png) |\n```\n\n## Notes\n\n- The hover/parallax image-follow effect is desktop-only (`width >= 1280px`); below that, images are simply shown inline/statically per item (no follower JS runs) per the responsive CSS.\n- Respects `prefers-reduced-motion`: images snap directly into place under the cursor instead of animating in with spring physics.\n- Keyboard/touch users don't get a cursor to \"hover\" with \u2014 on narrower viewports the media block for each item is shown inline instead of relying on mouse position, so content isn't lost, just presented differently.\n- Because only the first cell of row 1 is used for the headline, don't rely on additional cells in the headline row \u2014 they're silently dropped.\n"}, {"slug": "hub-hero", "title": "Hub Hero", "summary": "A large scroll-driven hero with a fading header, a parallax image grid, and a horizontal carousel of slides that appear to \"rise\" out of the grid as you scroll \u2014 used as the top-of-page hero for hub/landing pages wanting a cinematic, scroll-linked reveal instead of a static hero. Authored as a strict, fixed sequence of 8 rows (header, image-grid rows, carousel header, slide rows). By default the carousel takes exactly 4 slides across a 5-column grid; the `slides-3` variation switches to exactly 3 slides across a 3-column grid instead \u2014 pick one carousel size and match your row count to it. Other variations: `dark` (knockout color treatment) and the text-sizing modifier classes `heading-<1\u20136>`, `body-<sm|md|lg|xl>`, `button-<sm|md|lg|xl>`. Important gotcha: content is located by row position, not markers, so adding/removing/reordering rows (or authoring a slide count that doesn't match whichever layout you're using) breaks the layout.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 1257, "lastUpdated": "Aug 13, 2026", "lastUpdatedTs": 1786664833.2542722, "techSpecUrl": null, "html": "<h1>Hub Hero</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A large scroll-driven hero with a fading header, a parallax image grid, and a horizontal carousel of slides that appear to \"rise\" out of the grid as you scroll \u2014 used as the top-of-page hero for hub/landing pages wanting a cinematic, scroll-linked reveal instead of a static hero. Authored as a strict, fixed sequence of 8 rows (header, image-grid rows, carousel header, slide rows). By default the carousel takes exactly 4 slides across a 5-column grid; the <code>slides-3</code> variation switches to exactly 3 slides across a 3-column grid instead \u2014 pick one carousel size and match your row count to it. Other variations: <code>dark</code> (knockout color treatment) and the text-sizing modifier classes <code>heading-&lt;1\u20136&gt;</code>, <code>body-&lt;sm|md|lg|xl&gt;</code>, <code>button-&lt;sm|md|lg|xl&gt;</code>. Important gotcha: content is located by row position, not markers, so adding/removing/reordering rows (or authoring a slide count that doesn't match whichever layout you're using) breaks the layout.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>This block has a <strong>strict row order</strong> \u2014 it always expects exactly 8 rows, in this exact sequence. Which rows are \"image grid\" rows vs. \"carousel slide\" rows depends on whether you're using the default 4-slide layout or the <code>slides-3</code> variation (see Variations) \u2014 getting the row count, order, or slide count wrong for whichever layout you're using will break the scroll math and column mapping.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Default (4 slides)</th>\n<th>With <code>slides-3</code></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 \u2014 Header</td>\n<td>One cell containing (in order): an optional eyebrow line, a heading (<code>h1</code>\u2013<code>h6</code>), body paragraph(s), and a CTA paragraph with an inline icon image + link, e.g. <code>![icon](https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg)</code> followed by <code>[Explore now \\| Explore Creative Cloud plans](https://...)</code>. Same <code>text \\| aria-label</code> pipe convention as Floating CTA: text before <code>\\|</code> is shown, text after becomes the link's <code>aria-label</code>.</td>\n<td>Same</td>\n</tr>\n<tr>\n<td>2 \u2014 Image grid, row A</td>\n<td>Up to 5 cells, each with one image \u2014 the \"top\" image for parallax columns 1\u20135.</td>\n<td>Up to 3 cells \u2014 the \"top\" image for columns 1\u20133.</td>\n</tr>\n<tr>\n<td>3 \u2014 Image grid, row B</td>\n<td>Up to 5 cells, each with one image \u2014 stacks under the matching column from row 2. Columns 2 and 4 automatically get a 3rd image cloned from carousel slide 2's and slide 4's image \u2014 don't add a 3rd image yourself for those columns.</td>\n<td>Up to 3 cells, stacks under row 2's columns. Columns 1 and 3 automatically get a 3rd image cloned from carousel slide 1's and slide 3's image instead.</td>\n</tr>\n<tr>\n<td>4 \u2014 Image grid, row C</td>\n<td><em>(not used \u2014 only 2 grid rows in the default layout)</em></td>\n<td>Up to 3 cells \u2014 a third stacked image row per column (the default layout only has 2 grid rows; <code>slides-3</code> adds this one).</td>\n</tr>\n<tr>\n<td>4 (default) / 5 (<code>slides-3</code>) \u2014 Carousel header</td>\n<td>One cell, text only (no image) \u2014 the small heading shown above the horizontal carousel, e.g. \"Explore what's new.\" This row is identified by <em>not</em> having an image, so keep it image-free.</td>\n<td>Same, just one row later.</td>\n</tr>\n<tr>\n<td>5\u20138 (default) / 6\u20138 (<code>slides-3</code>) \u2014 Carousel slides</td>\n<td>Exactly <strong>4</strong> slide rows.</td>\n<td>Exactly <strong>3</strong> slide rows.</td>\n</tr>\n<tr>\n<td>...cell 1 (left)</td>\n<td>An eyebrow line, a heading, then a link paragraph, e.g. <code>[See details](https://...)</code>. Only the eyebrow and heading are visually rendered on the slide \u2014 the link paragraph is <em>not</em> shown; only its <code>href</code> is used, to make the whole slide clickable. The link text (before a <code>\\|</code>, if present) is also used to build the carousel's accessible name on the first slide.</td>\n<td>Same.</td>\n</tr>\n<tr>\n<td>...cell 2 (right)</td>\n<td>One media item: an image, or a video (paste a video/MP4 link \u2014 Milo's standard video authoring converts it automatically). Optionally, a second paragraph/image after the media becomes a small icon overlay on the slide \u2014 but this overlay currently only has visual styling in the <code>slides-3</code> layout; adding it in the default 4-slide layout has no defined position/appearance yet.</td>\n<td>Same, and the icon overlay is fully styled here (positioned top-left of the slide media, fades in on scroll).</td>\n</tr>\n</tbody>\n</table>\n<p>Either way, the block always totals exactly 8 rows \u2014 <code>slides-3</code> just redistributes them (3 grid rows + 3 slides instead of 2 grid rows + 4 slides).</p>\n<h2>Variations</h2>\n<p>Add modifier classes to the block name cell (these are read from the block's own class list, e.g. \"Hub Hero (heading-2, body-md, button-sm, slides-3)\"):</p>\n<table>\n<thead>\n<tr>\n<th>Class</th>\n<th>Effect</th>\n<th>Default</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>slides-3</code><sup class=\"fn-ref\" data-fn=\"slides-3\" title=\"Click for details\">1</sup></td>\n<td>Switches the carousel from 4 slides/5-column grid to 3 slides/3-column grid \u2014 see Authoring instructions for the row-count differences. Also enables the slide-media icon overlay's visual styling.</td>\n<td>Off (4-slide layout)</td>\n</tr>\n<tr>\n<td><code>dark</code><sup class=\"fn-ref\" data-fn=\"slides-3\" title=\"Click for details\">1</sup></td>\n<td>Knockout color treatment: dark background, gray-900 slide/header/footer/media backgrounds, and subheading-colored text throughout the carousel.</td>\n<td>Off (light)</td>\n</tr>\n<tr>\n<td><code>heading-&lt;1\u20136&gt;</code></td>\n<td>Size of the header's heading.</td>\n<td><code>heading-1</code></td>\n</tr>\n<tr>\n<td><code>body-&lt;sm\\|md\\|lg\\|xl&gt;</code></td>\n<td>Size of the header's body text.</td>\n<td><code>body-lg</code></td>\n</tr>\n<tr>\n<td><code>button-&lt;sm\\|md\\|lg\\|xl&gt;</code></td>\n<td>Size of the header CTA button.</td>\n<td><code>button-lg</code></td>\n</tr>\n</tbody>\n</table>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"5\">Hub Hero (heading-1, body-lg, button-lg)</th></tr>\n<tr><td><p>Eyebrow text</p>\n<h2>Discover what's possible</h2>\n<p>Body copy about the hub.</p>\n<p><img alt=\"icon\" src=\"https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg\" /> <a href=\"https://adobe.com/cc\">Explore now | Explore Creative Cloud plans</a></p></td><td></td><td></td><td></td><td></td></tr>\n<tr><td><img alt=\"grid1a\" src=\"/g1a.png\" /></td><td><img alt=\"grid2a\" src=\"/g2a.png\" /></td><td><img alt=\"grid3a\" src=\"/g3a.png\" /></td><td><img alt=\"grid4a\" src=\"/g4a.png\" /></td><td><img alt=\"grid5a\" src=\"/g5a.png\" /></td></tr>\n<tr><td><img alt=\"grid1b\" src=\"/g1b.png\" /></td><td><img alt=\"grid2b\" src=\"/g2b.png\" /></td><td><img alt=\"grid3b\" src=\"/g3b.png\" /></td><td><img alt=\"grid4b\" src=\"/g4b.png\" /></td><td><img alt=\"grid5b\" src=\"/g5b.png\" /></td></tr>\n<tr><td><h3>Explore the latest releases</h3></td><td></td><td></td><td></td><td></td></tr>\n<tr><td><p>Eyebrow 1</p>\n<h4>Photoshop</h4>\n<p><a href=\"https://adobe.com/ps\">See details</a></p></td><td><img alt=\"slide1\" src=\"/s1.png\" /></td><td></td><td></td><td></td></tr>\n<tr><td><p>Eyebrow 2</p>\n<h4>Illustrator</h4>\n<p><a href=\"https://adobe.com/ai\">See details</a></p></td><td><img alt=\"slide2\" src=\"/s2.png\" /></td><td></td><td></td><td></td></tr>\n<tr><td><p>Eyebrow 3</p>\n<h4>Premiere Pro</h4>\n<p><a href=\"https://adobe.com/pr\">See details</a></p></td><td><img alt=\"slide3\" src=\"/s3.png\" /></td><td></td><td></td><td></td></tr>\n<tr><td><p>Eyebrow 4</p>\n<h4>Lightroom</h4>\n<p><a href=\"https://adobe.com/lr\">See details</a></p></td><td><img alt=\"slide4\" src=\"/s4.png\" /></td><td></td><td></td><td></td></tr>\n</table>\n\n<p>(The pipe-table mockup above simplifies multi-paragraph cells with <code>\\n</code> \u2014 in the actual authoring doc each cell is a normal table cell containing multiple paragraphs/lines.)</p>\n<h2>Notes</h2>\n<ul>\n<li>This is one of the most fragile authoring contracts in the codebase: the JS locates rows by <strong>position</strong> (<code>div:first-child</code>, <code>nth-child(2)</code>, <code>nth-child(3)</code>, \"not first &amp; no image\" for the carousel header, and \"last N rows\" for slides), not by explicit markers. Adding, removing, or reordering rows will misassign content.</li>\n<li>Slide count must match the layout you're using: exactly 4 for the default layout, or exactly 3 with <code>slides-3</code><sup class=\"fn-ref\" data-fn=\"slides-3\" title=\"Click for details\">1</sup> (the column-offset math and grid-row count assume whichever one you picked). Fewer or more will visually break the scroll animation.</li>\n<li>The block is heavily scroll/animation driven (CSS <code>animation-timeline</code>), with full <code>prefers-reduced-motion</code> fallbacks and a <code>@supports not (animation-timeline: view())</code> fallback for browsers without scroll-driven animation support (e.g. Firefox) \u2014 no extra authoring is needed for these, they're automatic.</li>\n<li>On mobile, video slides autoplay/rewind based on scroll position via <code>IntersectionObserver</code>; this is automatic once a video is present in a slide's media cell.</li>\n<li>Video gotcha: pair the video link with its poster image as two adjacent cells in the same row \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the scroll-triggered play/pause above to actually kick in, the video link's hash needs both <code>autoplay</code> and <code>viewportplay</code>, e.g. <code>#autoplay|viewportplay</code>. <span class=\"autoplay-warn\">Using <code>#autoplay</code> alone plays the video immediately on page load \u2014 by the time it scrolls into view it has already finished, so visitors just see its frozen last frame.</span></li>\n<li>The first slide gets a unique, more descriptive <code>aria-label</code> (built from its link text) since assistive tech announces it as the start of the carousel; the rest just get \"N of &lt;slide count&gt;.\"</li>\n</ul>", "footnotes": {"slides-3": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/pull/6406\">#6406</a> \u2014 Denys Fedotov, 2026-08-05"}}, "raw": "# Hub Hero\n\n> **Quick summary:** A large scroll-driven hero with a fading header, a parallax image grid, and a horizontal carousel of slides that appear to \"rise\" out of the grid as you scroll \u2014 used as the top-of-page hero for hub/landing pages wanting a cinematic, scroll-linked reveal instead of a static hero. Authored as a strict, fixed sequence of 8 rows (header, image-grid rows, carousel header, slide rows). By default the carousel takes exactly 4 slides across a 5-column grid; the `slides-3` variation switches to exactly 3 slides across a 3-column grid instead \u2014 pick one carousel size and match your row count to it. Other variations: `dark` (knockout color treatment) and the text-sizing modifier classes `heading-<1\u20136>`, `body-<sm|md|lg|xl>`, `button-<sm|md|lg|xl>`. Important gotcha: content is located by row position, not markers, so adding/removing/reordering rows (or authoring a slide count that doesn't match whichever layout you're using) breaks the layout.\n\n## Authoring instructions\n\nThis block has a **strict row order** \u2014 it always expects exactly 8 rows, in this exact sequence. Which rows are \"image grid\" rows vs. \"carousel slide\" rows depends on whether you're using the default 4-slide layout or the `slides-3` variation (see Variations) \u2014 getting the row count, order, or slide count wrong for whichever layout you're using will break the scroll math and column mapping.\n\n| Row | Default (4 slides) | With `slides-3` |\n|---|---|---|\n| 1 \u2014 Header | One cell containing (in order): an optional eyebrow line, a heading (`h1`\u2013`h6`), body paragraph(s), and a CTA paragraph with an inline icon image + link, e.g. `![icon](https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg)` followed by `[Explore now \\| Explore Creative Cloud plans](https://...)`. Same `text \\| aria-label` pipe convention as Floating CTA: text before `\\|` is shown, text after becomes the link's `aria-label`. | Same |\n| 2 \u2014 Image grid, row A | Up to 5 cells, each with one image \u2014 the \"top\" image for parallax columns 1\u20135. | Up to 3 cells \u2014 the \"top\" image for columns 1\u20133. |\n| 3 \u2014 Image grid, row B | Up to 5 cells, each with one image \u2014 stacks under the matching column from row 2. Columns 2 and 4 automatically get a 3rd image cloned from carousel slide 2's and slide 4's image \u2014 don't add a 3rd image yourself for those columns. | Up to 3 cells, stacks under row 2's columns. Columns 1 and 3 automatically get a 3rd image cloned from carousel slide 1's and slide 3's image instead. |\n| 4 \u2014 Image grid, row C | *(not used \u2014 only 2 grid rows in the default layout)* | Up to 3 cells \u2014 a third stacked image row per column (the default layout only has 2 grid rows; `slides-3` adds this one). |\n| 4 (default) / 5 (`slides-3`) \u2014 Carousel header | One cell, text only (no image) \u2014 the small heading shown above the horizontal carousel, e.g. \"Explore what's new.\" This row is identified by *not* having an image, so keep it image-free. | Same, just one row later. |\n| 5\u20138 (default) / 6\u20138 (`slides-3`) \u2014 Carousel slides | Exactly **4** slide rows. | Exactly **3** slide rows. |\n| ...cell 1 (left) | An eyebrow line, a heading, then a link paragraph, e.g. `[See details](https://...)`. Only the eyebrow and heading are visually rendered on the slide \u2014 the link paragraph is *not* shown; only its `href` is used, to make the whole slide clickable. The link text (before a `\\|`, if present) is also used to build the carousel's accessible name on the first slide. | Same. |\n| ...cell 2 (right) | One media item: an image, or a video (paste a video/MP4 link \u2014 Milo's standard video authoring converts it automatically). Optionally, a second paragraph/image after the media becomes a small icon overlay on the slide \u2014 but this overlay currently only has visual styling in the `slides-3` layout; adding it in the default 4-slide layout has no defined position/appearance yet. | Same, and the icon overlay is fully styled here (positioned top-left of the slide media, fades in on scroll). |\n\nEither way, the block always totals exactly 8 rows \u2014 `slides-3` just redistributes them (3 grid rows + 3 slides instead of 2 grid rows + 4 slides).\n\n## Variations\n\nAdd modifier classes to the block name cell (these are read from the block's own class list, e.g. \"Hub Hero (heading-2, body-md, button-sm, slides-3)\"):\n\n| Class | Effect | Default |\n|---|---|---|\n| `slides-3`[^slides-3] | Switches the carousel from 4 slides/5-column grid to 3 slides/3-column grid \u2014 see Authoring instructions for the row-count differences. Also enables the slide-media icon overlay's visual styling. | Off (4-slide layout) |\n| `dark`[^slides-3] | Knockout color treatment: dark background, gray-900 slide/header/footer/media backgrounds, and subheading-colored text throughout the carousel. | Off (light) |\n| `heading-<1\u20136>` | Size of the header's heading. | `heading-1` |\n| `body-<sm\\|md\\|lg\\|xl>` | Size of the header's body text. | `body-lg` |\n| `button-<sm\\|md\\|lg\\|xl>` | Size of the header CTA button. | `button-lg` |\n\n## Example\n\n```\n| Hub Hero (heading-1, body-lg, button-lg)                                    |\n|-------------------------------------------------------------------------------|\n| Eyebrow text  \\n ## Discover what's possible  \\n Body copy about the hub.  \\n ![icon](https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg) [Explore now \\| Explore Creative Cloud plans](https://adobe.com/cc) |\n| ![grid1a](/g1a.png) | ![grid2a](/g2a.png) | ![grid3a](/g3a.png) | ![grid4a](/g4a.png) | ![grid5a](/g5a.png) |\n| ![grid1b](/g1b.png) | ![grid2b](/g2b.png) | ![grid3b](/g3b.png) | ![grid4b](/g4b.png) | ![grid5b](/g5b.png) |\n| ### Explore the latest releases |\n| Eyebrow 1 \\n #### Photoshop \\n [See details](https://adobe.com/ps) | ![slide1](/s1.png) |\n| Eyebrow 2 \\n #### Illustrator \\n [See details](https://adobe.com/ai) | ![slide2](/s2.png) |\n| Eyebrow 3 \\n #### Premiere Pro \\n [See details](https://adobe.com/pr) | ![slide3](/s3.png) |\n| Eyebrow 4 \\n #### Lightroom \\n [See details](https://adobe.com/lr) | ![slide4](/s4.png) |\n```\n\n(The pipe-table mockup above simplifies multi-paragraph cells with `\\n` \u2014 in the actual authoring doc each cell is a normal table cell containing multiple paragraphs/lines.)\n\n## Notes\n\n- This is one of the most fragile authoring contracts in the codebase: the JS locates rows by **position** (`div:first-child`, `nth-child(2)`, `nth-child(3)`, \"not first & no image\" for the carousel header, and \"last N rows\" for slides), not by explicit markers. Adding, removing, or reordering rows will misassign content.\n- Slide count must match the layout you're using: exactly 4 for the default layout, or exactly 3 with `slides-3`[^slides-3] (the column-offset math and grid-row count assume whichever one you picked). Fewer or more will visually break the scroll animation.\n- The block is heavily scroll/animation driven (CSS `animation-timeline`), with full `prefers-reduced-motion` fallbacks and a `@supports not (animation-timeline: view())` fallback for browsers without scroll-driven animation support (e.g. Firefox) \u2014 no extra authoring is needed for these, they're automatic.\n- On mobile, video slides autoplay/rewind based on scroll position via `IntersectionObserver`; this is automatic once a video is present in a slide's media cell.\n- Video gotcha: pair the video link with its poster image as two adjacent cells in the same row \u2014 Milo grabs the poster from whichever image sits next to the video link, and won't show one otherwise. For the scroll-triggered play/pause above to actually kick in, the video link's hash needs both `autoplay` and `viewportplay`, e.g. `#autoplay|viewportplay`. Using `#autoplay` alone plays the video immediately on page load \u2014 by the time it scrolls into view it has already finished, so visitors just see its frozen last frame.\n- The first slide gets a unique, more descriptive `aria-label` (built from its link text) since assistive tech announces it as the start of the carousel; the rest just get \"N of &lt;slide count&gt;.\"\n\n[^slides-3]: [#6406](https://github.com/adobecom/milo/pull/6406) \u2014 Denys Fedotov, 2026-08-05\n"}, {"slug": "iframe", "title": "Iframe", "summary": "Embeds an external page (scheduling widget, calendar, third-party tool, etc.) inline in a responsive (16:9 by default) `<iframe>`, for when you need it directly in the page flow rather than just linking out. Authored as a single row/cell containing one link \u2014 its `href` becomes the iframe `src`; any other content in the cell is ignored. The only variation is passing an extra class in parentheses after the block name (e.g. `iframe-calendar`, which switches to a fixed 1500px height for scheduling widgets); there are no other author-facing variations.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 445, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868216.662796, "techSpecUrl": null, "html": "<h1>Iframe</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> Embeds an external page (scheduling widget, calendar, third-party tool, etc.) inline in a responsive (16:9 by default) <code>&lt;iframe&gt;</code>, for when you need it directly in the page flow rather than just linking out. Authored as a single row/cell containing one link \u2014 its <code>href</code> becomes the iframe <code>src</code>; any other content in the cell is ignored. The only variation is passing an extra class in parentheses after the block name (e.g. <code>iframe-calendar</code>, which switches to a fixed 1500px height for scheduling widgets); there are no other author-facing variations.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>Author a one-row, one-column table named \"Iframe\" whose single cell contains a link. The block looks for the first link anywhere inside it and uses that link's URL as the iframe's source \u2014 any other content in the cell is ignored.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Iframe</td>\n<td>A single link (the link text can be anything; the URL is what matters, e.g. <code>https://example.com/scheduler</code>).</td>\n</tr>\n</tbody>\n</table>\n<p>Required: the cell must contain a real hyperlink \u2014 if no link is found, the block does nothing (no iframe is rendered and the block is left/removed with no visible output).</p>\n<h2>Variations</h2>\n<p>Any extra class typed in parentheses after the block name (e.g. \"Iframe (iframe-calendar)\") is carried straight through onto the rendered embed wrapper (<code>&lt;div class=\"milo-iframe iframe-calendar\"&gt;</code>), so it can be targeted with CSS.</p>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author it</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>iframe-calendar</code></td>\n<td>Fixed 1500px height, no padding-bottom (instead of the default responsive 16:9 box) \u2014 sized for scheduling/calendar embeds.</td>\n<td>Name the block \"Iframe (iframe-calendar)\"</td>\n</tr>\n</tbody>\n</table>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Iframe</th></tr>\n<tr><td><a href=\"https://example.com/scheduling-widget\">Book a demo</a></td></tr>\n</table>\n\n<p>With the calendar variation:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Iframe (iframe-calendar)</th></tr>\n<tr><td><a href=\"https://example.com/calendar-widget\">Schedule a call</a></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>If the linked page is same-origin, the block tries to read an <code>&lt;h1&gt;</code>\u2013<code>&lt;h6&gt;</code> from inside the iframe once it loads and uses that as the iframe's accessible <code>title</code>; for cross-origin pages it falls back to the link's <code>aria-label</code> if one is set on the authored link (there is no simple authoring UI for <code>aria-label</code> in most doc editors, so accessible titling of cross-origin embeds is not guaranteed \u2014 flag this to a developer if the embedded page needs a specific title).</li>\n<li>When an Iframe block ends up inside a Modal (see the Modal block), sizing changes automatically (e.g., min-width 80vw, or full-bleed for <code>commerce-frame</code>/<code>three-in-one</code> modals) \u2014 no extra authoring needed.</li>\n<li>If the linked page posts messages from <code>https://plan.adobe.com</code> or <code>https://stage.plan.adobe.com</code> (Adobe's Manage Plan flow), the block listens for close/external-navigation events from it automatically; this only applies to those specific Adobe domains.</li>\n</ul>", "footnotes": {}, "raw": "# Iframe\n\n> **Quick summary:** Embeds an external page (scheduling widget, calendar, third-party tool, etc.) inline in a responsive (16:9 by default) `<iframe>`, for when you need it directly in the page flow rather than just linking out. Authored as a single row/cell containing one link \u2014 its `href` becomes the iframe `src`; any other content in the cell is ignored. The only variation is passing an extra class in parentheses after the block name (e.g. `iframe-calendar`, which switches to a fixed 1500px height for scheduling widgets); there are no other author-facing variations.\n\n## Authoring instructions\n\nAuthor a one-row, one-column table named \"Iframe\" whose single cell contains a link. The block looks for the first link anywhere inside it and uses that link's URL as the iframe's source \u2014 any other content in the cell is ignored.\n\n| Row | Content |\n|---|---|\n| Iframe | A single link (the link text can be anything; the URL is what matters, e.g. `https://example.com/scheduler`). |\n\nRequired: the cell must contain a real hyperlink \u2014 if no link is found, the block does nothing (no iframe is rendered and the block is left/removed with no visible output).\n\n## Variations\n\nAny extra class typed in parentheses after the block name (e.g. \"Iframe (iframe-calendar)\") is carried straight through onto the rendered embed wrapper (`<div class=\"milo-iframe iframe-calendar\">`), so it can be targeted with CSS.\n\n| Variation | Effect | How to author it |\n|---|---|---|\n| `iframe-calendar` | Fixed 1500px height, no padding-bottom (instead of the default responsive 16:9 box) \u2014 sized for scheduling/calendar embeds. | Name the block \"Iframe (iframe-calendar)\" |\n\n## Example\n\n```\n| Iframe |\n| --- |\n| [Book a demo](https://example.com/scheduling-widget) |\n```\n\nWith the calendar variation:\n\n```\n| Iframe (iframe-calendar) |\n| --- |\n| [Schedule a call](https://example.com/calendar-widget) |\n```\n\n## Notes\n\n- If the linked page is same-origin, the block tries to read an `<h1>`\u2013`<h6>` from inside the iframe once it loads and uses that as the iframe's accessible `title`; for cross-origin pages it falls back to the link's `aria-label` if one is set on the authored link (there is no simple authoring UI for `aria-label` in most doc editors, so accessible titling of cross-origin embeds is not guaranteed \u2014 flag this to a developer if the embedded page needs a specific title).\n- When an Iframe block ends up inside a Modal (see the Modal block), sizing changes automatically (e.g., min-width 80vw, or full-bleed for `commerce-frame`/`three-in-one` modals) \u2014 no extra authoring needed.\n- If the linked page posts messages from `https://plan.adobe.com` or `https://stage.plan.adobe.com` (Adobe's Manage Plan flow), the block listens for close/external-navigation events from it automatically; this only applies to those specific Adobe domains.\n"}, {"slug": "logo-ticker", "title": "Logo Ticker", "summary": "A horizontal strip of partner/customer logos that auto-scrolls in a seamless loop (or centers statically if the logos already fit) \u2014 commonly used for \"Trusted by\" / partner-logo strips. Authored as one row of icon-shortcode cells, plus an optional second row with a plain-text description used only as the ticker's `aria-label`. No author-facing variations \u2014 the only class toggled (`is-static`) is computed automatically at runtime, not set by the author.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 467, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868187.3849287, "techSpecUrl": null, "html": "<h1>Logo Ticker</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A horizontal strip of partner/customer logos that auto-scrolls in a seamless loop (or centers statically if the logos already fit) \u2014 commonly used for \"Trusted by\" / partner-logo strips. Authored as one row of icon-shortcode cells, plus an optional second row with a plain-text description used only as the ticker's <code>aria-label</code>. No author-facing variations \u2014 the only class toggled (<code>is-static</code>) is computed automatically at runtime, not set by the author.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>One or more cells, each containing a single logo authored with Milo's standard icon shortcode syntax \u2014 type <code>:some-icon-name:</code> in the cell (the authoring pipeline turns this into <code>&lt;span class=\"icon icon-some-icon-name\"&gt;</code>, which the icons feature then resolves to the actual logo image/SVG). The block reads every <code>span.icon</code> anywhere inside it, in document order, as one logo each.</td>\n</tr>\n<tr>\n<td>2 (optional)</td>\n<td>A single text cell with a plain-language description of the logo set, e.g. \"Logos of Adobe Creative Cloud partner brands.\" This text is <strong>not displayed</strong> \u2014 it's used only as the <code>aria-label</code> on the ticker (which is exposed to assistive tech as <code>role=\"img\"</code>, i.e. one described image rather than a long list of individual logo names).</td>\n</tr>\n</tbody>\n</table>\n<p>If no <code>span.icon</code> elements are found anywhere in the block, nothing renders.</p>\n<h2>Variations</h2>\n<p>This block has no author-facing variations. There are no modifier classes checked in the JS, and the only class toggled (<code>is-static</code>) is computed automatically at runtime based on whether the logos already fit the container \u2014 not something an author sets.</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"4\">Logo Ticker</th></tr>\n<tr><td>:adobe-logo:</td><td>:microsoft-logo:</td><td>:ibm-logo:</td><td>:sap-logo:</td></tr>\n<tr><td>Logos of Adobe's technology partners</td><td></td><td></td><td></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>The block clones the full logo set a second time internally to create a seamless scrolling loop; you only author the logos once (row 1) \u2014 do not duplicate them yourself.</li>\n<li>The duplicate (cloned) set is marked <code>aria-hidden=\"true\"</code> so screen readers only encounter the logos once; combined with the row-2 description and <code>role=\"img\"</code>, the whole ticker reads as a single described image rather than a list of links/logos.</li>\n<li>Scrolling uses a CSS scroll-driven animation (<code>animation-timeline</code>) and only runs when <code>prefers-reduced-motion: no-preference</code>; otherwise the logos stay static. It also only animates when there are enough logos to overflow the container \u2014 a short logo list will simply be centered, not looped.</li>\n<li>In RTL layouts the drift direction is automatically mirrored \u2014 no authoring action needed.</li>\n<li>On dark backgrounds, any logo authored as an inline SVG automatically has its fill color switched to a light gray so it stays legible \u2014 this happens automatically whenever the surrounding section/page (or the block itself) is set to dark; there's no separate authoring step for the logos themselves.</li>\n</ul>", "footnotes": {}, "raw": "# Logo Ticker\n\n> **Quick summary:** A horizontal strip of partner/customer logos that auto-scrolls in a seamless loop (or centers statically if the logos already fit) \u2014 commonly used for \"Trusted by\" / partner-logo strips. Authored as one row of icon-shortcode cells, plus an optional second row with a plain-text description used only as the ticker's `aria-label`. No author-facing variations \u2014 the only class toggled (`is-static`) is computed automatically at runtime, not set by the author.\n\n## Authoring instructions\n\n| Row | Content |\n|---|---|\n| 1 | One or more cells, each containing a single logo authored with Milo's standard icon shortcode syntax \u2014 type `:some-icon-name:` in the cell (the authoring pipeline turns this into `<span class=\"icon icon-some-icon-name\">`, which the icons feature then resolves to the actual logo image/SVG). The block reads every `span.icon` anywhere inside it, in document order, as one logo each. |\n| 2 (optional) | A single text cell with a plain-language description of the logo set, e.g. \"Logos of Adobe Creative Cloud partner brands.\" This text is **not displayed** \u2014 it's used only as the `aria-label` on the ticker (which is exposed to assistive tech as `role=\"img\"`, i.e. one described image rather than a long list of individual logo names). |\n\nIf no `span.icon` elements are found anywhere in the block, nothing renders.\n\n## Variations\n\nThis block has no author-facing variations. There are no modifier classes checked in the JS, and the only class toggled (`is-static`) is computed automatically at runtime based on whether the logos already fit the container \u2014 not something an author sets.\n\n## Example\n\n```\n| Logo Ticker                                         |\n|-------------------------------------------------------|\n| :adobe-logo: | :microsoft-logo: | :ibm-logo: | :sap-logo: |\n| Logos of Adobe's technology partners                    |\n```\n\n## Notes\n\n- The block clones the full logo set a second time internally to create a seamless scrolling loop; you only author the logos once (row 1) \u2014 do not duplicate them yourself.\n- The duplicate (cloned) set is marked `aria-hidden=\"true\"` so screen readers only encounter the logos once; combined with the row-2 description and `role=\"img\"`, the whole ticker reads as a single described image rather than a list of links/logos.\n- Scrolling uses a CSS scroll-driven animation (`animation-timeline`) and only runs when `prefers-reduced-motion: no-preference`; otherwise the logos stay static. It also only animates when there are enough logos to overflow the container \u2014 a short logo list will simply be centered, not looped.\n- In RTL layouts the drift direction is automatically mirrored \u2014 no authoring action needed.\n- On dark backgrounds, any logo authored as an inline SVG automatically has its fill color switched to a light gray so it stays legible \u2014 this happens automatically whenever the surrounding section/page (or the block itself) is set to dark; there's no separate authoring step for the logos themselves.\n"}, {"slug": "martech-metadata", "title": "Martech Metadata", "summary": "A hidden, config-only block that never renders visibly and removes itself from the page after running \u2014 it patches Adobe Analytics `daa-ll` tracking labels on localized pages so they match the canonical English label, without changing the visible on-page text. Authored as a simple key/value table (on-page label \u2192 replacement label), one row per label pair. It has no variations and produces no visible markup.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 370, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868213.2465498, "techSpecUrl": null, "html": "<h1>Martech Metadata</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A hidden, config-only block that never renders visibly and removes itself from the page after running \u2014 it patches Adobe Analytics <code>daa-ll</code> tracking labels on localized pages so they match the canonical English label, without changing the visible on-page text. Authored as a simple key/value table (on-page label \u2192 replacement label), one row per label pair. It has no variations and produces no visible markup.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>Author a table named \"Martech Metadata\" where every row has exactly two columns: a key and a value. The block reads each row and, for any row with two cells, treats the first cell as the key and the second as the value.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Any row</td>\n<td>Column 1: the on-page label text as it currently reads on <strong>this</strong> (localized) page \u2014 e.g. the visible text of a link, button, or heading used for analytics tracking. Column 2: the value you want substituted in its place when the analytics label is generated (typically the canonical English label).</td>\n</tr>\n</tbody>\n</table>\n<p>Both columns are required \u2014 a row with an empty key or empty value is silently skipped. Both the key and the value are run through the same sanitizer used for analytics labels (non-alphanumeric characters are stripped/normalized, leading/trailing underscores trimmed), so match the text as literally as possible.</p>\n<h2>Variations</h2>\n<p>This block has no author-facing variations. It has no visible output and no modifier classes are checked anywhere in its code.</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Martech Metadata</th></tr>\n<tr><td>En savoir plus</td><td>Learn more</td></tr>\n<tr><td>Achetez maintenant</td><td>Buy now</td></tr>\n</table>\n\n<p>This maps the French labels \"En savoir plus\" and \"Achetez maintenant\" back to their English tracking equivalents so cross-locale analytics reporting stays comparable.</p>\n<h2>Notes</h2>\n<ul>\n<li>Place this block anywhere on the page \u2014 it produces no visible markup and detaches itself from the DOM once processed.</li>\n<li>Only one Martech Metadata block's values are used per page; if you add more than one, later rows simply merge into (and can overwrite) the same lookup table.</li>\n<li>This block only affects the <code>daa-ll</code> analytics attribute value, never the visible text authors see on the page.</li>\n</ul>", "footnotes": {}, "raw": "# Martech Metadata\n\n> **Quick summary:** A hidden, config-only block that never renders visibly and removes itself from the page after running \u2014 it patches Adobe Analytics `daa-ll` tracking labels on localized pages so they match the canonical English label, without changing the visible on-page text. Authored as a simple key/value table (on-page label \u2192 replacement label), one row per label pair. It has no variations and produces no visible markup.\n\n## Authoring instructions\n\nAuthor a table named \"Martech Metadata\" where every row has exactly two columns: a key and a value. The block reads each row and, for any row with two cells, treats the first cell as the key and the second as the value.\n\n| Row | Content |\n|---|---|\n| Any row | Column 1: the on-page label text as it currently reads on **this** (localized) page \u2014 e.g. the visible text of a link, button, or heading used for analytics tracking. Column 2: the value you want substituted in its place when the analytics label is generated (typically the canonical English label). |\n\nBoth columns are required \u2014 a row with an empty key or empty value is silently skipped. Both the key and the value are run through the same sanitizer used for analytics labels (non-alphanumeric characters are stripped/normalized, leading/trailing underscores trimmed), so match the text as literally as possible.\n\n## Variations\n\nThis block has no author-facing variations. It has no visible output and no modifier classes are checked anywhere in its code.\n\n## Example\n\n```\n| Martech Metadata |\n| --- |\n| En savoir plus | Learn more |\n| Achetez maintenant | Buy now |\n```\n\nThis maps the French labels \"En savoir plus\" and \"Achetez maintenant\" back to their English tracking equivalents so cross-locale analytics reporting stays comparable.\n\n## Notes\n\n- Place this block anywhere on the page \u2014 it produces no visible markup and detaches itself from the DOM once processed.\n- Only one Martech Metadata block's values are used per page; if you add more than one, later rows simply merge into (and can overwrite) the same lookup table.\n- This block only affects the `daa-ll` analytics attribute value, never the visible text authors see on the page.\n"}, {"slug": "modal-metadata", "title": "Modal Metadata", "summary": "A hidden, config-only block (`display: none`, no visible output) authored as key/value rows (`style`, `curtain`, `background`) \u2014 but it only has any effect when placed inside a fragment that is being loaded into a [Modal](./modal.md) dialog; viewed as a standalone page, it does nothing. `style` accepts comma-separated keywords that add CSS classes to the dialog; `curtain: off` removes the dimmed background overlay.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 455, "lastUpdated": "Aug 6, 2026", "lastUpdatedTs": 1786042635.2292676, "techSpecUrl": null, "html": "<h1>Modal Metadata</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A hidden, config-only block (<code>display: none</code>, no visible output) authored as key/value rows (<code>style</code>, <code>curtain</code>, <code>background</code>) \u2014 but it only has any effect when placed inside a fragment that is being loaded into a <a href=\"./modal.md\">Modal</a> dialog; viewed as a standalone page, it does nothing. <code>style</code> accepts comma-separated keywords that add CSS classes to the dialog; <code>curtain: off</code> removes the dimmed background overlay.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>Author a table named \"Modal Metadata\" inside the fragment that serves as a modal's content, with one key/value pair per row (same convention as a Section Metadata block).</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>style</code></td>\n<td>One or more modifier keywords, comma-separated (e.g. <code>xl-size, tall video</code>). Spaces in a keyword become hyphens, and each keyword is added as a CSS class to the modal dialog (<code>.dialog-modal</code>). See <a href=\"./modal.md\">modal.md</a> for the list of supported keywords (<code>three-in-one</code>, <code>xl-size</code>, <code>s-size</code>, <code>tall-video</code>, <code>commerce-frame</code>, <code>dynamic-height</code>, <code>upgrade-flow-modal</code>, <code>hide-close-button</code>, <code>manage-plan-cancel</code>).</td>\n</tr>\n<tr>\n<td><code>curtain</code></td>\n<td>Set the value to <code>off</code> to remove the dark background overlay behind the modal and skip disabling scroll/interaction on the rest of the page. Omit this row (or use any other value) to keep the default dimmed curtain.</td>\n</tr>\n<tr>\n<td><code>background</code></td>\n<td>Optional, only used when <code>style</code> includes <code>tall-video</code>: an image or a background color (same authoring pattern as Section Metadata's <code>background</code> key) applied to the modal.</td>\n</tr>\n</tbody>\n</table>\n<p>If the fragment isn't actually being rendered inside a modal dialog (e.g. you're previewing the fragment directly), this block has no effect.</p>\n<h2>Variations</h2>\n<p>This block itself has no modifier classes on its own block name \u2014 all of its configurability comes from the key/value rows above, not from a \"Modal Metadata (variant)\" naming convention.</p>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Modal Metadata</th></tr>\n<tr><td>style</td><td>xl-size</td></tr>\n<tr><td>curtain</td><td>off</td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>Because this block is invisible and only \"activates\" inside a modal, do not expect to see any change when previewing the fragment as a normal page \u2014 always test by opening the link that triggers the modal.</li>\n<li><code>style</code> values are matched to specific CSS in <code>modal.css</code>; typing an arbitrary keyword that isn't one of the documented ones adds a class with no visual effect, so stick to the supported list.</li>\n<li>Only one <code>style</code> row is read per block; if you need multiple keywords, put them all in a single row separated by commas rather than adding multiple <code>style</code> rows.</li>\n<li>The <code>background</code> key here only holds a static image/color backdrop for a <code>tall-video</code> modal \u2014 the actual video is authored inside whatever block sits in the fragment (e.g. <a href=\"./rich-content.md\">Rich Content</a>'s <code>media</code> variant). See that block's own Notes for the video-authoring gotcha (poster image adjacency, <code>#autoplay</code>/<code>viewportplay</code> hash options).</li>\n</ul>", "footnotes": {}, "raw": "# Modal Metadata\n\n> **Quick summary:** A hidden, config-only block (`display: none`, no visible output) authored as key/value rows (`style`, `curtain`, `background`) \u2014 but it only has any effect when placed inside a fragment that is being loaded into a [Modal](./modal.md) dialog; viewed as a standalone page, it does nothing. `style` accepts comma-separated keywords that add CSS classes to the dialog; `curtain: off` removes the dimmed background overlay.\n\n## Authoring instructions\n\nAuthor a table named \"Modal Metadata\" inside the fragment that serves as a modal's content, with one key/value pair per row (same convention as a Section Metadata block).\n\n| Row | Content |\n|---|---|\n| `style` | One or more modifier keywords, comma-separated (e.g. `xl-size, tall video`). Spaces in a keyword become hyphens, and each keyword is added as a CSS class to the modal dialog (`.dialog-modal`). See [modal.md](./modal.md) for the list of supported keywords (`three-in-one`, `xl-size`, `s-size`, `tall-video`, `commerce-frame`, `dynamic-height`, `upgrade-flow-modal`, `hide-close-button`, `manage-plan-cancel`). |\n| `curtain` | Set the value to `off` to remove the dark background overlay behind the modal and skip disabling scroll/interaction on the rest of the page. Omit this row (or use any other value) to keep the default dimmed curtain. |\n| `background` | Optional, only used when `style` includes `tall-video`: an image or a background color (same authoring pattern as Section Metadata's `background` key) applied to the modal. |\n\nIf the fragment isn't actually being rendered inside a modal dialog (e.g. you're previewing the fragment directly), this block has no effect.\n\n## Variations\n\nThis block itself has no modifier classes on its own block name \u2014 all of its configurability comes from the key/value rows above, not from a \"Modal Metadata (variant)\" naming convention.\n\n## Example\n\n```\n| Modal Metadata |\n| --- |\n| style | xl-size |\n| curtain | off |\n```\n\n## Notes\n\n- Because this block is invisible and only \"activates\" inside a modal, do not expect to see any change when previewing the fragment as a normal page \u2014 always test by opening the link that triggers the modal.\n- `style` values are matched to specific CSS in `modal.css`; typing an arbitrary keyword that isn't one of the documented ones adds a class with no visual effect, so stick to the supported list.\n- Only one `style` row is read per block; if you need multiple keywords, put them all in a single row separated by commas rather than adding multiple `style` rows.\n- The `background` key here only holds a static image/color backdrop for a `tall-video` modal \u2014 the actual video is authored inside whatever block sits in the fragment (e.g. [Rich Content](./rich-content.md)'s `media` variant). See that block's own Notes for the video-authoring gotcha (poster image adjacency, `#autoplay`/`viewportplay` hash options).\n"}, {"slug": "modal", "title": "Modal", "summary": "Not a table-based block \u2014 it's applied automatically to any ordinary link whose URL ends in a `#hash`, turning that link into a trigger that opens the target page/fragment in an overlay dialog instead of navigating away (e.g. for pricing details, sign-up flows, or embedded checkout/plan-management tools). The dialog's appearance/behavior (size, curtain, close button, etc.) is controlled separately via a [Modal Metadata](./modal-metadata.md) block placed inside the target fragment, not on the link itself. Key gotcha: reused hash fragments across different links/fragments only resolve correctly for the first one encountered.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 795, "lastUpdated": "Aug 6, 2026", "lastUpdatedTs": 1786042627.2004135, "techSpecUrl": null, "html": "<h1>Modal</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> Not a table-based block \u2014 it's applied automatically to any ordinary link whose URL ends in a <code>#hash</code>, turning that link into a trigger that opens the target page/fragment in an overlay dialog instead of navigating away (e.g. for pricing details, sign-up flows, or embedded checkout/plan-management tools). The dialog's appearance/behavior (size, curtain, close button, etc.) is controlled separately via a <a href=\"./modal-metadata.md\">Modal Metadata</a> block placed inside the target fragment, not on the link itself. Key gotcha: reused hash fragments across different links/fragments only resolve correctly for the first one encountered.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>Modal is <strong>not</strong> a table-based block you insert like most others \u2014 there is no \"Modal\" row to fill in. It is applied automatically to any ordinary link whose target URL includes a <code>#hash</code> fragment and points at a fragment/page (not <code>#_inline</code> or <code>#_replacecell</code>, which have other meanings). When Milo sees such a link, it rewrites it to <code>href=\"#hash\"</code>, tags it with <code>data-modal-path</code> (the target page's path) and <code>data-modal-hash</code> (the fragment), and adds the <code>modal</code> class. Clicking that link \u2014 or loading the page directly with that hash in the URL (a deep link) \u2014 opens the target page's content inside a dialog.</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Link</td>\n<td>A normal link/button whose URL points at the fragment or page you want shown in the modal, with a <code>#hash</code> at the end, e.g. <code>/fragments/pricing-details#pricing-modal</code>. The hash is just an identifier \u2014 it doesn't need to match anything on the target page.</td>\n</tr>\n<tr>\n<td>Modal content</td>\n<td>Authored separately, on the fragment/page the link points to. That page's content becomes the modal body. Add a <a href=\"./modal-metadata.md\">Modal Metadata</a> block (see below) inside that fragment to control the dialog's appearance/behavior.</td>\n</tr>\n</tbody>\n</table>\n<p>Style the trigger like a normal button using Milo's standard convention: bold (<code>**text**</code>) for a filled button, italic (<code>*text*</code>) for an outline button.</p>\n<h2>Variations</h2>\n<p>Modal itself has no author-typed variant classes on the link. Its appearance/behavior is instead controlled from <strong>inside the fragment that becomes the modal</strong>, via a <strong><a href=\"./modal-metadata.md\">Modal Metadata</a></strong> block placed in that fragment, using a <code>style</code> key (comma-separated keywords, spaces become hyphens) that adds classes to the dialog:</p>\n<table>\n<thead>\n<tr>\n<th>Style keyword</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>three-in-one</code><sup class=\"fn-ref\" data-fn=\"three-in-one\" title=\"Click for details\">1</sup></td>\n<td>Full-height/full-width dialog for multi-step flows</td>\n</tr>\n<tr>\n<td><code>xl-size</code><sup class=\"fn-ref\" data-fn=\"xl-size\" title=\"Click for details\">2</sup></td>\n<td>Extra-large modal on smaller viewports</td>\n</tr>\n<tr>\n<td><code>s-size</code><sup class=\"fn-ref\" data-fn=\"s-size\" title=\"Click for details\">3</sup></td>\n<td>Smaller max-width (650px) on large desktop</td>\n</tr>\n<tr>\n<td><code>tall-video</code><sup class=\"fn-ref\" data-fn=\"tall-video\" title=\"Click for details\">4</sup></td>\n<td>Narrow, tall dialog sized for portrait/tall video content</td>\n</tr>\n<tr>\n<td><code>commerce-frame</code><sup class=\"fn-ref\" data-fn=\"commerce-frame\" title=\"Click for details\">5</sup></td>\n<td>Sized/optimized for embedded commerce iframes (e.g. mini-plans checkout)</td>\n</tr>\n<tr>\n<td><code>dynamic-height</code><sup class=\"fn-ref\" data-fn=\"dynamic-height\" title=\"Click for details\">6</sup></td>\n<td>Iframe content can resize the modal height dynamically via postMessage</td>\n</tr>\n<tr>\n<td><code>upgrade-flow-modal</code><sup class=\"fn-ref\" data-fn=\"upgrade-flow-modal\" title=\"Click for details\">7</sup></td>\n<td>Full-screen upgrade flow, hides the close button</td>\n</tr>\n<tr>\n<td><code>hide-close-button</code><sup class=\"fn-ref\" data-fn=\"hide-close-button\" title=\"Click for details\">8</sup></td>\n<td>Hides the \"X\" close control</td>\n</tr>\n<tr>\n<td><code>manage-plan-cancel</code><sup class=\"fn-ref\" data-fn=\"manage-plan-cancel\" title=\"Click for details\">9</sup></td>\n<td>Fixed 1280px-wide layout for the plan-cancellation flow</td>\n</tr>\n</tbody>\n</table>\n<p>A separate <code>curtain</code> key with value <code>off</code> removes the dimmed background curtain and skips locking page scroll/disabling the rest of the page \u2014 see <a href=\"./modal-metadata.md\">modal-metadata.md</a>.</p>\n<h2>Example</h2>\n<p>On the page where the trigger lives:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"1\">Text</th></tr>\n<tr><td><strong><a href=\"/fragments/pricing-details#pricing-modal\">See pricing details</a></strong></td></tr>\n</table>\n\n<p>Inside <code>/fragments/pricing-details</code>, add a <a href=\"./modal-metadata.md\">Modal Metadata</a> block to make it a large modal:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">Modal Metadata</th></tr>\n<tr><td>style</td><td>xl-size</td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>Because this is link-based, not table-based, there is nothing to type into a \"Modal\" block \u2014 adding one from a block library will do nothing useful. Just link to the fragment with a <code>#hash</code>.</li>\n<li>The modal automatically closes on Escape, on clicking the dark curtain, or via its close (\"X\") button, and restores focus to the triggering link afterward \u2014 no extra authoring needed for this behavior.</li>\n<li>If two authors reuse the same hash for different links pointing at different fragments, only the first one encountered will resolve correctly; keep hash fragments unique per fragment.</li>\n<li><strong><a href=\"./section-metadata.md\">Section Metadata</a> <code>layout</code>/<code>style</code> interaction:</strong> <code>region selector text</code> (\u2192 class <code>region-selector-text</code>) is a narrow, purpose-built value applied to a section <em>inside a modal fragment</em> to tighten that section's intro-copy padding/typography \u2014 it's used specifically by the region/locale-selector modal. It isn't a general Modal styling option; don't add it to unrelated modal content expecting a generic effect.</li>\n<li>With <code>tall-video</code>: the video itself is authored inside the target fragment using whatever block holds it (e.g. <a href=\"./rich-content.md\">Rich Content</a>'s <code>media</code> variant), not on Modal itself \u2014 <code>tall-video</code> only sizes the dialog. See that block's own Notes for the video-authoring gotcha (poster image adjacency, <code>#autoplay</code>/<code>viewportplay</code> hash options).</li>\n</ul>", "footnotes": {"three-in-one": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/pull/5692\">#5692</a> \u2014 Rares Munteanu, 2026-03-30"}, "xl-size": {"num": 2, "html": "<a href=\"https://github.com/adobecom/milo/pull/5692\">#5692</a> \u2014 Rares Munteanu, 2026-03-30"}, "s-size": {"num": 3, "html": "<a href=\"https://github.com/adobecom/milo/pull/5692\">#5692</a> \u2014 Rares Munteanu, 2026-03-30"}, "tall-video": {"num": 4, "html": "<a href=\"https://github.com/adobecom/milo/pull/5692\">#5692</a> \u2014 Rares Munteanu, 2026-03-30"}, "commerce-frame": {"num": 5, "html": "<a href=\"https://github.com/adobecom/milo/pull/5692\">#5692</a> \u2014 Rares Munteanu, 2026-03-30"}, "dynamic-height": {"num": 6, "html": "<a href=\"https://github.com/adobecom/milo/pull/5692\">#5692</a> \u2014 Rares Munteanu, 2026-03-30"}, "upgrade-flow-modal": {"num": 7, "html": "<a href=\"https://github.com/adobecom/milo/pull/5692\">#5692</a> \u2014 Rares Munteanu, 2026-03-30"}, "hide-close-button": {"num": 8, "html": "<a href=\"https://github.com/adobecom/milo/pull/5692\">#5692</a> \u2014 Rares Munteanu, 2026-03-30"}, "manage-plan-cancel": {"num": 9, "html": "<a href=\"https://github.com/adobecom/milo/pull/5692\">#5692</a> \u2014 Rares Munteanu, 2026-03-30"}}, "raw": "# Modal\n\n> **Quick summary:** Not a table-based block \u2014 it's applied automatically to any ordinary link whose URL ends in a `#hash`, turning that link into a trigger that opens the target page/fragment in an overlay dialog instead of navigating away (e.g. for pricing details, sign-up flows, or embedded checkout/plan-management tools). The dialog's appearance/behavior (size, curtain, close button, etc.) is controlled separately via a [Modal Metadata](./modal-metadata.md) block placed inside the target fragment, not on the link itself. Key gotcha: reused hash fragments across different links/fragments only resolve correctly for the first one encountered.\n\n## Authoring instructions\n\nModal is **not** a table-based block you insert like most others \u2014 there is no \"Modal\" row to fill in. It is applied automatically to any ordinary link whose target URL includes a `#hash` fragment and points at a fragment/page (not `#_inline` or `#_replacecell`, which have other meanings). When Milo sees such a link, it rewrites it to `href=\"#hash\"`, tags it with `data-modal-path` (the target page's path) and `data-modal-hash` (the fragment), and adds the `modal` class. Clicking that link \u2014 or loading the page directly with that hash in the URL (a deep link) \u2014 opens the target page's content inside a dialog.\n\n| Row | Content |\n|---|---|\n| Link | A normal link/button whose URL points at the fragment or page you want shown in the modal, with a `#hash` at the end, e.g. `/fragments/pricing-details#pricing-modal`. The hash is just an identifier \u2014 it doesn't need to match anything on the target page. |\n| Modal content | Authored separately, on the fragment/page the link points to. That page's content becomes the modal body. Add a [Modal Metadata](./modal-metadata.md) block (see below) inside that fragment to control the dialog's appearance/behavior. |\n\nStyle the trigger like a normal button using Milo's standard convention: bold (`**text**`) for a filled button, italic (`*text*`) for an outline button.\n\n## Variations\n\nModal itself has no author-typed variant classes on the link. Its appearance/behavior is instead controlled from **inside the fragment that becomes the modal**, via a **[Modal Metadata](./modal-metadata.md)** block placed in that fragment, using a `style` key (comma-separated keywords, spaces become hyphens) that adds classes to the dialog:\n\n| Style keyword | Effect |\n|---|---|\n| `three-in-one`[^three-in-one] | Full-height/full-width dialog for multi-step flows |\n| `xl-size`[^xl-size] | Extra-large modal on smaller viewports |\n| `s-size`[^s-size] | Smaller max-width (650px) on large desktop |\n| `tall-video`[^tall-video] | Narrow, tall dialog sized for portrait/tall video content |\n| `commerce-frame`[^commerce-frame] | Sized/optimized for embedded commerce iframes (e.g. mini-plans checkout) |\n| `dynamic-height`[^dynamic-height] | Iframe content can resize the modal height dynamically via postMessage |\n| `upgrade-flow-modal`[^upgrade-flow-modal] | Full-screen upgrade flow, hides the close button |\n| `hide-close-button`[^hide-close-button] | Hides the \"X\" close control |\n| `manage-plan-cancel`[^manage-plan-cancel] | Fixed 1280px-wide layout for the plan-cancellation flow |\n\n[^three-in-one]: [#5692](https://github.com/adobecom/milo/pull/5692) \u2014 Rares Munteanu, 2026-03-30\n[^xl-size]: [#5692](https://github.com/adobecom/milo/pull/5692) \u2014 Rares Munteanu, 2026-03-30\n[^s-size]: [#5692](https://github.com/adobecom/milo/pull/5692) \u2014 Rares Munteanu, 2026-03-30\n[^tall-video]: [#5692](https://github.com/adobecom/milo/pull/5692) \u2014 Rares Munteanu, 2026-03-30\n[^commerce-frame]: [#5692](https://github.com/adobecom/milo/pull/5692) \u2014 Rares Munteanu, 2026-03-30\n[^dynamic-height]: [#5692](https://github.com/adobecom/milo/pull/5692) \u2014 Rares Munteanu, 2026-03-30\n[^upgrade-flow-modal]: [#5692](https://github.com/adobecom/milo/pull/5692) \u2014 Rares Munteanu, 2026-03-30\n[^hide-close-button]: [#5692](https://github.com/adobecom/milo/pull/5692) \u2014 Rares Munteanu, 2026-03-30\n[^manage-plan-cancel]: [#5692](https://github.com/adobecom/milo/pull/5692) \u2014 Rares Munteanu, 2026-03-30\n\nA separate `curtain` key with value `off` removes the dimmed background curtain and skips locking page scroll/disabling the rest of the page \u2014 see [modal-metadata.md](./modal-metadata.md).\n\n## Example\n\nOn the page where the trigger lives:\n\n```\n| Text |\n| --- |\n| **[See pricing details](/fragments/pricing-details#pricing-modal)** |\n```\n\nInside `/fragments/pricing-details`, add a [Modal Metadata](./modal-metadata.md) block to make it a large modal:\n\n```\n| Modal Metadata |\n| --- |\n| style | xl-size |\n```\n\n## Notes\n\n- Because this is link-based, not table-based, there is nothing to type into a \"Modal\" block \u2014 adding one from a block library will do nothing useful. Just link to the fragment with a `#hash`.\n- The modal automatically closes on Escape, on clicking the dark curtain, or via its close (\"X\") button, and restores focus to the triggering link afterward \u2014 no extra authoring needed for this behavior.\n- If two authors reuse the same hash for different links pointing at different fragments, only the first one encountered will resolve correctly; keep hash fragments unique per fragment.\n- **[Section Metadata](./section-metadata.md) `layout`/`style` interaction:** `region selector text` (\u2192 class `region-selector-text`) is a narrow, purpose-built value applied to a section *inside a modal fragment* to tighten that section's intro-copy padding/typography \u2014 it's used specifically by the region/locale-selector modal. It isn't a general Modal styling option; don't add it to unrelated modal content expecting a generic effect.\n- With `tall-video`: the video itself is authored inside the target fragment using whatever block holds it (e.g. [Rich Content](./rich-content.md)'s `media` variant), not on Modal itself \u2014 `tall-video` only sizes the dialog. See that block's own Notes for the video-authoring gotcha (poster image adjacency, `#autoplay`/`viewportplay` hash options).\n"}, {"slug": "news", "title": "News", "summary": "A headlined grid of short news/press items \u2014 headline, optional body snippet, optional standalone \"read more\" link \u2014 such as a press-mentions or in-the-news section. Authored as a table with a header row (icon + section label) followed by one row per item. Item count (2, 3, or 4, sometimes 6) determines the grid layout (`two-up`/`three-up`/`four-up`/`six-up`). Only variation: `quiet`, for a lower-emphasis \"read more\" link style.", "sections": {"authoring": true, "variations": true, "example": true, "notes": true}, "wordCount": 698, "lastUpdated": "Aug 4, 2026", "lastUpdatedTs": 1785868230.2498963, "techSpecUrl": null, "html": "<h1>News</h1>\n<blockquote>\n<p><strong>Quick summary:</strong> A headlined grid of short news/press items \u2014 headline, optional body snippet, optional standalone \"read more\" link \u2014 such as a press-mentions or in-the-news section. Authored as a table with a header row (icon + section label) followed by one row per item. Item count (2, 3, or 4, sometimes 6) determines the grid layout (<code>two-up</code>/<code>three-up</code>/<code>four-up</code>/<code>six-up</code>). Only variation: <code>quiet</code>, for a lower-emphasis \"read more\" link style.</p>\n</blockquote>\n<h2>Authoring instructions</h2>\n<p>Author a table named \"News\" whose <strong>first row</strong> is the section header and whose <strong>remaining rows</strong> are the individual news items (the block requires at least 2 rows total \u2014 a header plus at least one item; a single-row table is ignored entirely).</p>\n<table>\n<thead>\n<tr>\n<th>Row</th>\n<th>Content</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Header row (row 1)</td>\n<td>Two columns: <strong>Column 1</strong> \u2014 an optional icon image (a small <code>picture</code>/image; leave empty for no icon). <strong>Column 2</strong> \u2014 a heading (any level h1\u2013h6) or a plain paragraph, used as the section's eyebrow/label text (e.g. \"Latest News\").</td>\n</tr>\n<tr>\n<td>Item rows (row 2+)</td>\n<td>Each item is a single column containing, in order: a heading or paragraph for the item's <strong>headline</strong> (required, must be the first text element in the cell), then optionally one or more body paragraphs (truncated to 3 lines visually), then optionally one final paragraph containing <strong>only</strong> a link (nothing else in that paragraph) to act as a \"read more\"-style standalone link for that item.</td>\n</tr>\n</tbody>\n</table>\n<p>The number of item rows determines the grid layout: 2, 3, or 4 items map to a <code>two-up</code>/<code>three-up</code>/<code>four-up</code> grid class. Other counts fall back to <code>three-up</code> styling, which may not lay out cleanly \u2014 stick to 2, 3, or 4 items. Some deployments of this block also recognize 6 items as a dedicated <code>six-up</code> grid; in others, authoring 6 items falls back to the <code>three-up</code> styling instead, so if a 6-item layout looks wrong, that's likely why.</p>\n<h2>Variations</h2>\n<table>\n<thead>\n<tr>\n<th>Variation</th>\n<th>Effect</th>\n<th>How to author it</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>quiet</code><sup class=\"fn-ref\" data-fn=\"quiet\" title=\"Click for details\">1</sup></td>\n<td>Applies a quieter/lower-emphasis style to each item's standalone \"read more\" link.</td>\n<td>Name the block \"News (quiet)\"</td>\n</tr>\n</tbody>\n</table>\n<h2>Example</h2>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">News</th></tr>\n<tr><td><img alt=\"icon\" src=\"https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg\" /></td><td><h2>Latest News</h2></td></tr>\n<tr><td><h3>Adobe announces new Firefly features</h3>\n<p>A short summary of the announcement.</p>\n<p><a href=\"https://example.com/story-1\">Read more</a></p></td><td></td></tr>\n<tr><td><h3>Partnership with example.com</h3>\n<p>A short summary of the partnership.</p>\n<p><a href=\"https://example.com/story-2\">Read more</a></p></td><td></td></tr>\n<tr><td><h3>Q3 earnings report</h3>\n<p>A short summary of the results.</p>\n<p><a href=\"https://example.com/story-3\">Read more</a></p></td><td></td></tr>\n</table>\n\n<p>With the quiet variation:</p>\n<table class=\"authoring-example-table\">\n<tr class=\"ex-header-row\"><th colspan=\"2\">News (quiet)</th></tr>\n<tr><td><img alt=\"icon\" src=\"https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg\" /></td><td><h2>Latest News</h2></td></tr>\n<tr><td><h3>Headline one</h3>\n<p>Body text.</p>\n<p><a href=\"https://example.com/1\">Read more</a></p></td><td></td></tr>\n<tr><td><h3>Headline two</h3>\n<p>Body text.</p>\n<p><a href=\"https://example.com/2\">Read more</a></p></td><td></td></tr>\n</table>\n\n<h2>Notes</h2>\n<ul>\n<li>The item's headline must be the very first piece of content in the cell \u2014 anything placed before it (other than nothing) will be misread as the headline instead.</li>\n<li>The \"read more\" link only becomes a standalone styled link if its paragraph contains <strong>nothing but</strong> the link; if there's any surrounding text in that paragraph (e.g. \"Read more about it here\"), it's treated as regular body text instead and the link stays inline.</li>\n<li>A single-row News table (header only, no items) is silently ignored \u2014 the block renders nothing.</li>\n<li>Icon images that are SVGs are automatically rewritten to load from Adobe's federated asset root, so authors can reference local/relative SVG icon paths without worrying about federation.</li>\n<li>Card body text is clamped to 3 lines via CSS \u2014 longer copy is truncated with an ellipsis, not scrollable, so keep summaries short.</li>\n<li>There is no explicit handling for images placed inside an item's body (only the header row's icon is handled) \u2014 an image added inside an item cell isn't actively broken, but it won't be positioned or styled by this block.</li>\n<li>The <code>two-up</code>/<code>three-up</code>/<code>four-up</code>/<code>six-up</code> classes mentioned above are applied automatically by this block's own code to its own internal item grid \u2014 they're unrelated to <a href=\"./section-metadata.md\">Section Metadata</a>'s <code>product-grid</code> + <code>-up</code> multi-block layout system (which arranges separate blocks side by side in a section). Adding <code>product-grid, two-up</code> to this block's Section Metadata does not change how many items per row News shows; only the item count does.</li>\n</ul>", "footnotes": {"quiet": {"num": 1, "html": "<a href=\"https://github.com/adobecom/milo/pull/6086\">#6086</a> \u2014 Rares Munteanu, 2026-06-15"}}, "raw": "# News\n\n> **Quick summary:** A headlined grid of short news/press items \u2014 headline, optional body snippet, optional standalone \"read more\" link \u2014 such as a press-mentions or in-the-news section. Authored as a table with a header row (icon + section label) followed by one row per item. Item count (2, 3, or 4, sometimes 6) determines the grid layout (`two-up`/`three-up`/`four-up`/`six-up`). Only variation: `quiet`, for a lower-emphasis \"read more\" link style.\n\n## Authoring instructions\n\nAuthor a table named \"News\" whose **first row** is the section header and whose **remaining rows** are the individual news items (the block requires at least 2 rows total \u2014 a header plus at least one item; a single-row table is ignored entirely).\n\n| Row | Content |\n|---|---|\n| Header row (row 1) | Two columns: **Column 1** \u2014 an optional icon image (a small `picture`/image; leave empty for no icon). **Column 2** \u2014 a heading (any level h1\u2013h6) or a plain paragraph, used as the section's eyebrow/label text (e.g. \"Latest News\"). |\n| Item rows (row 2+) | Each item is a single column containing, in order: a heading or paragraph for the item's **headline** (required, must be the first text element in the cell), then optionally one or more body paragraphs (truncated to 3 lines visually), then optionally one final paragraph containing **only** a link (nothing else in that paragraph) to act as a \"read more\"-style standalone link for that item. |\n\nThe number of item rows determines the grid layout: 2, 3, or 4 items map to a `two-up`/`three-up`/`four-up` grid class. Other counts fall back to `three-up` styling, which may not lay out cleanly \u2014 stick to 2, 3, or 4 items. Some deployments of this block also recognize 6 items as a dedicated `six-up` grid; in others, authoring 6 items falls back to the `three-up` styling instead, so if a 6-item layout looks wrong, that's likely why.\n\n## Variations\n\n| Variation | Effect | How to author it |\n|---|---|---|\n| `quiet`[^quiet] | Applies a quieter/lower-emphasis style to each item's standalone \"read more\" link. | Name the block \"News (quiet)\" |\n\n[^quiet]: [#6086](https://github.com/adobecom/milo/pull/6086) \u2014 Rares Munteanu, 2026-06-15\n\n## Example\n\n```\n| News |\n| --- |\n| ![icon](https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg) | ## Latest News |\n| ### Adobe announces new Firefly features<br>A short summary of the announcement.<br>[Read more](https://example.com/story-1) |\n| ### Partnership with example.com<br>A short summary of the partnership.<br>[Read more](https://example.com/story-2) |\n| ### Q3 earnings report<br>A short summary of the results.<br>[Read more](https://example.com/story-3) |\n```\n\nWith the quiet variation:\n\n```\n| News (quiet) |\n| --- |\n| ![icon](https://www.adobe.com/federal/assets/svgs/experience-cloud-logo.svg) | ## Latest News |\n| ### Headline one<br>Body text.<br>[Read more](https://example.com/1) |\n| ### Headline two<br>Body text.<br>[Read more](https://example.com/2) |\n```\n\n## Notes\n\n- The item's headline must be the very first piece of content in the cell \u2014 anything placed before it (other than nothing) will be misread as the headline instead.\n- The \"read more\" link only becomes a standalone styled link if its paragraph contains **nothing but** the link; if there's any surrounding text in that paragraph (e.g. \"Read more about it here\"), it's treated as regular body text instead and the link stays inline.\n- A single-row News table (header only, no items) is silently ignored \u2014 the block renders nothing.\n- Icon images that are SVGs are automatically rewritten to load from Adobe's federated asset root, so authors can reference local/relative SVG icon paths without worrying about federation.\n- Card body text is clamped to 3 lines via CSS \u2014 longer copy is truncated with an ellipsis, not scrollable, so keep summaries short.\n- There is no explicit handling for images placed inside an item's body (only the header row's icon is handled) \u2014 an image added inside an item cell isn't actively broken, but it won't be positioned or styled by this block.\n- The `two-up`/`three-up`/`fo
